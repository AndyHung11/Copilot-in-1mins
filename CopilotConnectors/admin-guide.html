/* Power of Copilot - shared language core (v1)
 *
 * ONE source of truth. Injected inline into every entry page by
 * _tools/inject_lang.py, so each page stays a standalone file.
 * Never load this with <script src>: the handbooks are distributed as
 * single files and are opened offline over file://.
 *
 * Priority: ?lang= > saved preference > navigator.languages > fallback.
 * Once the reader picks a language it wins everywhere, including when they
 * open a link that points at a different language edition.
 *
 * Pages declare window.__LANG_CFG before this block:
 *   cur        current edition of THIS file, normalized ('zh-Hant'|'zh-Hans'|'en')
 *   mode       'redirect' (separate file per language) | 'inpage' (switches live)
 *   paths      redirect mode only: normalized code -> relative path
 *   supported  languages this page actually ships (default: all three)
 *   fallback   used when nothing matches (default: 'en')
 *
 * Exposes window.PocLang = { code, save, normalize, KEY }.
 */
(function () {
  "use strict";

  var KEY = "pocLang";
  var CODES = ["zh-Hant", "zh-Hans", "en"];
  // keys written by earlier per-page implementations, newest first - read once
  // so nobody who already picked a language gets thrown back to detection
  var LEGACY = [
    "copilotPortalLang", "powerofcopilot.lang", "poc.lang", "cph-lang",
    "copilotBuildingLang", "copilotPlaygroundLang", "copilotPlanetLang",
    "copilotExpoLang", "agentTransitLang", "agent-lang"
  ];
  var cfg = window.__LANG_CFG || {};
  var supported = cfg.supported || CODES;
  var HOP = "pocLangHop";

  // Accepts every vocabulary in use across the sites plus raw BCP 47 tags:
  // 'zh'/'cn'/'en', 'zh-cn'/'zh-Hant', 'zh-Hans-CN', 'en-GB'...
  function normalize(value) {
    if (!value) return null;
    var v = String(value).toLowerCase();
    if (v === "cn") return "zh-Hans";
    if (v === "zh") return "zh-Hant";
    if (/^en/.test(v)) return "en";
    if (/(^|[-_])(hans|cn|sg)(?![a-z])/.test(v)) return "zh-Hans";
    if (/^zh/.test(v)) return "zh-Hant";
    return null;
  }

  function read(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }
  function write(key, value) {
    try { localStorage.setItem(key, value); } catch (e) {}
  }

  function save(value) {
    var code = normalize(value);
    if (code) write(KEY, code);
    return code;
  }

  // Preference is stored unchanged even when the current page cannot render it;
  // only the language used for THIS render is downgraded.
  function toSupported(code) {
    if (supported.indexOf(code) !== -1) return code;
    var order = code === "zh-Hans" ? ["zh-Hant", "en"]
      : code === "zh-Hant" ? ["zh-Hans", "en"]
      : ["en", "zh-Hant"];
    for (var i = 0; i < order.length; i++) {
      if (supported.indexOf(order[i]) !== -1) return order[i];
    }
    return supported[0] || "en";
  }

  function fromQuery() {
    try {
      return normalize(new URLSearchParams(location.search).get("lang"));
    } catch (e) { return null; }
  }

  function fromLegacy() {
    for (var i = 0; i < LEGACY.length; i++) {
      var code = normalize(read(LEGACY[i]));
      if (code) return code;
    }
    return null;
  }

    var list = (navigator.languages && navigator.languages.length)
      ? navigator.languages

    for (var i = 0; i < list.length; i++) {
      var code = normalize(list[i]);
      if (code) return code;
    }
    return null;
  }

  function resolve() {
    var q = fromQuery();
    if (q) { write(KEY, q); return q; }         // shared links set the preference
    var saved = normalize(read(KEY));
    if (saved) return saved;
    var legacy = fromLegacy();
    if (legacy) { write(KEY, legacy); return legacy; }
    return fromBrowser() || normalize(cfg.fallback) || "en";

  var wanted = resolve();
  var code = toSupported(wanted);

  // ---- redirect editions (Basic / Pro) ----
  // Each hop lands on a page whose cur === code, so this settles after one
  // move; the marker only guards against a broken paths table.

    var hopped = null;

  // ?lang=) is stored, so readers who never choose keep following the browser.
  window.PocLang = { code: code, save: save, normalize: normalize, KEY: KEY };

  // Language buttons that are plain links (the redirect editions) must record
  // the choice before navigating, otherwise the new page bounces straight back.
  var TEXT = { "\u7e41": "zh-Hant", "\u7b80": "zh-Hans", "EN": "en" };

        || TEXT[(el.textContent || "").trim()];
    }

<script>
(() => {
  const param = new URLSearchParams(location.search).get("scoutTheme");
  let saved = null;
  try { saved = localStorage.getItem("copilotPortalTheme"); } catch (_) {}
  const ok = v => v === "light" || v === "dark";
  const theme = ok(param) ? param : ok(saved) ? saved : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.setAttribute("data-theme", theme);
  const lang = (window.PocLang && window.PocLang.code) || "zh-Hant";
  document.documentElement.setAttribute("data-lang", lang);
  document.documentElement.setAttribute("lang", lang);
})();

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { min-height: 100%; background: var(--cp-bg); scroll-behavior: smooth; scroll-padding-top: 132px; }
body {
  min-width: 280px; min-height: 100vh; margin: 0; font-size: 15px; line-height: 1.6;
  background:
    radial-gradient(circle at 12% 8%, var(--wash-a), transparent 34%),
    radial-gradient(circle at 88% 14%, var(--wash-b), transparent 32%),
    linear-gradient(var(--cp-sheen), var(--cp-sheen)),
    var(--cp-bg);
  color: var(--cp-text);
  font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
}

}
button, input, select { font: inherit; color: inherit; }
input::placeholder { color: var(--cp-text-muted); opacity: 1; }
a { color: var(--cp-link); }
.shell { width: min(1180px, calc(100% - 48px)); margin: 0 auto; }
.skip { position: absolute; left: -9999px; top: 8px; z-index: 100; padding: 10px 14px; border-radius: 0.625rem; background: var(--cp-accent); color: var(--cp-accent-fg); font-weight: 700; }
.skip:focus { left: 12px; }
:focus-visible { outline: 3px solid var(--cp-accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

/* top bar */
.topbar { position: sticky; top: 0; z-index: 20; background: var(--cp-overlay); border-bottom: 1px solid var(--cp-border); backdrop-filter: blur(18px); }
.topbar::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--cp-gradient); }
.topbar-inner { min-height: 68px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; text-decoration: none; color: var(--cp-text); }
.brand img { width: 38px; height: 38px; object-fit: contain; flex: none; }
.brand-name { font-size: 15px; font-weight: 700; line-height: 1.25; }
.brand-sub { margin-top: 2px; color: var(--cp-text-muted); font-size: 12px; }
.topbar-actions { display: flex; align-items: center; gap: 8px; flex: none; }
.lang-switch { height: 36px; display: inline-flex; align-items: center; gap: 2px; padding: 3px; border: 1px solid var(--cp-border); border-radius: 0.625rem; background: var(--cp-surface); }
.lang-switch button { min-width: 30px; height: 28px; padding: 0 8px; border: 0; border-radius: 0.45rem; background: transparent; color: var(--cp-text-muted); font-weight: 600; font-size: 12px; cursor: pointer; white-space: nowrap; }
.lang-switch button:hover { color: var(--cp-text); background: var(--cp-surface-soft); }
.lang-switch button[aria-pressed="true"] { background: var(--cp-accent); color: var(--cp-accent-fg); }
.theme-toggle { min-width: 96px; height: 36px; padding: 0 11px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--cp-border); border-radius: 0.625rem; background: var(--cp-surface); font-weight: 600; font-size: 12px; cursor: pointer; }
.theme-toggle:hover { border-color: var(--cp-border-strong); }

/* in-page navigation */
.subnav { position: sticky; top: 68px; z-index: 15; background: var(--cp-overlay); border-bottom: 1px solid var(--cp-border); backdrop-filter: blur(14px); }
.subnav .shell { display: flex; gap: 4px; overflow-x: auto; padding: 6px 0; scrollbar-width: none; }
.subnav .shell::-webkit-scrollbar { display: none; }
.subnav a { flex: none; min-height: 36px; padding: 0 13px; display: inline-flex; align-items: center; border-radius: 0.625rem; color: var(--cp-text-muted); text-decoration: none; font-weight: 600; font-size: 13px; white-space: nowrap; }
.subnav a:hover { background: var(--cp-surface-soft); color: var(--cp-text); }
.subnav a[aria-current] { background: var(--cp-accent-soft); color: var(--cp-accent); }

/* hero */
.hero { padding: 52px 0 12px; }
.eyebrow { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border: 1px solid var(--cp-border); border-radius: 999px; background: var(--cp-surface); color: var(--cp-text-muted); font-weight: 700; font-size: 12px; letter-spacing: 0.05em; }
.eyebrow i { width: 8px; height: 8px; border-radius: 50%; background: var(--cp-gradient); }
h1 { margin: 16px 0 12px; font-size: clamp(30px, 4.6vw, 48px); line-height: 1.16; letter-spacing: -0.01em; }
.grad { background: var(--cp-gradient); -webkit-background-clip: text; background-clip: text; color: transparent; }
.lead { margin: 0; max-width: 64ch; color: var(--cp-text-muted); font-size: clamp(16px, 1.6vw, 18px); }
.stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin: 28px 0 18px; }
.stat { padding: 16px 18px; border: 1px solid var(--cp-border); border-radius: 0.625rem; background: var(--cp-panel-strong); }
.stat b { display: block; font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { color: var(--cp-text-muted); font-size: 13px; }
.stat small { display: block; margin-top: 2px; color: var(--cp-text-muted); font-size: 12px; }
.asof { margin: 0 0 18px; color: var(--cp-text-muted); font-size: 13px; }
.cta { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { min-height: 42px; padding: 0 18px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--cp-accent); border-radius: 0.625rem; background: var(--cp-accent); color: var(--cp-accent-fg); font-weight: 700; text-decoration: none; cursor: pointer; }
.btn:hover { background: var(--cp-accent-hover); border-color: var(--cp-accent-hover); }
.btn.secondary { background: var(--cp-surface); color: var(--cp-text); border-color: var(--cp-border); }
.btn.secondary:hover { border-color: var(--cp-border-strong); background: var(--cp-surface-soft); }
.btn.small { min-height: 36px; padding: 0 14px; font-size: 13px; }

/* sections */
.block { padding: 48px 0 4px; }
.sec-kicker { color: var(--cp-accent); font-weight: 700; font-size: 12px; letter-spacing: 0.07em; text-transform: uppercase; }
h2 { margin: 4px 0 8px; font-size: clamp(22px, 3vw, 30px); line-height: 1.25; }
h3 { margin: 0; font-size: 16px; line-height: 1.35; }
.sec-lead { margin: 0 0 22px; max-width: 72ch; color: var(--cp-text-muted); }
.card { border: 1px solid var(--cp-border); border-radius: 0.625rem; background: var(--cp-surface); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04); }

/* diagram */
.flow { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto minmax(0, 1fr); gap: 12px; align-items: stretch; }
.flow-box { padding: 18px; }
.flow-box h3 { margin-bottom: 8px; }
.flow-box p { margin: 0 0 10px; color: var(--cp-text-muted); font-size: 14px; }
.flow-arrow { align-self: center; color: var(--cp-text-muted); font-size: 24px; text-align: center; }
.flow-box.mid { background: var(--cp-gradient-soft), var(--cp-surface); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.tags li { padding: 3px 9px; border: 1px solid var(--cp-border); border-radius: 999px; background: var(--cp-surface-soft); font-size: 12px; }
.callout { margin-top: 14px; padding: 14px 18px; border-left: 4px solid var(--cp-accent); border-radius: 0 0.625rem 0.625rem 0; background: var(--cp-accent-soft); font-size: 14px; }

/* comparison */
.cmp { overflow: hidden; }
.cmp-row { display: grid; grid-template-columns: 170px minmax(0, 1fr) minmax(0, 1fr); border-top: 1px solid var(--cp-border); }
.cmp-row:first-child { border-top: 0; }
.cmp-row > div { padding: 13px 16px; font-size: 14px; }
.cmp-head > div { font-weight: 700; background: var(--cp-surface-soft); }
.cmp-label { color: var(--cp-text-muted); font-weight: 700; }
.cmp-row > div + div { border-left: 1px solid var(--cp-border); }
.cmp-sub { display: block; color: var(--cp-text-muted); font-weight: 400; font-size: 12px; }
.note { margin: 12px 2px 0; color: var(--cp-text-muted); font-size: 13px; }

/* badges and chips */
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border: 1px solid var(--cp-border); border-radius: 999px; background: var(--cp-surface-soft); color: var(--cp-text); font-weight: 600; font-size: 12px; line-height: 1.5; white-space: nowrap; }
.badge::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--cp-text-muted); }
.badge.fed::before { background: var(--cp-brand-purple); }
.badge.syn::before { background: var(--cp-link); }
.badge.pre { background: color-mix(in srgb, var(--cp-warning) 20%, var(--cp-surface)); border-color: color-mix(in srgb, var(--cp-warning) 55%, var(--cp-border)); }
.badge.pre::before { background: var(--cp-warning); }
.badge.part::before { background: var(--cp-text-muted); }
.badge.onprem::before { background: var(--cp-border-strong); }
.badge.cert { border-color: color-mix(in srgb, var(--cp-success) 55%, var(--cp-border)); background: color-mix(in srgb, var(--cp-success) 12%, var(--cp-surface)); }
.badge.cert::before { background: var(--cp-success); }
.badge.st-launched::before { background: var(--cp-success); }
.badge.st-rolling::before { background: var(--cp-link); }
.badge.st-dev::before { background: var(--cp-warning); }

/* gallery */
.origin { margin: 0 0 8px; }
.origin-h { margin: 0 0 8px; color: var(--cp-text-muted); font-size: 13px; letter-spacing: 0.04em; }
.origin ul { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.origin li { padding: 14px 16px; display: grid; gap: 4px; align-content: start; border-top: 3px solid var(--cp-border-strong); }
.origin li b { font-size: 15px; line-height: 1.4; }
.origin li span { color: var(--cp-text-muted); font-size: 13px; }
.origin li.o0 { border-top-color: var(--cp-accent); background: color-mix(in srgb, var(--cp-accent) 8%, var(--cp-surface)); }
.origin-note { margin: 0 2px 8px; }
#mergeNote { margin-bottom: 18px; }
.filters { padding: 16px; display: grid; gap: 12px; }
.filter-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label, .field .lbl { color: var(--cp-text-muted); font-weight: 700; font-size: 12px; }
.search { flex: 1 1 280px; }
.search input, select { width: 100%; min-height: 42px; padding: 0 12px; border: 1px solid var(--cp-border); border-radius: 0.625rem; background: var(--cp-bg-elevated); font-size: 14px; }
select { cursor: pointer; }
.search input:focus, select:focus { border-color: var(--cp-accent); }
.seg { display: inline-flex; flex-wrap: wrap; max-width: 100%; padding: 3px; gap: 2px; border: 1px solid var(--cp-border); border-radius: 0.625rem; background: var(--cp-surface-soft); }
.seg button { min-height: 34px; padding: 0 12px; border: 0; border-radius: 0.45rem; background: transparent; color: var(--cp-text-muted); font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; }
.seg button:hover { color: var(--cp-text); }
.seg button[aria-pressed="true"] { background: var(--cp-accent); color: var(--cp-accent-fg); }
.check { min-height: 42px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }
.check input { width: 18px; height: 18px; accent-color: var(--cp-accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chips .lbl { margin-right: 4px; color: var(--cp-text-muted); font-size: 12px; font-weight: 700; }
.chip { min-height: 32px; padding: 0 12px; border: 1px solid var(--cp-border); border-radius: 999px; background: var(--cp-surface); font-size: 13px; cursor: pointer; }
.chip:hover { border-color: var(--cp-border-strong); }
.chip[aria-pressed="true"] { background: var(--cp-accent-soft); border-color: var(--cp-accent); color: var(--cp-accent); font-weight: 700; }
.resultbar { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: center; margin: 16px 2px 12px; color: var(--cp-text-muted); font-size: 14px; }
.type-note { margin-left: 12px; font-size: 13px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
.conn { padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.conn-top { display: flex; align-items: flex-start; gap: 12px; }
.avatar { width: 40px; height: 40px; flex: none; display: grid; place-items: center; border-radius: 0.625rem; background: var(--cp-gradient-soft); color: var(--cp-accent); font-weight: 800; font-size: 17px; border: 1px solid var(--cp-border); }
.conn h3 { overflow-wrap: anywhere; }
.conn-meta { margin-top: 2px; color: var(--cp-text-muted); font-size: 12px; }
.conn p { margin: 0; flex: 1; color: var(--cp-text-muted); font-size: 14px; overflow-wrap: anywhere; }
.conn-foot { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: space-between; }
.conn-foot .badges { display: flex; flex-wrap: wrap; gap: 6px; }
.conn a { font-weight: 600; font-size: 13px; text-decoration: none; }
.conn-block { display: flex; flex-direction: column; gap: 8px; padding-top: 10px; border-top: 1px solid var(--cp-border); }
.conn-top + .conn-block { padding-top: 0; border-top: 0; }
.conn-block p { flex: none; }
.conn.is-merged > p { flex: none; }
.conn-pub { align-self: center; color: var(--cp-text-muted); font-size: 12px; font-weight: 600; }
.conn-partners { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding-top: 10px; border-top: 1px solid var(--cp-border); }
.conn-partners ul { flex: 1 1 180px; min-width: 0; display: flex; flex-wrap: wrap; gap: 2px 14px; margin: 0; padding: 0; list-style: none; }
.conn-partners li { display: inline-flex; align-items: center; gap: 6px; min-height: 24px; }
.conn a:hover { text-decoration: underline; }
.empty { padding: 36px 18px; text-align: center; color: var(--cp-text-muted); }
.more { display: flex; justify-content: center; margin: 18px 0 4px; }

/* picker */
.picker { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.qs { padding: 6px 18px 18px; }
fieldset { margin: 0; padding: 14px 0 0; border: 0; min-width: 0; }
fieldset + fieldset { border-top: 1px solid var(--cp-border); margin-top: 14px; }
legend { padding: 0; font-weight: 700; font-size: 15px; }
legend small { display: block; color: var(--cp-text-muted); font-weight: 400; font-size: 13px; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.opt { position: relative; flex: 1 1 150px; min-width: 0; }
.opt input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.opt span { display: block; height: 100%; padding: 10px 12px; border: 1px solid var(--cp-border); border-radius: 0.625rem; background: var(--cp-bg-elevated); font-size: 14px; font-weight: 600; }
.opt span small { display: block; color: var(--cp-text-muted); font-weight: 400; font-size: 12px; }
.opt input:hover + span { border-color: var(--cp-border-strong); }
.opt input:checked + span { border-color: var(--cp-accent); background: var(--cp-accent-soft); box-shadow: inset 0 0 0 1px var(--cp-accent); }
.opt input:focus-visible + span { outline: 3px solid var(--cp-accent); outline-offset: 2px; }
.result { padding: 18px; position: sticky; top: 132px; }
.progress { color: var(--cp-text-muted); font-size: 13px; }
.verdict { margin: 6px 0 4px; font-size: 22px; line-height: 1.3; font-weight: 800; }
.result h4 { margin: 14px 0 6px; font-size: 13px; color: var(--cp-text-muted); letter-spacing: 0.04em; }
.result ul { margin: 0; padding-left: 20px; font-size: 14px; }
.result li + li { margin-top: 4px; }
.result .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.result.is-empty { color: var(--cp-text-muted); }
.result .applied { margin: 12px 0 0; font-size: 14px; }
.result .jump { margin: 8px 0 0; }
.result .no-list { margin: 10px 0 0; padding: 10px 12px; border-radius: 0.625rem; background: var(--cp-accent-soft); color: var(--cp-text); font-size: 14px; }

/* the picker's recommended type, tagged in the gallery's type switch */
.seg button .tag { margin-left: 6px; padding: 1px 7px; border-radius: 999px; background: var(--cp-accent-soft); color: var(--cp-accent); font-size: 11px; font-weight: 700; }
.seg button[aria-pressed="true"] .tag { background: rgba(255, 255, 255, 0.22); color: inherit; }

/* license */
.lic-pick { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; margin-bottom: 14px; }
.lic-pick .field { flex: 1 1 320px; }
.lic-sum { flex: 2 1 320px; padding: 11px 14px; border-radius: 0.625rem; background: var(--cp-accent-soft); font-size: 14px; }
.lic-row { display: grid; grid-template-columns: minmax(0, 1.6fr) repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--cp-border); }
.lic-row:first-child { border-top: 0; }
.lic-row > div { padding: 12px 14px; font-size: 14px; }
.lic-row > div + div { border-left: 1px solid var(--cp-border); }
.lic-head > div { font-weight: 700; background: var(--cp-surface-soft); font-size: 13px; }
.lic-row.is-picked { background: var(--cp-accent-soft); box-shadow: inset 4px 0 0 var(--cp-accent); }
.yes { font-weight: 700; }
.no { color: var(--cp-text-muted); }

/* timeline */
.tl-group + .tl-group { margin-top: 22px; }
.tl-group > h3 { margin-bottom: 10px; color: var(--cp-text-muted); font-size: 13px; letter-spacing: 0.05em; }
.tl { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.tl li { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 14px; padding: 14px 16px; }
.tl .when { font-weight: 800; font-variant-numeric: tabular-nums; }
.tl .when small { display: block; color: var(--cp-text-muted); font-weight: 400; font-size: 12px; }
.tl h4 { margin: 0 0 3px; font-size: 15px; }
.tl p { margin: 0 0 8px; color: var(--cp-text-muted); font-size: 14px; }
.tl .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; }

/* caveats */
details { border: 1px solid var(--cp-border); border-radius: 0.625rem; background: var(--cp-surface); }
details + details { margin-top: 8px; }
summary { min-height: 48px; padding: 12px 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 10px; list-style: none; }
summary::-webkit-details-marker { display: none; }
summary::before { content: "＋"; flex: none; width: 18px; color: var(--cp-accent); font-weight: 800; }
details[open] > summary::before { content: "－"; }
details > div { padding: 0 16px 14px 44px; color: var(--cp-text-muted); font-size: 14px; }
details > div p { margin: 0; }

/* sources */
.sources { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 8px 24px; }
.sources a { font-size: 14px; }
footer { margin-top: 56px; padding: 26px 0 48px; border-top: 1px solid var(--cp-border); color: var(--cp-text-muted); font-size: 13px; }
footer p { margin: 0 0 6px; max-width: 90ch; }

@media (max-width: 1100px) {
  .origin ul { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 900px) {
  .picker { grid-template-columns: minmax(0, 1fr); }
  .result { position: static; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat:first-child { grid-column: 1 / -1; }
}
@media (max-width: 760px) {
  .origin ul { grid-template-columns: minmax(0, 1fr); }
  .shell { width: min(1180px, calc(100% - 28px)); }
  .brand-sub { display: none; }
  .theme-toggle { min-width: 40px; padding: 0 10px; }
  .theme-toggle .tt-label { display: none; }
  .flow { grid-template-columns: minmax(0, 1fr); }
  .flow-arrow { transform: rotate(90deg); }
  .cmp-row { grid-template-columns: minmax(0, 1fr); }
  .cmp-head { display: none; }
  .cmp-row > div + div { border-left: 0; border-top: 1px dashed var(--cp-border); }
  .cmp-cell::before { content: attr(data-col); display: block; margin-bottom: 2px; color: var(--cp-accent); font-weight: 700; font-size: 12px; }
  .lic-row { grid-template-columns: minmax(0, 1fr); }
  .lic-head { display: none; }
  .lic-row > div + div { border-left: 0; border-top: 1px dashed var(--cp-border); }
  .lic-cell::before { content: attr(data-col); display: block; color: var(--cp-text-muted); font-weight: 700; font-size: 12px; }
  .tl li { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .grid { grid-template-columns: minmax(0, 1fr); }
  details > div { padding-left: 16px; }
}
@media (max-width: 420px) {
  .lang-switch button { min-width: 28px; padding: 0 6px; }
  .stat b { font-size: 26px; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  * { transition: none !important; animation: none !important; }
}

/* admin-guide.html page-specific additions (layered after the shared template/style.css) */

/* the four phases at a glance */
.phases { list-style: none; margin: 18px 0 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.phases a { display: grid; align-content: start; gap: 4px; height: 100%; padding: 16px; border: 1px solid var(--cp-border); border-radius: 0.625rem; background: var(--cp-surface); color: var(--cp-text); text-decoration: none; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04); }
.phases a:hover { border-color: var(--cp-border-strong); }
.phases .no { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; background: var(--cp-accent); color: var(--cp-accent-fg); font-weight: 800; font-size: 13px; }
.phases b { margin-top: 6px; font-size: 19px; line-height: 1.3; }
.phases .d { color: var(--cp-text-muted); font-size: 14px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 14px 0 0; color: var(--cp-text-muted); font-size: 14px; }

/* an admin-center path or setting name inside running text */
.path { padding: 1px 6px; border: 1px solid var(--cp-border); border-radius: 6px; background: var(--cp-surface-soft); color: var(--cp-text); font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 0.9em; }

/* table cells that hold a short list */
.cmp-cell p, .cmp-cell ul { margin: 0; }
.cmp-cell ul { padding-left: 1.1em; }
.cmp-cell li + li { margin-top: 4px; }

.proc { padding: 18px; }
.proc-steps { counter-reset: proc; margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.proc-steps li { position: relative; padding: 2px 0 2px 34px; font-size: 14px; }
.proc-steps li::before { counter-increment: proc; content: counter(proc); position: absolute; left: 0; top: 0; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; background: var(--cp-accent-soft); color: var(--cp-accent); font-weight: 800; font-size: 12px; }

.callout.warn { border-left-color: var(--cp-warning); background: color-mix(in srgb, var(--cp-warning) 14%, var(--cp-surface)); }
.sub-h { margin: 26px 0 0; font-size: 18px; }
#perm { margin-top: 18px; }
#perm strong { display: block; margin-bottom: 4px; }
.find { margin-top: 18px; }

.type-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 18px; align-items: start; }
.type-pair .card { padding: 18px; }
.type-pair p { margin: 10px 0 0; color: var(--cp-text); font-size: 14px; }
.type-pair h3 { margin: 18px 0 10px; font-size: 14px; }
.card-top { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 14px; }
.card-top .who { color: var(--cp-text-muted); font-size: 14px; font-weight: 600; }
.type-pair .card-top + h3 { margin-top: 0; }
.type-pair .proc-steps + h3 { margin-top: 20px; }

/* folded blocks */
details { margin-top: 12px; }

  const body = rows.map(r =>
    `<div class="cmp-row" role="row"><div class="cmp-label" role="rowheader">${esc(r[0])}</div>` +
    `<div class="cmp-cell" role="cell" data-col="${esc(t("type.s"))}">${cellHTML(r[1])}</div>` +
    `<div class="cmp-cell" role="cell" data-col="${esc(t("type.f"))}">${cellHTML(r[2])}</div></div>`).join("");
  $(id).setAttribute("aria-label", label);
  $(id).innerHTML = head + body;
}

const typeBadge = k => `<span class="badge ${k === "s" ? "syn" : "fed"}">${esc(t(k === "s" ? "type.s" : "type.f"))}</span>`;

/* ---------- 1. plan: licence table and the five-question picker ---------- */
function renderLicense() {
  const rows = get("lic.rows"), cols = get("lic.cols");
  const cell = c => c === "y" ? `<span class="yes">${esc(t("lic.cell.yes"))}</span>` : c === "n" ? `<span class="no">${esc(t("lic.cell.no"))}</span>` : `<span>${esc(t("lic.cell.agents"))}</span>`;
  const head = `<div class="lic-row lic-head" role="row">${cols.map(c => `<div role="columnheader">${esc(c)}</div>`).join("")}</div>`;
  const body = LIC.map(r => `<div class="lic-row" role="row"><div role="rowheader"><strong>${esc(rows[r[0]])}</strong></div>` +
    [1, 2, 3].map(i => `<div class="lic-cell" role="cell" data-col="${esc(cols[i])}">${cell(r[i])}</div>`).join("") + `</div>`).join("");
  $("#licTable").setAttribute("aria-label", t("plan.licH"));
  $("#licTable").innerHTML = head + body;
}

const A = {};
function recommend(a) {
  let s = true, f = true;
  const why = [], note = [];
  if (a.where === "onprem") { f = false; why.push("onprem"); }
  if (a.fresh === "live") { s = false; why.push("live"); }
  if (a.rw === "write") { s = false; why.push("write"); }
  if (a.lic === "m365") { f = false; why.push("licM365"); }
  if (a.lic === "studio") { f = false; why.push("licStudio"); }
  let result, both = false;
  if (!s && !f) result = "none";
  else if (s && !f) result = "synced";
  else if (!s && f) result = "federated";
  else { both = true; result = a.who === "user" ? "federated" : "synced"; why.push(a.who === "user" ? "whoUser" : "whoAdmin"); }
  if (a.where === "custom") note.push("custom");
  if (s) {
    if (a.lic === "m365") note.push("licM365Syn");
    if (a.lic === "studio") note.push("licStudioSyn");
  }
  if (result === "synced") { note.push("syncDelay"); if (a.who === "user") note.push("userSyn"); }
  if (result === "federated") { note.push("fedNet"); if (a.who === "admin") note.push("adminFed"); }
  if (result === "none") note.push("noneTip");
  const links = ["overview", "prereq"];
  if (s) { links.push("gallery"); if (a.where === "custom") links.push("graph"); }
  if (f) { links.push("fed"); if (a.where === "custom") links.push("custom"); links.push("admin"); }
  return { result, both, why, note, links };
}

// the Explorer views the answers point at: the recommended type first, the other one when both fit
function targets(a, r) {
  if (a.where === "custom" || r.result === "none") return [];
  const kinds = r.both ? (r.result === "synced" ? ["synced", "federated"] : ["federated", "synced"]) : [r.result];
  return kinds.map(k => ({ kind: k, href: "index.html?type=" + k + "&where=" + a.where + "#gallery" }));
}

function renderPicker() {
  const qs = QORDER.map(q => {
    const qq = get("pk.q." + q);
    const opts = Object.keys(qq.o).map(k =>
      `<label class="opt"><input type="radio" name="${q}" value="${k}"${A[q] === k ? " checked" : ""}><span>${esc(qq.o[k][0])}<small>${esc(qq.o[k][1])}</small></span></label>`).join("");
    return `<fieldset><legend>${esc(qq.t)}</legend><div class="opts">${opts}</div></fieldset>`;
  }).join("");
  $("#qs").innerHTML = qs + `<div class="cta qs-actions"><button type="button" class="btn secondary small" id="pkReset">${esc(t("pk.reset"))}</button></div>`;
  renderResult();
}

function renderResult() {
  const el = $("#result");
  const n = QORDER.filter(q => A[q]).length;
  if (n < QORDER.length) {
    el.className = "card result is-empty";
    el.innerHTML = `<p class="progress">${esc(t("pk.progress", n))}</p><p>${esc(t("pk.empty"))}</p>`;
    return;
  }
  const r = recommend(A);
  const tg = targets(A, r);
  const notes = r.note.slice();
  if (tg.length && r.result === "federated" && A.rw === "write") notes.push("writeTools");
  if (tg.length && r.result === "synced" && A.where === "onprem") notes.push("onpremAgent");
  if (tg.length && r.result === "synced" && A.where === "cloud") notes.push("cloudOnly");
  const list = (head, keys, group) => keys.length ? `<h4>${esc(head)}</h4><ul>${keys.map(k => `<li>${esc(t("pk." + group + "." + k))}</li>`).join("")}</ul>` : "";
  const name = k => t(k === "synced" ? "type.s" : "type.f");
  const explore = tg.length
    ? `<p class="jump">${tg.map((x, i) => `<a class="btn${i ? " secondary" : ""} small" href="${esc(x.href)}">${esc(t("pk.m.explore", name(x.kind)))}</a>`).join(" ")}</p>`
    : `<p class="no-list">${esc(t(A.where === "custom" ? "pk.m.custom" : "pk.m.none"))}</p>`;
  el.className = "card result";
  el.innerHTML = `<p class="progress">${esc(t("pk.progress", n))}</p><h3 class="verdict">${esc(t("pk.verdict." + r.result))}</h3>` +
    (r.both ? `<p class="note">${esc(t("pk.alsoOk"))}</p>` : "") + explore +
    list(t("pk.whyH"), r.why, "why") + list(t("pk.noteH"), notes, "note") +
    `<h4>${esc(t("pk.nextH"))}</h4><div class="links">${r.links.map(k => `<a class="btn secondary small" href="${esc(learn(DOCS[k]))}" target="_blank" rel="noopener">${esc(t("pk.next." + k))}</a>`).join("")}</div>`;
}

/* ---------- 2. adopt, 3. set up, 4. manage ---------- */
function renderAdopt() {
  $("#adoptSteps").innerHTML = t("adopt.steps").map(s => `<li>${fmt(s)}</li>`).join("");
  const lim = t("adopt.limit");
  $("#limitPair").innerHTML = ["s", "f"].map((k, i) => `<article class="card">${typeBadge(k)}<p>${fmt(lim[i])}</p></article>`).join("");
}

function renderSetup() {
  $("#setupPair").innerHTML = t("setup.cards").map(c => {
    const groups = c.groups.map(g => (g.h ? `<h3>${esc(g.h)}</h3>` : "") +
      `<ol class="proc-steps">${g.steps.map(s => `<li>${fmt(s)}</li>`).join("")}</ol>`).join("");
    return `<article class="card"><div class="card-top">${typeBadge(c.t)}<span class="who">${fmt(c.who)}</span></div>${groups}</article>`;
  }).join("");
  $("#d1").innerHTML = t("setup.d1").map(s => `<li>${fmt(s)}</li>`).join("");
  const pairs = a => a.map(([h, p]) => `<dt>${esc(h)}</dt><dd>${fmt(p)}</dd>`).join("");
  $("#d2").innerHTML = pairs(t("setup.d2"));
  $("#d3").innerHTML = pairs(t("setup.d3"));
}

function renderManage() {
  renderTable("#manageTable", t("manage.rows"), t("manage.h"));
  $("#whoList").innerHTML = t("manage.who").map(s => `<li>${esc(s)}</li>`).join("");
}

function renderNews() {
  const item = n => {
    const txt = get("news.items." + n.id);
    return `<li class="card"><div class="when">${esc(fmtMonth(n.date))}</div><div><h4>${esc(txt[0])}</h4><p>${esc(txt[1])}</p>` +
      `<div class="row"><span class="badge st-${n.status}">${esc(t("news.status." + n.status))}</span>` +
      `<a href="${ROADMAP}?searchterms=${n.rm}" target="_blank" rel="noopener">${esc(t("news.roadmap"))} · ${n.rm}</a></div></div></li>`;
  };
  const done = DATA.news.filter(n => n.status !== "dev").sort((a, b) => (a.date < b.date ? 1 : -1));
  const dev = DATA.news.filter(n => n.status === "dev").sort((a, b) => (a.date < b.date ? -1 : 1));
  $("#tl").innerHTML = `<div class="tl-group"><h3>${esc(t("news.g1"))}</h3><ul class="tl">${done.map(item).join("")}</ul></div>` +
    `<div class="tl-group"><h3>${esc(t("news.g2"))}</h3><ul class="tl">${dev.map(item).join("")}</ul></div>`;
}

function renderSources() {
  const labels = get("src.list");
  const keys = ["overview", "prereq", "deploy", "manage", "fed", "manageFed", "admin", "custom", "discovery"];
  $("#srcList").innerHTML = keys.map(k => `<li><a href="${esc(learn(DOCS[k]))}" target="_blank" rel="noopener">${esc(labels[k])}</a></li>`).join("") +
    `<li><a href="${ROADMAP}" target="_blank" rel="noopener">${esc(labels.roadmap)}</a></li>`;
}

function renderAll() {
  document.documentElement.setAttribute("lang", lang);
  document.documentElement.setAttribute("data-lang", lang);
  applyStatic();
  renderTheme();
  renderPhases();
  renderTable("#planTable", t("plan.rows"), t("plan.h"));
  renderPicker();
  renderLicense();
  renderAdopt();
  renderSetup();
  renderManage();
  renderNews();
  renderSources();
}

function setLang(l) {
  if (!I18N[l] || l === lang) return;
  lang = l;
  try { window.PocLang && window.PocLang.save(l); } catch (e) { /* storage unavailable */ }
  renderAll();
}

$$(".lang-switch button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));
$("#themeBtn").addEventListener("click", () => {
  const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("copilotPortalTheme", next); } catch (e) { /* storage unavailable */ }
  renderTheme();
});
$("#qs").addEventListener("change", e => {
  if (e.target.name && QORDER.includes(e.target.name)) { A[e.target.name] = e.target.value; renderResult(); }
});
$("#qs").addEventListener("click", e => {
  if (e.target.id === "pkReset") { QORDER.forEach(q => delete A[q]); renderPicker(); }
});

// a link to #pick, #license, #news... opens the folded block it points at
function openTarget() {
  const id = decodeURIComponent(location.hash.replace(/^#/, ""));
  const el = id && document.getElementById(id);
  const d = el && (el.tagName === "DETAILS" ? el : el.closest("details"));
  if (d && !d.open) {
    d.open = true;
    // the page just grew; scroll again so the block sits under the sticky bars
    el.scrollIntoView({ behavior: "auto", block: "start" });
  }
}
window.addEventListener("hashchange", openTarget);

/* highlight the section being read */
const links = new Map($$(".subnav a").map(a => [a.getAttribute("href").slice(1), a]));
const markCurrent = a => {
  links.forEach(x => x.removeAttribute("aria-current"));
  if (!a) return;
  a.setAttribute("aria-current", "location");
  const box = a.parentElement;
  box.scrollLeft = a.offsetLeft - box.clientWidth / 2 + a.offsetWidth / 2;
};
if ("IntersectionObserver" in window) {
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => { if (en.isIntersecting) markCurrent(links.get(en.target.id)); });
  }, { rootMargin: "-30% 0px -60% 0px" });
  $$("main section.block").forEach(s => io.observe(s));
  let ticking = false;
  window.addEventListener("scroll", () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      ticking = false;
      if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2) markCurrent([...links.values()].pop());
    });
  }, { passive: true });
}

window.CopilotConnectorPlanner = { recommend, targets };
renderAll();
openTarget();
})();

</script>
</body>
</html>
