/* Power of Copilot - shared language core (v1)
 *
 * ONE source of truth. Injected inline into every entry page by
 * _tools/inject_lang.py, so each page stays a standalone file.
 * Never load this with <script src>: the handbooks are distributed as
 * single files and are opened offline over file://.
 *
 * Priority: ?lang= > saved preference > navigator.languages > fallback.
 * Once the reader picks a language it wins everywhere, including when they
 * open a link that points at a different language edition.
 *
 * Pages declare window.__LANG_CFG before this block:
 *   cur        current edition of THIS file, normalized ('zh-Hant'|'zh-Hans'|'en')
 *   mode       'redirect' (separate file per language) | 'inpage' (switches live)
 *   paths      redirect mode only: normalized code -> relative path
 *   supported  languages this page actually ships (default: all three)
 *   fallback   used when nothing matches (default: 'en')
 *
 * Exposes window.PocLang = { code, save, normalize, KEY }.
 */
(function () {
  "use strict";

  var KEY = "pocLang";
  var CODES = ["zh-Hant", "zh-Hans", "en"];
  // keys written by earlier per-page implementations, newest first - read once
  // so nobody who already picked a language gets thrown back to detection
  var LEGACY = [
    "copilotPortalLang", "powerofcopilot.lang", "poc.lang", "cph-lang",
    "copilotBuildingLang", "copilotPlaygroundLang", "copilotPlanetLang",
    "copilotExpoLang", "agentTransitLang", "agent-lang"
  ];
  var cfg = window.__LANG_CFG || {};
  var supported = cfg.supported || CODES;
  var HOP = "pocLangHop";

  // Accepts every vocabulary in use across the sites plus raw BCP 47 tags:
  // 'zh'/'cn'/'en', 'zh-cn'/'zh-Hant', 'zh-Hans-CN', 'en-GB'...
  function normalize(value) {
    if (!value) return null;
    var v = String(value).toLowerCase();
    if (v === "cn") return "zh-Hans";
    if (v === "zh") return "zh-Hant";
    if (/^en/.test(v)) return "en";
    if (/(^|[-_])(hans|cn|sg)(?![a-z])/.test(v)) return "zh-Hans";
    if (/^zh/.test(v)) return "zh-Hant";
    return null;
  }

  function read(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }
  function write(key, value) {
    try { localStorage.setItem(key, value); } catch (e) {}
  }

  function save(value) {
    var code = normalize(value);
    if (code) write(KEY, code);
    return code;
  }

  // Preference is stored unchanged even when the current page cannot render it;
  // only the language used for THIS render is downgraded.
  function toSupported(code) {
    if (supported.indexOf(code) !== -1) return code;
    var order = code === "zh-Hans" ? ["zh-Hant", "en"]
      : code === "zh-Hant" ? ["zh-Hans", "en"]
      : ["en", "zh-Hant"];
    for (var i = 0; i < order.length; i++) {
      if (supported.indexOf(order[i]) !== -1) return order[i];

    try {

    } catch (e) { return null; }
  }

    for (var i = 0; i < LEGACY.length; i++) {

    }
    return null;

    }

    var q = fromQuery();
    if (q) { write(KEY, q); return q; }         // shared links set the preference

  // the choice before navigating, otherwise the new page bounces straight back.

<script>
(() => {
  const param = new URLSearchParams(location.search).get("scoutTheme");
  let saved = null;
  try { saved = localStorage.getItem("copilotPortalTheme"); } catch (_) {}
  const ok = v => v === "light" || v === "dark";
  const theme = ok(param) ? param : ok(saved) ? saved : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.setAttribute("data-theme", theme);
  const lang = (window.PocLang && window.PocLang.code) || "zh-Hant";
  document.documentElement.setAttribute("data-lang", lang);
  document.documentElement.setAttribute("lang", lang);
})();
</script>

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { min-height: 100%; background: var(--cp-bg); scroll-behavior: smooth; scroll-padding-top: 132px; }
body {
  min-width: 280px; min-height: 100vh; margin: 0; font-size: 15px; line-height: 1.6;
  background:
    radial-gradient(circle at 12% 8%, var(--wash-a), transparent 34%),
    radial-gradient(circle at 88% 14%, var(--wash-b), transparent 32%),
    linear-gradient(var(--cp-sheen), var(--cp-sheen)),
    var(--cp-bg);
  color: var(--cp-text);
  font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
}
html[data-lang="zh-Hans"] body {
  font-family: "Segoe UI", "Microsoft YaHei", "微软雅黑", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
}
button, input, select { font: inherit; color: inherit; }
input::placeholder { color: var(--cp-text-muted); opacity: 1; }
a { color: var(--cp-link); }
.shell { width: min(1180px, calc(100% - 48px)); margin: 0 auto; }
.skip { position: absolute; left: -9999px; top: 8px; z-index: 100; padding: 10px 14px; border-radius: 0.625rem; background: var(--cp-accent); color: var(--cp-accent-fg); font-weight: 700; }
.skip:focus { left: 12px; }
:focus-visible { outline: 3px solid var(--cp-accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

/* top bar */
.topbar { position: sticky; top: 0; z-index: 20; background: var(--cp-overlay); border-bottom: 1px solid var(--cp-border); backdrop-filter: blur(18px); }
.topbar::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--cp-gradient); }
.topbar-inner { min-height: 68px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; text-decoration: none; color: var(--cp-text); }
.brand img { width: 38px; height: 38px; object-fit: contain; flex: none; }
.brand-name { font-size: 15px; font-weight: 700; line-height: 1.25; }
.brand-sub { margin-top: 2px; color: var(--cp-text-muted); font-size: 12px; }

rom Microsoft Teams alongside content from other enterprise systems to provide unified results.","將 Microsoft Teams 的內容與其他企業系統的內容一併建立索引，提供整合的搜尋結果。","将 Microsoft Teams 的内容与其他企业系统的内容一并建立索引，提供统一的搜索结果。","url:https://uplandsoftware.com/bainsight/connectors/microsoft-teams/",0,0,0],["Microsoft Teams","ServiceNow","P",17,0,"Retrieves conversations and attachments from teams in your Microsoft Teams source system and makes their content and metadata searchable in AI Search applications.","從來源系統 Microsoft Teams 的團隊中擷取交談與附件，並讓其內容與中繼資料可在 AI Search 應用程式中搜尋。","从来源系统 Microsoft Teams 的团队中获取对话和附件，并让其内容和元数据可在 AI Search 应用中搜索。","url:https://www.servicenow.com/docs/bundle/zurich-platform-administration/page/administer/ai-search/concept/microsoft-teams-external-content-connector.html",0,0,0],["Mural","Mural","P",17,0,"Enables an enterprise to bring a continuously updated copy of Mural data into an indexed database inside their Microsoft tenant. It enhances Mural's Copilot plugin to help users answer questions about mural content, summarize the content inside murals, and more. It also unlocks the ability to access murals and mural content from Microsoft Search hubs like SharePoint or the Microsoft 365 app.","讓企業把持續更新的 Mural 資料副本，匯入自己 Microsoft 租用戶內已建立索引的資料庫。它強化了 Mural 的 Copilot 外掛程式，協助使用者回答關於 mural 內容的問題、摘要 mural 內的內容等，也讓使用者能從 SharePoint 或 Microsoft 365 應用程式等 Microsoft Search 入口存取 mural 與其內容。","让企业把持续更新的 Mural 数据副本，导入自己 Microsoft 租户内已建立索引的数据库。它增强了 Mural 的 Copilot 插件，帮助用户回答有关 mural 内容的问题、总结 mural 里的内容等，也让用户能从 SharePoint 或 Microsoft 365 应用等 Microsoft Search 入口访问 mural 及其内容。","url:https://support.mural.co/s/article/Mural-s-Microsoft-Graph-connector-admin",0,0,0],["Notion","RheinInsights","P",17,0,"Reliably indexes databases, pages, attachments, and files for Notion. Comes with full metadata sets, advanced processing pipelines, and connector-based support for Notion's permission model.","可穩定索引 Notion 的資料庫、頁面、附件與檔案，提供完整的中繼資料集與進階處理管線，並由連接器支援 Notion 的權限模型。","可稳定索引 Notion 的数据库、页面、附件和文件，提供完整的元数据集和高级处理管道，并由连接器支持 Notion 的权限模型。","url:https://www.rheininsights.com/en/connectors/notion.php",0,0,0],["Powtoon","Powtoon","P",17,0,"Powtoon is a video creation platform and the Powtoon connector enables the indexing of video and content with Microsoft Graph.","Powtoon 是影片製作平台，其連接器可讓影片與內容透過 Microsoft Graph 建立索引。","Powtoon 是视频制作平台，其连接器可让视频和内容通过 Microsoft Graph 建立索引。","url:https://www.powtoon.com/integrations/",0,0,0],["Priority Matrix","Priority Matrix","P",17,0,"The Priority Matrix connector indexes every task and project in your account, allowing your team members to find relevant items directly from Office, Teams, and more. Access your priorities without switching context.","Priority Matrix 連接器會為你帳戶中的每個工作與專案建立索引，讓團隊成員能直接從 Office、Teams 等位置找到相關項目，不必切換工作情境就能存取你的優先事項。","Priority Matrix 连接器会为你账户中的每项任务和项目建立索引，让团队成员能直接从 Office、Teams 等位置找到相关内容，无需切换上下文就能查看你的优先事项。","url:https://sync.appfluence.com/office365/external_connector/",0,0,0],["ServiceNow Catalog","ServiceNow","P",17,0,"Allows your organization to list service catalog items. These items are visible to users as per the user criteria permissions defined within your organization. After you configure the connector and index content from ServiceNow, end users can search for those catalog items in Microsoft Copilot and from any Microsoft Search client.","讓組織列出服務目錄項目。這些項目會依組織內定義的使用者準則權限顯示給使用者。設定連接器並索引 ServiceNow 的內容後，一般使用者即可在 Microsoft Copilot 與任何 Microsoft Search 用戶端中搜尋這些目錄項目。","让组织列出服务目录项。这些项会按组织内定义的用户条件权限显示给用户。配置连接器并索引 ServiceNow 的内容后，最终用户即可在 Microsoft Copilot 和任何 Microsoft Search 客户端中搜索这些目录项。","abs:microsoft-365/copilot/connectors/servicenow-catalog-overview",0,0,0],["ServiceNow Knowledge","ServiceNow","P",17,0,"Enables organizations to index ServiceNow knowledge base (KB) articles into Microsoft 365 Copilot and search experiences.","讓組織將 ServiceNow 知識庫（KB）文章索引到 Microsoft 365 Copilot 與各項搜尋體驗中。","让组织将 ServiceNow 知识库（KB）文章索引到 Microsoft 365 Copilot 和各类搜索体验中。","abs:microsoft-365/copilot/connectors/servicenow-knowledge-overview",0,0,0],["Slack","RheinInsights","P",17,0,"Enables the Enterprise search and Microsoft 365 connector for indexing Slack. Reliably indexes public and private channels, messages, threads, and attached files. Comes with full metadata sets, advanced processing pipelines, and full support for Slack's permission model.","為 Slack 建立索引，支援企業搜尋與 Microsoft 365 連接器。可穩定索引公開與私人頻道、訊息、討論串與附加檔案，提供完整的中繼資料集與進階處理管線，並完整支援 Slack 的權限模型。","为 Slack 建立索引，支持企业搜索和 Microsoft 365 连接器。可稳定索引公开和私有频道、消息、线程和附加文件，提供完整的元数据集和高级处理管道，并完整支持 Slack 的权限模型。","url:https://www.rheininsights.com/en/connectors/slack.php",0,0,0],["Slack","ServiceNow","P",17,0,"Secure enterprise search connector for reliably indexing content from Slack and intelligently searching it with Microsoft Graph. It robustly indexes messages, threads, and shared files from all public channels from Slack in near real-time.","安全的企業搜尋連接器，可穩定索引 Slack 的內容，並透過 Microsoft Graph 進行智慧搜尋。可近乎即時地索引 Slack 所有公開頻道中的訊息、討論串與共用檔案。","安全的企业搜索连接器，可稳定索引 Slack 的内容，并通过 Microsoft Graph 进行智能搜索。可近乎实时地索引 Slack 所有公开频道中的消息、线程和共享文件。","url:https://www.servicenow.com/docs/bundle/zurich-platform-administration/page/administer/ai-search/concept/slack-external-content-connector.html",0,0,0],["TeamForge","Accenture","P",17,0,"Crawls content from a TeamForge server through its SOAP services.","透過 SOAP 服務從 TeamForge 伺服器爬取內容。","通过 SOAP 服务从 TeamForge 服务器爬取内容。","url:https://www.accenture.com/in-en/services/ecosystem-partners/microsoft",0,1,0],["Trello","RheinInsights","P",17,0,"Enables the Enterprise search and Microsoft 365 connector for indexing Trello. Reliably indexes Trello boards, cards, comments, and attachments. Comes with full metadata sets, advanced processing pipelines, and full support for Trello's permission model.","為 Trello 建立索引，支援企業搜尋與 Microsoft 365 連接器。可穩定索引 Trello 的看板、卡片、留言與附件，提供完整的中繼資料集與進階處理管線，並完整支援 Trello 的權限模型。","为 Trello 建立索引，支持企业搜索和 Microsoft 365 连接器。可稳定索引 Trello 的看板、卡片、评论和附件，提供完整的元数据集和高级处理管道，并完整支持 Trello 的权限模型。","url:https://www.rheininsights.com/en/connectors/trello.php",0,0,0],["Adobe Experience Manager (AEM)","Accenture","P",18,0,"The Adobe Experience Manager (AEM) connector crawls content from an Adobe Experience Manager server. The connector fetches access control lists for document-level security (currently only Closed Users Groups). It can filter content based on properties using expected values or patterns or pages based on the scheduled on and off time.","Adobe Experience Manager（AEM）連接器會從 Adobe Experience Manager 伺服器爬取內容，並擷取存取控制清單以提供文件層級的安全性（目前僅支援封閉使用者群組）。可依屬性的預期值或模式篩選內容，也可依排定的上線與下線時間篩選頁面。","Adobe Experience Manager（AEM）连接器会从 Adobe Experience Manager 服务器爬取内容，并获取访问控制列表以提供文档级安全性（目前仅支持封闭用户组）。可按属性的预期值或模式筛选内容，也可按计划的上线和下线时间筛选页面。","url:https://www.accenture.com/in-en/services/ecosystem-partners/microsoft",0,1,0],["Bentley AssetWise","BA Insight","P",18,0,"The BA Insight Bentley AssetWise connector makes it possible to surface content from AssetWise into a single consolidated search index, along with content from other repositories.","BA Insight 的 Bentley AssetWise 連接器可將 AssetWise 的內容，與其他存放庫的內容一起整合到單一搜尋索引中呈現。","BA Insight 的 Bentley AssetWise 连接器可将 AssetWise 的内容，与其他仓库的内容一起汇总到单一搜索索引中呈现。","url:https://uplandsoftware.com/bainsight/connectors/bentley-assetwise/",0,0,0],["CuadraSTAR","BA Insight","P",18,0,"Crawls content in CuadraSTAR and creates a single index that makes it possible to use Microsoft Search to find relevant information within CuadraSTAR, and over 70 other supported repositories, eliminating the need to perform separate searches.","爬取 CuadraSTAR 中的內容並建立單一索引，讓你能用 Microsoft Search 在 CuadraSTAR 與其他 70 多個支援的存放庫中找到相關資訊，不必分別搜尋。","爬取 CuadraSTAR 中的内容并建立单一索引，让你能用 Microsoft Search 在 CuadraSTAR 和其他 70 多个受支持的仓库中找到相关信息，无需分别搜索。","url:https://uplandsoftware.com/bainsight/connectors/cuadrastar/",0,0,0],["Documentum Document Query Language (DQL)","Accenture","P",18,0,"The Aspire Documentum Document Query Language (DQL) connector crawls content from Documentum.","Aspire 的 Documentum Document Query Language（DQL）連接器會從 Documentum 爬取內容。","Aspire 的 Documentum Document Query Language（DQL）连接器会从 Documentum 爬取内容。","url:https://www.accenture.com/in-en/services/ecosystem-partners/microsoft",0,1,0],["Elasticsearch","Accenture","P",18,0,"The Elasticsearch connector crawls content from an Elastic index using a user-defined query. It can identify updates automatically or use a timestamp in the index.","Elasticsearch 連接器會以使用者自訂的查詢，從 Elastic 索引爬取內容，可自動偵測更新，或使用索引中的時間戳記。","Elasticsearch 连接器会通过用户自定义的查询，从 Elastic 索引爬取内容，可自动发现更新，或使用索引中的时间戳。","url:https://www.accenture.com/in-en/services/ecosystem-partners/microsoft",0,1,0],["HP Consolidated Archive (EAS)","BA Insight","P",18,0,"BA Insight’s HP Consolidated Archive connector securely indexes both the full text and metadata of documents in archives into various search engines, including SharePoint Search and Azure Search. It enables a single searchable result set across content from multiple repositories. It allows organizations to tap into the wealth of information accessible within Consolidated Archive, SharePoint, and other repositories, making that data instantly actionable to users through search.","BA Insight 的 HP Consolidated Archive 連接器可將封存中文件的全文與中繼資料，安全地索引到包含 SharePoint Search 與 Azure Search 在內的各種搜尋引擎，讓多個存放庫的內容整合成單一可搜尋的結果集，協助組織善用 Consolidated Archive、SharePoint 與其他存放庫中的豐富資訊，讓使用者透過搜尋即刻運用這些資料。","BA Insight 的 HP Consolidated Archive 连接器可将归档中文档的全文和元数据，安全地索引到包括 SharePoint Search 和 Azure Search 在内的各种搜索引擎，让多个仓库的内容汇总成单一可搜索的结果集，帮助组织用好 Consolidated Archive、SharePoint 和其他仓库中的丰富信息，让用户通过搜索即刻使用这些数据。","url:https://uplandsoftware.com/bainsight/connectors/hp-consolidated-archive/",0,0,0],["IBM Content Manager","BA Insight","P",18,0,"BA Insight's IBM Content Manager Connector honors the security of source applications and provides both full and incremental crawls so the users have the latest information available to them all the time.","BA Insight 的 IBM Content Manager 連接器會遵循來源應用程式的安全性設定，並提供完整與增量爬取，讓使用者隨時取得最新資訊。","BA Insight 的 IBM Content Manager 连接器遵循来源应用的安全设置，并提供完整 ，并提供完整爬取和增量爬取，让用户随时获得最新信息。它会将 PostgreSQL 的内容索引到 Microsoft Search，并通过 BA Insight 的 SmartHub 呈现，为用户提供统一的搜索结果。","url:https://uplandsoftware.com/bainsight/connectors/postgresql/",0,0,0],["Practical Law","BA Insight","P",20,0,"The BA Insight Practical Law Connector enables users to perform searches against the Practical Law database, eliminating the need to navigate to Practical Law directly.","BA Insight 的 Practical Law 連接器讓使用者可搜尋 Practical Law 資料庫，不必直接前往 Practical Law。","BA Insight 的 Practical Law 连接器让用户可搜索 Practical Law 数据库，无需直接前往 Practical Law。","url:https://uplandsoftware.com/bainsight/connectors/practical-law/",0,0,0],["Relational Databases","Accenture","P",20,0,"Crawls content from relational databases using third-party Java Database Connectivity (JDBC) drivers. Updates are identified automatically or use an update table. An SQL select statement is used to control the data submitted. Access control lists can be extracted from a returned column.","使用第三方 Java Database Connectivity（JDBC）驅動程式，從關聯式資料庫爬取內容。可自動找出更新，或使用更新資料表。以 SQL select 陳述式控制要提交的資料，並可從傳回的資料行擷取存取控制清單。","使用第三方 Java Database Connectivity（JDBC）驱动程序，从关系数据库爬取内容。可自动发现更新，或使用更新表。通过 SQL select 语句控制要提交的数据，并可从返回的列中提取访问控制列表。","url:https://www.accenture.com/in-en/services/ecosystem-partners/microsoft",0,1,0],["ServiceNow instance","ServiceNow","P",21,0,"Retrieves KB article records (and their attachments) from your ServiceNow AI Platform source instance and makes their content and metadata searchable in AI Search applications in your ServiceNow AI Platform destination instance.","從來源 ServiceNow AI Platform 執行個體擷取 KB 文章記錄（含附件），並讓其內容與中繼資料可在目的地 ServiceNow AI Platform 執行個體的 AI Search 應用程式中搜尋。","从来源 ServiceNow AI Platform 实例获取 KB 文章记录（含附件），并让其内容和元数据可在目标 ServiceNow AI Platform 实例的 AI Search 应用中搜索。","url:https://www.servicenow.com/docs/bundle/zurich-platform-administration/page/administer/ai-search/concept/servicenow-instance-external-content-connector.html",0,0,0],["Amazon S3","Accenture","P",22,0,"Indexes pages, attachments, and other generated document types from Amazon S3 in near real-time. The connector fully supports Amazon S3's built-in user and group management, as well as Amazon S3 installations based on Microsoft Entra ID and other directory services.","近乎即時地索引 Amazon S3 中的頁面、附件與其他產生的文件類型。連接器完整支援 Amazon S3 內建的使用者與群組管理，以及以 Microsoft Entra ID 與其他目錄服務為基礎的 Amazon S3 安裝。","近乎实时地索引 Amazon S3 中的页面、附件和其他生成的文档类型。连接器完全支持 Amazon S3 内置的用户和组管理，以及基于 Microsoft Entra ID 及其他目录服务的 Amazon S3 安装。","url:https://www.accenture.com/in-en/services/ecosystem-partners/microsoft",0,1,0],["Amazon S3","BA Insight","P",22,0,"BA Insight's Amazon S3 connector works with all content stored in S3. Organizations can use the connector to securely connect to S3 and index content from S3 buckets. Powerful filtering capabilities give organizations control over what content found in S3 should be indexed.","BA Insight 的 Amazon S3 連接器適用於 S3 中儲存的所有內容。組織可用它安全地連線到 S3，並為 S3 貯體中的內容建立索引；強大的篩選功能讓組織能控制 S3 中哪些內容要建立索引。","BA Insight 的 Amazon S3 连接器适用于 S3 中存储的所有内容。组织可用它安全地连接到 S3，并为 S3 存储桶中的内容建立索引；强大的筛选功能让组织能控制 S3 中哪些内容要建立索引。","url:https://www.bainsight.com/connectors/amazon-s3-connector-sharepoint-azure-elasticsearch/",0,0,0],["Amazon S3","ServiceNow","P",22,0,"Retrieves files from buckets in your Amazon S3 source system and makes their content and metadata searchable in AI Search applications.","從來源系統 Amazon S3 的貯體擷取檔案，並讓其內容與中繼資料可在 AI Search 應用程式中搜尋。","从来源系统 Amazon S3 的存储桶获取文件，并让其内容和元数据可在 AI Search 应用中搜索。","url:https://www.servicenow.com/docs/bundle/zurich-platform-administration/page/administer/ai-search/concept/amazon-s3-external-content-connector.html",0,0,0],["Azure Blob Storage","Accenture","P",22,0,"Crawls content from the Azure Blob Container. Each blob is submitted with its metadata (size, location, last accessed, and so on.). Updates are discovered automatically.","從 Azure Blob 容器爬取內容。每個 Blob 會連同其中繼資料（大小、位置、上次存取時間等）一併提交，並自動偵測更新。","从 Azure Blob 容器爬取内容。每个 Blob 会连同其元数据（大小、位置、上次访问时间等）一并提交，并自动发现更新。","url:https://www.accenture.com/in-en/services/ecosystem-partners/microsoft",0,1,0],["Azure Data Lake","Accenture","P",22,0,"Crawls content from the Azure Data Lake Storage (ADLS) cloud at either root or specified paths. Each file is submitted with its metadata (size, location, last accessed, and so on.). Updates are discovered automatically.","從 Azure Data Lake Storage（ADLS）雲端的根目錄或指定路徑爬取內容。每個檔案會連同其中繼資料（大小、位置、上次存取時間等）一併提交，並自動偵測更新。","从 Azure Data Lake Storage（ADLS）云的根目录或指定路径爬取内容。每个文件会连同其元数据（大小、位置、上次访问时间等）一并提交，并自动发现更新。","url:https://www.accenture.com/in-en/services/ecosystem-partners/microsoft",0,1,0],["Azure Event Hubs","Accenture","P",22,0,"The Event Hubs connector fetches events from Azure streams and submits them after performing an optional transform.","Event Hubs 連接器會從 Azure 串流擷取事件，並在執行選用的轉換後提交。","Event Hubs 连接器会从 Azure 流获取事件，并在执行可选的转换后提交。","url:https://www.accenture.com/in-en/services/ecosystem-partners/microsoft",0,1,0],["Box","Accenture","P",22,0,"Box connector crawls content from a Box repository. The connector retrieves the supported elements using the RESTful API (Content API Basics 2.0 version); for authentication, it uses Box API (that uses OAuth 2). Each file is submitted with its metadata (size, location, last accessed, and so on.). Updates are discovered automatically.","Box 連接器會從 Box 存放庫爬取內容，透過 RESTful API（Content API Basics 2.0 版）擷取支援的項目；驗證則使用 Box API（採用 OAuth 2）。每個檔案會連同其中繼資料（大小、位置、上次存取時間等）一併提交，並自動偵測更新。","Box 连接器会从 Box 仓库爬取内容，通过 RESTful API（Content API Basics 2.0 版）获取受支持的元素；身份验证则使用 Box API（采用 OAuth 2）。每个文件会连同其元数据（大小、位置、上次访问时间等）一并提交，并自动发现更新。","url:https://www.accenture.com/in-en/services/ecosystem-partners/microsoft",0,1,0],["Box","BA Insight","P",22,0,"BA Insight's Box connector makes it possible to surface content from Box in SharePoint and other portals, enabling users to get integrated search results from SharePoint and Box.","BA Insight 的 Box 連接器可在 SharePoint 與其他入口網站中呈現 Box 的內容，讓使用者取得來自 SharePoint 與 Box 的整合搜尋結果。","BA Insight 的 Box 连接器可在 SharePoint 和其他门户中呈现 Box 的内容，让用户获得来自 SharePoint 和 Box 的统一搜索结果。","url:https://uplandsoftware.com/bainsight/connectors/box/",0,0,0],["Box","Box","P",22,0,"Enables users to search for and surface their Box content from within Microsoft 365 experiences. The Box connector helps Box and Microsoft users to explore, discover, and go to the content they need when they need it.","讓使用者能在 Microsoft 365 的各項體驗中搜尋並呈現自己的 Box 內容。Box 連接器協助 Box 與 Microsoft 的使用者在需要時探索、找到並前往所需的內容。","让用户能在 Microsoft 365 的各项体验中搜索并呈现自己的 Box 内容。Box 连接器帮助 Box 和 Microsoft 的用户在需要时探索、找到并前往所需的内容。","url:https://support.box.com/hc/articles/4403605037587",1,0,0],["Box","ServiceNow","P",22,0,"Secure enterprise search connector for reliably indexing content from Box and intelligently searching it with Microsoft Graph. It robustly indexes files, folders, comments, users, groups, and tasks from Box in near real-time. The connector fully supports Box’s built-in user and group management.","安全的企業搜尋連接器，可穩定索引 Box 的內容，並透過 Microsoft Graph 進行智慧搜尋。可近乎即時地索引 Box 中的檔案、資料夾、留言、使用者、群組與工作。連接器完整支援 Box 內建的使用者與群組管理。","安全的企业搜索连接器，可稳定索引 Box 的内容，并通过 Microsoft Graph 进行智能搜索。可近乎实时地索引 Box 中的文件、文件夹、评论、用户、组和任务。连接器完全支持 Box 内置的用户和组管理。","url:https://www.servicenow.com/docs/bundle/zurich-platform-administration/page/administer/ai-search/concept/box-external-content-connector.html",0,0,0],["File Share","BA Insight","P",22,0,"BA Insight's File Share connector makes it possible to surface content from File Shares (Windows, Server Message Block/CIFS) in a single consolidated search index, along with content from other repositories.","BA Insight 的 File Share 連接器可將檔案共用（Windows、Server Message Block/CIFS）的內容，與其他存放庫的內容一起整合到單一搜尋索引中呈現。","BA Insight 的 File Share 连接器可将文件共享（Windows、Server Message Block/CIFS）的内容，与其他仓库的内容一起汇总到单一搜索索引中呈现。","url:https://uplandsoftware.com/bainsight/connectors/file-share/",0,0,0],["File Share and Network Shares","RheinInsights","P",22,0,"Enables the Enterprise search and Microsoft 365 Copilot connector for indexing file shares. Reliably indexes all files from the given file share. Comes with full metadata sets, advanced processing pipelines, supporting UI features, and full support for the respective file share's permission model.","為檔案共用建立索引，支援企業搜尋與 Microsoft 365 Copilot 連接器。可穩定索引指定檔案共用中的所有檔案，提供完整的中繼資料集、進階處理管線與輔助的使用者介面功能，並完整支援各檔案共用的權限模型。","为文件共享建立索引，支持企业搜索和 Microsoft 365 Copilot 连接器。可稳定索引指定文件共享中的所有文件，提供完整的元数据集、高级处理管道和辅助的用户界面功能，并完整支持各文件共享的权限模型。","url:https://www.rheininsights.com/en/connectors/file-share.php",0,0,0],["File System","Accenture","P",22,0,"The File System connector crawls local file (or locally mounted) systems, traversing folders to build a complete index. It generates a signature for each item to allow incremental updates of only changed items. Each file is submitted with its metadata (size, location, last accessed, etc.).","File System 連接器會爬取本機（或本機掛接的）檔案系統，走訪資料夾以建立完整索引。它會為每個項目產生簽章，以便只對有變更的項目進行增量更新。每個檔案會連同其中繼資料（大小、位置、上次存取時間等）一併提交。","File System 连接器会爬取本地（或本地挂载的）文件系统，遍历文件夹以建立完整索引。它会为每个项目生成签名，以便只对有变更的项目进行增量更新。每个文件会连同其元数据（大小、位置、上次访问时间等）一并提交。","url:https://www.accenture.com/in-en/services/ecosystem-partners/microsoft",0,1,0],["File Transfer Protocol (FTP)","Accenture","P",22,0,"The Aspire File Transfer Protocol (FTP) connector provides access to files and folders on an FTP server. Each file is submitted with its metadata (size, location, last accessed, etc.). Updates are discovered automatically.","Aspire 的 File Transfer Protocol（FTP）連接器可存取 FTP 伺服器上的檔案與資料夾。每個檔案會連同其中繼資料（大小、位置、上次存取時間等）一併提交，並自動偵測更新。","Aspire 的 File Transfer Protocol（FTP）连接器可访问 FTP 服务器上的文件和文件夹。每个文件会连同其元数据（大小、位置、上次访问时间等）一并提交，并自动发现更新。","url:https://www.accenture.com/in-en/services/ecosystem-partners/microsoft",0,1,0],["Hadoop Distributed File System (HDFS)","Accenture","P",22,0,"The Hadoop Distributed File System (HDFS) connector crawls content from any given HDFS Cluster using the WebHDFS HTTP interface. Each file is submitted with its metadata (size, location, last accessed, etc.). Updates are discovered automatically.","Hadoop Distributed File System（HDFS）連接器會透過 WebHDFS HTTP 介面，從任何指定的 HDFS 叢集爬取內容。每個檔案會連同其中繼資料（大小、位置、上次存取時間等）一併提交，並自動偵測更新。","Hadoop Distributed File System（HDFS）连接器会通过 WebHDFS HTTP 接口，从任何指定的 HDFS 集群爬取内容。每个文件会连同其元数据（大小、位置、上次访问时间等）一并提交，并自动发现更新。","url:https://www.accenture.com/in-en/services/ecosystem-partners/microsoft",0,1,0],["IBM FileNet","Insight","P",22,0,"BA Insight's IBM FileNet Content Manager connector allows SharePoint, and other portal users, to securely search for content stored in FileNet repositories. Access to content is determined by security established in FileNet, ensuring that your content is as safe when accessed through any other portal as it is directly within FileNet.","BA Insight 的 IBM FileNet Content Manager 連接器讓 SharePoint 與其他入口網站的使用者，能安全地搜尋 FileNet 存放庫中的內容。內容的存取權由 FileNet 中建立的安全性決定，確保內容不論透過其他入口網站，或直接在 FileNet 中存取，都同樣安全。","BA Insight 的 IBM FileNet Content Manager 连接器让 SharePoint 和其他门户的用户，能安全地搜索 FileNet 仓库中的内容。内容的访问权由 FileNet 中建立的安全性决定，确保内容不论通过其他门户，还是直接在 FileNet 中访问，都同样安全。","url:https://uplandsoftware.com/bainsight/connectors/ibm-filenet/",0,0,0],["Microsoft OneDrive","Accenture","P",22,0,"The OneDrive connector crawls content from Microsoft OneDrive, traversing folders to find files. It generates a signature for each item to allow incremental updates of only changed items. Each file is submitted with its metadata and access control lists.","OneDrive 連接器會從 Microsoft OneDrive 爬取內容，走訪資料夾以找出檔案。它會為每個項目產生簽章，以便只對有變更的項目進行增量更新。每個檔案會連同其中繼資料與存取控制清單一併提交。","OneDrive 连接器会从 Microsoft OneDrive 爬取内容，遍历文件夹以找出文件。它会为每个项目生成签名，以便只对有变更的项目进行增量更新。每个文件会连同其元数据和访问控制列表一并提交。","url:https://www.accenture.com/in-en/services/ecosystem-partners/microsoft",0,1,0],["Microsoft OneDrive","BA Insight","P",22,0,"The BA Insight OneDrive connector makes it possible to index content from OneDrive into various search platforms, providing users with integrated search results from multiple sources.","BA Insight 的 OneDrive 連接器可將 OneDrive 的內容索引到各種搜尋平台，為使用者提供來自多個來源的整合搜尋結果。","BA Insight 的 OneDrive 连接器可将 OneDrive 的内容索引到各种搜索平台，为用户提供来自多个来源的统一搜索结果。","url:https://uplandsoftware.com/bainsight/connectors/onedrive-business/",0,0,0],["Microsoft OneDrive","ServiceNow","P",22,0,"Retrieves files from individual drives in your Microsoft OneDrive source system and makes their content and metadata searchable in AI Search applications.","從來源系統 Microsoft OneDrive 的各個雲端硬碟擷取檔案，並讓其內容與中繼資料可在 AI Search 應用程式中搜尋。","从来源系统 Microsoft OneDrive 的各个云端硬盘获取文件，并让其内容和元数据可在 AI Search 应用中搜索。","url:https://www.servicenow.com/docs/bundle/zurich-platform-administration/page/administer/ai-search/concept/microsoft-onedrive-external-content-connector.html",0,0,0],["Nasuni File Share","Nasuni","P",22,0,"Integrates external file share data into Microsoft 365, enhancing search, AI-driven content discovery, and advanced analytics. This connector allows seamless indexing of Nasuni data, enabling organizations to unlock the full potential of their distributed content through a unified search experience and personalized, AI-powered insights. It supports scalability with up to 20 paths per connector and optimizes performance for large datasets.","將外部檔案共用的資料整合到 Microsoft 365，強化搜尋、AI 驅動的內容探索與進階分析。此連接器可順暢地為 Nasuni 資料建立索引，讓組織透過統一的搜尋體驗與個人化的 AI 洞察，充分發揮分散內容的價值。每個連接器最多支援 20 個路徑，具備擴充性，並針對大型資料集最佳化效能。","将外部文件共享的数据集成到 Microsoft 365，增强搜索、AI 驱动的内容发现和高级分析。此连接器可顺畅地为 Nasuni 数据建立索引，让组织通过统一的搜索体验和个性化的 AI 洞察，充分发挥分散内容的价值。每个连接器最多支持 20 个路径，具备可扩展性，并针对大型数据集优化性能。","url:https://www.nasuni.com/partners/alliance-cloud-partners/graph-connector/",0,0,0],["NetApp","NetApp","P",22,0,"The NetApp connector for Microsoft 365 Copilot lets organizations connect their NetApp ONTAP files and data to Copilot without moving or changing the original data. This works for on-premises, cloud-based (Azure, AWS, and GCP), and virtual NetApp solutions. It allows users to easily access non-Microsoft 365 data for their Copilot and Copilot Studio needs.","Microsoft 365 Copilot 的 NetApp 連接器讓組織不必移動或變更原始資料，就能將 NetApp ONTAP 的檔案與資料連接到 Copilot。適用於內部部署、雲端（Azure、AWS、GCP）與虛擬 NetApp 解決方案，讓使用者輕鬆取得非 Microsoft 365 的資料，用於 Copilot 與 Copilot Studio 的需求。","Microsoft 365 Copilot 的 NetApp 连接器让组织无需移动或更改原始数据，就能将 NetApp ONTAP 的文件和数据连接到 Copilot。适用于本地部署、云端（Azure、AWS、GCP）和虚拟 NetApp 解决方案，让用户轻松获取非 Microsoft 365 的数据，用于 Copilot 和 Copilot Studio 的需求。","url:https://community.netapp.com/t5/Tech-ONTAP-Blogs/Announcing-the-release-of-NetApp-Connector-v1-1-for-Microsoft-365-Copilot/ba-p/457980",0,0,0],["OData via Rest","RheinInsights","P",22,0,"Enables the Enterprise search and Microsoft 365 Copilot connector for flexibly indexing custom data via OData over REST. Easily provide your own data via SAP API Management, Google Apigee Management, or Azure API Management. It comes with full metadata sets of the provided documents, advanced processing pipelines, and support for custom permission models, also provided via an API endpoint.","透過 OData over REST 靈活地為自訂資料建立索引，支援企業搜尋與 Microsoft 365 Copilot 連接器。可輕鬆透過 SAP API Management、Google Apigee Management 或 Azure API Management 提供你自己的資料。附帶所提供文件的完整中繼資料集、進階處理管線，並支援同樣透過 API 端點提供的自訂權限模型。","通过 OData over REST 灵活地为自定义数据建立索引，支持企业搜索和 Microsoft 365 Copilot 连接器。可轻松通过 SAP API Management、Google Apigee Management 或 Azure API Management 提供你自己的数据。附带所提供文档的完整元数据集、高级处理管道，并支持同样通过 API 终结点提供的自定义权限模型。","url:https://www.rheininsights.com/en/connectors/odata.php",0,0,0],["Server Message Block (SMB) File Share","Accenture","P",22,0,"The SMB connector crawls files and directories across shared drives. It generates a signature for each item to allow incremental updates of only changed items. Each file is submitted with its metadata and access control lists.","SMB 連接器會爬取共用磁碟機中的檔案與目錄。它會為每個項目產生簽章，以便只對有變更的項目進行增量更新。每個檔案會連同其中繼資料與存取控制清單一併提交。","SMB 连接器会爬取共享驱动器中的文件和目录。它会为每个项目生成签名，以便只对有变更的项目进行增量更新。每个文件会连同其元数据和访问控制列表一并提交。","url:https://www.accenture.com/in-en/services/ecosystem-partners/microsoft",0,1,0],["Simple Mail Transfer Protocol (SMTP)","Accenture","P",22,0,"The Simple Mail Transfer Protocol (SMTP) connector processes e-mails sent to it. The email and attachments are submitted with metadata such as to, from, and subject.","Simple Mail Transfer Protocol（SMTP）連接器會處理寄送給它的電子郵件，並將郵件與附件連同收件者、寄件者、主旨等中繼資料一併提交。","Simple Mail Transfer Protocol（SMTP）连接器会处理发送给它的邮件，并将邮件和附件连同收件人、发件人、主题等元数据一并提交。","url:https://www.accenture.com/in-en/services/ecosystem-partners/microsoft",0,1,0],["Microsoft Viva Engage","ServiceNow","P",23,0,"Retrieves messages and attachments from conversations in your Microsoft Viva Engage source system and makes their content and metadata searchable in AI Search applications.","從來源系統 Microsoft Viva Engage 的交談中擷取訊息與附件，並讓其內容與中繼資料可在 AI Search 應用程式中搜尋。","从来源系统 Microsoft Viva Engage 的对话中获取消息和附件，并让其内容和元数据可在 AI Search 应用中搜索。","url:https://www.servicenow.com/docs/bundle/zurich-platform-administration/page/administer/ai-search/concept/microsoft-viva-engage-external-content-connector.html",0,0,0],["Git","RheinInsights","P",24,0,"Enables the Enterprise search and Microsoft 365 Copilot connector for indexing Git repositories. Reliably indexes branches from remote GIT repositories, versioned files and commit messages. Comes with full metadata sets, and advanced processing pipelines.","為 Git 存放庫建立索引，支援企業搜尋與 Microsoft 365 Copilot 連接器。可穩定索引遠端 Git 存放庫的分支、版本化檔案與提交訊息，提供完整的中繼資料集與進階處理管線。","为 Git 仓库建立索引，支持企业搜索和 Microsoft 365 Copilot 连接器。可稳定索引远程 Git 仓库的分支、版本化文件和提交消息，提供完整的元数据集和高级处理管道。","url:https://www.rheininsights.com/en/connectors/git.php",0,0,0],["GitLab","ServiceNow","P",24,0,"Secure enterprise search connector for reliably indexing content from GitLab and intelligently searching it with Microsoft Graph. It robustly indexes projects, files, folders, commit messages, issues, and wiki pages from GitLab in near real-time.","安全的企業搜尋連接器，可穩定索引 GitLab 的內容，並透過 Microsoft Graph 進行智慧搜尋。可近乎即時地索引 GitLab 中的專案、檔案、資料夾、提交訊息、議題與 wiki 頁面。","安全的企业搜索连接器，可稳定索引 GitLab 的内容，并通过 Microsoft Graph 进行智能搜索。可近乎实时地索引 GitLab 中的项目、文件、文件夹、提交消息、议题和 wiki 页面。","url:https://www.servicenow.com/docs/bundle/zurich-platform-administration/page/administer/ai-search/concept/gitlab-external-content-connector.html",0,0,0],["LDAP","BA Insight","P",24,0,"Enables organizations to connect to any LDAP-compliant directory and index any record from it. Organizations can filter to specific subsets of the directory and retrieve only specific fields, making it simple to search for users, contracts, or groups stored anywhere in your directory.","讓組織連接任何符合 LDAP 的目錄，並為其中任何記錄建立索引。組織可篩選目錄的特定子集並只擷取特定欄位，輕鬆搜尋儲存在目錄任何位置的使用者、合約或群組。","让组织连接任何符合 LDAP 的目录，并为其中任何记录建立索引。组织可筛选目录的特定子集并只获取特定字段，轻松搜索存储在目录任何位置的用户、合同或组。","url:https://uplandsoftware.com/bainsight/connectors/ldap/",0,0,0],["ITSM connector","ServiceNow","P",24,0,"Secure enterprise search connector for reliably indexing content from directory services compatible with the Lightweight Directory Access Protocol (LDAP) and intelligently searching it with Microsoft Graph. It robustly indexes LDAP objects from Microsoft Entra ID, Novell E-Directory, and other LDAP-compatible directory services in near real-time. The connector can be used for ingesting principals into Google Cloud Search for use cases like expert, equipment, and location searches or for implementing security trimming for custom data sources. The connector supports LDAP over SSL.","安全的企業搜尋連接器，可穩定索引相容於 Lightweight Directory Access Protocol（LDAP）之目錄服務的內容，並透過 Microsoft Graph 進行智慧搜尋。可近乎即時地索引 Microsoft Entra ID、Novell E-Directory 與其他 LDAP 相容目錄服務中的 LDAP 物件。連接器可用於把主體擷取到 Google Cloud Search，支援專家、設備與地點搜尋等情境，或為自訂資料來源實作安全性修整（security trimming）。連接器支援 LDAP over SSL。","安全的企业搜索连接器，可稳定索引兼容 Lightweight Directory Access Protocol（LDAP）的目录服务中的内容，并通过 Microsoft Graph 进行智能搜索。可近乎实时地索引 Microsoft Entra ID、Novell E-Directory 及其他兼容 LDAP 的目录服务中的 LDAP 对象。连接器可用于把主体导入 Google Cloud Search，支持专家、设备和位置搜索等场景，或为自定义数据源实现安全修整（security trimming）。连接器支持 LDAP over SSL。","url:https://www.servicenow.com/docs/bundle/zurich-integrate-applications/page/product/rpa-studio/concept/itsm.html",0,0,0],["ServiceNow","Accenture","P",24,0,"Crawls content from ServiceNow.","從 ServiceNow 爬取內容。","从 ServiceNow 爬取内容。","url:https://www.accenture.com/in-en/services/ecosystem-partners/microsoft",0,1,0],["ServiceNow Cloud","BA Insight","P",24,0,"Honors the security of the source system and provides both full and incremental crawls so users have the latest information available all the time.","會遵循來源系統的安全性設定，並提供完整與增量爬取，讓使用者隨時取得最新資訊。","遵循来源系统的安全设置，并提供完整爬取和增量爬取，让用户随时获得最新信息。","url:https://uplandsoftware.com/bainsight/connectors/servicenow-cloud/",0,0,0],["Veeva Vault","BA Insight","P",24,0,"Securely indexes both the full text and metadata of Veeva Vault objects into Microsoft Search. It enables users to retrieve a single result set for content within Veeva Vault and Microsoft 365.","將 Veeva Vault 物件的全文與中繼資料安全地索引到 Microsoft Search，讓使用者能針對 Veeva Vault 與 Microsoft 365 中的內容取得單一結果集。","将 Veeva Vault 对象的全文和元数据安全地索引到 Microsoft Search，让用户能针对 Veeva Vault 和 Microsoft 365 中的内容获得单一结果集。","url:https://uplandsoftware.com/bainsight/connectors/veeva-vault/",0,0,0],["getAbstract","getAbstract","P",25,0,"The getAbstract Copilot connector enhances your Microsoft Copilot with verified business knowledge from leading experts. The connector delivers fully indexed and licensed knowledge from domains like leadership and strategy, sales, marketing, corporate finance, digital transformation, and many more, helping your employees solve business issues right in the flow of work.","getAbstract Copilot 連接器以來自頂尖專家、經過驗證的商業知識，強化你的 Microsoft Copilot。連接器提供已完整建立索引且已取得授權的知識，涵蓋領導力與策略、銷售、行銷、企業財務、數位轉型等領域，協助員工在工作流程中直接解決業務問題。","getAbstract Copilot 连接器以来自顶尖专家、经过验证的商业知识，增强你的 Microsoft Copilot。连接器提供已完整建立索引且已获得授权的知识，涵盖领导力与战略、销售、营销、企业财务、数字化转型等领域，帮助员工在工作流中直接解决业务问题。","url:https://www.getabstract.com/en/connector",1,0,0],["Go1","Go1","P",25,0,"Go1 integration with Microsoft Search allows your employees to find and access learning from Microsoft Search, in places like the Microsoft 365 app or SharePoint. Your employees can learn directly from Microsoft Search in their normal day-to-day routine.","Go1 與 Microsoft Search 的整合讓員工能在 Microsoft 365 應用程式或 SharePoint 等位置，透過 Microsoft Search 找到並存取學習內容，在日常工作中直接從 Microsoft Search 學習。","Go1 与 Microsoft Search 的集成让员工能在 Microsoft 365 应用或 SharePoint 等位置，通过 Microsoft Search 找到并访问学习内容，在日常工作中直接从 Microsoft Search 学习。","url:https://www.go1.com/integrations/microsoft",0,0,0],["Twitter","Accenture","P",26,0,"Crawls content from Twitter feeds. It collects tweet text and metadata including URL links, geo-location, and hashtags.","從 Twitter 摘要動態爬取內容，收集推文文字與中繼資料，包括 URL 連結、地理位置與主題標籤。","从 Twitter 动态爬取内容，收集推文文本和元数据，包括 URL 链接、地理位置和话题标签。","url:https://www.accenture.com/in-en/services/ecosystem-partners/microsoft",0,1,0],["Yammer","Accenture","P",26,0,"Crawls content from Yammer messages and metadata including sender, group, and thread details. It runs from any machine with access to the AEM server and optionally supports content fetching and connection throttling.","從 Yammer 訊息爬取內容與中繼資料，包括寄件者、群組與討論串詳細資料。可在任何能存取 AEM 伺服器的電腦上執行，並選擇性支援內容擷取與連線節流。","从 Yammer 消息爬取内容和元数据，包括发送者、群组和线程详细信息。可在任何能访问 AEM 服务器的机器上运行，并可选支持内容获取和连接限流。","url:https://www.accenture.com/in-en/services/ecosystem-partners/microsoft",0,1,0],["Yammer","BA Insight","P",26,0,"Establishes a secure connection to the Yammer application and maps the content including metadata and attachments from the Yammer schema to the search engine schema. It then extracts content and feeds it to the search engine in a process called crawling.","與 Yammer 應用程式建立安全連線，並將 Yammer 結構描述中的內容（含中繼資料與附件）對應到搜尋引擎的結構描述，接著在稱為爬取的程序中擷取內容並提供給搜尋引擎。","与 Yammer 应用建立安全连接，并将 Yammer 架构中的内容（含元数据和附件）映射到搜索引擎的架构，接着在称为爬取的过程中提取内容并提供给搜索引擎。","url:https://uplandsoftware.com/bainsight/connectors/yammer/",0,0,0],["Aspider Web Crawler","Accenture","P",27,0,"Crawls content from one or more websites. The content is submitted along with any metadata provided by the server.","從一或多個網站爬取內容，並連同伺服器提供的任何中繼資料一併提交。","从一个或多个网站爬取内容，并连同服务器提供的任何元数据一并提交。","url:https://www.accenture.com/in-en/services/ecosystem-partners/microsoft",0,1,0],["RSS","Accenture","P",27,0,"Allows you to retrieve feed information and trigger flows when new items are published in an RSS feed.","可擷取摘要資訊，並在 RSS 摘要發布新項目時觸發流程。","可获取订阅源信息，并在 RSS 订阅源发布新项目时触发流程。","url:https://www.accenture.com/in-en/services/ecosystem-partners/microsoft",0,1,0],["Selenium","Accenture","P",27,0,"Crawls content from websites using an internet browser to retrieve the pages.","使用網際網路瀏覽器擷取頁面，從網站爬取內容。","使用互联网浏览器获取页面，从网站爬取内容。","url:https://www.accenture.com/in-en/services/ecosystem-partners/microsoft",0,1,0],["Web Pages","RheinInsights","P",27,0,"Reliably and easily indexes web pages from a given site. Comes with full metadata sets, advanced processing pipelines, flexible metadata extraction, and support for custom permission models.","可穩定且輕鬆地索引指定網站的網頁，提供完整的中繼資料集、進階處理管線、彈性的中繼資料擷取，並支援自訂權限模型。","可稳定且轻松地索引指定网站的网页，提供完整的元数据集、高级处理管道、灵活的元数据提取，并支持自定义权限模型。","url:https://www.rheininsights.com/en/connectors/web-pages.php",0,0,0],["Website Crawler","BA Insight","P",27,0,"Resurfaces content from any website in a single consolidated search index, along with content from other repositories.","可將任何網站的內容，與其他存放庫的內容一起整合到單一搜尋索引中重新呈現。","可将任何网站的内容，与其他仓库的内容一起汇总到单一搜索索引中重新呈现。","url:https://uplandsoftware.com/bainsight/connectors/website-crawler/",0,0,0]]};

(() => {
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const LOC = { "zh-Hant": "zh-tw", "zh-Hans": "zh-cn", en: "en-us" };
const PAGE = 24;
const CONN = "microsoft-365/copilot/connectors/";
const DOCS = {
  overview: CONN + "overview",
  gallery: CONN + "connectors-gallery-microsoft",
  partners: CONN + "connectors-gallery-partners",
  fed: CONN + "federated-connectors-overview"
};
const POPULAR = ["Salesforce", "ServiceNow", "Jira", "Confluence", "GitHub", "Google Drive", "Box", "Notion", "HubSpot", "Workday", "Zendesk", "SharePoint"];

let lang = (window.PocLang && window.PocLang.code) || "zh-Hant";
if (!I18N[lang]) lang = "zh-Hant";

const get = (path, l = lang) => {
  let v = path.split(".").reduce((o, k) => (o == null ? o : o[k]), I18N[l]);
  if (v == null && l !== "en") v = get(path, "en");
  return v;
};
const t = (path, ...args) => { const v = get(path); return typeof v === "function" ? v(...args) : v; };
const learn = tail => "https://learn.microsoft.com/" + LOC[lang] + "/" + tail;
const colon = () => (lang === "en" ? ": " : "：");
const catName = i => DATA.cats[i][lang === "zh-Hant" ? 1 : lang === "zh-Hans" ? 2 : 0];

/* ---------- data ---------- */
// same name = same system: a synced and a federated connector, or several partner versions, share one gallery card
const keyOf = n => n.toLowerCase().replace(/[^a-z0-9]+/g, " ").trim() || n.toLowerCase();
const ITEMS = DATA.items.map((r, i) => ({
  i, key: keyOf(r[0]), name: r[0], pub: r[1], type: r[2], cat: r[3], pre: !!r[4], d: { en: r[5], "zh-Hant": r[6], "zh-Hans": r[7] }, link: r[8],
  cert: !!r[9], contact: !!r[10], deploy: r[11] || 0,
  // where the connector comes from: Microsoft gallery published by Microsoft / Microsoft gallery, other publisher / partner gallery
  src: r[2] === "P" ? "partner" : r[1] === "Microsoft" ? "ms" : "ext"
}));
const COLL = new Intl.Collator("en", { numeric: true, sensitivity: "base" });
const RANK = { F: 0, S: 1, P: 2 };
ITEMS.sort((a, b) => COLL.compare(a.name, b.name) || RANK[a.type] - RANK[b.type] || COLL.compare(a.pub, b.pub));
const count = fn => ITEMS.filter(fn).length;
const COUNT = {
  all: ITEMS.length, F: count(x => x.type === "F"), S: count(x => x.type === "S"), P: count(x => x.type === "P"),
  ms: count(x => x.src === "ms"), ext: count(x => x.src === "ext"), partner: count(x => x.src === "partner"),
  msF: count(x => x.src === "ms" && x.type === "F"), msS: count(x => x.src === "ms" && x.type === "S"),
  cert: count(x => x.cert), contact: count(x => x.contact)
};
// where the data lives. cloud: every federated connector and the synced ones that are not for a self-hosted system;
// onprem: synced ones that reach a self-hosted system or go through the Graph connector agent. Partner entries say neither.
const whereOk = (it, where) => where === "all" || (where === "onprem" ? it.type === "S" && it.deploy >= 1 : where === "cloud" && (it.type === "F" || (it.type === "S" && it.deploy !== 1)));
// what the gallery controls promise is the number of cards, so they count systems rather than connectors
const distinct = fn => new Set(ITEMS.filter(fn).map(x => x.key)).size;
const CARDS = {
  all: distinct(() => true), F: distinct(x => x.type === "F"), S: distinct(x => x.type === "S"),
  ms: distinct(x => x.src === "ms"), ext: distinct(x => x.src === "ext"), partner: distinct(x => x.src === "partner"),
  cloud: distinct(x => whereOk(x, "cloud")), onprem: distinct(x => whereOk(x, "onprem"))
};
const groupByName = list => {
  const m = new Map();
  list.forEach(it => { const g = m.get(it.key); if (g) g.push(it); else m.set(it.key, [it]); });
  return [...m.values()];
};
const NMS = DATA.msCats;
const catGroup = i => (i < NMS ? "ms" : "partner");
const srcGroups = src => (src === "partner" ? ["partner"] : src === "all" ? ["ms", "partner"] : ["ms"]);
const hayCache = {};
const hayOf = it => (hayCache[lang + it.i] ??= (it.name + " " + it.pub + " " + it.d.en + " " + it.d[lang] + " " + DATA.cats[it.cat][0] + " " + catName(it.cat)).toLowerCase());

// where: the data location filter (all / cloud / onprem)
const S = { q: "", type: "all", where: "all", cat: "all", src: "all", pre: false, shown: PAGE };
const params = new URLSearchParams(location.search);
if (params.get("q")) S.q = params.get("q");
if (params.get("type") === "synced") S.type = "S";
if (params.get("type") === "federated") S.type = "F";
if (["ms", "ext", "partner"].includes(params.get("source"))) S.src = params.get("source");
if (["cloud", "onprem"].includes(params.get("where"))) S.where = params.get("where");

/* ---------- static text ---------- */
function applyStatic() {
  document.title = t("title");
  $$("[data-i]").forEach(el => { const v = t(el.dataset.i); if (typeof v === "string") el.innerHTML = v; });
  $$("[data-i-ph]").forEach(el => { el.placeholder = t(el.dataset.iPh); });
  $$("[data-i-aria]").forEach(el => { el.setAttribute("aria-label", t(el.dataset.iAria)); });
  $$(".lang-switch button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  $("#gal-h").textContent = t("gal.h", ITEMS.length);
  $("#galLead").innerHTML = t("gal.lead", learn(DOCS.gallery), learn(DOCS.partners));
  $("#originNote").textContent = t("gal.originNote", { rows: DATA.partnerRows, cert: COUNT.cert });
  $("#mergeNote").textContent = t("gal.merge", ITEMS.length, CARDS.all);
  $("#ctaGallery").textContent = t("hero.cta2", ITEMS.length);
  $("#disc1").textContent = t("src.d1", DATA.asOf);
  $("#asof").textContent = t("asof", DATA.asOf);
}

function renderTheme() {
  const dark = document.documentElement.getAttribute("data-theme") === "dark";
  $("#themeBtn .theme-icon").textContent = dark ? "☀" : "☾";
  $("#themeBtn .tt-label").textContent = dark ? t("themeToLight") : t("themeToDark");
  $("#themeBtn").setAttribute("aria-label", dark ? t("themeToLight") : t("themeToDark"));
}

function renderStats() {
  const cells = [[COUNT.all, t("stat.total")], [COUNT.ms + COUNT.ext, t("stat.ms")], [COUNT.partner, t("stat.partner")], [COUNT.F, t("stat.fed"), t("stat.inMs")], [COUNT.S, t("stat.syn"), t("stat.inMs")]];
  $("#stats").innerHTML = cells.map(c => `<div class="stat"><b>${c[0]}</b><span>${esc(c[1])}</span>${c[2] ? `<small>${esc(c[2])}</small>` : ""}</div>`).join("");
}

/* ---------- comparison ---------- */
function renderCompare() {
  const sub = lang === "en" ? "" : n => `<span class="cmp-sub">${n}</span>`;
  const head = `<div class="cmp-row cmp-head" role="row"><div role="columnheader">${esc(t("cmp.feature"))}</div>` +
    `<div role="columnheader"><span class="badge syn">${esc(t("cmp.colS"))}</span>${sub ? sub("Synced") : ""}</div>` +
    `<div role="columnheader"><span class="badge fed">${esc(t("cmp.colF"))}</span>${sub ? sub("Federated") : ""}</div></div>`;
  const body = t("cmp.rows").map(r =>
    `<div class="cmp-row" role="row"><div class="cmp-label" role="rowheader">${esc(r[0])}</div>` +
    `<div class="cmp-cell" role="cell" data-col="${esc(t("cmp.colS"))}">${esc(r[1])}</div>` +
    `<div class="cmp-cell" role="cell" data-col="${esc(t("cmp.colF"))}">${esc(r[2])}</div></div>`).join("");
  $("#cmp").setAttribute("aria-label", t("cmp.h"));
  $("#cmp").innerHTML = head + body;
}

/* ---------- gallery ---------- */
function renderOrigin() {
  const items = t("gal.origin", { ms: COUNT.ms, msF: COUNT.msF, msS: COUNT.msS, ext: COUNT.ext, partner: COUNT.partner, contact: COUNT.contact });
  $("#origin").setAttribute("aria-label", t("gal.originH"));
  $("#origin").innerHTML = `<h3 class="origin-h">${esc(t("gal.originH"))}</h3><ul>` +
    items.map((o, i) => `<li class="card o${i}"><b>${esc(o[0])}</b><span>${esc(o[1])}</span></li>`).join("") + `</ul>`;
}

function renderCats() {
  const groups = srcGroups(S.src);
  if (S.cat !== "all" && !groups.includes(catGroup(Number(S.cat)))) S.cat = "all";
  const perCat = DATA.cats.map(() => new Set());
  ITEMS.forEach(it => { perCat[it.cat].add(it.key); });
  const opt = i => `<option value="${i}">${esc(catName(i))} (${perCat[i].size})</option>`;
  const range = (a, b) => Array.from({ length: b - a }, (_, k) => a + k);
  const ms = range(0, NMS).map(opt).join(""), partner = range(NMS, DATA.cats.length).map(opt).join("");
  $("#cat").innerHTML = `<option value="all">${esc(t("gal.allCat"))}</option>` + (groups.length === 2
    ? `<optgroup label="${esc(t("gal.grpMs"))}">${ms}</optgroup><optgroup label="${esc(t("gal.grpPartner"))}">${partner}</optgroup>`
    : groups[0] === "ms" ? ms : partner);
  $("#cat").value = S.cat;
}

function renderFilters() {
  const seg = [["all", t("gal.all") + " " + CARDS.all], ["F", t("type.f") + " " + CARDS.F], ["S", t("type.s") + " " + CARDS.S]];
  $("#typeSeg").setAttribute("aria-label", t("gal.type"));
  $("#typeSeg").innerHTML = seg.map(s => `<button type="button" data-type="${s[0]}" aria-pressed="${S.type === s[0]}">${esc(s[1])}</button>`).join("");
  $("#where").innerHTML = [["all", t("gal.whereAll"), CARDS.all], ["cloud", t("gal.whereCloud"), CARDS.cloud], ["onprem", t("gal.whereOnprem"), CARDS.onprem]]
    .map(o => `<option value="${o[0]}">${esc(o[1])} (${o[2]})</option>`).join("");
  $("#where").value = S.where;
  renderCats();
  $("#src").innerHTML = [["all", t("gal.srcAll"), CARDS.all], ["ms", t("gal.srcMs"), CARDS.ms], ["ext", t("gal.srcExt"), CARDS.ext], ["partner", t("gal.srcPartner"), CARDS.partner]]
    .map(o => `<option value="${o[0]}">${esc(o[1])} (${o[2]})</option>`).join("");
  $("#src").value = S.src;
  $("#pre").checked = S.pre;
  $("#q").value = S.q;
  const cur = S.q.trim().toLowerCase();
  $("#chips").innerHTML = `<span class="lbl">${esc(t("gal.chips"))}</span>` +
    POPULAR.map(p => `<button type="button" class="chip" data-chip="${esc(p)}" aria-pressed="${cur === p.toLowerCase()}">${esc(p)}</button>`).join("");
}

function filtered() {
  const terms = S.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  return ITEMS.filter(it =>
    (S.type === "all" || it.type === S.type) &&
    whereOk(it, S.where) &&
    (S.cat === "all" || it.cat === Number(S.cat)) &&
    (S.src === "all" || it.src === S.src) &&
    (!S.pre || it.pre) &&
    terms.every(w => hayOf(it).includes(w)));
}

const VRANK = { S: 0, F: 1, P: 2 };
const urlOf = it => (it.link.startsWith("url:") ? it.link.slice(4) : learn(it.link.startsWith("abs:") ? it.link.slice(4) : CONN + it.link));
const descOf = it => it.d[lang] || it.d.en;
const badgesOf = it => {
  const badge = it.type === "F" ? `<span class="badge fed">${esc(t("type.f"))}</span>` : it.type === "S" ? `<span class="badge syn">${esc(t("type.s"))}</span>` : `<span class="badge part">${esc(t("type.p"))}</span>`;
  const pre = it.pre ? `<span class="badge pre">${esc(t("type.pre"))}</span>` : "";
  const cert = it.cert ? `<span class="badge cert" title="${esc(t("type.certTip"))}">${esc(t("type.cert"))}</span>` : "";
  const dep = it.deploy ? `<span class="badge onprem">${esc(t(it.deploy === 1 ? "type.onprem" : "type.agent"))}</span>` : "";
  return badge + dep + cert + pre;
};
const linkOf = (it, text, sr) => {
  const external = it.link.startsWith("url:");
  return `<a href="${esc(urlOf(it))}" target="_blank" rel="${external ? "noopener noreferrer" : "noopener"}">${esc(text)} ${external ? "↗" : "→"}<span class="sr-only"> ${esc(sr)}</span></a>`;
};
const topOf = (name, meta) => `<div class="conn-top"><div class="avatar" aria-hidden="true">${esc(name.trim().charAt(0).toUpperCase())}</div>` +
  `<div class="conn-title"><h3>${esc(name)}</h3><div class="conn-meta">${meta}</div></div></div>`;

function singleHTML(it) {
  const label = it.contact ? t("gal.contact", it.pub) : t("gal.learn");
  return `<article class="card conn${it.type === "P" ? " is-partner" : ""}">` +
    topOf(it.name, `${esc(catName(it.cat))} · ${esc(t("gal.pub"))}${colon()}${esc(it.pub)}`) +
    `<p>${esc(descOf(it))}</p>` +
    `<div class="conn-foot"><div class="badges">${badgesOf(it)}</div>${linkOf(it, label, it.name)}</div></article>`;
}

// one system with several connectors: a block per Microsoft-gallery connector, one row of links for the partner versions
function mergedHTML(vs) {
  const ms = vs.filter(v => v.type !== "P").sort((a, b) => VRANK[a.type] - VRANK[b.type] || COLL.compare(a.pub, b.pub));
  const ps = vs.filter(v => v.type === "P").sort((a, b) => b.cert - a.cert || COLL.compare(a.pub, b.pub));
  const first = ms[0] || ps[0];
  const block = it => `<div class="conn-block"><p>${esc(descOf(it))}</p><div class="conn-foot"><div class="badges">${badgesOf(it)}<span class="conn-pub">${esc(it.pub)}</span></div>` +
    `${linkOf(it, t("gal.learn"), `${it.name} (${t(it.type === "S" ? "type.s" : "type.f")})`)}</div></div>`;
  const partner = p => `<li>${linkOf(p, p.contact ? t("gal.contact", p.pub) : p.pub, p.name)}` +
    (p.cert ? `<span class="badge cert" title="${esc(t("type.certTip"))}">${esc(t("type.cert"))}</span>` : "") + `</li>`;
  return `<article class="card conn is-merged">${topOf(first.name, esc(catName(first.cat)))}` +
    ms.map(block).join("") +
    (ms.length ? "" : `<p>${esc(descOf(ps[0]))}</p>`) +
    (ps.length ? `<div class="conn-partners"><span class="badge part">${esc(t("type.p"))}</span><ul>${ps.map(partner).join("")}</ul></div>` : "") +
    `</article>`;
}

// a card is a list of connectors with the same name, or a single connector
function cardHTML(x) {
  return Array.isArray(x) && x.length > 1 ? mergedHTML(x) : singleHTML(Array.isArray(x) ? x[0] : x);
}

function renderGrid() {
  const list = groupByName(filtered());
  const shown = list.slice(0, S.shown);
  $("#grid").innerHTML = shown.map(x => cardHTML(x)).join("");
  $("#count").textContent = t("gal.count", shown.length, list.length);
  const note = (S.type !== "all" || S.where !== "all") && (S.src === "all" || S.src === "partner");
  $("#typeNote").textContent = note ? t("gal.typeNote") : "";
  $("#typeNote").hidden = !note;
  const rest = list.length - shown.length;
  $("#more").hidden = rest <= 0;
  $("#more").textContent = t("gal.more", rest);
  $("#empty").hidden = list.length > 0;
  $("#empty").textContent = t("gal.empty");
}

function galleryChanged() { S.shown = PAGE; renderGrid(); }

/* ---------- sources ---------- */
function renderSources() {
  const labels = get("src.list");
  const keys = ["overview", "fed", "gallery", "partners"];
  $("#srcList").innerHTML = keys.map(k => `<li><a href="${esc(learn(DOCS[k]))}" target="_blank" rel="noopener">${esc(labels[k])}</a></li>`).join("");
}

/* ---------- wiring ---------- */
function renderAll() {
  document.documentElement.setAttribute("lang", lang);
  document.documentElement.setAttribute("data-lang", lang);
  applyStatic();
  renderTheme();
  renderStats();
  renderCompare();
  renderOrigin();
  renderFilters();
  renderGrid();
  renderSources();
}

function setLang(l) {
  if (!I18N[l] || l === lang) return;
  lang = l;
  try { window.PocLang && window.PocLang.save(l); } catch (e) { /* storage unavailable */ }
  renderAll();
}

$$(".lang-switch button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));
$("#themeBtn").addEventListener("click", () => {
  const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("copilotPortalTheme", next); } catch (e) { /* storage unavailable */ }
  renderTheme();
});

let timer;
$("#q").addEventListener("input", e => {
  S.q = e.target.value;
  clearTimeout(timer);
  timer = setTimeout(() => {
    galleryChanged();
    const cur = S.q.trim().toLowerCase();
    $$("#chips .chip").forEach(c => c.setAttribute("aria-pressed", String(cur === c.dataset.chip.toLowerCase())));
  }, 120);
});
$("#typeSeg").addEventListener("click", e => {
  const b = e.target.closest("button[data-type]");
  if (!b) return;
  S.type = b.dataset.type;
  $$("#typeSeg button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  galleryChanged();
});
$("#cat").addEventListener("change", e => { S.cat = e.target.value; galleryChanged(); });
$("#src").addEventListener("change", e => { S.src = e.target.value; renderCats(); galleryChanged(); });
$("#pre").addEventListener("change", e => { S.pre = e.target.checked; galleryChanged(); });
$("#chips").addEventListener("click", e => {
  const b = e.target.closest("button[data-chip]");
  if (!b) return;
  const same = S.q.trim().toLowerCase() === b.dataset.chip.toLowerCase();
  S.q = same ? "" : b.dataset.chip;
  $("#q").value = S.q;
  $$("#chips .chip").forEach(x => x.setAttribute("aria-pressed", String(!same && x === b)));
  galleryChanged();
});
$("#reset").addEventListener("click", () => {
  Object.assign(S, { q: "", type: "all", where: "all", cat: "all", src: "all", pre: false, shown: PAGE });
  renderFilters();
  renderGrid();
});
$("#where").addEventListener("change", e => { S.where = e.target.value; galleryChanged(); });
$("#more").addEventListener("click", () => { S.shown += PAGE; renderGrid(); });

/* highlight the section being read */
const links = new Map($$(".subnav a").map(a => [a.getAttribute("href").slice(1), a]));
const markCurrent = a => {
  links.forEach(x => x.removeAttribute("aria-current"));
  if (!a) return;
  a.setAttribute("aria-current", "location");
  const box = a.parentElement;
  box.scrollLeft = a.offsetLeft - box.clientWidth / 2 + a.offsetWidth / 2;
};
if ("IntersectionObserver" in window) {
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => { if (en.isIntersecting) markCurrent(links.get(en.target.id)); });
  }, { rootMargin: "-30% 0px -60% 0px" });
  $$("main section.block").forEach(s => io.observe(s));
  // the last section is shorter than the band, so it needs the end of the page to count as reading it
  let ticking = false;
  window.addEventListener("scroll", () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      ticking = false;
      if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2) markCurrent([...links.values()].pop());
    });
  }, { passive: true });
}

renderAll();
})();
</script>
</body>
</html>
