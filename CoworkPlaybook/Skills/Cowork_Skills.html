wn 呈现 — 高管摘要用于阅读，不用于下载，除非用户明确要求 Word 文档。使用以下结构：\n\n```markdown\n# <Document title> — 高管摘要\n\n**一句话结论：** <one-sentence core claim>\n\n## 为什么重要\n<2–3 sentence stakes/context>\n\n## 关键点\n- <point 1 with number/fact>\n- <point 2>\n- <point 3>\n\n## 决策 / 请求\n- <what is being requested>\n\n## 风险\n- <key risk>\n\n## 建议下一步\n<one sentence>\n```\n\n目标：250 字以内。如果来源中有关键数字，尽可能标注来源行号或页码。\n\n### 步骤 5：提供文件转换\n\n显示内联摘要后，询问：\"Want this as a Word doc or PDF?\" 只有在用户确认后，才调用 `docx` 或 `pdf` skills。\n\n## 护栏\n\n- 绝不编造数字、姓名或引用 — 每个事实都必须能追溯到来源\n- 如果来源存在缺口或矛盾，在风险部分说明，不要掩盖\n- 控制在一页内（≤250 words）— 这就是价值所在。如果内容无法压缩到这个程度，请说明并询问优先保留什么\n- 对于敏感文档（财务、人事），除非用户明确受众是内部人员，否则姓名一律泛化\n"},"data-storyteller":{"en":"---\nname: data-storyteller\ndescription: |\n  Transforms data and spreadsheets into narrative insights and recommendations.\n  Use when user asks \"analyze this data\", \"what does this spreadsheet show\",\n  \"insights from this Excel\", \"explain these numbers\", or \"data summary\".\nlicense: MIT\nmetadata:\n  author: Ash Sisalem\n  version: \"1.0\"\n---\n\n# Data Storyteller\n\nTransform raw data into compelling narratives with actionable insights.\n\n## What This Skill Does\n\nAnalyzes data to provide:\n- Plain-English summary\n- Key trends and patterns\n- Anomalies and outliers\n- Comparative analysis\n- Actionable recommendations\n- Suggested visualizations\n\n## When to Use\n\n- Making sense of spreadsheet data\n- Preparing data for presentations\n- Finding insights in reports\n- Explaining metrics to stakeholders\n- Monthly/quarterly data reviews\n\n## Workflow\n\n1. **Understand the Data**\n   - What does each column represent?\n   - What time period does it cover?\n   - What's the business context?\n\n2. **Identify Patterns**\n   - Trends (up, down, stable)\n   - Seasonality or cycles\n   - Correlations between variables\n\n3. **Find the Story**\n   - What's the headline?\n   - What's surprising?\n   - What's concerning?\n   - What's the opportunity?\n\n4. **Make it Actionable**\n   - So what?\n   - Now what?\n   - What decisions does this inform?\n\n## Output Format\n\n# Data Analysis: {Dataset Name}\n\n## The Headline\n\n**{One sentence that captures the most important finding}**\n\n---\n\n## Executive Summary\n\n{2-3 paragraph narrative summary written for a non-technical audience. Focus on what the data means, not just what it shows.}\n\n---\n\n## Key Metrics at a Glance\n\n| Metric | Current | Previous | Change | Trend |\n|--------|---------|----------|--------|-------|\n| {metric 1} | {value} | {value} | {+/-}% | {↑↓→} |\n| {metric 2} | {value} | {value} | {+/-}% | {↑↓→} |\n| {metric 3} | {value} | {value} | {+/-}% | {↑↓→} |\n\n---\n\n## What the Data Shows\n\n### Trend 1: {Title}\n{Description of the trend with specific numbers}\n\n**Why it matters:** {Business implication}\n\n### Trend 2: {Title}\n{Description of the trend with specific numbers}\n\n**Why it matters:** {Business implication}\n\n### Trend 3: {Title}\n{Description of the trend with specific numbers}\n\n**Why it matters:** {Business implication}\n\n---\n\n## 🔍 Notable Findings\n\n### Highlights (Good News)\n- {Positive finding 1 with data point}\n- {Positive finding 2 with data point}\n\n### Concerns (Watch These)\n- ⚠️ {Concerning finding 1 with data point}\n- ⚠️ {Concerning finding 2 with data point}\n\n### Anomalies (Investigate)\n- ❓ {Unexpected data point that needs explanation}\n\n---\n\n## Comparisons\n\n### vs. Previous Period\n{How does this compare to last month/quarter/year?}\n\n### vs. Target/Goal\n| Metric | Actual | Target | Gap |\n|--------|--------|--------|-----|\n| {metric} | {value} | {value} | {+/-} |\n\n### vs. Benchmark\n{How does this compare to industry/competitor benchmarks if known?}\n\n---\n\n## Correlations & Relationships\n\n{Any interesting relationships between variables}\n\n- When {X} increases, {Y} tends to {behavior}\n- {Variable A} and {Variable B} appear {correlated/uncorrelated}\n\n---\n\n## 📊 Recommended Visualizations\n\n1. **{Chart type}** - to show {what insight}\n2. **{Chart type}** - to show {what insight}\n3. **{Chart type}** - to show {what insight}\n\n---\n\n## 💡 Recommendations\n\nBased on this analysis:\n\n1. **{Action 1}**\n   - Why: {rationale from data}\n   - Impact: {expected outcome}\n\n2. **{Action 2}**\n   - Why: {rationale from data}\n   - Impact: {expected outcome}\n\n3. **{Action 3}**\n   - Why: {rationale from data}\n   - Impact: {expected outcome}\n\n---\n\n## Questions This Raises\n\n- {Question that the data prompts but doesn't answer}\n- {Additional data that would be helpful}\n- {Follow-up analysis to consider}\n\n---\n\n## Data Quality Notes\n\n- **Completeness:** {Any missing data?}\n- **Timeframe:** {What period does this cover?}\n- **Caveats:** {Any limitations to note?}","zh":"---\nname: data-storyteller\ndescription: |\n  將資料與試算表轉換為敘事式洞察與建議。\n  當使用者要求「分析這些資料」、「這份試算表顯示什麼」、「這份 Excel 的洞察」、「解釋這些數字」、「資料摘要」、\"analyze this data\", \"what does this spreadsheet show\",\n  \"insights from this Excel\", \"explain these numbers\", 或 \"data summary\" 時使用。\nlicense: MIT\nmetadata:\n  author: Ash Sisalem\n  version: \"1.0\"\n---\n\n# 數據說故事\n將原始資料轉換成具說服力的敘事與可行洞察。\n\n## 此技能的用途\n\n分析資料並提供：\n- 白話中文摘要\n- 關鍵趨勢與模式\n- 異常與離群值\n- 比較分析\n- 可執行建議\n- 建議視覺化\n\n## 使用時機\n\n- 解讀試算表資料\n- 為簡報準備資料\n- 從報表中找出洞察\n- 向利害關係人說明指標\n- 每月/每季資料檢討\n\n## 工作流程\n\n1. **理解資料**\n   - 每個欄位代表什麼？\n   - 涵蓋哪個時間區間？\n   - 商業背景是什麼？\n\n2. **識別模式**\n   - 趨勢（上升、下降、持平）\n   - 季節性或週期\n   - 變數之間的相關性\n\n3. **找出故事**\n   - 標題是什麼？\n   - 令人意外的是什麼？\n   - 令人擔憂的是什麼？\n   - 機會在哪裡？\n\n4. **轉為可行動**\n   - 所以代表什麼？\n   - 接下來該做什麼？\n   - 這能支援哪些決策？\n\n## 輸出格式\n\n# 資料分析：{Dataset Name}\n\n## 核心結論\n\n**{One sentence that captures the most important finding}**\n\n---\n\n## 執行摘要\n\n{2-3 paragraph narrative summary written for a non-technical audience. Focus on what the data means, not just what it shows.}\n\n---\n\n## 關鍵指標一覽\n\n| 指標 | 目前 | 前期 | 變化 | 趨勢 |\n|--------|---------|----------|--------|-------|\n| {metric 1} | {value} | {value} | {+/-}% | {↑↓→} |\n| {metric 2} | {value} | {value} | {+/-}% | {↑↓→} |\n| {metric 3} | {value} | {value} | {+/-}% | {↑↓→} |\n\n---\n\n## 資料顯示了什麼\n\n### 趨勢 1：{Title}\n{Description of the trend with specific numbers}\n\n**為什麼重要：** {Business implication}\n\n### 趨勢 2：{Title}\n{Description of the trend with specific numbers}\n\n**為什麼重要：** {Business implication}\n\n### 趨勢 3：{Title}\n{Description of the trend with specific numbers}\n\n**為什麼重要：** {Business implication}\n\n---\n\n## 🔍 值得注意的發現\n\n### 亮點（好消息）\n- {Positive finding 1 with data point}\n- {Positive finding 2 with data point}\n\n### 疑慮（請留意）\n- ⚠️ {Concerning finding 1 with data point}\n- ⚠️ {Concerning finding 2 with data point}\n\n### 異常（需調查）\n- ❓ {Unexpected data point that needs explanation}\n\n---\n\n## 比較\n\n### 與前一期間相比\n{How does this compare to last month/quarter/year?}\n\n### 與目標相比\n| 指標 | 實際 | 目標 | 差距 |\n|--------|--------|--------|-----|\n| {metric} | {value} | {value} | {+/-} |\n\n### 與基準相比\n{How does this compare to industry/competitor benchmarks if known?}\n\n---\n\n## 相關性與關係\n\n{Any interesting relationships between variables}\n\n- 當 {X} 增加時，{Y} 往往會 {behavior}\n- {Variable A} 與 {Variable B} 看起來 {correlated/uncorrelated}\n\n---\n\n## 📊 建議視覺化\n\n1. **{Chart type}** - 用來呈現 {what insight}\n2. **{Chart type}** - 用來呈現 {what insight}\n3. **{Chart type}** - 用來呈現 {what insight}\n\n---\n\n## 💡 建議\n\n根據此分析：\n\n1. **{Action 1}**\n   - 原因：{rationale from data}\n   - 影響：{expected outcome}\n\n2. **{Action 2}**\n   - 原因：{rationale from data}\n   - 影響：{expected outcome}\n\n3. **{Action 3}**\n   - 原因：{rationale from data}\n   - 影響：{expected outcome}\n\n---\n\n## 這引發的問題\n\n- {Question that the data prompts but doesn't answer}\n- {Additional data that would be helpful}\n- {Follow-up analysis to consider}\n\n---\n\n## 資料品質備註\n\n- **完整性：** {Any missing data?}\n- **時間範圍：** {What period does this cover?}\n- **注意事項：** {Any limitations to note?}\n","cn":"---\nname: data-storyteller\ndescription: |\n  将数据和电子表格转化为叙事化洞察与建议。\n  当用户提出“分析这些数据”、“这份电子表格说明了什么”、“这份 Excel 的洞察”、“解释这些数字”、“数据摘要”、\"analyze this data\", \"what does this spreadsheet show\",\n  \"insights from this Excel\", \"explain these numbers\", 或 \"data summary\" 时使用。\nlicense: MIT\nmetadata:\n  author: Ash Sisalem\n  version: \"1.0\"\n---\n\n# 数据讲故事\n将原始数据转化为有说服力的叙事和可执行洞察。\n\n## 此技能的作用\n\n分析数据并提供：\n- 通俗中文摘要\n- 关键趋势和模式\n- 异常值和离群点\n- 对比分析\n- 可执行建议\n- 推荐可视化\n\n## 使用场景\n\n- 解读电子表格数据\n- 为演示准备数据\n- 从报告中发现洞察\n- 向干系人解释指标\n- 月度/季度数据复盘\n\n## 工作流程\n\n1. **理解数据**\n   - 每列代表什么？\n   - 覆盖哪个时间段？\n   - 业务背景是什么？\n\n2. **识别模式**\n   - 趋势（上升、下降、稳定）\n   - 季节性或周期\n   - 变量之间的相关性\n\n3. **找到故事**\n   - 核心标题是什么？\n   - 有什么令人意外？\n   - 有什么值得担心？\n   - 机会在哪里？\n\n4. **转化为行动**\n   - 这说明什么？\n   - 接下来做什么？\n   - 这能支持哪些决策？\n\n## 输出格式\n\n# 数据分析：{Dataset Name}\n\n## 核心结论\n\n**{One sentence that captures the most important finding}**\n\n---\n\n## 执行摘要\n\n{2-3 paragraph narrative summary written for a non-technical audience. Focus on what the data means, not just what it shows.}\n\n---\n\n## 关键指标速览\n\n| 指标 | 当前 | 上期 | 变化 | 趋势 |\n|--------|---------|----------|--------|-------|\n| {metric 1} | {value} | {value} | {+/-}% | {↑↓→} |\n| {metric 2} | {value} | {value} | {+/-}% | {↑↓→} |\n| {metric 3} | {value} | {value} | {+/-}% | {↑↓→} |\n\n---\n\n## 数据显示了什么\n\n### 趋势 1：{Title}\n{Description of the trend with specific numbers}\n\n**为什么重要：** {Business implication}\n\n### 趋势 2：{Title}\n{Description of the trend with specific numbers}\n\n**为什么重要：** {Business implication}\n\n### 趋势 3：{Title}\n{Description of the trend with specific numbers}\n\n**为什么重要：** {Business implication}\n\n---\n\n## 🔍 重要发现\n\n### 亮点（好消息）\n- {Positive finding 1 with data point}\n- {Positive finding 2 with data point}\n\n### 关注点（请留意）\n- ⚠️ {Concerning finding 1 with data point}\n- ⚠️ {Concerning finding 2 with data point}\n\n### 异常（需调查）\n- ❓ {Unexpected data point that needs explanation}\n\n---\n\n## 对比\n\n### 与上一周期相比\n{How does this compare to last month/quarter/year?}\n\n### 与目标相比\n| 指标 | 实际 | 目标 | 差距 |\n|--------|--------|--------|-----|\n| {metric} | {value} | {value} | {+/-} |\n\n### 与基准相比\n{How does this compare to industry/competitor benchmarks if known?}\n\n---\n\n## 相关性与关系\n\n{Any interesting relationships between variables}\n\n- 当 {X} 增加时，{Y} 往往会 {behavior}\n- {Variable A} 和 {Variable B} 看起来 {correlated/uncorrelated}\n\n---\n\n## 📊 推荐可视化\n\n1. **{Chart type}** - 用于呈现 {what insight}\n2. **{Chart type}** - 用于呈现 {what insight}\n3. **{Chart type}** - 用于呈现 {what insight}\n\n---\n\n## 💡 建议\n\n基于此分析：\n\n1. **{Action 1}**\n   - 原因：{rationale from data}\n   - 影响：{expected outcome}\n\n2. **{Action 2}**\n   - 原因：{rationale from data}\n   - 影响：{expected outcome}\n\n3. **{Action 3}**\n   - 原因：{rationale from data}\n   - 影响：{expected outcome}\n\n---\n\n## 此数据引出的问题\n\n- {Question that the data prompts but doesn't answer}\n- {Additional data that would be helpful}\n- {Follow-up analysis to consider}\n\n---\n\n## 数据质量备注\n\n- **完整性：** {Any missing data?}\n- **时间范围：** {What period does this cover?}\n- **注意事项：** {Any limitations to note?}\n"},"contract-review":{"en":"---\nname: contract-review\ndescription: |\n  Analyzes contracts and agreements for key terms, risks, and obligations.\n  Use when user asks \"review this contract\", \"analyze agreement\", \"check contract terms\",\n  \"find liability clause\", \"summarize this NDA\", or \"contract risks\".\nlicense: MIT\nmetadata:\n  author: Cowork Library\n  version: \"1.0\"\n---\n\n# Contract Review\n\nAnalyze contracts to extract key terms, identify risks, and summarize obligations.\n\n## What This Skill Does\n\nReviews contracts to provide:\n- Executive summary\n- Key terms extraction\n- Important dates and deadlines\n- Risk identification\n- Obligation tracking\n- Unusual or concerning clauses\n\n## When to Use\n\n- Reviewing vendor agreements\n- Analyzing NDAs before signing\n- Checking customer contracts\n- Renewal decision support\n- Due diligence reviews\n\n## Workflow\n\n1. **Document Analysis**\n   - Identify contract type\n   - Extract parties involved\n   - Find effective dates and term\n\n2. **Key Terms Extraction**\n   - Payment terms\n   - Deliverables and scope\n   - Termination conditions\n   - Renewal provisions\n\n3. **Risk Assessment**\n   - Liability clauses\n   - Indemnification\n   - Limitation of liability\n   - IP ownership\n   - Confidentiality scope\n\n4. **Obligation Mapping**\n   - Your obligations\n   - Their obligations\n   - Deadlines and milestones\n\n## Output Format\n\n# Contract Review Summary\n\n## Document Overview\n| Field | Value |\n|-------|-------|\n| **Contract Type** | {NDA, MSA, SOW, License, etc.} |\n| **Parties** | {Party A} and {Party B} |\n| **Effective Date** | {date} |\n| **Term** | {duration} |\n| **Governing Law** | {jurisdiction} |\n\n---\n\n## Executive Summary\n\n{2-3 sentence summary of what this contract does and its key implications}\n\n---\n\n## Key Terms\n\n### Financial Terms\n| Term | Details |\n|------|---------|\n| **Total Value** | {amount} |\n| **Payment Terms** | {Net 30, milestone-based, etc.} |\n| **Late Fees** | {if applicable} |\n| **Price Escalation** | {annual increase clause if any} |\n\n### Scope & Deliverables\n- {Deliverable 1}\n- {Deliverable 2}\n- {Deliverable 3}\n\n### Term & Termination\n- **Initial Term:** {duration}\n- **Auto-Renewal:** {Yes/No, terms}\n- **Termination for Convenience:** {notice period}\n- **Termination for Cause:** {conditions}\n\n---\n\n## ⚠️ Risk Assessment\n\n### High Risk Items\n| Clause | Location | Concern | Recommendation |\n|--------|----------|---------|----------------|\n| {clause} | Section {n} | {why it's risky} | {suggested action} |\n\n### Medium Risk Items\n| Clause | Location | Concern |\n|--------|----------|---------|\n| {clause} | Section {n} | {concern} |\n\n### Unusual Terms\n- {Any non-standard clauses worth noting}\n\n---\n\n## 📋 Your Obligations\n\n| Obligation | Deadline | Section |\n|------------|----------|---------|\n| {obligation 1} | {date/trigger} | §{n} |\n| {obligation 2} | {date/trigger} | §{n} |\n| {obligation 3} | {date/trigger} | §{n} |\n\n---\n\n## 📋 Their Obligations\n\n| Obligation | Deadline | Section |\n|------------|----------|---------|\n| {obligation 1} | {date/trigger} | §{n} |\n| {obligation 2} | {date/trigger} | §{n} |\n\n---\n\n## Important Dates\n\n| Date | Event | Action Required |\n|------|-------|-----------------|\n| {date} | {event} | {action} |\n| {date} | Renewal notice deadline | Decide to renew or terminate |\n| {date} | Contract expiration | {action} |\n\n---\n\n## Negotiation Points\n\nConsider negotiating these items before signing:\n\n1. **{Item 1}:** {current state} → {suggested change}\n2. **{Item 2}:** {current state} → {suggested change}\n3. **{Item 3}:** {current state} → {suggested change}\n\n---\n\n## Comparison to Standard Terms\n\n| Clause | This Contract | Market Standard | Assessment |\n|--------|---------------|-----------------|------------|\n| Liability Cap | {amount} | {typical} | {favorable/unfavorable} |\n| Indemnification | {scope} | {typical} | {favorable/unfavorable} |\n| IP Ownership | {terms} | {typical} | {favorable/unfavorable} |\n\n---\n\n## ⚠️ Disclaimer\n\nThis analysis is for informational purposes only and does not constitute leg","zh":"---\nname: contract-review\ndescription: |\n  分析合約與協議的關鍵條款、風險與義務。\n  當使用者要求「幫我審閱這份合約」、「分析這份協議」、「檢查合約條款」、「找出責任條款」、「摘要這份 NDA」、「合約風險」、\"review this contract\", \"analyze agreement\", \"check contract terms\",\n  \"find liability clause\", \"summarize this NDA\", 或 \"contract risks\" 時使用。\nlicense: MIT\nmetadata:\n  author: Cowork Library\n  version: \"1.0\"\n---\n\n# 合約審閱\n\n分析合約以萃取關鍵條款、識別風險並摘要義務。\n\n## 此技能的用途\n\n審閱合約並提供：\n- 執行摘要\n- 關鍵條款萃取\n- 重要日期與期限\n- 風險識別\n- 義務追蹤\n- 不尋常或令人疑慮的條款\n\n## 使用時機\n\n- 審閱供應商協議\n- 簽署前分析 NDA\n- 檢查客戶合約\n- 支援續約決策\n- 盡職調查審閱\n\n## 工作流程\n\n1. **文件分析**\n   - 識別合約類型\n   - 萃取涉及方\n   - 找出有效日期與期限\n\n2. **關鍵條款萃取**\n   - 付款條件\n   - 交付項目與範圍\n   - 終止條件\n   - 續約條款\n\n3. **風險評估**\n   - 責任條款\n   - 賠償\n   - 責任限制\n   - IP 所有權\n   - 保密範圍\n\n4. **義務對應**\n   - 我方義務\n   - 對方義務\n   - 期限與里程碑\n\n## 輸出格式\n\n# 合約審閱摘要\n\n## 文件概覽\n| 欄位 | 值 |\n|-------|-------|\n| **合約類型** | {NDA, MSA, SOW, License, etc.} |\n| **雙方** | {Party A} 與 {Party B} |\n| **生效日期** | {date} |\n| **期限** | {duration} |\n| **準據法** | {jurisdiction} |\n\n---\n\n## 執行摘要\n\n{2-3 sentence summary of what this contract does and its key implications}\n\n---\n\n## 關鍵條款\n\n### 財務條款\n| 條款 | 詳細資料 |\n|------|---------|\n| **總價值** | {amount} |\n| **付款條件** | {Net 30, milestone-based, etc.} |\n| **逾期費用** | {if applicable} |\n| **價格調整** | {annual increase clause if any} |\n\n### 範圍與交付項目\n- {Deliverable 1}\n- {Deliverable 2}\n- {Deliverable 3}\n\n### 期限與終止\n- **初始期限：** {duration}\n- **自動續約：** {Yes/No, terms}\n- **任意終止：** {notice period}\n- **有因終止：** {conditions}\n\n---\n\n## ⚠️ 風險評估\n\n### 高風險項目\n| 條款 | 位置 | 疑慮 | 建議 |\n|--------|----------|---------|----------------|\n| {clause} | Section {n} | {why it's risky} | {suggested action} |\n\n### 中風險項目\n| 條款 | 位置 | 疑慮 |\n|--------|----------|---------|\n| {clause} | Section {n} | {concern} |\n\n### 不尋常條款\n- {Any non-standard clauses worth noting}\n\n---\n\n## 📋 我方義務\n\n| 義務 | 期限 | 條款 |\n|------------|----------|---------|\n| {obligation 1} | {date/trigger} | §{n} |\n| {obligation 2} | {date/trigger} | §{n} |\n| {obligation 3} | {date/trigger} | §{n} |\n\n---\n\n## 📋 對方義務\n\n| 義務 | 期限 | 條款 |\n|------------|----------|---------|\n| {obligation 1} | {date/trigger} | §{n} |\n| {obligation 2} | {date/trigger} | §{n} |\n\n---\n\n## 重要日期\n\n| 日期 | 事件 | 需要採取的行動 |\n|------|-------|-----------------|\n| {date} | {event} | {action} |\n| {date} | 續約通知期限 | 決定續約或終止 |\n| {date} | 合約到期 | {action} |\n\n---\n\n## 談判重點\n\n簽署前可考慮談判下列項目：\n\n1. **{Item 1}:** {current state} → {suggested change}\n2. **{Item 2}:** {current state} → {suggested change}\n3. **{Item 3}:** {current state} → {suggested change}\n\n---\n\n## 與標準條款比較\n\n| 條款 | 本合約 | 市場標準 | 評估 |\n|--------|---------------|-----------------|------------|\n| 責任上限 | {amount} | {typical} | {favorable/unfavorable} |\n| 賠償 | {scope} | {typical} | {favorable/unfavorable} |\n| IP 所有權 | {terms} | {typical} | {favorable/unfavorable} |\n\n---\n\n## ⚠️ 免責聲明\n\n本分析僅供參考，不構成法律意見。\n","cn":"---\nname: contract-review\ndescription: |\n  分析合同和协议的关键条款、风险与义务。\n  当用户提出“帮我审查这份合同”、“分析这份协议”、“检查合同条款”、“找出责任条款”、“总结这份 NDA”、“合同风险”、\"review this contract\", \"analyze agreement\", \"check contract terms\",\n  \"find liability clause\", \"summarize this NDA\", 或 \"contract risks\" 时使用。\nlicense: MIT\nmetadata:\n  author: Cowork Library\n  version: \"1.0\"\n---\n\n# 合同审阅\n分析合同，提取关键条款、识别风险并总结义务。\n\n## 此技能的作用\n\n审查合同并提供：\n- 执行摘要\n- 关键条款提取\n- 重要日期和期限\n- 风险识别\n- 义务跟踪\n- 不寻常或值得关注的条款\n\n## 使用场景\n\n- 审查供应商协议\n- 签署前分析 NDA\n- 检查客户合同\n- 支持续约决策\n- 尽职调查审查\n\n## 工作流程\n\n1. **文档分析**\n   - 识别合同类型\n   - 提取相关方\n   - 找出生效日期和期限\n\n2. **关键条款提取**\n   - 付款条款\n   - 交付物和范围\n   - 终止条件\n   - 续约条款\n\n3. **风险评估**\n   - 责任条款\n   - 赔偿\n   - 责任限制\n   - IP 所有权\n   - 保密范围\n\n4. **义务映射**\n   - 我方义务\n   - 对方义务\n   - 期限和里程碑\n\n## 输出格式\n\n# 合同审查摘要\n\n## 文档概览\n| 字段 | 值 |\n|-------|-------|\n| **合同类型** | {NDA, MSA, SOW, License, etc.} |\n| **签约方** | {Party A} 和 {Party B} |\n| **生效日期** | {date} |\n| **期限** | {duration} |\n| **管辖法律** | {jurisdiction} |\n\n---\n\n## 执行摘要\n\n{2-3 sentence summary of what this contract does and its key implications}\n\n---\n\n## 关键条款\n\n### 财务条款\n| 条款 | 详细信息 |\n|------|---------|\n| **总价值** | {amount} |\n| **付款条款** | {Net 30, milestone-based, etc.} |\n| **逾期费用** | {if applicable} |\n| **价格上调** | {annual increase clause if any} |\n\n### 范围与交付物\n- {Deliverable 1}\n- {Deliverable 2}\n- {Deliverable 3}\n\n### 期限与终止\n- **初始期限：** {duration}\n- **自动续约：** {Yes/No, terms}\n- **便利终止：** {notice period}\n- **因故终止：** {conditions}\n\n---\n\n## ⚠️ 风险评估\n\n### 高风险项\n| 条款 | 位置 | 问题 | 建议 |\n|--------|----------|---------|----------------|\n| {clause} | Section {n} | {why it's risky} | {suggested action} |\n\n### 中风险项\n| 条款 | 位置 | 问题 |\n|--------|----------|---------|\n| {clause} | Section {n} | {concern} |\n\n### 不寻常条款\n- {Any non-standard clauses worth noting}\n\n---\n\n## 📋 我方义务\n\n| 义务 | 期限 | 条款 |\n|------------|----------|---------|\n| {obligation 1} | {date/trigger} | §{n} |\n| {obligation 2} | {date/trigger} | §{n} |\n| {obligation 3} | {date/trigger} | §{n} |\n\n---\n\n## 📋 对方义务\n\n| 义务 | 期限 | 条款 |\n|------------|----------|---------|\n| {obligation 1} | {date/trigger} | §{n} |\n| {obligation 2} | {date/trigger} | §{n} |\n\n---\n\n## 重要日期\n\n| 日期 | 事件 | 需要采取的行动 |\n|------|-------|-----------------|\n| {date} | {event} | {action} |\n| {date} | 续约通知截止日期 | 决定续约或终止 |\n| {date} | 合同到期 | {action} |\n\n---\n\n## 谈判要点\n\n签署前可考虑谈判以下事项：\n\n1. **{Item 1}:** {current state} → {suggested change}\n2. **{Item 2}:** {current state} → {suggested change}\n3. **{Item 3}:** {current state} → {suggested change}\n\n---\n\n## 与标准条款对比\n\n| 条款 | 本合同 | 市场标准 | 评估 |\n|--------|---------------|-----------------|------------|\n| 责任上限 | {amount} | {typical} | {favorable/unfavorable} |\n| 赔偿 | {scope} | {typical} | {favorable/unfavorable} |\n| IP 所有权 | {terms} | {typical} | {favorable/unfavorable} |\n\n---\n\n## ⚠️ 免责声明\n\n本分析仅供参考，不构成法律意见。\n"},"30-60-90-plan":{"en":"---\nname: 30-60-90-plan\ndescription: |\n  Creates a structured 30-60-90 day onboarding plan for new hires.\n  Use when user asks \"create 30-60-90 plan\", \"onboarding milestones\",\n  \"new hire goals\", \"ramp-up plan\", or \"first 90 days plan\".\nlicense: MIT\nmetadata:\n  author: Cowork Library\n  version: \"1.0\"\n  plugin: onboarding-accelerator\n---\n\n# 30-60-90 Day Plan\n\nGenerate a structured onboarding plan with clear milestones for the first 90 days.\n\n## What This Skill Does\n\nCreates a phased onboarding plan with:\n- Learning objectives for each phase\n- Key milestones and deliverables\n- Success metrics\n- Check-in schedule\n- Resources and training\n\n## When to Use\n\n- Manager preparing for new hire\n- New employee creating their own plan\n- HR standardizing onboarding\n- Promoting/transitioning employee to new role\n\n## Required Information\n\n1. Role and level\n2. Department/team\n3. Key responsibilities\n4. Critical skills to develop\n5. Key stakeholders to meet\n\n## Workflow\n\n1. **Understand the Role**\n   - Review job responsibilities\n   - Identify critical success factors\n   - Note team dynamics and dependencies\n\n2. **Structure Each Phase**\n   - Days 1-30: Learn & Absorb\n   - Days 31-60: Contribute & Apply\n   - Days 61-90: Own & Deliver\n\n3. **Define Milestones**\n   - Specific, measurable goals\n   - Key meetings and relationships\n   - Training completions\n   - First deliverables\n\n4. **Create Check-in Schedule**\n   - Weekly 1:1s with manager\n   - 30/60/90 day reviews\n   - Stakeholder feedback points\n\n## Output Format\n\n# 30-60-90 Day Plan: {Name} - {Role}\n\n## Overview\n**Start Date:** {date}\n**Manager:** {name}\n**Department:** {team}\n\n---\n\n## Days 1-30: Learn & Absorb\n**Theme:** Understand the landscape\n\n### Goals\n- [ ] Complete all required training\n- [ ] Meet with key stakeholders\n- [ ] Understand team processes and tools\n- [ ] Shadow team members on key workflows\n\n### Key Meetings\n| Who | Purpose | By When |\n|-----|---------|---------|\n| {stakeholder} | Understand {area} | Week 1 |\n\n### Deliverables\n- Complete onboarding checklist\n- Document initial questions and observations\n- Attend all team rituals\n\n### Success Metrics\n- Training completion: 100%\n- Stakeholder meetings: {n} completed\n- Systems access: Fully set up\n\n---\n\n## Days 31-60: Contribute & Apply\n**Theme:** Add value with guidance\n\n### Goals\n- [ ] Take ownership of first project/task\n- [ ] Contribute to team discussions\n- [ ] Identify improvement opportunities\n- [ ] Build cross-functional relationships\n\n### Deliverables\n- Complete first independent deliverable\n- Present learnings to team\n- Document process improvements\n\n### Success Metrics\n- First project delivered\n- Positive stakeholder feedback\n- Active participation in meetings\n\n---\n\n## Days 61-90: Own & Deliver\n**Theme:** Drive results independently\n\n### Goals\n- [ ] Own area of responsibility fully\n- [ ] Deliver measurable impact\n- [ ] Mentor or help others\n- [ ] Propose strategic improvements\n\n### Deliverables\n- Lead a project or initiative\n- Present 90-day accomplishments\n- Create 6-month goals\n\n### Success Metrics\n- Independent ownership demonstrated\n- Quantifiable impact delivered\n- Clear path forward established\n\n---\n\n## Check-in Schedule\n| Date | Type | Focus |\n|------|------|-------|\n| Week 1 | Daily sync | Questions, blockers |\n| Week 2-4 | Weekly 1:1 | Progress, support |\n| Day 30 | 30-day review | Phase 1 assessment |\n| Day 60 | 60-day review | Phase 2 assessment |\n| Day 90 | 90-day review | Full assessment |\n","zh":"---\nname: 30-60-90-plan\ndescription: |\n  為新進員工建立結構化的 30-60-90 天報到計畫。\n  當使用者詢問「建立 30-60-90 計畫」、「報到里程碑」、「新進員工目標」、「上手計畫」、「前 90 天計畫」、\"create 30-60-90 plan\", \"onboarding milestones\",\n  \"new hire goals\", \"ramp-up plan\", or \"first 90 days plan\" 時使用。\nlicense: MIT\nmetadata:\n  author: Cowork Library\n  version: \"1.0\"\n  plugin: onboarding-accelerator\n---\n\n# 30-60-90 天上手計畫\n產生結構化報到計畫，為前 90 天設定清楚里程碑。\n\n## 此 Skill 的功能\n\n建立分階段報到計畫，包含：\n- 每個階段的學習目標\n- 關鍵里程碑與交付項目\n- 成功衡量指標\n- 報到會議時程\n- 資源與訓練\n\n## 使用時機\n\n- 主管為新進員工做準備\n- 新進員工建立自己的計畫\n- HR 標準化報到流程\n- 員工升遷/轉任新角色\n\n## 必要資訊\n\n1. 角色與職級\n2. 部門/團隊\n3. 關鍵職責\n4. 需要培養的關鍵技能\n5. 需要會面的關鍵利害關係人\n\n## 工作流程\n\n1. **了解角色**\n   - 檢視工作職責\n   - 識別關鍵成功因素\n   - 記錄團隊動態與相依性\n\n2. **規劃各階段**\n   - 第 1-30 天：學習與吸收\n   - 第 31-60 天：貢獻與應用\n   - 第 61-90 天：負責與交付\n\n3. **定義里程碑**\n   - 具體且可衡量的目標\n   - 關鍵會議與關係\n   - 訓練完成情況\n   - 第一批交付項目\n\n4. **建立報到會議時程**\n   - 每週與主管 1:1\n   - 30/60/90 天檢視\n   - 利害關係人回饋點\n\n## 輸出格式\n\n# 30-60-90 天計畫：{Name} - {Role}\n\n## 概觀\n**開始日期：** {date}\n**主管：** {name}\n**部門：** {team}\n\n---\n\n## 第 1-30 天：學習與吸收\n**主題：** 了解環境全貌\n\n### 目標\n- [ ] 完成所有必要訓練\n- [ ] 與關鍵利害關係人會面\n- [ ] 了解團隊流程與工具\n- [ ] 跟隨團隊成員觀察關鍵工作流程\n\n### 關鍵會議\n| 對象 | 目的 | 完成時間 |\n|-----|---------|---------|\n| {stakeholder} | 了解 {area} | Week 1 |\n\n### 交付項目\n- 完成報到檢查清單\n- 記錄初步問題與觀察\n- 參加所有團隊例行活動\n\n### 成功衡量指標\n- 訓練完成度：100%\n- 利害關係人會議：{n} 已完成\n- 系統存取：完整設定\n\n---\n\n## 第 31-60 天：貢獻與應用\n**主題：** 在指導下創造價值\n\n### 目標\n- [ ] 承接第一個專案/任務\n- [ ] 參與團隊討論\n- [ ] 識別改善機會\n- [ ] 建立跨職能關係\n\n### 交付項目\n- 完成第一個獨立交付項目\n- 向團隊簡報學習成果\n- 記錄流程改善建議\n\n### 成功衡量指標\n- 第一個專案已交付\n- 利害關係人回饋正向\n- 積極參與會議\n\n---\n\n## 第 61-90 天：負責與交付\n**主題：** 獨立推動成果\n\n### 目標\n- [ ] 完全負責職責範圍\n- [ ] 交付可衡量影響\n- [ ] 指導或協助他人\n- [ ] 提出策略性改善\n\n### 交付項目\n- 主導一個專案或倡議\n- 呈現 90 天成果\n- 建立 6 個月目標\n\n### 成功衡量指標\n- 展現獨立負責能力\n- 交付可量化影響\n- 建立清楚後續路徑\n\n---\n\n## 報到會議時程\n| 日期 | 類型 | 重點 |\n|------|------|-------|\n| Week 1 | 每日同步 | 問題、阻礙 |\n| Week 2-4 | 每週 1:1 | 進度、支援 |\n| Day 30 | 30 天檢視 | 第 1 階段評估 |\n| Day 60 | 60 天檢視 | 第 2 階段評估 |\n| Day 90 | 90 天檢視 | 完整評估 |\n","cn":"---\nname: 30-60-90-plan\ndescription: |\n  为新员工创建结构化的 30-60-90 天入职计划。\n  当用户询问“创建 30-60-90 计划”、“入职里程碑”、“新员工目标”、“上手计划”、“前 90 天计划”、\"create 30-60-90 plan\", \"onboarding milestones\",\n  \"new hire goals\", \"ramp-up plan\", or \"first 90 days plan\" 时使用。\nlicense: MIT\nmetadata:\n  author: Cowork Library\n  version: \"1.0\"\n  plugin: onboarding-accelerator\n---\n\n# 30-60-90 天上手计划\n生成结构化入职计划，为前 90 天设定清晰里程碑。\n\n## 此 Skill 的功能\n\n创建分阶段入职计划，包括：\n- 每个阶段的学习目标\n- 关键里程碑和交付项\n- 成功指标\n- 沟通检查安排\n- 资源和培训\n\n## 适用场景\n\n- 经理为新员工入职做准备\n- 新员工创建自己的计划\n- HR 标准化入职流程\n- 员工晋升/转岗到新角色\n\n## 必填信息\n\n1. 角色和级别\n2. 部门/团队\n3. 关键职责\n4. 需要发展的关键技能\n5. 需要会面的关键干系人\n\n## 工作流\n\n1. **了解角色**\n   - 查看岗位职责\n   - 识别关键成功因素\n   - 记录团队协作方式和依赖关系\n\n2. **设计各阶段**\n   - 第 1-30 天：学习与吸收\n   - 第 31-60 天：贡献与应用\n   - 第 61-90 天：负责与交付\n\n3. **定义里程碑**\n   - 具体、可衡量的目标\n   - 关键会议和关系\n   - 培训完成情况\n   - 第一批交付项\n\n4. **创建沟通检查安排**\n   - 每周与经理 1:1\n   - 30/60/90 天复盘\n   - 干系人反馈节点\n\n## 输出格式\n\n# 30-60-90 天计划：{Name} - {Role}\n\n## 概览\n**开始日期：** {date}\n**经理：** {name}\n**部门：** {team}\n\n---\n\n## 第 1-30 天：学习与吸收\n**主题：** 了解业务和团队全貌\n\n### 目标\n- [ ] 完成所有必需培训\n- [ ] 与关键干系人会面\n- [ ] 了解团队流程和工具\n- [ ] 跟随团队成员观察关键工作流\n\n### 关键会议\n| 对象 | 目的 | 截止时间 |\n|-----|---------|---------|\n| {stakeholder} | 了解 {area} | Week 1 |\n\n### 交付项\n- 完成入职检查清单\n- 记录初步问题和观察\n- 参加所有团队例行会议\n\n### 成功指标\n- 培训完成度：100%\n- 干系人会议：{n} 已完成\n- 系统访问权限：已全部配置\n\n---\n\n## 第 31-60 天：贡献与应用\n**主题：** 在指导下创造价值\n\n### 目标\n- [ ] 接手第一个项目/任务\n- [ ] 参与团队讨论\n- [ ] 识别改进机会\n- [ ] 建立跨职能关系\n\n### 交付项\n- 完成第一个独立交付项\n- 向团队展示学习收获\n- 记录流程改进建议\n\n### 成功指标\n- 第一个项目已交付\n- 干系人反馈积极\n- 积极参与会议\n\n---\n\n## 第 61-90 天：负责与交付\n**主题：** 独立推动结果\n\n### 目标\n- [ ] 全面负责职责范围\n- [ ] 交付可衡量影响\n- [ ] 指导或帮助他人\n- [ ] 提出战略性改进\n\n### 交付项\n- 牵头一个项目或专项\n- 展示 90 天成果\n- 制定 6 个月目标\n\n### 成功指标\n- 展现独立负责能力\n- 交付可量化影响\n- 建立清晰后续路径\n\n---\n\n## 沟通检查安排\n| 日期 | 类型 | 重点 |\n|------|------|-------|\n| Week 1 | 每日同步 | 问题、阻碍 |\n| Week 2-4 | 每周 1:1 | 进展、支持 |\n| Day 30 | 30 天复盘 | 第 1 阶段评估 |\n| Day 60 | 60 天复盘 | 第 2 阶段评估 |\n| Day 90 | 90 天复盘 | 全面评估 |\n"},"onboarding-checklist":{"en":"---\nname: onboarding-checklist\ndescription: |\n  Creates a comprehensive onboarding checklist tracking all tasks across IT, HR, and team setup.\n  Use when user asks \"onboarding checklist\", \"new hire tasks\", \"onboarding tracker\",\n  \"what do I need to set up\", or \"onboarding status\".\nlicense: MIT\nmetadata:\n  author: Cowork Library\n  version: \"1.0\"\n  plugin: onboarding-accelerator\n---\n\n# Onboarding Checklist\n\nGenerate and track a complete onboarding checklist for new hires.\n\n## What This Skill Does\n\nCreates a comprehensive checklist covering:\n- Pre-arrival preparation\n- Day 1 essentials\n- Week 1 tasks\n- First month milestones\n- Compliance and training requirements\n\n## When to Use\n\n- Preparing for incoming employee\n- New hire tracking their own progress\n- Manager ensuring nothing falls through cracks\n- HR auditing onboarding completion\n\n## Required Information\n\n1. New hire name and role\n2. Department\n3. Start date\n4. Location (remote/hybrid/onsite)\n5. Any role-specific requirements\n\n## Output Format\n\n# Onboarding Checklist: {Name}\n**Role:** {title}\n**Start Date:** {date}\n**Manager:** {manager}\n**Status:** {X}% Complete\n\n---\n\n## Pre-Arrival (Before Day 1)\n\n### IT Setup\n- [ ] Laptop ordered and configured\n- [ ] Email account created\n- [ ] Microsoft 365 license assigned\n- [ ] Teams account provisioned\n- [ ] Security groups added\n- [ ] VPN access configured\n- [ ] Required software installed\n\n### HR & Admin\n- [ ] Offer letter signed\n- [ ] Background check complete\n- [ ] I-9 / work authorization\n- [ ] Benefits enrollment sent\n- [ ] Payroll setup complete\n- [ ] Emergency contact collected\n- [ ] Org announcement drafted\n\n### Workspace\n- [ ] Desk/office assigned (if onsite)\n- [ ] Building access badge\n- [ ] Parking arranged\n- [ ] Home office stipend (if remote)\n\n### Team Prep\n- [ ] Buddy assigned\n- [ ] First week meetings scheduled\n- [ ] Team notified of start date\n- [ ] Welcome message drafted\n\n---\n\n## Day 1\n\n### Morning\n- [ ] Welcome meeting with manager\n- [ ] Laptop and credentials working\n- [ ] Email accessible\n- [ ] Teams logged in\n- [ ] Building/office tour (or virtual tour)\n\n### Afternoon\n- [ ] HR paperwork session\n- [ ] Benefits overview\n- [ ] IT security training\n- [ ] Meet the team\n- [ ] Lunch with buddy\n\n### End of Day\n- [ ] Calendar populated with key meetings\n- [ ] Knows how to get help\n- [ ] Has 1:1 scheduled with manager\n- [ ] Feels welcomed!\n\n---\n\n## Week 1\n\n### Access & Tools\n- [ ] All required systems accessible\n- [ ] Relevant SharePoint sites shared\n- [ ] Added to team channels\n- [ ] Calendar synced with team\n- [ ] Can join video calls\n\n### Meetings & People\n- [ ] 1:1 with manager\n- [ ] Met direct team members\n- [ ] Introduced to key stakeholders\n- [ ] Attended first team meeting\n- [ ] Daily check-ins with buddy\n\n### Learning\n- [ ] Reviewed team documentation\n- [ ] Completed required compliance training\n- [ ] Understands team goals and priorities\n- [ ] Knows where to find help\n\n---\n\n## First 30 Days\n\n### Training & Compliance\n- [ ] Security awareness training\n- [ ] Code of conduct acknowledgment\n- [ ] Role-specific certifications started\n- [ ] Product/service overview complete\n- [ ] Tools training complete\n\n### Integration\n- [ ] 30-day check-in with manager\n- [ ] Feedback collected from buddy\n- [ ] Cross-functional introductions made\n- [ ] First contribution/deliverable\n- [ ] 30-60-90 plan reviewed\n\n### Administrative\n- [ ] Benefits elections finalized\n- [ ] Direct deposit confirmed\n- [ ] Time tracking set up\n- [ ] Expense system access\n- [ ] Travel profile (if needed)\n\n---\n\n## Progress Summary\n\n| Category | Complete | Total | Status |\n|----------|----------|-------|--------|\n| IT Setup | _ | _ | ⬜ |\n| HR & Admin | _ | _ | ⬜ |\n| Week 1 | _ | _ | ⬜ |\n| Training | _ | _ | ⬜ |\n| **Overall** | _ | _ | **_%** |\n","zh":"---\nname: onboarding-checklist\ndescription: |\n  建立完整的報到檢查清單，追蹤 IT、HR 與團隊設定中的所有任務。\n  當使用者要求「報到檢查清單」、「新人任務」、「報到追蹤」、「我需要設定什麼」、「報到狀態」、\"onboarding checklist\", \"new hire tasks\", \"onboarding tracker\",\n  \"what do I need to set up\", 或 \"onboarding status\" 時使用。\nlicense: MIT\nmetadata:\n  author: Cowork Library\n  version: \"1.0\"\n  plugin: onboarding-accelerator\n---\n\n# 新人入職檢核表\n為新進員工產生並追蹤完整的報到檢查清單。\n\n## 此技能的用途\n\n建立涵蓋下列項目的完整檢查清單：\n- 到職前準備\n- 第 1 天必要事項\n- 第 1 週任務\n- 第一個月里程碑\n- 合規與訓練要求\n\n## 使用時機\n\n- 為即將到職的員工做準備\n- 新進員工追蹤自己的進度\n- 主管確保沒有遺漏事項\n- HR 稽核報到完成狀態\n\n## 必要資訊\n\n1. 新進員工姓名與職稱\n2. 部門\n3. 到職日\n4. 地點（遠端/混合/現場）\n5. 任何職務特定要求\n\n## 輸出格式\n\n# 報到檢查清單：{Name}\n**職務：** {title}\n**到職日：** {date}\n**主管：** {manager}\n**狀態：** {X}% 完成\n\n---\n\n## 到職前（第 1 天之前）\n\n### IT 設定\n- [ ] 筆電已訂購並設定完成\n- [ ] 郵件帳號已建立\n- [ ] Microsoft 365 授權已指派\n- [ ] Teams 帳號已佈建\n- [ ] 安全性群組已加入\n- [ ] VPN 存取已設定\n- [ ] 必要軟體已安裝\n\n### HR 與行政\n- [ ] Offer letter 已簽署\n- [ ] 背景調查已完成\n- [ ] I-9 / 工作授權\n- [ ] 福利登記資訊已寄出\n- [ ] 薪資設定已完成\n- [ ] 緊急聯絡人已收集\n- [ ] 組織公告已草擬\n\n### 工作空間\n- [ ] 座位/辦公室已指派（若現場辦公）\n- [ ] 大樓門禁識別證\n- [ ] 停車已安排\n- [ ] 居家辦公補助（若遠端）\n\n### 團隊準備\n- [ ] Buddy 已指派\n- [ ] 第一週會議已排定\n- [ ] 團隊已收到到職日通知\n- [ ] 歡迎訊息已草擬\n\n---\n\n## 第 1 天\n\n### 上午\n- [ ] 與主管進行歡迎會議\n- [ ] 筆電與憑證可正常使用\n- [ ] 可存取郵件\n- [ ] 已登入 Teams\n- [ ] 大樓/辦公室導覽（或虛擬導覽）\n\n### 下午\n- [ ] HR 文件作業時段\n- [ ] 福利概覽\n- [ ] IT 安全性訓練\n- [ ] 認識團隊\n- [ ] 與 Buddy 午餐\n\n### 當天結束前\n- [ ] 行事曆已加入關鍵會議\n- [ ] 知道如何取得協助\n- [ ] 已排定與主管的 1:1\n- [ ] 感受到歡迎！\n\n---\n\n## 第 1 週\n\n### 存取與工具\n- [ ] 可存取所有必要系統\n- [ ] 相關 SharePoint 網站已分享\n- [ ] 已加入團隊頻道\n- [ ] 行事曆已與團隊同步\n- [ ] 可以加入視訊通話\n\n### 會議與人員\n- [ ] 與主管 1:1\n- [ ] 已認識直屬團隊成員\n- [ ] 已介紹給關鍵利害關係人\n- [ ] 已參加第一次團隊會議\n- [ ] 與 Buddy 每日確認\n\n### 學習\n- [ ] 已檢閱團隊文件\n- [ ] 已完成必要合規訓練\n- [ ] 了解團隊目標與優先事項\n- [ ] 知道到哪裡尋求協助\n\n---\n\n## 前 30 天\n\n### 訓練與合規\n- [ ] 資安意識訓練\n- [ ] 行為準則確認\n- [ ] 已開始職務特定認證\n- [ ] 產品/服務概覽已完成\n- [ ] 工具訓練已完成\n\n### 融入\n- [ ] 與主管進行 30 天確認\n- [ ] 已收集 Buddy 的回饋\n- [ ] 已完成跨職能介紹\n- [ ] 第一項貢獻/交付項目\n- [ ] 已檢閱 30-60-90 計畫\n\n### 行政\n- [ ] 福利選項已最終確認\n- [ ] 薪資轉帳已確認\n- [ ] 工時追蹤已設定\n- [ ] 費用系統存取\n- [ ] 差旅資料（如需要）\n\n---\n\n## 進度摘要\n\n| 類別 | 已完成 | 總計 | 狀態 |\n|----------|----------|-------|--------|\n| IT 設定 | _ | _ | ⬜ |\n| HR 與行政 | _ | _ | ⬜ |\n| 第 1 週 | _ | _ | ⬜ |\n| 訓練 | _ | _ | ⬜ |\n| **整體** | _ | _ | **_%** |\n","cn":"---\nname: onboarding-checklist\ndescription: |\n  创建完整的入职检查清单，跟踪 IT、HR 和团队设置中的所有任务。\n  当用户提出“入职检查清单”、“新员工任务”、“入职跟踪器”、“我需要设置什么”、“入职状态”、\"onboarding checklist\", \"new hire tasks\", \"onboarding tracker\",\n  \"what do I need to set up\", 或 \"onboarding status\" 时使用。\nlicense: MIT\nmetadata:\n  author: Cowork Library\n  version: \"1.0\"\n  plugin: onboarding-accelerator\n---\n\n# 新员工入职清单\n为新员工生成并跟踪完整的入职检查清单。\n\n## 此技能的作用\n\n创建覆盖以下内容的完整检查清单：\n- 到岗前准备\n- 第 1 天必备事项\n- 第 1 周任务\n- 首月里程碑\n- 合规和培训要求\n\n## 使用场景\n\n- 为即将入职的员工做准备\n- 新员工跟踪自己的进度\n- 经理确保没有事项遗漏\n- HR 审计入职完成情况\n\n## 必要信息\n\n1. 新员工姓名和岗位\n2. 部门\n3. 入职日期\n4. 地点（远程/混合/现场）\n5. 任何岗位特定要求\n\n## 输出格式\n\n# 入职检查清单：{Name}\n**岗位：** {title}\n**入职日期：** {date}\n**经理：** {manager}\n**状态：** {X}% 完成\n\n---\n\n## 到岗前（第 1 天之前）\n\n### IT 设置\n- [ ] 笔记本电脑已订购并配置完成\n- [ ] 邮件账号已创建\n- [ ] Microsoft 365 许可证已分配\n- [ ] Teams 账号已开通\n- [ ] 安全组已添加\n- [ ] VPN 访问已配置\n- [ ] 必需软件已安装\n\n### HR 与行政\n- [ ] Offer letter 已签署\n- [ ] 背景调查已完成\n- [ ] I-9 / 工作授权\n- [ ] 福利登记信息已发送\n- [ ] 薪资设置已完成\n- [ ] 紧急联系人已收集\n- [ ] 组织公告已起草\n\n### 工作空间\n- [ ] 工位/办公室已分配（如现场办公）\n- [ ] 楼宇门禁卡\n- [ ] 停车已安排\n- [ ] 居家办公补贴（如远程）\n\n### 团队准备\n- [ ] Buddy 已分配\n- [ ] 第一周会议已安排\n- [ ] 团队已收到入职日期通知\n- [ ] 欢迎信息已起草\n\n---\n\n## 第 1 天\n\n### 上午\n- [ ] 与经理进行欢迎会议\n- [ ] 笔记本电脑和凭据可正常使用\n- [ ] 可访问邮件\n- [ ] 已登录 Teams\n- [ ] 楼宇/办公室导览（或虚拟导览）\n\n### 下午\n- [ ] HR 文档办理环节\n- [ ] 福利概览\n- [ ] IT 安全培训\n- [ ] 认识团队\n- [ ] 与 Buddy 共进午餐\n\n### 当天结束前\n- [ ] 日历已加入关键会议\n- [ ] 知道如何获取帮助\n- [ ] 已安排与经理的 1:1\n- [ ] 感受到欢迎！\n\n---\n\n## 第 1 周\n\n### 访问权限与工具\n- [ ] 可访问所有必需系统\n- [ ] 相关 SharePoint 站点已共享\n- [ ] 已加入团队频道\n- [ ] 日历已与团队同步\n- [ ] 可以加入视频通话\n\n### 会议与人员\n- [ ] 与经理 1:1\n- [ ] 已认识直属团队成员\n- [ ] 已介绍给关键干系人\n- [ ] 已参加第一次团队会议\n- [ ] 与 Buddy 每日同步\n\n### 学习\n- [ ] 已查看团队文档\n- [ ] 已完成必需合规培训\n- [ ] 了解团队目标和优先级\n- [ ] 知道到哪里寻求帮助\n\n---\n\n## 前 30 天\n\n### 培训与合规\n- [ ] 安全意识培训\n- [ ] 行为准则确认\n- [ ] 已开始岗位特定认证\n- [ ] 产品/服务概览已完成\n- [ ] 工具培训已完成\n\n### 融入\n- [ ] 与经理进行 30 天跟进\n- [ ] 已收集 Buddy 的反馈\n- [ ] 已完成跨职能介绍\n- [ ] 第一项贡献/交付物\n- [ ] 已查看 30-60-90 计划\n\n### 行政\n- [ ] 福利选择已最终确认\n- [ ] 直接存款已确认\n- [ ] 工时跟踪已设置\n- [ ] 费用系统访问权限\n- [ ] 差旅档案（如需要）\n\n---\n\n## 进度摘要\n\n| 类别 | 已完成 | 总数 | 状态 |\n|----------|----------|-------|--------|\n| IT 设置 | _ | _ | ⬜ |\n| HR 与行政 | _ | _ | ⬜ |\n| 第 1 周 | _ | _ | ⬜ |\n| 培训 | _ | _ | ⬜ |\n| **整体** | _ | _ | **_%** |\n"},"hr-engagement-strategy":{"en":"---\nname: hr-engagement-strategy\ndescription: |\n  Turns an employee engagement survey export into a full executive deliverable set for HR:\n  a five-theme summary, a CEO-ready strategy document with benchmarks, an SLT execution\n  deck, a one-page brand-colored infographic, and a Copilot Create / Sora video script.\n  Use when the user asks to \"analyze our engagement survey\", \"summarize the engagement\n  survey into themes\", \"build an engagement strategy for the CEO/SLT\", \"create an HR\n  enablement deck\", \"turn survey results into a presentation\", \"make an engagement\n  infographic\", or \"write a sales-enablement / Copilot-adoption strategy for HR\".\n  Emphasizes HRBP, Sales Leader, and L&D roles and Copilot-for-Sales adoption.\n  Do NOT use for: scheduling HR meetings (use schedule-meeting), routine HR status emails\n  (use stakeholder-comms), or evaluating individual employee performance (refuse).\ncowork:\n  category: analysis\n  icon: People\n---\n\n## Overview\n\nThis skill runs a five-stage HR pipeline that converts a single engagement survey export\ninto an executive-ready package. Each stage grounds the next: themes come only from the\nreal survey data, the strategy builds on those themes, and every downstream deliverable\n(deck, infographic, video script) reuses the same strategy so the story stays consistent.\n\nThe recurring narrative across all deliverables: identify employees — especially **top\nsellers** — who use Copilot in advanced ways, capture their usage patterns, and let\n**L&D** turn those into short, time-of-need training that **HRBPs** orchestrate with\n**Sales Leadership** to lift revenue. CRM/Salesforce metrics are referenced as the\nmeasurement frame, using user-provided numbers or clearly-marked placeholders — this skill\nnever pulls live CRM data.\n\n## When to Use\n\n- User uploads an engagement / pulse / culture survey export and wants it analyzed\n- User needs a CEO or SLT presentation built from engagement findings\n- User wants an HR-to-Sales enablement strategy centered on Copilot adoption\n- User asks for the infographic or video script pieces individually\n\n## When NOT to Use\n\n- Scheduling or rescheduling HR meetings — use **schedule-meeting**\n- A simple status email or announcement — use **stakeholder-comms**\n- Ranking, rating, or comparing individual employees' performance — **refuse politely**\n  (\"I can't evaluate individual performance; I can summarize team/program outcomes instead\")\n- Filtering people by any protected characteristic — **refuse**, offer role/team/skill instead\n\n## Quick Start\n\n```\nUser: \"Analyze our engagement survey and build the CEO strategy + SLT deck + infographic + video script\"\n1. Find the survey file in input/ (Glob input/**/*). If none, ask for it — never invent data.\n2. Stage 1 — extract exactly 5 themes from the real survey data (xlsx skill).\n3. Stage 2 — write the strategy doc (docx): trends, 3 strategies (short + ≤2yr), exec\n   summary, benchmark vs a ~10k-employee peer (deep-research, cited).\n4. Stage 3 — build the SLT execution deck (pptx) from the strategy doc.\n5. Stage 4 — generate the one-page infographic (company branding, PNG via code).\n6. Stage 5 — write the Copilot Create / Sora video script (docx).\n7. Confirm each file landed in output/ before reporting done.\n```\n\nCreate a Task per stage so the user sees progress. Stages 3–5 depend on Stage 2's strategy\ncontent; Stage 1 must complete before Stage 2. Run nothing that needs survey data until the\nsurvey is loaded.\n\n## Core Instructions\n\n### Stage 0 — Locate inputs (always first)\n\n- `Glob input/**/*` to find the survey export (`.xlsx`, `.csv`, `.xls`). Match on names like\n  *survey*, *engagement*, *pulse*, *export*.\n- If no file is found, **stop and ask** the user to attach it. Do not proceed to Stage 1 on\n  invented data. This is a hard gate.\n- Ask once (only if unstated) whether they want all five deliverables or a subset.\n\n### Stage 1 — Five key themes (xlsx skill)\n\n- Read the survey with the **xlsx** skill. Inspect columns: question text, scores, free-text\n  comments, segments (department, tenure, region).\n- Derive **exactly five** themes grounded in the data. Each theme = a short title + the\n  quantitative signal behind it (e.g., score, % favorable, top driver) + 1–2 representative\n  verbatim snippets **only if** present in the file.\n- Compute any number (averages, % favorable, deltas) with a code tool — never by hand.\n- If the export lacks a dimension the user expects (e.g., no segment column), say so plainly.\n- Output the themes inline as a ranked list; this becomes the spine of Stage 2.\n\n### Stage 2 — Strategy document (docx skill)\n\nInvoke the **docx** skill. Structure:\n\n1. **Executive summary** (half page) — the engagement story in CEO language, leading with\n   business impact.\n2. **Workforce engagement trends** — the five themes plus recent macro trends in workforce\n   engagement (use deep-research / web search for external trends; cite sources).\n3. **Benchmark comparison** — our org vs a representative **~10,000-employee** peer set.\n   Route this through the **deep-research** agent so every external figure is cited. Where an\n   internal figure is unknown, insert a `[Add: our figure]` placeholder — never fabricate.\n4. **Three actionable strategies** — a deliberate **mix of short-term and longer-term (up to\n   2 years)**, framed **organization-wide**. For each: objective, time horizon, owner, and\n   the **organizational metric** it moves (engagement, retention, productivity, revenue).\n5. **Tie to org metrics** — explicit benefits to overall organizational metrics for the CEO.\n\nNumbers rule: any total, %, average, or delta embedded in the doc is computed by code, not by\nyou. Recipients, quotes, and stats are real-or-placeholder, never invented.\n\n### Stage 3 — SLT execution deck (pptx skill)\n\nInvoke the **pptx** skill. Build an **executive-level execution plan** from the Stage 2\nstrategy (not a re-analysis). Required sections:\n\n- Title + executive summary slide\n- The three strategies as an execution roadmap (short-term vs ≤2-year swimlanes)\n- **HR ↔ Sales alignment**: how HRBPs partner with Sales Leadership\n- **Customized AI training for Sales** using sales-specific scenarios, mapped to the sales\n  cycle (prospect → qualify → propose → close → expand)\n- **Measurement**: Salesforce CRM + existing sales KPIs as the measurement frame\n  (user-provided numbers or placeholders)\n- **Economic justification** for Copilot for M365 across all employees — show the model\n  structure (cost inputs, productivity/revenue levers, payback) with `[Add: figure]`\n  placeholders for any number not supplied. State assumptions explicitly.\n- **HRBP as liaison** to Sales Leadership orchestrating the transformation\n- Next steps / asks of the SLT\n\n### Stage 4 — One-page infographic (company branding, PNG via code)\n\nGenerate a single-page PNG to `output/` using Python (matplotlib/PIL — no image-generation\ntool in session, no `pip install`).\n\n**Resolve company branding first, in this order — do not hard-code one company's palette:**\n\n1. **Brand asset the user provided** — if a brand guide, logo, or style file is in `input/`,\n   read it and pull the hex colors / logo from there.\n2. **Org template library** — check `@org-template-library` (the tenant's branded Office\n   templates via `GetOrgTemplateLibrary` / `GetDriveChildren(drive_id=\"@org-template-library\")`).\n   Derive accent colors from a `.potx`/`.dotx`, and reuse the logo if present.\n3. **Ask, briefly** — if neither yields colors, ask the user for their brand hex values (or a\n   logo to sample). Offer a neutral professional default (a single primary + dark neutral +\n   light gray) so the run isn't blocked, and label it as a placeholder palette.\n\nApply the resolved brand colors consistently (primary for headers/accents, neutral for body,\none secondary for callouts). If a logo is available, place it in the header. Never claim a\nspecific brand's colors unless they were actually resolved from steps 1–2 or supplied by the\nuser.\n\nContent: the **three strategies** as the backbone, with a clear spotlight on three roles —\n**HRBP** (orchestrator/liaison), **Sales Leader** (sponsor), **L&D** (builds training from\nidentified **sales champions** using Copilot). Emphasize the sales role driving additional\nrevenue. Keep it scannable: title, 3 strategy blocks, a role band, a metric callout.\n\n### Stage 5 — Video script (docx skill, Copilot Create / Sora ready)\n\nInvoke the **docx** skill. Audience: **SLT + Sales Leadership / CRO**. Deliver a script the\nuser can paste directly into **Copilot Create or Sora 2.0** — scene-by-scene with: scene\nnumber, on-screen visual direction, voiceover/narration, and approximate duration. Keep total\nruntime tight (target 60–120s). Narrative beats to hit:\n\n- Identify **top sellers using Copilot in advanced ways** to win in each sales phase\n- The opportunity: turn their patterns into **dynamic sales content** for other sellers\n- Content **targeted to each portion of the sales cycle**; **short, time-of-need**, with\n  **companion agents + pre-written prompts**\n- **Sales Copilot Champions** as peer coaches to less-experienced users\n- **HRBP as strategist** with Sales Managers, improving manager feedback/coaching via **OCM**\n  to support sellers on Copilot for Sales excellence\n\n## Guardrails\n\n- **Survey-data gate:** never generate themes, stats, or quotes without the real survey file\n  loaded. If it's missing or unreadable, say so and ask for re-upload.\n- **Never fabricate:** benchmarks, ROI, KPIs, names, dates, quotes. Use `[Add: …]`\n  placeholders and route external claims through deep-research with citations.\n- **Numbers by code:** compute every embedded figure with a code tool before writing it.\n- **No performance evaluation / no protected-characteristic profiling** — refuse and offer a\n  compliant alternative.\n- **Delivery gate:** after each file stage, `Glob output/**/*` to confirm the file exists\n  before telling the user it's ready.\n- **One run, staged:** if the user asks for everything at once, produce all five but keep the\n  dependency order (survey → themes → strategy → deck/infographic/script).\n- **Future plugin path:** this is built to be packaged later into a Cowork plugin (e.g., to add\n  a live Salesforce connector and distribute to all HRBPs) via the plugin builder.\n","zh":"---\nname: hr-engagement-strategy\ndescription: |\n  將員工敬業度調查匯出檔轉換為完整的人資高階主管交付套件：\n  五大主題摘要、含基準比較且可供 CEO 使用的策略文件、SLT 執行簡報、\n  一頁式品牌色資訊圖表，以及 Copilot Create / Sora 影片腳本。\n  當使用者說「分析我們的敬業度調查」、「把敬業度調查彙整成主題」、「為 CEO/SLT 建立敬業度策略」、「建立人資賦能簡報」、「把調查結果做成簡報」、「製作敬業度資訊圖表」、「為人資撰寫 sales-enablement / Copilot-adoption 策略」、\"analyze our engagement survey\", \"summarize the engagement\n  survey into themes\", \"build an engagement strategy for the CEO/SLT\", \"create an HR\n  enablement deck\", \"turn survey results into a presentation\", \"make an engagement\n  infographic\", or \"write a sales-enablement / Copilot-adoption strategy for HR\" 時使用。\n  強調 HRBP、Sales Leader 與 L&D 角色，以及 Copilot for Sales 採用。\n  請勿用於：排程 HR 會議（使用 schedule-meeting）、例行 HR 狀態郵件\n  （使用 stakeholder-comms），或評估個別員工績效（拒絕）。\ncowork:\n  category: analysis\n  icon: People\n---\n\n## 概觀\n\n此技能執行五階段人資流程，將單一敬業度調查匯出檔轉換為\n高階主管可直接使用的套件。每個階段都為下一階段奠定基礎：主題只來自\n真實調查資料，策略建構於這些主題之上，而所有後續交付項目\n（簡報、資訊圖表、影片腳本）都重複使用同一套策略，確保故事一致。\n\n所有交付項目的共同敘事：找出員工 — 尤其是**頂尖銷售人員** — 如何\n以進階方式使用 Copilot，擷取其使用模式，並讓 **L&D** 將其轉換為\n短篇、即時所需的訓練內容，再由 **HRBPs** 與 **Sales Leadership** 協作推動，\n以提升營收。CRM/Salesforce 指標會作為衡量架構，使用使用者提供的數字或\n清楚標示的預留位置 — 此技能絕不擷取即時 CRM 資料。\n\n## 使用時機\n\n- 使用者上傳敬業度／脈搏／文化調查匯出檔，並希望進行分析\n- 使用者需要根據敬業度發現建立 CEO 或 SLT 簡報\n- 使用者想要以 Copilot 採用為核心的人資到銷售賦能策略\n- 使用者單獨要求資訊圖表或影片腳本\n\n## 不使用時機\n\n- 排程或重新排程 HR 會議 — 使用 **schedule-meeting**\n- 簡單的狀態郵件或公告 — 使用 **stakeholder-comms**\n- 對個別員工績效進行排名、評分或比較 — **禮貌拒絕**\n  （\"I can't evaluate individual performance; I can summarize team/program outcomes instead\"）\n- 依任何受保護特徵篩選人員 — **拒絕**，改提供角色／團隊／技能等替代方式\n\n## 快速開始\n\n```\n使用者: \"分析我們的敬業度調查，並建立 CEO strategy + SLT deck + infographic + video script\"\n1. 在 input/ 中尋找調查檔案（Glob input/**/*）。如果沒有，請要求提供 — 絕不編造資料。\n2. 階段 1 — 從真實調查資料中擷取正好 5 個主題（xlsx skill）。\n3. 階段 2 — 撰寫策略文件（docx）：趨勢、3 項策略（短期 + ≤2yr）、高階主管\n   摘要、與約 ~10k-employee 同業基準比較（deep-research，附引用）。\n4. 階段 3 — 根據策略文件建立 SLT 執行簡報（pptx）。\n5. 階段 4 — 產生一頁式資訊圖表（公司品牌，透過 code 輸出 PNG）。\n6. 階段 5 — 撰寫 Copilot Create / Sora 影片腳本（docx）。\n7. 回報完成前，確認每個檔案都已落在 output/。\n```\n\n每個階段建立一個 Task，讓使用者看到進度。階段 3–5 依賴階段 2 的策略\n內容；階段 1 必須先於階段 2 完成。調查載入前，不要執行任何需要調查資料的工作。\n\n## 核心指示\n\n### 階段 0 — 找出輸入（永遠先做）\n\n- 使用 `Glob input/**/*` 找出調查匯出檔（`.xlsx`, `.csv`, `.xls`）。比對檔名中的\n  *survey*, *engagement*, *pulse*, *export*。\n- 如果找不到檔案，**停止並要求**使用者附上檔案。不要用編造資料進入階段 1。\n  這是硬性閘門。\n- 詢問一次（僅在未說明時）他們想要全部五項交付項目，還是其中一部分。\n\n### 階段 1 — 五個關鍵主題（xlsx skill）\n\n- 使用 **xlsx** skill 讀取調查。檢查欄位：問題文字、分數、開放式\n  意見、區隔（部門、年資、區域）。\n- 推導**正好五個**以資料為根據的主題。每個主題 = 短標題 + 背後的\n  量化訊號（例如分數、% favorable、top driver）+ 1–2 段代表性\n  逐字摘錄（**僅在**檔案中存在時）。\n- 任何數字（平均、% favorable、差異）都要用 code tool 計算 — 絕不要手算。\n- 如果匯出檔缺少使用者期待的維度（例如沒有區隔欄位），請清楚說明。\n- 將主題以排名清單內嵌輸出；這會成為階段 2 的主軸。\n\n### 階段 2 — 策略文件（docx skill）\n\n叫用 **docx** skill。結構：\n\n1. **高階主管摘要**（半頁）— 以 CEO 語言描述敬業度故事，並以\n   商業影響開場。\n2. **員工敬業度趨勢** — 五個主題加上近期員工敬業度宏觀趨勢\n   （使用 deep-research / web search 取得外部趨勢；引用來源）。\n3. **基準比較** — 我們組織與具代表性的 **~10,000-employee** 同業群組比較。\n   透過 **deep-research** agent 處理，確保每個外部數字都有引用。若\n   內部數字未知，插入 `[Add: our figure]` 預留位置 — 絕不編造。\n4. **三項可執行策略** — 有意識地混合**短期與較長期（最長\n   2 years）**，並以**全組織**角度呈現。每項包含：目標、時間範圍、負責人，以及\n   會推動的**組織指標**（敬業度、留任率、生產力、營收）。\n5. **連結至組織指標** — 明確說明對 CEO 關注之整體組織指標的好處。\n\n數字規則：文件中嵌入的任何總數、%、平均或差異，都必須由 code 計算，\n不是由你計算。收件者、引述與統計數字必須是真實或預留位置，絕不編造。\n\n### 階段 3 — SLT 執行簡報（pptx skill）\n\n叫用 **pptx** skill。根據階段 2 策略建立**高階主管層級的執行計畫**\n（不是重新分析）。必要章節：\n\n- 標題 + 高階主管摘要投影片\n- 以三項策略作為執行路線圖（短期 vs ≤2-year 泳道）\n- **HR ↔ Sales alignment**：HRBPs 如何與 Sales Leadership 合作\n- **Customized AI training for Sales** 使用銷售專屬情境，對應銷售\n  週期（prospect → qualify → propose → close → expand）\n- **衡量**：Salesforce CRM + 現有 sales KPIs 作為衡量架構\n  （使用者提供的數字或預留位置）\n- **經濟合理性**：針對所有員工採用 Copilot for M365 展示模型\n  結構（成本投入、生產力／營收槓桿、回收期），對未提供的任何數字使用 `[Add: figure]`\n  預留位置。明確列出假設。\n- **HRBP as liaison** to Sales Leadership 協調轉型\n- SLT 的後續步驟／決策請求\n\n### 階段 4 — 一頁式資訊圖表（公司品牌，透過 code 輸出 PNG）\n\n使用 Python（matplotlib/PIL — session 中沒有 image-generation\n工具，不要 `pip install`）產生單頁 PNG 到 `output/`。\n\n**先解析公司品牌，依此順序 — 不要硬編碼某一家公司的色盤：**\n\n1. **使用者提供的品牌素材** — 如果 `input/` 中有品牌指南、標誌或樣式檔，\n   讀取並從中擷取 hex 色碼／標誌。\n2. **組織範本庫** — 檢查 `@org-template-library`（租用戶品牌化 Office\n   範本，透過 `GetOrgTemplateLibrary` / `GetDriveChildren(drive_id=\"@org-template-library\")`）。\n   從 `.potx`/`.dotx` 推導強調色，並在有標誌時重複使用。\n3. **簡短詢問** — 如果兩者都沒有色彩，請向使用者詢問品牌 hex 值（或\n   可取樣的標誌）。提供中性專業預設（單一主要色 + 深色中性色 +\n   淺灰）以避免流程受阻，並標示為預留色盤。\n\n一致套用解析出的品牌色（主要色用於標題／強調，中性色用於內文，\n一個次要色用於提示區塊）。如果有標誌，放在標頭。除非顏色確實來自\n步驟 1–2 或由使用者提供，否則不要宣稱那是特定品牌的顏色。\n\n內容：以**三項策略**為骨幹，清楚凸顯三個角色 —\n**HRBP**（協調者／聯絡窗口）、**Sales Leader**（贊助者）、**L&D**（根據\n已識別的 **sales champions** 使用 Copilot 建立訓練）。強調銷售角色帶動額外\n營收。保持易讀：標題、3 個策略區塊、角色帶、指標提示區塊。\n\n### 階段 5 — 影片腳本（docx skill，Copilot Create / Sora ready）\n\n叫用 **docx** skill。受眾：**SLT + Sales Leadership / CRO**。交付一份\n使用者可直接貼到 **Copilot Create 或 Sora 2.0** 的腳本 — 逐場景列出：場景\n編號、螢幕視覺指示、旁白／敘述，以及約略時長。總長保持精簡（目標 60–120s）。要涵蓋的敘事節點：\n\n- 找出**以進階方式使用 Copilot** 在各銷售階段致勝的**頂尖銷售人員**\n- 機會：將他們的模式轉換為供其他銷售人員使用的**動態銷售內容**\n- 內容**鎖定銷售週期的每個部分**；**短篇、即時所需**，並搭配\n  **companion agents + pre-written prompts**\n- **Sales Copilot Champions** 作為同儕教練，協助經驗較少的使用者\n- **HRBP as strategist** 與 Sales Managers 合作，透過 **OCM** 改善經理回饋／教練方式，\n  支援銷售人員達成 Copilot for Sales 卓越表現\n\n## 護欄\n\n- **調查資料閘門：** 若尚未載入真實調查檔案，絕不產生主題、統計或引述。\n  如果檔案缺失或無法讀取，請說明並要求重新上傳。\n- **絕不編造：** 基準、ROI、KPIs、姓名、日期、引述。使用 `[Add: …]`\n  預留位置，並透過 deep-research 搭配引用處理外部主張。\n- **數字用 code 計算：** 寫入前先用 code tool 計算每個內嵌數字。\n- **不做績效評估／不依受保護特徵剖析** — 拒絕並提供合規替代方案。\n- **交付閘門：** 每個檔案階段完成後，執行 `Glob output/**/*` 確認檔案存在，\n  再告訴使用者已準備好。\n- **一次執行、分階段：** 如果使用者一次要求全部內容，產出全部五項，但維持\n  相依順序（survey → themes → strategy → deck/infographic/script）。\n- **未來 plugin 路徑：** 此技能設計為日後可透過 plugin builder 封裝成 Cowork plugin\n  （例如新增即時 Salesforce connector 並散佈給所有 HRBPs）。","cn":"---\nname: hr-engagement-strategy\ndescription: |\n  将员工敬业度调研导出文件转化为完整的 HR 高管交付套件：\n  五大主题摘要、包含对标信息且可直接给 CEO 使用的策略文档、SLT 落地执行\n  汇报材料、一页品牌色信息图，以及 Copilot Create / Sora 视频脚本。\n  当用户说“分析我们的敬业度调研”、“把敬业度调研总结成主题”、“为 CEO/SLT 制定敬业度策略”、“创建 HR 赋能汇报材料”、“把调研结果做成演示文稿”、“制作敬业度信息图”、“为 HR 写 sales-enablement / Copilot-adoption 策略”、\"analyze our engagement survey\", \"summarize the engagement\n  survey into themes\", \"build an engagement strategy for the CEO/SLT\", \"create an HR\n  enablement deck\", \"turn survey results into a presentation\", \"make an engagement\n  infographic\", or \"write a sales-enablement / Copilot-adoption strategy for HR\" 时使用。\n  重点覆盖 HRBP、Sales Leader 和 L&D 角色，以及 Copilot for Sales 采用。\n  不要用于：安排 HR 会议（使用 schedule-meeting）、常规 HR 状态邮件\n  （使用 stakeholder-comms），或评估单个员工绩效（拒绝）。\ncowork:\n  category: analysis\n  icon: People\n---\n\n## 概述\n\n此技能运行一个五阶段 HR 流程，将单个敬业度调研导出文件转化为\n高管可直接使用的一整套交付物。每个阶段都为下一阶段打基础：主题只来自\n真实调研数据，策略基于这些主题展开，所有下游交付物\n（汇报材料、信息图、视频脚本）都复用同一套策略，保证叙事一致。\n\n所有交付物的共同叙事：识别员工 — 尤其是**顶尖销售人员** — 如何\n以进阶方式使用 Copilot，提炼他们的使用模式，并让 **L&D** 将这些模式转化为\n短小、按需触达的培训内容，再由 **HRBPs** 联动 **Sales Leadership** 进行落地，\n从而提升收入。CRM/Salesforce 指标会作为衡量框架，使用用户提供的数据或\n明确标注的占位符 — 此技能绝不拉取实时 CRM 数据。\n\n## 使用场景\n\n- 用户上传敬业度/脉搏/文化调研导出文件，并希望进行分析\n- 用户需要基于敬业度发现生成 CEO 或 SLT 汇报材料\n- 用户想要围绕 Copilot 采用制定 HR 到销售的赋能策略\n- 用户单独要求信息图或视频脚本\n\n## 不使用场景\n\n- 安排或改期 HR 会议 — 使用 **schedule-meeting**\n- 简单的状态邮件或公告 — 使用 **stakeholder-comms**\n- 对单个员工绩效进行排名、评分或比较 — **礼貌拒绝**\n  （\"I can't evaluate individual performance; I can summarize team/program outcomes instead\"）\n- 按任何受保护特征筛选人员 — **拒绝**，改为提供角色/团队/技能等替代方式\n\n## 快速开始\n\n```\n用户: \"分析我们的敬业度调研，并生成 CEO strategy + SLT deck + infographic + video script\"\n1. 在 input/ 中查找调研文件（Glob input/**/*）。如果没有，请要求用户提供 — 绝不编造数据。\n2. 阶段 1 — 从真实调研数据中提取正好 5 个主题（xlsx skill）。\n3. 阶段 2 — 编写策略文档（docx）：趋势、3 项策略（短期 + ≤2yr）、高管\n   摘要、与约 ~10k-employee 同业基准对标（deep-research，附引用）。\n4. 阶段 3 — 基于策略文档制作 SLT 落地执行汇报材料（pptx）。\n5. 阶段 4 — 生成一页信息图（公司品牌，使用 code 输出 PNG）。\n6. 阶段 5 — 编写 Copilot Create / Sora 视频脚本（docx）。\n7. 在报告完成前，确认每个文件都已落在 output/。\n```\n\n每个阶段创建一个 Task，让用户看到进展。阶段 3–5 依赖阶段 2 的策略\n内容；阶段 1 必须先于阶段 2 完成。在调研加载前，不运行任何需要调研数据的工作。\n\n## 核心说明\n\n### 阶段 0 — 定位输入（始终先做）\n\n- 使用 `Glob input/**/*` 查找调研导出文件（`.xlsx`, `.csv`, `.xls`）。匹配名称中的\n  *survey*, *engagement*, *pulse*, *export*。\n- 如果没有找到文件，**停止并要求**用户附上文件。不要基于编造数据进入阶段 1。\n  这是硬性门槛。\n- 询问一次（仅在未说明时）他们需要全部五项交付物，还是只需要其中一部分。\n\n### 阶段 1 — 五个关键主题（xlsx skill）\n\n- 使用 **xlsx** skill 读取调研。检查列：问题文本、分数、开放式\n  评论、分群维度（部门、任职年限、区域）。\n- 推导**正好五个**由数据支撑的主题。每个主题 = 简短标题 + 背后的\n  量化信号（例如分数、% favorable、top driver）+ 1–2 条代表性\n  原文摘录（**仅当**文件中存在时）。\n- 任何数字（平均值、% favorable、差异）都必须用 code tool 计算 — 绝不手算。\n- 如果导出文件缺少用户预期的维度（例如没有分群列），请直接说明。\n- 将主题以内联的有序列表输出；这会成为阶段 2 的主线。\n\n### 阶段 2 — 策略文档（docx skill）\n\n调用 **docx** skill。结构：\n\n1. **高管摘要**（半页）— 用 CEO 能接受的业务语言讲清敬业度故事，并以\n   业务影响开场。\n2. **员工敬业度趋势** — 五个主题加上近期员工敬业度宏观趋势\n   （使用 deep-research / web search 获取外部趋势；引用来源）。\n3. **基准对标** — 我们组织与具有代表性的 **~10,000-employee** 同业群体对比。\n   通过 **deep-research** agent 处理，确保每个外部数字都有引用。若\n   内部数字未知，插入 `[Add: our figure]` 占位符 — 绝不编造。\n4. **三项可执行策略** — 有意识地混合**短期与中长期（最长\n   2 years）**，并以**全组织**视角呈现。每项包含：目标、时间范围、负责人，以及\n   会推动的**组织指标**（敬业度、留存率、生产力、收入）。\n5. **关联到组织指标** — 明确说明对 CEO 关注的整体组织指标的收益。\n\n数字规则：文档中嵌入的任何总数、%、平均值或差异，都必须由 code 计算，\n不能由你手算。收件人、引用和统计数据必须真实或使用占位符，绝不编造。\n\n### 阶段 3 — SLT 落地执行汇报材料（pptx skill）\n\n调用 **pptx** skill。基于阶段 2 策略制作**高管层级的落地执行计划**\n（不是重新分析）。必备章节：\n\n- 标题 + 高管摘要幻灯片\n- 将三项策略呈现为执行路线图（短期 vs ≤2-year 泳道）\n- **HR ↔ Sales alignment**：HRBPs 如何与 Sales Leadership 合作\n- **Customized AI training for Sales** 使用销售专属场景，并映射到销售\n  周期（prospect → qualify → propose → close → expand）\n- **衡量**：Salesforce CRM + 现有 sales KPIs 作为衡量框架\n  （用户提供的数据或占位符）\n- **经济合理性**：面向所有员工采用 Copilot for M365 展示模型\n  结构（成本输入、生产力/收入杠杆、回收期），对任何未提供的数字使用 `[Add: figure]`\n  占位符。明确说明假设。\n- **HRBP as liaison** to Sales Leadership 协同推进转型\n- SLT 的下一步行动/决策请求\n\n### 阶段 4 — 一页信息图（公司品牌，使用 code 输出 PNG）\n\n使用 Python（matplotlib/PIL — session 中没有 image-generation\n工具，不要 `pip install`）生成单页 PNG 到 `output/`。\n\n**先解析公司品牌，按以下顺序 — 不要硬编码某一家公司的配色：**\n\n1. **用户提供的品牌资产** — 如果 `input/` 中有品牌指南、logo 或样式文件，\n   读取并从中提取 hex 颜色/logo。\n2. **组织模板库** — 检查 `@org-template-library`（租户的品牌化 Office\n   模板，通过 `GetOrgTemplateLibrary` / `GetDriveChildren(drive_id=\"@org-template-library\")`）。\n   从 `.potx`/`.dotx` 推导强调色，并在存在 logo 时复用。\n3. **简短询问** — 如果两者都没有颜色，请向用户询问品牌 hex 值（或\n   可取样的 logo）。提供一个中性专业默认方案（单一主色 + 深色中性色 +\n   浅灰），避免流程被阻塞，并标注为占位配色。\n\n一致应用解析出的品牌色（主色用于标题/强调，中性色用于正文，\n一个辅助色用于提示区块）。如果有 logo，将其放在页眉。除非颜色确实来自\n步骤 1–2 或由用户提供，否则不要声称这是某个特定品牌的颜色。\n\n内容：以**三项策略**为主干，清晰突出三个角色 —\n**HRBP**（编排者/联络人）、**Sales Leader**（赞助者）、**L&D**（基于\n已识别的 **sales champions** 使用 Copilot 构建培训）。强调销售角色带动新增\n收入。保持易读：标题、3 个策略区块、角色带、指标提示区块。\n\n### 阶段 5 — 视频脚本（docx skill，Copilot Create / Sora ready）\n\n调用 **docx** skill。受众：**SLT + Sales Leadership / CRO**。交付一份\n用户可直接粘贴到 **Copilot Create 或 Sora 2.0** 的脚本 — 按场景拆分，包含：场景\n编号、屏幕视觉方向、旁白/解说，以及大致时长。总时长保持紧凑（目标 60–120s）。需要覆盖的叙事节奏：\n\n- 识别**以进阶方式使用 Copilot** 在各销售阶段获胜的**顶尖销售人员**\n- 机会：将他们的模式转化为面向其他销售人员的**动态销售内容**\n- 内容**面向销售周期的各个部分**；**短小、按需触达**，并配套\n  **companion agents + pre-written prompts**\n- **Sales Copilot Champions** 作为同伴教练，帮助经验较少的用户\n- **HRBP as strategist** 与 Sales Managers 协作，通过 **OCM** 改善经理反馈/辅导方式，\n  支持销售人员实现 Copilot for Sales 卓越表现\n\n## 护栏\n\n- **调研数据门槛：** 在真实调研文件加载前，绝不生成主题、统计或引用。\n  如果文件缺失或不可读，请说明并要求重新上传。\n- **绝不编造：** 基准、ROI、KPIs、姓名、日期、引用。使用 `[Add: …]`\n  占位符，并通过 deep-research 加引用处理外部主张。\n- **数字由 code 计算：** 写入前先用 code tool 计算每个嵌入数字。\n- **不做绩效评估/不按受保护特征画像** — 拒绝并提供合规替代方案。\n- **交付门槛：** 每个文件阶段结束后，执行 `Glob output/**/*` 确认文件存在，\n  再告诉用户已准备好。\n- **一次运行、分阶段推进：** 如果用户一次要求全部内容，产出全部五项，但保持\n  依赖顺序（survey → themes → strategy → deck/infographic/script）。\n- **未来 plugin 路径：** 此技能设计为后续可通过 plugin builder 打包成 Cowork plugin\n  （例如增加实时 Salesforce connector 并分发给所有 HRBPs）。"},"sharepoint-finder":{"en":"---\nname: sharepoint-finder\ndescription: |\n  Searches SharePoint and OneDrive to find documents, files, and information.\n  Use when user asks \"find document\", \"search SharePoint\", \"where is the file\",\n  \"look for\", \"find the presentation\", or \"locate the spreadsheet\".\nlicense: MIT\nmetadata:\n  author: Ash Sisalem\n  version: \"1.0\"\n  plugin: document-intelligence\n  m365-services: [SharePoint, OneDrive, Graph, Search]\n---\n\n# SharePoint Finder\n\nSearch across SharePoint sites and OneDrive to locate files and information.\n\n## M365 Integration\n\n- **SharePoint:** Site content, document libraries, lists\n- **OneDrive:** Personal files and shared items\n- **Microsoft Search:** Unified search across M365\n- **Graph:** File metadata, sharing info, recent activity\n\n## What This Skill Does\n\nHelps find:\n- Documents by name, content, or topic\n- Files by type (presentations, spreadsheets, etc.)\n- Recent or frequently accessed files\n- Files shared with or by specific people\n- Content within specific sites or libraries\n\n## When to Use\n\n- Can't remember where a file is saved\n- Looking for documents on a topic\n- Finding files shared by someone\n- Locating the latest version of a document\n- Searching for templates or examples\n\n## Search Strategies\n\n1. **By Name:** Exact or partial filename\n2. **By Content:** Words or phrases inside documents\n3. **By Metadata:** Author, date, file type\n4. **By Location:** Specific site or library\n5. **By Activity:** Recently modified or shared\n\n## Output Format\n\n# Search Results\n\n## Query\n**Looking for:** {user's search intent}\n**Search terms:** {actual search query used}\n**Scope:** {All M365 / SharePoint / OneDrive / Specific site}\n\n---\n\n## 🎯 Best Matches\n\n### 1. {Document Title}\n| Property | Value |\n|----------|-------|\n| **Type** | {Word, Excel, PowerPoint, PDF, etc.} |\n| **Location** | {Site > Library > Folder} |\n| **Modified** | {date} by {person} |\n| **Size** | {size} |\n\n**Preview:** {First few lines of content or description}\n\n**Actions:** [Open]({link}) | [Share]({link}) | [Copy link]({link})\n\n---\n\n### 2. {Document Title}\n{Same structure}\n\n---\n\n### 3. {Document Title}\n{Same structure}\n\n---\n\n## 📁 Related Locations\n\nThese locations might have what you're looking for:\n\n| Site/Library | Description | Link |\n|--------------|-------------|------|\n| {Site name} | {what it contains} | [Open]({link}) |\n| {Library name} | {description} | [Open]({link}) |\n\n---\n\n## 🕐 Recent Activity\n\nFiles you or your team recently worked on matching this search:\n\n| File | Action | When | By |\n|------|--------|------|-------|\n| {file} | {Modified/Viewed/Shared} | {time} | {person} |\n\n---\n\n## 🔍 Search Tips\n\nIf these results aren't what you need, try:\n\n1. **More specific:** Add \"{suggested term}\"\n2. **By type:** \"filetype:pptx {topic}\"\n3. **By author:** \"author:{name}\"\n4. **By date:** \"modified:last week\"\n5. **In location:** Search within {suggested site}\n\n---\n\n## No Results?\n\nIf the file doesn't appear in search:\n- It may be in a private OneDrive (not shared with you)\n- It might be newly created (search indexes can lag)\n- Check if you have access to the site/library\n- Try alternative spellings or related terms\n\n---\n\n## Quick Actions\n\n- 🆕 **Create new document** in {suggested location}\n- 📤 **Request access** to {restricted location}\n- 👤 **Ask {person}** who might have this file","zh":"---\nname: sharepoint-finder\ndescription: |\n  搜尋 SharePoint 與 OneDrive 以尋找文件、檔案和資訊。\n  當使用者詢問「找文件」、「搜尋 SharePoint」、「檔案在哪裡」、「幫我找」、「找簡報」、「找到試算表」、\"find document\", \"search SharePoint\", \"where is the file\",\n  \"look for\", \"find the presentation\", or \"locate the spreadsheet\" 時使用。\nlicense: MIT\nmetadata:\n  author: Ash Sisalem\n  version: \"1.0\"\n  plugin: document-intelligence\n  m365-services: [SharePoint, OneDrive, Graph, Search]\n---\n\n# SharePoint 檔案搜尋\n跨 SharePoint 網站與 OneDrive 搜尋，以定位檔案和資訊。\n\n## M365 整合\n\n- **SharePoint:** 網站內容、文件庫、清單\n- **OneDrive:** 個人檔案與共用項目\n- **Microsoft Search:** 跨 M365 的整合搜尋\n- **Graph:** 檔案中繼資料、共用資訊、近期活動\n\n## 此 Skill 的功能\n\n協助尋找：\n- 依名稱、內容或主題尋找文件\n- 依類型尋找檔案（簡報、試算表等）\n- 最近或常用的檔案\n- 與特定人員共用或由其共用的檔案\n- 特定網站或文件庫內的內容\n\n## 使用時機\n\n- 想不起檔案儲存在哪裡\n- 尋找某個主題的文件\n- 尋找某人共用的檔案\n- 定位文件的最新版本\n- 搜尋範本或範例\n\n## 搜尋策略\n\n1. **依名稱：** 完整或部分檔名\n2. **依內容：** 文件內的字詞或片語\n3. **依中繼資料：** 作者、日期、檔案類型\n4. **依位置：** 特定網站或文件庫\n5. **依活動：** 最近修改或共用\n\n## 輸出格式\n\n# 搜尋結果\n\n## 查詢\n**尋找：** {user's search intent}\n**搜尋字詞：** {actual search query used}\n**範圍：** {All M365 / SharePoint / OneDrive / Specific site}\n\n---\n\n## 🎯 最佳符合項目\n\n### 1. {Document Title}\n| 屬性 | 值 |\n|----------|-------|\n| **類型** | {Word, Excel, PowerPoint, PDF, etc.} |\n| **位置** | {Site > Library > Folder} |\n| **修改時間** | {date}，由 {person} 修改 |\n| **大小** | {size} |\n\n**預覽：** {First few lines of content or description}\n\n**動作：** [開啟]({link}) | [共用]({link}) | [複製連結]({link})\n\n---\n\n### 2. {Document Title}\n{Same structure}\n\n---\n\n### 3. {Document Title}\n{Same structure}\n\n---\n\n## 📁 相關位置\n\n這些位置可能有你要找的內容：\n\n| 網站/文件庫 | 描述 | 連結 |\n|--------------|-------------|------|\n| {Site name} | {what it contains} | [開啟]({link}) |\n| {Library name} | {description} | [開啟]({link}) |\n\n---\n\n## 🕐 近期活動\n\n你或你的團隊最近處理過且符合此搜尋的檔案：\n\n| 檔案 | 動作 | 時間 | 人員 |\n|------|--------|------|-------|\n| {file} | {Modified/Viewed/Shared} | {time} | {person} |\n\n---\n\n## 🔍 搜尋提示\n\n如果這些結果不是你需要的，請嘗試：\n\n1. **更具體：** 加上 \"{suggested term}\"\n2. **依類型：** \"filetype:pptx {topic}\"\n3. **依作者：** \"author:{name}\"\n4. **依日期：** \"modified:last week\"\n5. **依位置：** 在 {suggested site} 內搜尋\n\n---\n\n## 沒有結果？\n\n如果檔案沒有出現在搜尋中：\n- 它可能在私人 OneDrive（未與你共用）\n- 它可能是新建立的（搜尋索引可能延遲）\n- 檢查你是否有該網站/文件庫的存取權\n- 嘗試其他拼字或相關詞\n\n---\n\n## 快速動作\n\n- 🆕 **建立新文件** 於 {suggested location}\n- 📤 **要求存取權** 至 {restricted location}\n- 👤 **詢問 {person}** 可能誰有這個檔案\n","cn":"---\nname: sharepoint-finder\ndescription: |\n  搜索 SharePoint 和 OneDrive，查找文档、文件和信息。\n  当用户询问“找文档”、“搜索 SharePoint”、“文件在哪里”、“帮我找”、“找演示文稿”、“定位电子表格”、\"find document\", \"search SharePoint\", \"where is the file\",\n  \"look for\", \"find the presentation\", or \"locate the spreadsheet\" 时使用。\nlicense: MIT\nmetadata:\n  author: Ash Sisalem\n  version: \"1.0\"\n  plugin: document-intelligence\n  m365-services: [SharePoint, OneDrive, Graph, Search]\n---\n\n# SharePoint 文件搜索\n跨 SharePoint 站点和 OneDrive 搜索，以定位文件和信息。\n\n## M365 集成\n\n- **SharePoint:** 站点内容、文档库、列表\n- **OneDrive:** 个人文件和共享项目\n- **Microsoft Search:** 跨 M365 的统一搜索\n- **Graph:** 文件元数据、共享信息、近期活动\n\n## 此 Skill 的功能\n\n帮助查找：\n- 按名称、内容或主题查找文档\n- 按类型查找文件（演示文稿、电子表格等）\n- 最近或经常访问的文件\n- 与特定人员共享或由特定人员共享的文件\n- 特定站点或文档库中的内容\n\n## 适用场景\n\n- 记不起文件保存在哪里\n- 查找某个主题的文档\n- 查找某人共享的文件\n- 定位文档的最新版本\n- 搜索模板或示例\n\n## 搜索策略\n\n1. **按名称：** 精确或部分文件名\n2. **按内容：** 文档内的词语或短语\n3. **按元数据：** 作者、日期、文件类型\n4. **按位置：** 特定站点或文档库\n5. **按活动：** 最近修改或共享\n\n## 输出格式\n\n# 搜索结果\n\n## 查询\n**查找内容：** {user's search intent}\n**搜索词：** {actual search query used}\n**范围：** {All M365 / SharePoint / OneDrive / Specific site}\n\n---\n\n## 🎯 最佳匹配\n\n### 1. {Document Title}\n| 属性 | 值 |\n|----------|-------|\n| **类型** | {Word, Excel, PowerPoint, PDF, etc.} |\n| **位置** | {Site > Library > Folder} |\n| **修改时间** | {date}，由 {person} 修改 |\n| **大小** | {size} |\n\n**预览：** {First few lines of content or description}\n\n**操作：** [打开]({link}) | [共享]({link}) | [复制链接]({link})\n\n---\n\n### 2. {Document Title}\n{Same structure}\n\n---\n\n### 3. {Document Title}\n{Same structure}\n\n---\n\n## 📁 相关位置\n\n这些位置可能包含你要找的内容：\n\n| 站点/文档库 | 描述 | 链接 |\n|--------------|-------------|------|\n| {Site name} | {what it contains} | [打开]({link}) |\n| {Library name} | {description} | [打开]({link}) |\n\n---\n\n## 🕐 近期活动\n\n你或你的团队最近处理过且匹配此搜索的文件：\n\n| 文件 | 操作 | 时间 | 人员 |\n|------|--------|------|-------|\n| {file} | {Modified/Viewed/Shared} | {time} | {person} |\n\n---\n\n## 🔍 搜索提示\n\n如果这些结果不是你需要的，可以尝试：\n\n1. **更具体：** 添加 \"{suggested term}\"\n2. **按类型：** \"filetype:pptx {topic}\"\n3. **按作者：** \"author:{name}\"\n4. **按日期：** \"modified:last week\"\n5. **按位置：** 在 {suggested site} 中搜索\n\n---\n\n## 没有结果？\n\n如果文件没有出现在搜索结果中：\n- 它可能在私人 OneDrive 中（未与你共享）\n- 它可能是新创建的（搜索索引可能有延迟）\n- 检查你是否有该站点/文档库的访问权限\n- 尝试其他拼写或相关词\n\n---\n\n## 快速操作\n\n- 🆕 **新建文档** 于 {suggested location}\n- 📤 **请求访问权限** 至 {restricted location}\n- 👤 **询问 {person}** 可能谁有这个文件\n"},"file-organizer":{"en":"---\nname: file-organizer\ndescription: |\n  Suggests organization and cleanup for OneDrive and SharePoint files.\n  Use when user asks \"organize my files\", \"clean up OneDrive\", \"file structure\",\n  \"folder organization\", \"declutter files\", or \"organize documents\".\nlicense: MIT\nmetadata:\n  author: Cowork Library\n  version: \"1.0\"\n  plugin: document-intelligence\n  m365-services: [OneDrive, SharePoint, Graph]\n---\n\n# File Organizer\n\nAnalyze and suggest organization for your M365 files.\n\n## M365 Integration\n\n- **OneDrive:** Personal file analysis\n- **SharePoint:** Library organization\n- **Microsoft Graph:** File metadata, activity\n\n## What This Skill Does\n\nProvides:\n- Current state analysis\n- Duplicate file detection\n- Old/stale file identification\n- Folder structure recommendations\n- Naming convention suggestions\n- Cleanup action plan\n\n## When to Use\n\n- OneDrive is cluttered and hard to navigate\n- Starting fresh organization\n- Annual file cleanup\n- Before migrating files\n- Setting up new project structure\n\n## Output Format\n\n# File Organization Report\n\n## Current State Analysis\n\n### Location: {OneDrive or SharePoint site}\n\n| Metric | Value |\n|--------|-------|\n| **Total Files** | {count} |\n| **Total Size** | {GB} |\n| **Folders** | {count} |\n| **Max Folder Depth** | {levels} |\n| **Files in Root** | {count} ⚠️ {if high} |\n\n---\n\n## 📊 File Distribution\n\n### By Type\n| Type | Count | Size | % of Total |\n|------|-------|------|------------|\n| Documents (.docx, .pdf) | {n} | {size} | {%} |\n| Spreadsheets (.xlsx) | {n} | {size} | {%} |\n| Presentations (.pptx) | {n} | {size} | {%} |\n| Images | {n} | {size} | {%} |\n| Other | {n} | {size} | {%} |\n\n### By Age\n| Age | Count | Recommendation |\n|-----|-------|----------------|\n| < 30 days | {n} | Active - keep organized |\n| 30-90 days | {n} | Review for relevance |\n| 90-365 days | {n} | Archive candidates |\n| > 1 year | {n} | Archive or delete |\n\n### By Size (Largest Files)\n| File | Size | Location | Last Accessed |\n|------|------|----------|---------------|\n| {filename} | {size} | {path} | {date} |\n| {filename} | {size} | {path} | {date} |\n| {filename} | {size} | {path} | {date} |\n","zh":"---\nname: file-organizer\ndescription: |\n  建議 OneDrive 與 SharePoint 檔案的整理與清理方式。\n  當使用者要求「整理我的檔案」、「清理 OneDrive」、「檔案結構」、\n  「資料夾整理」、「整理雜亂檔案」、「整理文件」、\"organize my files\", \"clean up OneDrive\", \"file structure\",\n  \"folder organization\", \"declutter files\", or \"organize documents\" 時使用。\nlicense: MIT\nmetadata:\n  author: Cowork Library\n  version: \"1.0\"\n  plugin: document-intelligence\n  m365-services: [OneDrive, SharePoint, Graph]\n---\n\n# 檔案整理建議\n分析並建議如何整理您的 M365 檔案。\n\n## M365 整合\n\n- **OneDrive:** 個人檔案分析\n- **SharePoint:** 文件庫整理\n- **Microsoft Graph:** 檔案中繼資料、活動\n\n## 此技能的功能\n\n提供：\n- 目前狀態分析\n- 重複檔案偵測\n- 舊檔/停用檔案識別\n- 資料夾結構建議\n- 命名慣例建議\n- 清理行動計畫\n\n## 適用情境\n\n- OneDrive 雜亂且難以瀏覽\n- 從頭開始整理\n- 年度檔案清理\n- 移轉檔案之前\n- 設定新的專案結構\n\n## 輸出格式\n\n# 檔案整理報告\n\n## 目前狀態分析\n\n### 位置：{OneDrive or SharePoint site}\n\n| 指標 | 值 |\n|--------|-------|\n| **檔案總數** | {count} |\n| **總大小** | {GB} |\n| **資料夾** | {count} |\n| **最大資料夾深度** | {levels} |\n| **根目錄中的檔案** | {count} ⚠️ {if high} |\n\n---\n\n## 📊 檔案分布\n\n### 依類型\n| 類型 | 數量 | 大小 | 佔總量百分比 |\n|------|-------|------|------------|\n| 文件（.docx, .pdf） | {n} | {size} | {%} |\n| 試算表（.xlsx） | {n} | {size} | {%} |\n| 簡報（.pptx） | {n} | {size} | {%} |\n| 圖片 | {n} | {size} | {%} |\n| 其他 | {n} | {size} | {%} |\n\n### 依時間\n| 時間 | 數量 | 建議 |\n|-----|-------|----------------|\n| < 30 days | {n} | 使用中 - 保持整理 |\n| 30-90 days | {n} | 檢閱相關性 |\n| 90-365 days | {n} | 封存候選項目 |\n| > 1 year | {n} | 封存或刪除 |\n\n### 依大小（最大檔案）\n| 檔案 | 大小 | 位置 | 上次存取 |\n|------|------|----------|---------------|\n| {filename} | {size} | {path} | {date} |\n| {filename} | {size} | {path} | {date} |\n| {filename} | {size} | {path} | {date} |\n","cn":"---\nname: file-organizer\ndescription: |\n  为 OneDrive 和 SharePoint 文件提供整理与清理建议。\n  当用户提出“整理我的文件”、“清理 OneDrive”、“文件结构”、\n  “文件夹整理”、“清理杂乱文件”、“整理文档”、\"organize my files\", \"clean up OneDrive\", \"file structure\",\n  \"folder organization\", \"declutter files\", or \"organize documents\" 时使用。\nlicense: MIT\nmetadata:\n  author: Cowork Library\n  version: \"1.0\"\n  plugin: document-intelligence\n  m365-services: [OneDrive, SharePoint, Graph]\n---\n\n# 文件整理建议\n分析你的 M365 文件，并给出整理建议。\n\n## M365 集成\n\n- **OneDrive:** 个人文件分析\n- **SharePoint:** 文档库整理\n- **Microsoft Graph:** 文件元数据、活动\n\n## 此技能的作用\n\n提供：\n- 当前状态分析\n- 重复文件检测\n- 旧文件/长期未用文件识别\n- 文件夹结构建议\n- 命名规范建议\n- 清理行动计划\n\n## 适用场景\n\n- OneDrive 杂乱，难以浏览\n- 从零开始整理\n- 年度文件清理\n- 文件迁移前\n- 设置新的项目结构\n\n## 输出格式\n\n# 文件整理报告\n\n## 当前状态分析\n\n### 位置：{OneDrive or SharePoint site}\n\n| 指标 | 值 |\n|--------|-------|\n| **文件总数** | {count} |\n| **总大小** | {GB} |\n| **文件夹** | {count} |\n| **最大文件夹深度** | {levels} |\n| **根目录中的文件** | {count} ⚠️ {if high} |\n\n---\n\n## 📊 文件分布\n\n### 按类型\n| 类型 | 数量 | 大小 | 占总量百分比 |\n|------|-------|------|------------|\n| 文档（.docx, .pdf） | {n} | {size} | {%} |\n| 电子表格（.xlsx） | {n} | {size} | {%} |\n| 演示文稿（.pptx） | {n} | {size} | {%} |\n| 图片 | {n} | {size} | {%} |\n| 其他 | {n} | {size} | {%} |\n\n### 按时间\n| 时间 | 数量 | 建议 |\n|-----|-------|----------------|\n| < 30 days | {n} | 活跃 - 保持有序 |\n| 30-90 days | {n} | 复核相关性 |\n| 90-365 days | {n} | 可归档候选项 |\n| > 1 year | {n} | 归档或删除 |\n\n### 按大小（最大文件）\n| 文件 | 大小 | 位置 | 上次访问 |\n|------|------|----------|---------------|\n| {filename} | {size} | {path} | {date} |\n| {filename} | {size} | {path} | {date} |\n| {filename} | {size} | {path} | {date} |\n"},"permissions-audit":{"en":"---\nname: permissions-audit\ndescription: |\n  Reviews sharing and permissions for files and SharePoint sites.\n  Use when user asks \"who has access\", \"check permissions\", \"sharing audit\",\n  \"who can see this file\", \"review access\", or \"permissions report\".\nlicense: MIT\nmetadata:\n  author: Cowork Library\n  version: \"1.0\"\n  plugin: document-intelligence\n  m365-services: [SharePoint, OneDrive, Graph, Entra ID]\n---\n\n# Permissions Audit\n\nReview and report on file and site sharing permissions.\n\n## M365 Integration\n\n- **SharePoint:** Site permissions, library settings\n- **OneDrive:** Personal sharing settings\n- **Microsoft Graph:** Sharing links, access details\n- **Entra ID:** Group memberships, guest users\n\n## What This Skill Does\n\nAnalyzes and reports:\n- Who has access to files/folders/sites\n- Types of access (view, edit, owner)\n- External sharing status\n- Sharing links (anonymous, org-wide)\n- Permission inheritance\n- Potential security concerns\n\n## When to Use\n\n- Before sharing sensitive documents\n- Regular security reviews\n- Offboarding employees\n- Compliance audits\n- Investigating unexpected access\n\n## Output Format\n\n# Permissions Audit Report\n\n## Audit Target\n\n| Property | Value |\n|----------|-------|\n| **Item** | {file/folder/site name} |\n| **Type** | {File/Folder/Document Library/Site} |\n| **Location** | {path} |\n| **Owner** | {name} |\n| **Created** | {date} |\n| **Last Modified** | {date} |\n\n---\n\n## Access Summary\n\n| Access Type | Count |\n|-------------|-------|\n| Owners | {n} |\n| Editors | {n} |\n| Viewers | {n} |\n| External Users | {n} |\n| Sharing Links | {n} |\n\n**Overall Risk Level:** {🟢 Low / 🟡 Medium / 🔴 High}\n\n---\n\n## Direct Access\n\n### Owners (Full Control)\n| User/Group | Type | Source |\n|------------|------|--------|\n| {name} | {User/Group} | {Direct/Inherited} |\n\n### Editors (Can Edit)\n| User/Group | Type | Source |\n|------------|------|--------|\n| {name} | {User/Group} | {Direct/Inherited} |\n\n### Viewers (Can View)\n| User/Group | Type | Source |\n|------------|------|--------|\n| {name} | {User/Group} | {Direct/Inherited} |\n\n---\n\n## 🔗 Sharing Links\n\n| Link Type | Scope | Created By | Expiration |\n|-----------|-------|------------|------------|\n| {Anyone/Organization/Specific people} | {View/Edit} | {name} | {date or Never} |\n\n### ⚠️ Anonymous Links\n{List of \"Anyone with the link\" shares - security concern}\n\n---\n\n## 👥 External Sharing\n\n### Guest Users\n| Email | Access Level | Invited By | Date |\n|-------|--------------|------------|------|\n| {email} | {level} | {name} | {date} |\n\n### External Domains\n| Domain | Users | Risk |\n|--------|-------|------|\n| {domain.com} | {n} | {assessment} |\n\n---\n\n## 🏢 Group Access\n\n| Group | Members | Access Level |\n|-------|---------|--------------|\n| {group name} | {n} members | {level} |\n\n**Notable group memberships:**\n- {Group} includes {notable members}\n\n---\n\n## 📊 Permission Inheritance\n\n```\n{Site/Library}\n├── 📁 {Folder 1} - Inherits\n│   └── 📄 {File} - Inherits\n├── 📁 {Folder 2} - ⚠️ Unique permissions\n│   └── 📄 {File} - Inherits from folder\n└── 📄 {File} - ⚠️ Unique permissions\n```\n\n---\n\n## ⚠️ Security Concerns\n\n### High Priority\n- 🔴 {Concern - e.g., \"Anonymous link to sensitive file\"}\n- 🔴 {Concern}\n\n### Medium Priority\n- 🟡 {Concern - e.g., \"External user with edit access\"}\n- 🟡 {Concern}\n\n### Recommendations\n1. **{Action}** - {reason}\n2. **{Action}** - {reason}\n3. **{Action}** - {reason}\n\n---\n\n## Recent Permission Changes\n\n| Date | Change | Made By |\n|------|--------|---------|\n| {date} | {what changed} | {who} |\n\n---\n\n## Compliance Notes\n\n- **External sharing:** {Enabled/Disabled} at site level\n- **Guest access policy:** {policy status}\n- **Sensitivity label:** {if applied}\n- **Retention policy:** {if applied}\n\n---\n\n## Quick Actions\n\n- 🔒 **Remove external access** to {items}\n- ⏱️ **Set expiration** on sharing links\n- 👤 **Remove** {user} access\n- 📧 **Notify owner** about {concern}","zh":"---\nname: permissions-audit\ndescription: |\n  審閱檔案與 SharePoint 網站的分享與權限。\n  當使用者要求「誰有存取權」、「檢查權限」、「分享稽核」、「誰可以看到這個檔案」、「審閱存取權」、「權限報告」、\"who has access\", \"check permissions\", \"sharing audit\",\n  \"who can see this file\", \"review access\", 或 \"permissions report\" 時使用。\nlicense: MIT\nmetadata:\n  author: Cowork Library\n  version: \"1.0\"\n  plugin: document-intelligence\n  m365-services: [SharePoint, OneDrive, Graph, Entra ID]\n---\n\n# 權限稽核\n\n審閱並回報檔案與網站的分享權限。\n\n## M365 整合\n\n- **SharePoint:** 網站權限、文件庫設定\n- **OneDrive:** 個人分享設定\n- **Microsoft Graph:** 分享連結、存取詳細資料\n- **Entra ID:** 群組成員資格、來賓使用者\n\n## 此技能的用途\n\n分析並回報：\n- 誰有檔案/資料夾/網站的存取權\n- 存取類型（檢視、編輯、擁有者）\n- 外部分享狀態\n- 分享連結（匿名、全組織）\n- 權限繼承\n- 潛在安全疑慮\n\n## 使用時機\n\n- 分享敏感文件前\n- 定期安全性審閱\n- 員工離職移交流程\n- 合規稽核\n- 調查非預期存取\n\n## 輸出格式\n\n# 權限稽核報告\n\n## 稽核目標\n\n| 屬性 | 值 |\n|----------|-------|\n| **項目** | {file/folder/site name} |\n| **類型** | {File/Folder/Document Library/Site} |\n| **位置** | {path} |\n| **擁有者** | {name} |\n| **建立日期** | {date} |\n| **上次修改** | {date} |\n\n---\n\n## 存取摘要\n\n| 存取類型 | 數量 |\n|-------------|-------|\n| 擁有者 | {n} |\n| 編輯者 | {n} |\n| 檢視者 | {n} |\n| 外部使用者 | {n} |\n| 分享連結 | {n} |\n\n**整體風險等級：** {🟢 Low / 🟡 Medium / 🔴 High}\n\n---\n\n## 直接存取\n\n### 擁有者（完全控制）\n| 使用者/群組 | 類型 | 來源 |\n|------------|------|--------|\n| {name} | {User/Group} | {Direct/Inherited} |\n\n### 編輯者（可編輯）\n| 使用者/群組 | 類型 | 來源 |\n|------------|------|--------|\n| {name} | {User/Group} | {Direct/Inherited} |\n\n### 檢視者（可檢視）\n| 使用者/群組 | 類型 | 來源 |\n|------------|------|--------|\n| {name} | {User/Group} | {Direct/Inherited} |\n\n---\n\n## 🔗 分享連結\n\n| 連結類型 | 範圍 | 建立者 | 到期日 |\n|-----------|-------|------------|------------|\n| {Anyone/Organization/Specific people} | {View/Edit} | {name} | {date or Never} |\n\n### ⚠️ 匿名連結\n{List of \"Anyone with the link\" shares - security concern}\n\n---\n\n## 👥 外部分享\n\n### 來賓使用者\n| 電子郵件 | 存取層級 | 邀請者 | 日期 |\n|-------|--------------|------------|------|\n| {email} | {level} | {name} | {date} |\n\n### 外部網域\n| 網域 | 使用者 | 風險 |\n|--------|-------|------|\n| {domain.com} | {n} | {assessment} |\n\n---\n\n## 🏢 群組存取\n\n| 群組 | 成員 | 存取層級 |\n|-------|---------|--------------|\n| {group name} | {n} 位成員 | {level} |\n\n**值得注意的群組成員資格：**\n- {Group} 包含 {notable members}\n\n---\n\n## 📊 權限繼承\n\n```\n{Site/Library}\n├── 📁 {Folde
