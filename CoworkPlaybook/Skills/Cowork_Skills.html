r 1} - 繼承\n│   └── 📄 {File} - 繼承\n├── 📁 {Folder 2} - ⚠️ 唯一權限\n│   └── 📄 {File} - 繼承自資料夾\n└── 📄 {File} - ⚠️ 唯一權限\n```\n\n---\n\n## ⚠️ 安全疑慮\n\n### 高優先順序\n- 🔴 {Concern - e.g., \"Anonymous link to sensitive file\"}\n- 🔴 {Concern}\n\n### 中優先順序\n- 🟡 {Concern - e.g., \"External user with edit access\"}\n- 🟡 {Concern}\n\n### 建議\n1. **{Action}** - {reason}\n2. **{Action}** - {reason}\n3. **{Action}** - {reason}\n\n---\n\n## 最近權限變更\n\n| 日期 | 變更 | 執行者 |\n|------|--------|---------|\n| {date} | {what changed} | {who} |\n\n---\n\n## 合規備註\n\n- **外部分享：** {Enabled/Disabled} at site level\n- **來賓存取原則：** {policy status}\n- **敏感度標籤：** {if applied}\n- **保留原則：** {if applied}\n\n---\n\n## 快速動作\n\n- 🔒 **移除** {items} 的外部存取權\n- ⏱️ **為分享連結設定到期日**\n- 👤 **移除** {user} 的存取權\n- 📧 **通知擁有者** 關於 {concern}\n","cn":"---\nname: permissions-audit\ndescription: |\n  审查文件和 SharePoint 站点的共享与权限。\n  当用户提出“谁有访问权限”、“检查权限”、“共享审计”、“谁能看到这个文件”、“审查访问权限”、“权限报告”、\"who has access\", \"check permissions\", \"sharing audit\",\n  \"who can see this file\", \"review access\", 或 \"permissions report\" 时使用。\nlicense: MIT\nmetadata:\n  author: Cowork Library\n  version: \"1.0\"\n  plugin: document-intelligence\n  m365-services: [SharePoint, OneDrive, Graph, Entra ID]\n---\n\n# 权限审计\n\n审查并报告文件和站点的共享权限。\n\n## M365 集成\n\n- **SharePoint:** 站点权限、库设置\n- **OneDrive:** 个人共享设置\n- **Microsoft Graph:** 共享链接、访问详情\n- **Entra ID:** 组成员身份、来宾用户\n\n## 此技能的作用\n\n分析并报告：\n- 谁有文件/文件夹/站点的访问权限\n- 访问类型（查看、编辑、所有者）\n- 外部共享状态\n- 共享链接（匿名、整个组织）\n- 权限继承\n- 潜在安全问题\n\n## 使用场景\n\n- 共享敏感文档前\n- 定期安全审查\n- 员工离职交接\n- 合规审计\n- 调查异常访问\n\n## 输出格式\n\n# 权限审计报告\n\n## 审计目标\n\n| 属性 | 值 |\n|----------|-------|\n| **项目** | {file/folder/site name} |\n| **类型** | {File/Folder/Document Library/Site} |\n| **位置** | {path} |\n| **所有者** | {name} |\n| **创建时间** | {date} |\n| **上次修改** | {date} |\n\n---\n\n## 访问摘要\n\n| 访问类型 | 数量 |\n|-------------|-------|\n| 所有者 | {n} |\n| 编辑者 | {n} |\n| 查看者 | {n} |\n| 外部用户 | {n} |\n| 共享链接 | {n} |\n\n**整体风险等级：** {🟢 Low / 🟡 Medium / 🔴 High}\n\n---\n\n## 直接访问\n\n### 所有者（完全控制）\n| 用户/组 | 类型 | 来源 |\n|------------|------|--------|\n| {name} | {User/Group} | {Direct/Inherited} |\n\n### 编辑者（可编辑）\n| 用户/组 | 类型 | 来源 |\n|------------|------|--------|\n| {name} | {User/Group} | {Direct/Inherited} |\n\n### 查看者（可查看）\n| 用户/组 | 类型 | 来源 |\n|------------|------|--------|\n| {name} | {User/Group} | {Direct/Inherited} |\n\n---\n\n## 🔗 共享链接\n\n| 链接类型 | 范围 | 创建者 | 到期时间 |\n|-----------|-------|------------|------------|\n| {Anyone/Organization/Specific people} | {View/Edit} | {name} | {date or Never} |\n\n### ⚠️ 匿名链接\n{List of \"Anyone with the link\" shares - security concern}\n\n---\n\n## 👥 外部共享\n\n### 来宾用户\n| 邮件 | 访问级别 | 邀请者 | 日期 |\n|-------|--------------|------------|------|\n| {email} | {level} | {name} | {date} |\n\n### 外部域\n| 域 | 用户数 | 风险 |\n|--------|-------|------|\n| {domain.com} | {n} | {assessment} |\n\n---\n\n## 🏢 组访问\n\n| 组 | 成员 | 访问级别 |\n|-------|---------|--------------|\n| {group name} | {n} 名成员 | {level} |\n\n**值得注意的组成员身份：**\n- {Group} 包含 {notable members}\n\n---\n\n## 📊 权限继承\n\n```\n{Site/Library}\n├── 📁 {Folder 1} - 继承\n│   └── 📄 {File} - 继承\n├── 📁 {Folder 2} - ⚠️ 唯一权限\n│   └── 📄 {File} - 从文件夹继承\n└── 📄 {File} - ⚠️ 唯一权限\n```\n\n---\n\n## ⚠️ 安全问题\n\n### 高优先级\n- 🔴 {Concern - e.g., \"Anonymous link to sensitive file\"}\n- 🔴 {Concern}\n\n### 中优先级\n- 🟡 {Concern - e.g., \"External user with edit access\"}\n- 🟡 {Concern}\n\n### 建议\n1. **{Action}** - {reason}\n2. **{Action}** - {reason}\n3. **{Action}** - {reason}\n\n---\n\n## 最近权限变更\n\n| 日期 | 变更 | 操作者 |\n|------|--------|---------|\n| {date} | {what changed} | {who} |\n\n---\n\n## 合规备注\n\n- **外部共享：** {Enabled/Disabled} at site level\n- **来宾访问策略：** {policy status}\n- **敏感度标签：** {if applied}\n- **保留策略：** {if applied}\n\n---\n\n## 快速操作\n\n- 🔒 **移除** {items} 的外部访问权限\n- ⏱️ **为共享链接设置到期时间**\n- 👤 **移除** {user} 的访问权限\n- 📧 **通知所有者** 关于 {concern}\n"},"snow-incident-rca":{"en":"---\nname: snow-incident-rca\ndescription: |\n  Generates Root Cause Analysis reports from ServiceNow incident data.\n  Use when user asks \"generate RCA\", \"root cause analysis\", \"analyze this incident\",\n  \"RCA report\", \"incident postmortem\", \"5 whys analysis\", or \"what caused this incident\".\n  User provides incident data by pasting, attaching export, or describing the incident.\nlicense: MIT\nmetadata:\n  author: Ash Sisalem\n  version: \"1.0\"\n  requires-connector: false\n---\n\n# ServiceNow Incident RCA Generator\n\nGenerate comprehensive Root Cause Analysis reports from ServiceNow incident data - no server deployment required.\n\n## How This Works\n\n1. User provides incident data (paste, attach, or describe)\n2. Skill analyzes the data\n3. Generates formatted RCA report with CMDB references\n\n## No Server Required\n\nThis skill works with data you provide directly:\n- Paste incident details from ServiceNow\n- Attach exported CSV/Excel\n- Copy from ServiceNow form\n- Describe the incident verbally\n\n## When to Use\n\n- Post-incident reviews\n- Major incident analysis\n- Problem management\n- Compliance documentation\n- Service improvement\n\n## How to Provide Data\n\n### Option 1: Paste Incident Fields\nCopy these fields from ServiceNow:\n- Incident Number\n- Short Description\n- Description\n- Priority / Impact / Urgency\n- State\n- Opened / Resolved dates\n- Assignment Group / Assigned To\n- Configuration Item (CI)\n- Resolution Notes\n- Work Notes (key entries)\n\n### Option 2: Attach Export\nExport from ServiceNow as CSV or Excel and attach the file.\n\n### Option 3: Describe the Incident\nTell me:\n- What happened?\n- When did it start/end?\n- What was affected?\n- How was it resolved?\n- What systems/CIs were involved?\n\n## Workflow\n\n1. **Parse Incident Data**\n   - Extract key fields\n   - Identify affected CI\n   - Note timeline\n\n2. **Structure Analysis**\n   - Impact assessment\n   - Timeline reconstruction\n   - CI relationship mapping\n\n3. **Generate RCA**\n   - 5 Whys framework\n   - Contributing factors\n   - Recommendations\n\n4. **Output Report**\n   - Formatted markdown\n   - Ready for documentation\n\n## Output Format\n\n# Root Cause Analysis Report\n\n## Incident Overview\n\n| Field | Value |\n|-------|-------|\n| **Incident Number** | {from provided data} |\n| **Short Description** | {from provided data} |\n| **Priority** | {P1/P2/P3/P4/P5} |\n| **Impact** | {1-High/2-Medium/3-Low} |\n| **Urgency** | {1-High/2-Medium/3-Low} |\n| **State** | {New/In Progress/Resolved/Closed} |\n| **Opened** | {date/time} |\n| **Resolved** | {date/time} |\n| **Duration** | {calculated} |\n| **Assignment Group** | {group name} |\n| **Assigned To** | {person} |\n| **Caller/Affected User** | {user} |\n\n---\n\n## Impact Summary\n\n### Business Impact\n- **Users Affected:** {number or scope}\n- **Services Affected:** {list services}\n- **Business Processes Impacted:** {processes}\n- **Financial Impact:** {if known}\n\n### Technical Impact\n- **Systems Affected:** {list}\n- **Data Impact:** {none/read-only/data loss}\n- **Integration Impact:** {downstream effects}\n\n---\n\n## Configuration Item (Affected CI)\n\n| Attribute | Value |\n|-----------|-------|\n| **CI Name** | {from data or ask user} |\n| **CI Class** | {Server/Application/Database/Network/Service} |\n| **Environment** | {Production/Staging/Dev} |\n| **Business Service** | {service name} |\n| **Support Group** | {owning team} |\n\n### CMDB Relationships\nIf user provides CI relationships:\n\n**Upstream (This CI depends on):**\n- {Parent CI 1}\n- {Parent CI 2}\n\n**Downstream (Depends on this CI):**\n- {Child CI 1}\n- {Child CI 2}\n\n---\n\n## Timeline\n\n| Time | Event | Source |\n|------|-------|--------|\n| {time} | First symptom/alert | {monitoring/user report} |\n| {time} | Incident created | ServiceNow |\n| {time} | Team engaged | Assignment |\n| {time} | Root cause identified | Investigation |\n| {time} | Fix applied | Work notes |\n| {time} | Service restored | Verification |\n| {time} | Incident resolved | ServiceNow |\n\n---\n\n## Root Ca
