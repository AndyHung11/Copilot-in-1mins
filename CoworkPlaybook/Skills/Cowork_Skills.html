\"Create root cause analysis - incident INC0010001, server crashed due to memory leak, affected 500 users for 2 hours\"\n\n\"Analyze this incident and create RCA report [attach CSV export]\"\n\n\"5 whys analysis for a database outage that happened yesterday\"\n","cn":"---\nname: snow-incident-rca\ndescription: |\n  根据 ServiceNow 事件数据生成 Root Cause Analysis 报告。\n  当用户提出“生成 RCA”、“根因分析”、“分析这个事件”、\n  “RCA 报告”、“事件复盘”、“5 whys 分析”、“这个事件是什么原因导致的”、\"generate RCA\", \"root cause analysis\", \"analyze this incident\",\n  \"RCA report\", \"incident postmortem\", \"5 whys analysis\", or \"what caused this incident\" 时使用。\n  用户可通过粘贴、附加导出文件，或描述事件来提供事件数据。\nlicense: MIT\nmetadata:\n  author: Ash Sisalem\n  version: \"1.0\"\n  requires-connector: false\n---\n\n# ServiceNow 事件 RCA 生成器\n\n根据 ServiceNow 事件数据生成完整的 Root Cause Analysis 报告 - 无需部署服务器。\n\n## 工作方式\n\n1. 用户提供事件数据（粘贴、附加或描述）\n2. 技能分析数据\n3. 生成带 CMDB 引用的格式化 RCA 报告\n\n## 无需服务器\n\n此技能使用你直接提供的数据：\n- 从 ServiceNow 粘贴事件详情\n- 附加导出的 CSV/Excel\n- 从 ServiceNow 表单复制\n- 口头描述事件\n\n## 适用场景\n\n- 事件后复盘\n- 重大事件分析\n- 问题管理\n- 合规文档\n- 服务改进\n\n## 如何提供数据\n\n### 选项 1：粘贴事件字段\n从 ServiceNow 复制这些字段：\n- Incident Number\n- Short Description\n- Description\n- Priority / Impact / Urgency\n- State\n- Opened / Resolved dates\n- Assignment Group / Assigned To\n- Configuration Item (CI)\n- Resolution Notes\n- Work Notes（关键条目）\n\n### 选项 2：附加导出文件\n从 ServiceNow 导出为 CSV 或 Excel，并附加该文件。\n\n### 选项 3：描述事件\n告诉我：\n- 发生了什么？\n- 什么时候开始/结束？\n- 影响了什么？\n- 如何解决的？\n- 涉及哪些系统/CI？\n\n## 工作流\n\n1. **解析事件数据**\n   - 提取关键字段\n   - 识别受影响的 CI\n   - 记录时间线\n\n2. **结构化分析**\n   - 影响评估\n   - 时间线还原\n   - CI 关系映射\n\n3. **生成 RCA**\n   - 5 Whys 框架\n   - 促成因素\n   - 建议\n\n4. **输出报告**\n   - 格式化 markdown\n   - 可直接用于文档归档\n\n## 输出格式\n\n# Root Cause Analysis 报告\n\n## 事件概览\n\n| 字段 | 值 |\n|-------|-------|\n| **Incident Number** | {from provided data} |\n| **Short Description** | {from provided data} |\n| **Priority** | {P1/P2/P3/P4/P5} |\n| **Impact** | {1-High/2-Medium/3-Low} |\n| **Urgency** | {1-High/2-Medium/3-Low} |\n| **State** | {New/In Progress/Resolved/Closed} |\n| **Opened** | {date/time} |\n| **Resolved** | {date/time} |\n| **Duration** | {calculated} |\n| **Assignment Group** | {group name} |\n| **Assigned To** | {person} |\n| **Caller/Affected User** | {user} |\n\n---\n\n## 影响摘要\n\n### 业务影响\n- **受影响用户：** {number or scope}\n- **受影响服务：** {list services}\n- **受影响业务流程：** {processes}\n- **财务影响：** {if known}\n\n### 技术影响\n- **受影响系统：** {list}\n- **数据影响：** {none/read-only/data loss}\n- **集成影响：** {downstream effects}\n\n---\n\n## Configuration Item（受影响 CI）\n\n| 属性 | 值 |\n|-----------|-------|\n| **CI Name** | {from data or ask user} |\n| **CI Class** | {Server/Application/Database/Network/Service} |\n| **Environment** | {Production/Staging/Dev} |\n| **Business Service** | {service name} |\n| **Support Group** | {owning team} |\n\n### CMDB 关系\n如果用户提供 CI 关系：\n\n**上游（此 CI 依赖）：**\n- {Parent CI 1}\n- {Parent CI 2}\n\n**下游（依赖此 CI）：**\n- {Child CI 1}\n- {Child CI 2}\n\n---\n\n## 时间线\n\n| 时间 | 事件 | 来源 |\n|------|-------|--------|\n| {time} | 首个症状/告警 | {monitoring/user report} |\n| {time} | 事件创建 | ServiceNow |\n| {time} | 团队介入 | Assignment |\n| {time} | 识别根因 | Investigation |\n| {time} | 应用修复 | Work notes |\n| {time} | 服务恢复 | Verification |\n| {time} | 事件解决 | ServiceNow |\n\n---\n\n## 根因分析\n\n### 发生了什么\n{Detailed description of the incident based on provided data}\n\n### 直接原因\n{The direct trigger that caused the incident}\n\n### 促成因素\n| 因素 | 类别 | 详情 |\n|--------|----------|---------|\n| {factor 1} | {Process/Tech/People/External} | {description} |\n| {factor 2} | {category} | {description} |\n| {factor 3} | {category} | {description} |\n\n### 5 Whys 分析\n\n1. **为什么 {incident symptom} 会发生？**\n   → 因为 {immediate cause}\n\n2. **为什么 {immediate cause} 会发生？**\n   → 因为 {contributing factor 1}\n\n3. **为什么 {contributing factor 1} 会发生？**\n   → 因为 {contributing factor 2}\n\n4. **为什么 {contributing factor 2} 会发生？**\n   → 因为 {underlying cause}\n\n5. **为什么 {underlying cause} 会发生？**\n   → 因为 **{ROOT CAUSE}**\n\n### 根因陈述\n**{Clear, concise statement of the fundamental root cause}**\n\n---\n\n## 解决方案\n\n### 如何修复\n{Description of the resolution from provided data}\n\n### 解决方案类别\n- [ ] 配置变更\n- [ ] 代码修复\n- [ ] 基础设施变更\n- [ ] 重启/reboot\n- [ ] 回滚\n- [ ] 厂商修复\n- [ ] 流程变更\n- [ ] 其他：{specify}\n\n### 验证\n{How was the fix verified to be working?}\n\n---\n\n## 建议\n\n### 立即行动（本周）\n| # | 行动 | 负责人 | 优先级 | 到期日 |\n|---|--------|-------|----------|-----|\n| 1 | {specific action} | {assign} | High | {date} |\n| 2 | {specific action} | {assign} | High | {date} |\n\n### 短期改进（本月）\n| # | 改进 | 类别 | 工作量 |\n|---|-------------|----------|--------|\n| 1 | {improvement} | {Process/Tech/Monitoring} | {H/M/L} |\n| 2 | {improvement} | {category} | {effort} |\n\n### 长期改进（本季度）\n| # | 改进 | 类别 | 工作量 |\n|---|-------------|----------|--------|\n| 1 | {strategic improvement} | {category} | {effort} |\n\n---\n\n## 预防\n\n### 如何防止再次发生\n1. {Prevention measure 1}\n2. {Prevention measure 2}\n3. {Prevention measure 3}\n\n### 监控改进\n| 监控项 | 告警阈值 | 负责人 |\n|-----------------|-----------------|-------|\n| {metric} | {threshold} | {team} |\n\n### 流程变更\n- {Process change 1}\n- {Process change 2}\n\n---\n\n## 相关记录\n\n### Problem Ticket\n**创建 Problem？** Yes / No\n**Problem Statement：** {if yes, suggested problem description}\n\n### Change Requests\n如果需要通过变更防止再次发生：\n| 变更 | 类型 | 风险 | 目标日期 |\n|--------|------|------|-------------|\n| {change} | {Normal/Standard/Emergency} | {H/M/L} | {date} |\n\n### Knowledge Article\n**创建 KB？** Yes / No\n**Suggested Title：** {title}\n**Key Points：** {what to document}\n\n---\n\n## 经验教训\n\n1. **做得好的方面：**\n   - {positive aspect of response}\n   - {another positive}\n\n2. **可以改进的方面：**\n   - {improvement area}\n   - {another area}\n\n3. **关键启示：**\n   {Single most important lesson from this incident}\n\n---\n\n## 附录\n\n### Work Notes 摘要\n{Key work notes from incident if provided}\n\n### 引用的附件\n{List any attachments or evidence}\n\n### 参与人员\n| 角色 | 姓名 |\n|------|------|\n| Incident Manager | {name} |\n| Technical Lead | {name} |\n| Resolver | {name} |\n\n---\n\n## 签署确认\n\n| 角色 | 姓名 | 日期 |\n|------|------|------|\n| RCA 作者 | | |\n| 技术评审人 | | |\n| 服务负责人 | | |\n\n---\n\n*由 Copilot Cowork 的 ServiceNow RCA Skill 生成*\n\n## 示例提示\n\n\"Generate RCA for this incident: [paste incident details]\"\n\n\"Create root cause analysis - incident INC0010001, server crashed due to memory leak, affected 500 users for 2 hours\"\n\n\"Analyze this incident and create RCA report [attach CSV export]\"\n\n\"5 whys analysis for a database outage that happened yesterday\"\n"},"cowork-cost-estimator":{"en":"---\nname: cowork-cost-estimator\ndescription: |\n  Estimates monthly and annual Microsoft Copilot Cowork licensing cost for the\n  single signed-in user. Classifies that user by worker category, populates the\n  Cowork cost estimator spreadsheet with the correct prompt-mix defaults,\n  recalculates formulas, and delivers a cost summary card plus a filled-in\n  Excel file and a ready-to-send admin report.\n\n  Use when user asks to \"estimate my Cowork cost\", \"how much would Cowork cost\",\n  \"calculate my Copilot Credits\", \"how much would I pay for Cowork\",\n  \"what is the Cowork budget\", \"cost calculator for Cowork\",\n  \"model Cowork scenarios\", \"Cowork licensing cost\",\n  \"how much does Cowork cost per user\".\n\n  Do NOT use for general Microsoft 365 subscription pricing, Azure cost management,\n  Power BI licensing questions, or non-Cowork AI tool cost analysis (GitHub Copilot, Azure OpenAI).\ncowork:\n  category: analysis\n  icon: Calculator\n---\n\n# Copilot Cowork Cost Estimator\n\nEstimates monthly Copilot Credit consumption and USD cost for the single\nsigned-in user using the Microsoft Cowork pricing calculator spreadsheet.\n\n## When NOT to Use\n\n- General Microsoft 365 or Azure pricing questions — answer directly from product pages\n- Non-Cowork AI licensing (GitHub Copilot, Azure OpenAI, Copilot for M365) — answer directly\n- Actual invoice reconciliation or historical spend reporting — use the billing portal\n\n## Workflow\n\n### Step 1 — Ask three questions up front (blocking)\n\nThis skill always estimates for **a single user — the signed-in user**. Before anything else, ask these three questions (use `AskUserQuestion`). They gate the rest of the workflow — do not skip them:\n\n1. **Estimator file** — Ask the user to upload the Cowork estimator workbook (`CustomerCoworkEstimator.xlsx`). First check `input/`; if it is already there, use it and skip this question. Otherwise wait for the upload before proceeding — do not substitute representative or placeholder data if it is missing.\n2. **Calculation period** — Ask how many days the estimate should cover. Offer **30 days** (one month), **90 days** (a quarter), and **365 days** (a year) as options, and accept a custom number of days via \"Other\". Default to 30 days if the user declines to choose. Call this value `N` and carry it through Steps 3–4.\n3. **Monthly limit** — Ask what monthly Copilot Credit limit (cap) the admin has set for the user. The limit is always expressed in **Copilot Credits per month** (never USD). Accept a custom number via \"Other\", and allow \"No limit / not sure\" to skip. Call this value `L`. When provided, use it in Step 4 to compare against the estimated monthly credits; when skipped, omit the limit comparison.\n\nThen resolve the remaining inputs from context without asking:\n\n1. **User identity**: Read the signed-in user's name, job title, and department from system context.\n2. **Scope**: Always exactly 1 user — the signed-in user. Do not handle team or org-wide estimates here.\n3. **Worker category mapping** — map the signed-in user's job title keywords to exactly one of the four calculator categories:\n\n   | Job title keywords | Category | Calculator row |\n   |--------------------|----------|----------------|\n   | Architect, Engineer, Developer, SRE, DevOps, Data Scientist, IT, Technical | Technical Workers | D14 |\n   | Sales, Account Executive, Customer Success, Account Manager, Pre-Sales, SE | Customer-Facing Knowledge Workers | D13 |\n   | Manager, Director, VP, Head of, Principal, C-suite, Partner, GM, Lead | Managers & Senior Leaders | D15 |\n   | All others (analyst, coordinator, HR, legal, finance, marketing, ops) | Corporate Knowledge Workers | D12 |\n\n### Step 2 — Populate the calculator\n\nUsing `openpyxl`, open `input/CustomerCoworkEstimator.xlsx` and write user counts into the Budget sheet:\n\n- `D12` = Corporate Knowledge Workers count\n- `D13` = Customer-Facing Knowledge Workers count\n- `D14` = Technical Workers count\n- `D15` = Managers & Senior Leaders count\n\nKeep all default prompt-mix values (D23:F26) and credits-per-prompt values (D33:D35) unless the user explicitly provides overrides.\n\nStyle conventions:\n- Input cells: blue font (RGB `0000FF`, bold) per financial model convention\n- Add a brief annotation in column H beside each populated row (e.g., `← 1 user: Rajesh Jayaraj, Cloud Solution Architect`)\n- Widen column H to 52 characters so annotations are readable\n\nSave output to `output/CoworkEstimator_<FirstName>.xlsx` (use the signed-in user's first name).\n\n### Step 3 — Recalculate and spot-check\n\nRun `python scripts/recalc.py output/CoworkEstimator_<FirstName>.xlsx` and confirm `status: success` with zero formula errors.\n\nVerify key computed values against manual calculation before reporting:\n- `G25` (Technical Workers credits/user) = `(D25×D33) + (E25×D34) + (F25×D35)`\n- `D41` (total monthly credits) = `SUMPRODUCT(D12:D15, G23:G26)`\n- `D42` (monthly USD) = `D41 / 100`\n- `D43` (cost per user/month) = `D42 / SUM(D12:D15)`\n\nThen prorate to the requested period of `N` days from Step 1. The calculator's figures cover a full month; convert using a 365-day year so that `N = 365` reconciles to the annual total:\n- daily credits = `(D41 × 12) / 365`\n- **period credits** = daily credits × `N`\n- **period USD** = period credits / 100\nKeep the monthly and annual figures as reference points; do not overwrite the sheet's monthly formulas to do this — compute the period values alongside.\n\n### Step 4 — Display the results card (ALWAYS, on screen)\n\n**Always render an on-screen `render_ui` summary card** (use the `render-ui` skill). This graphical card is the **primary output the user sees** — render it every run, and render it *before* generating the Word report in Step 5. Never skip the card and jump straight to the report. The card contains:\n- User classification: role → worker category\n- **Calculation period**: `N` days (as chosen in Step 1)\n- **Cost for the requested period**: Copilot Credits and USD over `N` days\n- Estimated monthly Credits\n- Monthly cost (est)\n- Annual cost (estd)\n- Prompt mix used (Light / Medium / Heavy per month)\n- **Monthly limit** (only when `L` was provided): the credit cap, **estimated monthly Credits** vs that cap, and **remaining** (or **over by**) credits. Compare against the *monthly* estimate (`D41`) — never against the `N`-day period figure, which is a different unit. Flag clearly if the estimate exceeds the limit.\n\n**Include a chart in the same card** so the result is easy to read at a glance (use the `render-ui` skill's chart elements):\n- **Monthly limit provided (`L`)** → a `Chart.Gauge` of **estimated monthly Credits against the limit `L`**, so it's instantly clear whether the user is within or over the cap.\n- **No limit** → a `Chart.Donut` of **credits by prompt type** (Light / Medium / Heavy), so the heavy-prompt cost driver stands out.\n- Label each segment with its credits (or USD) value and keep the prompt-type color order consistent across runs.\n\n**Limit status color (only when `L` was provided)** — color the gauge value, the limit metric, and any status badge by how the estimated monthly credits compare to `L`:\n- **Green** — within limit: estimate ≤ 80% of `L`\n- **Amber** — reaching limit: estimate between 80% and 100% of `L` (inclusive)\n- **Red** — exceeded limit: estimate > `L`\n\nState the status in words next to the color (e.g., \"Within limit\", \"Approaching limit\", \"Over limit\") so it reads correctly without relying on color alone.\n\nFollow the card with:\n1. File reference: `output/CoworkEstimator_<FirstName>.xlsx`\n2. One-line key insight: identify the single biggest cost driver (typically Heavy prompts for Technical Workers)\n3. Disclosure note: actual session logs are not accessible via Microsoft 365 APIs — the Microsoft Frontier default prompt mix is used as a proxy\n4. Scenario offer: \"Want me to run Light-skew and Heavy-skew scenarios to see the cost range?\"\n\n### Step 5 — Generate the admin report (Word document ONLY)\n\nAfter the card is on screen, generate the shareable report **only as a Word document** (`.docx`) — do not produce PDF, HTML, an inline copy, or an email version. Use the `docx` skill to generate `output/CoworkCostReport_<FirstName>.docx` — a clean one-pager the user can forward to their admin (e.g., to request a budget or a credit-limit decision), containing:\n\n- **Header**: title (\"Microsoft Copilot Cowork — Cost Estimate\"), prepared-by (signed-in user's name, job title, department), and the date.\n- **Purpose line**: one sentence stating why it's being shared (e.g., budget approval / monthly limit review).\n- **Summary table**: the user (role + worker category), calculation period (`N` days), estimated cost for the period, estimated monthly Credits, monthly cost (est), and annual cost (estd).\n- **Limit status callout** (only when `L` was provided): the monthly cap, estimated monthly Credits vs cap, remaining/over, and the status word — colored green / amber / red by the same 80% / 80–100% / over-cap thresholds.\n- **Assumptions & disclosure**: the prompt mix used and the Frontier-default proxy note (session logs aren't accessible via M365 APIs; this is a directional estimate, not a billing commitment).\n- **Requested action**: a short closing line (e.g., \"Requesting approval for the above monthly limit / budget\").\n\nAfter the document is created, confirm to the user that the Word report is saved in `output/` and ready to share with their admin (by attaching it to an email or Teams message). Do not draft or send an email, and do not produce the report in any other format — the Word document is the only report artifact.\n\n## Output Format\n\n| Artifact | Location | Description |\n|----------|----------|-------------|\n| Excel file | `output/CoworkEstimator_<FirstName>.xlsx` | Filled calculator with blue input cells and column-H annotations |\n| Summary card | Inline (`render_ui`) | **Always shown.** Period cost (over N days), estimated monthly Credits, monthly USD, annual USD, plus a chart (usage-vs-limit gauge, or prompt-type donut) |\n| Admin report | `output/CoworkCostReport_<FirstName>.docx` | The only report artifact — a Word one-pager to share with an admin (no PDF/HTML/email versions) |\n| Scenario offer | Inline text | Offer to model optimistic vs conservative prompt mix |\n\n## Pricing Reference (Microsoft Frontier defaults, 5/27/2026)\n\n**Credits per prompt (Step 3 of calculator):**\n\n| Prompt type | Credits | Cost @ list price |\n|-------------|---------|-------------------|\n| Light | 125 | $1.25 |\n| Medium | 500 | $5.00 |\n| Heavy | 1,200 | $12.00 |\n\nConversion rate: **100 Copilot Credits = $1 USD** (list price). Model baseline: Anthropic Opus 4.8.\n\n**Default monthly prompt mix per user (Step 2 of calculator):**\n\n| Category | Light | Medium | Heavy | Credits/user/mo |\n|----------|-------|--------|-------|-----------------|\n| Corporate Knowledge Workers | 22 | 11 | 5 | 14,250 |\n| Customer-Facing Knowledge Workers | 17 | 13 | 5 | 14,625 |\n| Technical Workers | 12 | 9 | 14 | 22,800 |\n| Managers & Senior Leaders | 13 | 6 | 3 | 8,225 |\n\n## Guardrails\n\n- Never fabricate user counts, prompt volumes, or cost figures — use only what the user provides or the Frontier defaults from the sheet.\n- Do not hard-code calculated values into the Excel output — keep Excel formulas intact so the file remains editable.\n- Always disclose that this is a directional budget estimate, not a billing commitment.\n- Always disclose that actual session logs are not accessible via Microsoft 365 APIs; the default prompt mix is used as a proxy.\n- Always ask the user to upload `CustomerCoworkEstimator.xlsx` first (unless it is already in `input/`) — this is a blocking question; do not substitute representative or placeholder data.\n- Never fabricate the calculation period — use the number of days the user provides, defaulting to 30 days only if they decline to choose.\n- Never fabricate the monthly limit — use only the cap the user provides. If they skip it, omit the limit comparison and the limit gauge entirely; do not assume a default cap.\n- When a limit is provided, color and label the status consistently: green ≤ 80% of the cap, amber 80–100%, red over the cap — and always state the status in words, not color alone.\n- Always display the graphical `render_ui` summary card on screen first — it is the primary user-facing output and must appear on every run, never skipped in favor of going straight to the report.\n- Generate the admin report only as a Word document (`output/CoworkCostReport_<FirstName>.docx`) — never as PDF, HTML, an inline copy, or an email. Do not draft or send an email; the user shares the Word file themselves.\n- This skill is single-user only — always estimate for the signed-in user and classify them into exactly one worker category. Do not handle team or org-wide estimates.\n- The monthly limit is always in Copilot Credits (never USD) — do not convert or reinterpret it. Compare it only against the estimated *monthly* credits, not the period figure.\n- \"Estimated monthly Credits\" and \"Monthly cost (est)\" are projections from the default prompt mix, not actual usage — label them as estimates and never present them as measured consumption.\n- Always produce the admin report as a deliverable file the user can review; never auto-send it to an admin or guess the recipient. Only create an email draft after the user names the recipient, and leave it as a draft for them to send.\n","zh":"---\nname: cowork-cost-estimator\ndescription: |\n  估算目前登入之單一使用者每月與每年的 Microsoft Copilot Cowork 授權成本。依工作者類別分類該使用者，使用正確的提示組合預設值填寫 Cowork 成本估算試算表，重新計算公式，並交付成本摘要卡、已填妥的 Excel 檔案，以及可直接傳送的系統管理員報告。\n\n  當使用者要求「估算我的 Cowork 費用」、「Cowork 大概要多少錢」、「計算我的 Copilot Credits」、「我使用 Cowork 要付多少錢」、「Cowork 預算是多少」、「Cowork 成本計算器」、「模擬 Cowork 情境」、「Cowork 授權成本」、「每位使用者 Cowork 要多少錢」、\"estimate my Cowork cost\", \"how much would Cowork cost\",\n  \"calculate my Copilot Credits\", \"how much would I pay for Cowork\",\n  \"what is the Cowork budget\", \"cost calculator for Cowork\",\n  \"model Cowork scenarios\", \"Cowork licensing cost\",\n  \"how much does Cowork cost per user\" 時使用。\n\n  請勿用於一般 Microsoft 365 訂閱價格、Azure 成本管理、Power BI 授權問題，或非 Cowork AI 工具成本分析（GitHub Copilot、Azure OpenAI）。\ncowork:\n  category: analysis\n  icon: Calculator\n---\n\n# Copilot Cowork 成本估算器\n\n使用 Microsoft Cowork 價格計算器試算表，估算目前登入之單一使用者每月 Copilot Credit 消耗量與 USD 成本。\n\n## 不適用情境\n\n- 一般 Microsoft 365 或 Azure 價格問題 — 直接依產品頁面回答\n- 非 Cowork AI 授權（GitHub Copilot、Azure OpenAI、Copilot for M365）— 直接回答\n- 實際發票對帳或歷史支出報告 — 使用帳務入口網站\n\n## 工作流程\n\n### 步驟 1 — 先詢問三個問題（阻擋）\n\n此技能一律只估算 **單一使用者 — 目前登入的使用者**。在其他動作之前，先詢問這三個問題（使用 `AskUserQuestion`）。這些問題會控管後續工作流程 — 不得略過：\n\n1. **估算器檔案** — 請使用者上傳 Cowork 估算器活頁簿（`CustomerCoworkEstimator.xlsx`）。先檢查 `input/`；若檔案已在其中，請直接使用並略過此問題。否則請等待上傳後再繼續 — 若檔案遺失，不得以代表性或占位資料替代。\n2. **計算期間** — 詢問估算應涵蓋多少天。提供 **30 days**（一個月）、**90 days**（一季）與 **365 days**（一年）作為選項，並透過 \"Other\" 接受自訂天數。若使用者拒絕選擇，預設為 30 days。將此值稱為 `N`，並在步驟 3–4 全程沿用。\n3. **每月限制** — 詢問系統管理員為該使用者設定的每月 Copilot Credit 限制（上限）。限制一律以 **每月 Copilot Credits** 表示（絕不以 USD 表示）。透過 \"Other\" 接受自訂數字，並允許選擇 \"No limit / not sure\" 以略過。將此值稱為 `L`。若已提供，於步驟 4 用它與估算的每月 Credits 比較；若略過，則省略限制比較。\n\n接著從情境中解析其餘輸入，不再提問：\n\n1. **使用者身分**：從系統情境讀取目前登入使用者的姓名、職稱與部門。\n2. **範圍**：一律剛好 1 位使用者 — 目前登入的使用者。不要在此處處理團隊或整個組織的估算。\n3. **工作者類別對應** — 將目前登入使用者的職稱關鍵字對應至計算器的四個類別之一，且只能對應一個：\n\n   | 職稱關鍵字 | 類別 | 計算器列 |\n   |--------------------|----------|----------------|\n   | Architect, Engineer, Developer, SRE, DevOps, Data Scientist, IT, Technical | Technical Workers | D14 |\n   | Sales, Account Executive, Customer Success, Account Manager, Pre-Sales, SE | Customer-Facing Knowledge Workers | D13 |\n   | Manager, Director, VP, Head of, Principal, C-suite, Partner, GM, Lead | Managers & Senior Leaders | D15 |\n   | 所有其他職務（analyst, coordinator, HR, legal, finance, marketing, ops） | Corporate Knowledge Workers | D12 |\n\n### 步驟 2 — 填入計算器\n\n使用 `openpyxl` 開啟 `input/CustomerCoworkEstimator.xlsx`，並將使用者人數寫入 Budget 工作表：\n\n- `D12` = Corporate Knowledge Workers count\n- `D13` = Customer-Facing Knowledge Workers count\n- `D14` = Technical Workers count\n- `D15` = Managers & Senior Leaders count\n\n除非使用者明確提供覆寫值，否則保留所有預設提示組合值（D23:F26）與每次提示的 Credits 值（D33:D35）。\n\n樣式慣例：\n- 輸入儲存格：依財務模型慣例使用藍色字型（RGB `0000FF`、粗體）\n- 在每個已填入列旁的 H 欄新增簡短註解（例如 `← 1 user: Rajesh Jayaraj, Cloud Solution Architect`）\n- 將 H 欄加寬至 52 個字元，讓註解清楚可讀\n\n將輸出儲存至 `output/CoworkEstimator_<FirstName>.xlsx`（使用目前登入使用者的名字）。\n\n### 步驟 3 — 重新計算並抽查\n\n執行 `python scripts/recalc.py output/CoworkEstimator_<FirstName>.xlsx`，並確認 `status: success` 且公式錯誤為零。\n\n回報前，先以手動計算驗證關鍵計算值：\n- `G25`（Technical Workers credits/user）= `(D25×D33) + (E25×D34) + (F25×D35)`\n- `D41`（每月總 Credits）= `SUMPRODUCT(D12:D15, G23:G26)`\n- `D42`（每月 USD）= `D41 / 100`\n- `D43`（每位使用者/月成本）= `D42 / SUM(D12:D15)`\n\n接著按步驟 1 要求的期間 `N` 天進行按比例換算。計算器的數字涵蓋完整月份；請使用 365 天年度換算，讓 `N = 365` 可對齊年度總額：\n- 每日 Credits = `(D41 × 12) / 365`\n- **期間 Credits** = 每日 Credits × `N`\n- **期間 USD** = 期間 Credits / 100\n保留每月與每年數字作為參考點；不要覆寫試算表的每月公式來做此事 — 請另外計算期間值。\n\n### 步驟 4 — 顯示結果卡片（一律在畫面上）\n\n**一律呈現畫面上的 `render_ui` 摘要卡**（使用 `render-ui` skill）。這張圖形卡片是**使用者看到的主要輸出** — 每次執行都要呈現，且必須在步驟 5 產生 Word 報告之前呈現。絕不能略過卡片並直接跳到報告。卡片包含：\n- 使用者分類：角色 → 工作者類別\n- **計算期間**：`N` days（依步驟 1 選擇）\n- **要求期間的成本**：`N` 天內的 Copilot Credits 與 USD\n- 估計每月 Credits\n- 每月成本（估計）\n- 年度成本（估計）\n- 使用的提示組合（每月 Light / Medium / Heavy）\n- **每月限制**（僅在已提供 `L` 時）：Credit 上限、**估計每月 Credits** 與該上限的比較，以及**剩餘**（或**超出**）Credits。請與*每月*估算值（`D41`）比較 — 絕不要與 `N` 天期間數值比較，因為那是不同單位。若估算超過限制，請清楚標示。\n\n**在同一張卡片中包含圖表**，讓結果可一眼看懂（使用 `render-ui` skill 的圖表元素）：\n- **已提供每月限制（`L`）** → 使用 `Chart.Gauge` 顯示**估計每月 Credits 相對於限制 `L`**，讓使用者立即看出是否在上限內或已超出。\n- **無限制** → 使用 `Chart.Donut` 顯示**依提示類型區分的 Credits**（Light / Medium / Heavy），凸顯 Heavy 提示的成本驅動因素。\n- 以 Credits（或 USD）值標示每個區段，並在每次執行中保持提示類型顏色順序一致。\n\n**限制狀態顏色（僅在已提供 `L` 時）** — 依估計每月 Credits 與 `L` 的比較，為儀表值、限制指標及任何狀態徽章著色：\n- **綠色** — 在限制內：估算值 ≤ `L` 的 80%\n- **琥珀色** — 接近限制：估算值介於 `L` 的 80% 到 100% 之間（含）\n- **紅色** — 超過限制：估算值 > `L`\n\n在顏色旁以文字說明狀態（例如 \"Within limit\", \"Approaching limit\", \"Over limit\"），讓內容不只依賴顏色也能正確解讀。\n\n卡片後接續：\n1. 檔案參照：`output/CoworkEstimator_<FirstName>.xlsx`\n2. 一行關鍵洞察：指出單一最大成本驅動因素（通常是 Technical Workers 的 Heavy 提示）\n3. 揭露說明：無法透過 Microsoft 365 APIs 存取實際工作階段記錄 — 使用 Microsoft Frontier 預設提示組合作為代理值\n4. 情境提議：\"Want me to run Light-skew and Heavy-skew scenarios to see the cost range?\"\n\n### 步驟 5 — 產生系統管理員報告（僅限 Word 文件）\n\n卡片出現在畫面後，產生可分享的報告，且**只能是 Word 文件**（`.docx`）— 不要產生 PDF、HTML、內嵌副本或郵件版本。使用 `docx` skill 產生 `output/CoworkCostReport_<FirstName>.docx` — 這是一頁式整潔報告，使用者可轉寄給其系統管理員（例如用於申請預算或 Credit 限制決策），內容包含：\n\n- **標頭**：標題（\"Microsoft Copilot Cowork — Cost Estimate\"）、準備者（目前登入使用者的姓名、職稱、部門）與日期。\n- **目的行**：一句話說明分享原因（例如預算核准 / 每月限制檢閱）。\n- **摘要表**：使用者（角色 + 工作者類別）、計算期間（`N` days）、期間估計成本、估計每月 Credits、每月成本（估計）與年度成本（估計）。\n- **限制狀態重點提示**（僅在已提供 `L` 時）：每月上限、估計每月 Credits 與上限、剩餘/超出，以及狀態文字 — 依相同的 80% / 80–100% / 超出上限門檻，以綠色 / 琥珀色 / 紅色呈現。\n- **假設與揭露**：使用的提示組合，以及 Frontier 預設代理值說明（無法透過 M365 APIs 存取工作階段記錄；這是方向性估算，不是帳務承諾）。\n- **請求動作**：簡短結尾句（例如「請核准上述每月限制 / 預算」）。\n\n文件建立後，向使用者確認 Word 報告已儲存在 `output/`，可分享給其系統管理員（透過附加到郵件或 Teams 訊息）。不要草擬或傳送郵件，也不要以其他格式產生報告 — Word 文件是唯一的報告成品。\n\n## 輸出格式\n\n| 成品 | 位置 | 說明 |\n|----------|----------|-------------|\n| Excel 檔案 | `output/CoworkEstimator_<FirstName>.xlsx` | 已填妥計算器，包含藍色輸入儲存格與 H 欄註解 |\n| 摘要卡 | 內嵌（`render_ui`） | **一律顯示。** 期間成本（N 天內）、估計每月 Credits、每月 USD、年度 USD，以及圖表（使用量對限制儀表，或提示類型環圈圖） |\n| 系統管理員報告 | `output/CoworkCostReport_<FirstName>.docx` | 唯一報告成品 — 可分享給系統管理員的 Word 一頁式報告（無 PDF/HTML/email 版本） |\n| 情境提議 | 內嵌文字 | 提議模擬樂觀與保守的提示組合 |\n\n## 價格參考（Microsoft Frontier 預設值，5/27/2026）\n\n**每次提示的 Credits（計算器步驟 3）：**\n\n| 提示類型 | Credits | Cost @ list price |\n|-------------|---------|-------------------|\n| Light | 125 | $1.25 |\n| Medium | 500 | $5.00 |\n| Heavy | 1,200 | $12.00 |\n\nConversion rate: **100 Copilot Credits = $1 USD**（list price）。Model baseline: Anthropic Opus 4.8。\n\n**每位使用者預設每月提示組合（計算器步驟 2）：**\n\n| Category | Light | Medium | Heavy | Credits/user/mo |\n|----------|-------|--------|-------|-----------------|\n| Corporate Knowledge Workers | 22 | 11 | 5 | 14,250 |\n| Customer-Facing Knowledge Workers | 17 | 13 | 5 | 14,625 |\n| Technical Workers | 12 | 9 | 14 | 22,800 |\n| Managers & Senior Leaders | 13 | 6 | 3 | 8,225 |\n\n## 防護原則\n\n- 絕不捏造使用者人數、提示量或成本數字 — 只能使用使用者提供的資訊，或試算表中的 Frontier 預設值。\n- 不要將計算值硬式編碼到 Excel 輸出中 — 保留 Excel 公式，讓檔案維持可編輯。\n- 一律揭露這是方向性預算估算，不是帳務承諾。\n- 一律揭露無法透過 Microsoft 365 APIs 存取實際工作階段記錄；預設提示組合會作為代理值使用。\n- 一律先要求使用者上傳 `CustomerCoworkEstimator.xlsx`（除非它已在 `input/` 中）— 這是阻擋問題；不得以代表性或占位資料替代。\n- 絕不捏造計算期間 — 使用使用者提供的天數；只有在使用者拒絕選擇時，才預設為 30 days。\n- 絕不捏造每月限制 — 只使用使用者提供的上限。若使用者略過，請省略限制比較與限制儀表，不要假設預設上限。\n- 提供限制時，一律一致地標示狀態顏色與文字：綠色 ≤ 上限的 80%，琥珀色 80–100%，紅色為超過上限 — 並一律以文字說明狀態，不只依賴顏色。\n- 一律先在畫面上顯示圖形化 `render_ui` 摘要卡 — 這是主要面向使用者的輸出，每次執行都必須出現，絕不能略過而直接產生報告。\n- 系統管理員報告只能產生為 Word 文件（`output/CoworkCostReport_<FirstName>.docx`）— 絕不能是 PDF、HTML、內嵌副本或郵件。不要草擬或傳送郵件；由使用者自行分享 Word 檔案。\n- 此技能僅適用單一使用者 — 一律估算目前登入使用者，並將其分類到剛好一個工作者類別。不要處理團隊或整個組織的估算。\n- 每月限制一律以 Copilot Credits 表示（絕不以 USD 表示）— 不要轉換或重新詮釋。只將它與估計*每月* Credits 比較，不要與期間數字比較。\n- \"Estimated monthly Credits\" 與 \"Monthly cost (est)\" 是依預設提示組合推估，不是實際使用量 — 請標示為估計值，且絕不呈現為已量測的消耗。\n- 一律將系統管理員報告製作成使用者可檢閱的交付檔案；不要自動傳送給系統管理員或猜測收件者。只有在使用者指定收件者後，才建立郵件草稿，並讓它保持草稿狀態由使用者自行傳送。\n","cn":"---\nname: cowork-cost-estimator\ndescription: |\n  为当前登录的单个用户估算 Microsoft Copilot Cowork 的月度和年度授权成本。根据工作者类别对该用户进行分类，用正确的提示词组合默认值填写 Cowork 成本估算表，重新计算公式，并交付成本摘要卡、已填写的 Excel 文件以及可直接发送的管理员报告。\n\n  当用户提出“估算我的 Cowork 费用”、“Cowork 大概要多少钱”、“计算我的 Copilot Credits”、“我用 Cowork 要花多少钱”、“Cowork 预算是多少”、“Cowork 成本计算器”、“模拟 Cowork 场景”、“Cowork 授权成本”、“每个用户的 Cowork 成本是多少”、\"estimate my Cowork cost\", \"how much would Cowork cost\",\n  \"calculate my Copilot Credits\", \"how much would I pay for Cowork\",\n  \"what is the Cowork budget\", \"cost calculator for Cowork\",\n  \"model Cowork scenarios\", \"Cowork licensing cost\",\n  \"how much does Cowork cost per user\" 时使用。\n\n  不要用于一般 Microsoft 365 订阅价格、Azure 成本管理、Power BI 授权问题，或非 Cowork AI 工具成本分析（GitHub Copilot、Azure OpenAI）。\ncowork:\n  category: analysis\n  icon: Calculator\n---\n\n# Copilot Cowork 成本估算器\n\n使用 Microsoft Cowork 定价计算器表格，估算当前登录的单个用户每月 Copilot Credit 消耗量和 USD 成本。\n\n## 不适用场景\n\n- 一般 Microsoft 365 或 Azure 定价问题 — 直接参考产品页面回答\n- 非 Cowork AI 授权（GitHub Copilot、Azure OpenAI、Copilot for M365）— 直接回答\n- 实际发票核对或历史支出报告 — 使用计费门户\n\n## 工作流\n\n### 步骤 1 — 先询问三个问题（阻塞）\n\n此技能始终只估算 **单个用户 — 当前登录用户**。开始其他操作前，先询问这三个问题（使用 `AskUserQuestion`）。它们决定后续工作流是否继续 — 不得跳过：\n\n1. **估算器文件** — 请用户上传 Cowork 估算器工作簿（`CustomerCoworkEstimator.xlsx`）。先检查 `input/`；如果已经存在，就直接使用并跳过此问题。否则等待上传后再继续 — 如果缺失，不得用代表性数据或占位数据替代。\n2. **计算周期** — 询问估算覆盖多少天。提供 **30 days**（一个月）、**90 days**（一个季度）和 **365 days**（一年）作为选项，并通过 \"Other\" 接受自定义天数。如果用户不选择，默认用 30 days。将此值记为 `N`，并在步骤 3–4 中持续沿用。\n3. **月度上限** — 询问管理员为该用户设置的月度 Copilot Credit 上限。该上限始终以 **每月 Copilot Credits** 表示（绝不使用 USD）。通过 \"Other\" 接受自定义数字，并允许选择 \"No limit / not sure\" 跳过。将此值记为 `L`。如果已提供，在步骤 4 中用它与估算的月度 Credits 比较；如果跳过，则省略上限比较。\n\n然后根据上下文解析其余输入，不再询问：\n\n1. **用户身份**：从系统上下文读取当前登录用户的姓名、职务和部门。\n2. **范围**：始终正好是 1 个用户 — 当前登录用户。此处不要处理团队或组织级估算。\n3. **工作者类别映射** — 将当前登录用户职务中的关键词映射到计算器四个类别中的且仅一个类别：\n\n   | 职务关键词 | 类别 | 计算器行 |\n   |--------------------|----------|----------------|\n   | Architect, Engineer, Developer, SRE, DevOps, Data Scientist, IT, Technical | Technical Workers | D14 |\n   | Sales, Account Executive, Customer Success, Account Manager, Pre-Sales, SE | Customer-Facing Knowledge Workers | D13 |\n   | Manager, Director, VP, Head of, Principal, C-suite, Partner, GM, Lead | Managers & Senior Leaders | D15 |\n   | 所有其他职能（analyst, coordinator, HR, legal, finance, marketing, ops） | Corporate Knowledge Workers | D12 |\n\n### 步骤 2 — 填写计算器\n\n使用 `openpyxl` 打开 `input/CustomerCoworkEstimator.xlsx`，并在 Budget 工作表中写入用户数量：\n\n- `D12` = Corporate Knowledge Workers count\n- `D13` = Customer-Facing Knowledge Workers count\n- `D14` = Technical Workers count\n- `D15` = Managers & Senior Leaders count\n\n除非用户明确提供覆盖值，否则保留所有默认提示词组合值（D23:F26）和每次提示词的 Credits 值（D33:D35）。\n\n样式约定：\n- 输入单元格：按财务模型惯例使用蓝色字体（RGB `0000FF`、加粗）\n- 在每个已填写行旁边的 H 列添加简短注释（例如 `← 1 user: Rajesh Jayaraj, Cloud Solution Architect`）\n- 将 H 列加宽到 52 个字符，确保注释便于阅读\n\n将输出保存到 `output/CoworkEstimator_<FirstName>.xlsx`（使用当前登录用户的名字）。\n\n### 步骤 3 — 重新计算并抽查\n\n运行 `python scripts/recalc.py output/CoworkEstimator_<FirstName>.xlsx`，并确认 `status: success` 且公式错误为零。\n\n报告前，先通过手工计算核对关键计算值：\n- `G25`（Technical Workers credits/user）= `(D25×D33) + (E25×D34) + (F25×D35)`\n- `D41`（月度总 Credits）= `SUMPRODUCT(D12:D15, G23:G26)`\n- `D42`（月度 USD）= `D41 / 100`\n- `D43`（每用户/月成本）= `D42 / SUM(D12:D15)`\n\n然后按步骤 1 请求的 `N` 天周期进行折算。计算器中的数字覆盖完整月份；使用 365 天年度口径换算，确保 `N = 365` 能与年度总额对齐：\n- 每日 Credits = `(D41 × 12) / 365`\n- **周期 Credits** = 每日 Credits × `N`\n- **周期 USD** = 周期 Credits / 100\n保留月度和年度数字作为参考；不要为了这个周期计算而覆盖表格中的月度公式 — 只需在旁边计算周期值。\n\n### 步骤 4 — 显示结果卡片（始终在屏幕上）\n\n**始终渲染屏幕上的 `render_ui` 摘要卡**（使用 `render-ui` skill）。这张图形卡片是**用户看到的主要输出** — 每次运行都要渲染，并且必须在步骤 5 生成 Word 报告之前渲染。绝不能跳过卡片直接生成报告。卡片包含：\n- 用户分类：角色 → 工作者类别\n- **计算周期**：`N` days（按步骤 1 的选择）\n- **请求周期的成本**：`N` 天内的 Copilot Credits 和 USD\n- 估算月度 Credits\n- 月度成本（估算）\n- 年度成本（估算）\n- 使用的提示词组合（每月 Light / Medium / Heavy）\n- **月度上限**（仅在已提供 `L` 时）：Credit 上限、**估算月度 Credits** 与该上限的对比，以及**剩余**（或**超出**）Credits。请与*月度*估算值（`D41`）比较 — 绝不要与 `N` 天周期数字比较，因为它们不是同一口径。若估算值超出上限，请明确标注。\n\n**在同一张卡片中加入图表**，让结果一目了然（使用 `render-ui` skill 的图表元素）：\n- **已提供月度上限（`L`）** → 使用 `Chart.Gauge` 展示**估算月度 Credits 相对于上限 `L`**，让用户立即判断是否在上限内或已超出。\n- **无上限** → 使用 `Chart.Donut` 展示**按提示词类型划分的 Credits**（Light / Medium / Heavy），突出 Heavy 提示词这一成本驱动项。\n- 用 Credits（或 USD）数值标注每个分段，并在每次运行中保持提示词类型颜色顺序一致。\n\n**上限状态颜色（仅在已提供 `L` 时）** — 按估算月度 Credits 与 `L` 的对比，为仪表值、上限指标和任何状态徽章着色：\n- **绿色** — 未超上限：估算值 ≤ `L` 的 80%\n- **琥珀色** — 接近上限：估算值在 `L` 的 80% 到 100% 之间（含）\n- **红色** — 已超上限：估算值 > `L`\n\n在颜色旁用文字说明状态（例如 \"Within limit\", \"Approaching limit\", \"Over limit\"），确保不依赖颜色也能正确理解。\n\n卡片后接：\n1. 文件引用：`output/CoworkEstimator_<FirstName>.xlsx`\n2. 一行关键洞察：指出最大的单一成本驱动项（通常是 Technical Workers 的 Heavy 提示词）\n3. 披露说明：无法通过 Microsoft 365 APIs 访问实际会话日志 — 使用 Microsoft Frontier 默认提示词组合作为代理\n4. 场景建议：\"Want me to run Light-skew and Heavy-skew scenarios to see the cost range?\"\n\n### 步骤 5 — 生成管理员报告（仅 Word 文档）\n\n卡片显示在屏幕后，生成可共享的报告，且**只能生成 Word 文档**（`.docx`）— 不要生成 PDF、HTML、内联副本或邮件版本。使用 `docx` skill 生成 `output/CoworkCostReport_<FirstName>.docx` — 这是一页式清晰报告，用户可转发给管理员（例如用于申请预算或确定 Credit 上限），包含：\n\n- **页眉**：标题（\"Microsoft Copilot Cowork — Cost Estimate\"）、编制人（当前登录用户的姓名、职务、部门）和日期。\n- **目的行**：一句话说明分享目的（例如预算审批 / 月度上限复核）。\n- **摘要表**：用户（角色 + 工作者类别）、计算周期（`N` days）、周期估算成本、估算月度 Credits、月度成本（估算）和年度成本（估算）。\n- **上限状态提示**（仅在已提供 `L` 时）：月度上限、估算月度 Credits 与上限对比、剩余/超出，以及状态文字 — 按相同的 80% / 80–100% / 超上限阈值，使用绿色 / 琥珀色 / 红色标注。\n- **假设与披露**：使用的提示词组合，以及 Frontier 默认代理说明（无法通过 M365 APIs 访问会话日志；这是方向性估算，不构成计费承诺）。\n- **请求事项**：简短收尾句（例如“请求审批上述月度上限 / 预算”）。\n\n文档创建后，向用户确认 Word 报告已保存在 `output/`，可以分享给管理员（通过附加到邮件或 Teams 信息）。不要起草或发送邮件，也不要用任何其他格式生成报告 — Word 文档是唯一报告交付物。\n\n## 输出格式\n\n| 交付物 | 位置 | 说明 |\n|----------|----------|-------------|\n| Excel 文件 | `output/CoworkEstimator_<FirstName>.xlsx` | 已填写的计算器，包含蓝色输入单元格和 H 列注释 |\n| 摘要卡 | 内联（`render_ui`） | **始终显示。** 周期成本（N 天内）、估算月度 Credits、月度 USD、年度 USD，以及图表（用量对上限仪表，或提示词类型环形图） |\n| 管理员报告 | `output/CoworkCostReport_<FirstName>.docx` | 唯一报告交付物 — 可分享给管理员的 Word 一页式报告（无 PDF/HTML/email 版本） |\n| 场景建议 | 内联文本 | 建议模拟乐观与保守提示词组合 |\n\n## 定价参考（Microsoft Frontier 默认值，5/27/2026）\n\n**每次提示词的 Credits（计算器步骤 3）：**\n\n| 提示词类型 | Credits | Cost @ list price |\n|-------------|---------|-------------------|\n| Light | 125 | $1.25 |\n| Medium | 500 | $5.00 |\n| Heavy | 1,200 | $12.00 |\n\nConversion rate: **100 Copilot Credits = $1 USD**（list price）。Model baseline: Anthropic Opus 4.8。\n\n**每用户默认月度提示词组合（计算器步骤 2）：**\n\n| Category | Light | Medium | Heavy | Credits/user/mo |\n|----------|-------|--------|-------|-----------------|\n| Corporate Knowledge Workers | 22 | 11 | 5 | 14,250 |\n| Customer-Facing Knowledge Workers | 17 | 13 | 5 | 14,625 |\n| Technical Workers | 12 | 9 | 14 | 22,800 |\n| Managers & Senior Leaders | 13 | 6 | 3 | 8,225 |\n\n## 护栏\n\n- 绝不编造用户数量、提示词数量或成本数字 — 只能使用用户提供的信息，或表格中的 Frontier 默认值。\n- 不要把计算值硬编码到 Excel 输出中 — 保留 Excel 公式，确保文件仍可编辑。\n- 始终披露这是方向性预算估算，不构成计费承诺。\n- 始终披露无法通过 Microsoft 365 APIs 访问实际会话日志；默认提示词组合会作为代理使用。\n- 始终先要求用户上传 `CustomerCoworkEstimator.xlsx`（除非它已在 `input/` 中）— 这是阻塞问题；不得用代表性数据或占位数据替代。\n- 绝不编造计算周期 — 使用用户提供的天数；仅当用户不选择时，默认用 30 days。\n- 绝不编造月度上限 — 只使用用户提供的上限。如果用户跳过，请省略上限比较和上限仪表，且不要假设默认上限。\n- 提供上限时，始终按一致规则着色并标注状态：绿色 ≤ 上限的 80%，琥珀色 80–100%，红色为超出上限 — 并始终用文字说明状态，不只靠颜色表达。\n- 始终先在屏幕上显示图形化 `render_ui` 摘要卡 — 这是面向用户的主要输出，每次运行都必须出现，绝不能跳过并直接生成报告。\n- 管理员报告只能生成 Word 文档（`output/CoworkCostReport_<FirstName>.docx`）— 绝不能是 PDF、HTML、内联副本或邮件。不要起草或发送邮件；由用户自己分享 Word 文件。\n- 此技能仅支持单用户 — 始终估算当前登录用户，并将其分类到且仅一个工作者类别。不要处理团队或组织级估算。\n- 月度上限始终以 Copilot Credits 表示（绝不使用 USD）— 不要转换或重新解释。只将它与估算的*月度* Credits 比较，不要与周期数字比较。\n- \"Estimated monthly Credits\" 和 \"Monthly cost (est)\" 是基于默认提示词组合的预测，不是实际使用量 — 请标注为估算值，绝不要表述为已测量消耗。\n- 始终将管理员报告作为用户可审阅的交付文件生成；不要自动发送给管理员，也不要猜测收件人。只有在用户指定收件人后，才创建邮件草稿，并保留为草稿由用户发送。\n"},"cowork-library-search":{"en":"---\nname: cowork-library-search\ndescription: |\n  Searches the Copilot Cowork Library on the ABS GSA SharePoint site and returns matching items with a \"Download\" link to the SharePoint item page where the attached skill file lives.\n  Filters supported: category (Skill / Plugin / Prompt), persona (Knowledge workers, Sales, Management, Executives, Operations, etc.), industry (Cross Industry, Legal, Retail, etc.), customer-ready flag (true/false), keyword that matches Title or Description, and modified-after date for recency (\"what's new this week\").\n  Use when the user asks to \"search the cowork library\", \"find skills in the gallery\", \"what plugins are available for sales\", \"list prompts for executives\", \"find cowork items about meetings\", \"show customer-ready skills\", \"what's in the cowork gallery for retail\", \"any plugins for managers\", \"look up library items about [topic]\", or \"what's new in the cowork library this week\".\n  Do NOT use this skill to (a) list the user's personal skills — use the `skills` skill; (b) describe built-in system skills — answer directly; (c) search OneDrive or SharePoint files in general — use `SearchM365` with `sources=[\"files\"]` instead. This skill is scoped only to the Copilot Cowork Library SharePoint list.\ncowork:\n  category: research\n  icon: Search\n---\n\n# Cowork Library Search\n\nSearch the Copilot Cowork Library SharePoint list and return matching items with download links.\n\n## Library Location\n\n- **Site:** ABS - Global Solution Architects\n- **Site ID:** `microsoft.sharepoint-df.com,243ad53f-1b98-4147-8162-7b1557299391,8b86e36e-e48e-4fda-9fe8-c1d6eab2b3ab`\n- **List:** Copilot Cowork Library\n- **List ID:** `list_7` (alias) / `6c667e0a-5882-453e-9127-d70532841e28` (GUID)\n- **Gallery URL:** https://microsoft.sharepoint-df.com/sites/ABSGSA/Lists/CopilotCoworkLibrary/Cowork%20Full%20Gallery.aspx\n- **Item view pattern:** `https://microsoft.sharepoint-df.com/sites/ABSGSA/Lists/CopilotCoworkLibrary/DispForm.aspx?ID={id}` — this is the \"Download\" target (the SharePoint page where the attached skill file is accessible).\n\n## Workflow\n\n### Step 1 — Capture criteria\n\nParse the user's request into a structured filter. Supported criteria:\n\n| Criterion | Values |\n|-----------|--------|\n| `category` | `Skill`, `Plugin`, `Prompt` |\n| `persona` | `Knowledge workers`, `Sales`, `Management`, `Executives`, `Operations`, etc. |\n| `industry` | `Cross Industry`, `Legal`, `Retail`, etc. |\n| `customer_ready` | `true` / `false` |\n| `keyword` | Free text — matched (case-insensitive) against `Title` and `Description` |\n| `modified_after` | ISO date (e.g. `2026-05-20`) — keep only items with `Modified >= date` |\n\nIf the user provided only a topic phrase (e.g. \"find something for meeting follow-ups\"), treat it as `keyword`. For relative recency phrasings (\"this week\", \"last 7 days\", \"since Monday\"), resolve to an absolute ISO date using the user's local time zone, then use as `modified_after`. If criteria are ambiguous, pick a sensible default and proceed — do not block with a clarification.\n\n### Step 2 — Query the list\n\nUse `ListListItems` to retrieve items, then filter client-side. Pull a generous page (top=100) — the library is small.\n\n```\nListListItems(\n  site_id=\"microsoft.sharepoint-df.com,243ad53f-1b98-4147-8162-7b1557299391,8b86e36e-e48e-4fda-9fe8-c1d6eab2b3ab\",\n  list_id=\"list_7\",\n  top=100\n)\n```\n\nIf pagination returns `next_link`, follow it until the full set is retrieved before applying filters.\n\n### Step 3 — Apply filters\n\nFor each item, read the `fields` block and keep the item only if **all** specified criteria match:\n\n- `Category` equals the requested category (case-insensitive)\n- `Persona` equals the requested persona (case-insensitive)\n- `Industry` equals the requested industry (case-insensitive)\n- `CustomerReady` equals the requested boolean\n- `keyword` appears in either `Title` or `Description` (case-insensitive substring match)\n- `Modified` (ISO datetime) is ≥ `modified_after`\n\nIf no items match, say so plainly and suggest relaxing one criterion (e.g. dropping the industry filter or widening the date window).\n\n### Step 4 — Present results\n\nDefault to an **Adaptive Card** rendering via `render_ui` for any result set with 2 or more matches. Fall back to a plain markdown line for a single match (a card for one row is overkill).\n\n**Card rendering (2+ matches):**\n\n1. Invoke the `render-ui` skill first so the schema and validation rules are loaded, then call `render_ui`.\n2. Build the card body as follows:\n   - A leading `TextBlock` (`size: Large`, `weight: Bolder`) with the title `\"Cowork Library — N match(es)\"`.\n   - A second `TextBlock` (`isSubtle: true`, `wrap: true`) summarising the applied filters, e.g. _\"Filters: category = Skill · persona = Knowledge workers\"_.\n   - One `Container` per result, separated with `separator: true`, each containing:\n     - A `ColumnSet` with two columns: column 1 (`width: stretch`) holds the title (`TextBlock`, `weight: Bolder`, `size: Medium`) and the description (`TextBlock`, `wrap: true`, truncated to ~140 chars with ellipsis); column 2 (`width: auto`) holds an `ActionSet` with a single `Action.OpenUrl` whose `title` is the literal string `\"Download\"` and whose `url` is the item's `DispForm.aspx?ID={id}`.\n     - Underneath the columns, a `FactSet` with facts: `Category`, `Persona`, `Industry`, `Customer Ready` (Yes / No), `Modified` (formatted as `YYYY-MM-DD`).\n3. Sort the result containers by Category, then Title.\n4. After the `render_ui` call, add one short line of plain text below the card: _\"The Download button opens the SharePoint item page where the attached skill file can be downloaded.\"_\n\n**Markdown fallback (single match or `render_ui` unavailable):**\n\nRender a one-row markdown table with the same columns. The **Link** column MUST be a markdown link with the literal text `Download`, pointing at the item's `DispForm.aspx?ID={id}` URL.\n\n```\n| # | Title | Category | Persona | Industry | Customer Ready | Description | Link |\n|---|-------|----------|---------|----------|----------------|-------------|------|\n| 1 | meeting-followup | Skill | Knowledge workers | Cross Industry | Yes | Pulls action items from your last meeting and drafts a follow-up email. | [Download](https://microsoft.sharepoint-df.com/sites/ABSGSA/Lists/CopilotCoworkLibrary/DispForm.aspx?ID=1) |\n```\n\nRules (apply to both renderings):\n- Always use the literal action text `Download` — not \"Open\", not \"Link\", not the item title.\n- Truncate descriptions over ~140 chars with an ellipsis.\n- Show `Customer Ready` as `Yes` / `No` (not `true` / `false`).\n- Sort by Category, then Title.\n\n### Step 5 — Offer next steps\n\nAfter the table, offer 1–2 logical follow-ups:\n- \"Want me to narrow this further by industry or customer-ready status?\"\n- \"Want me to open one of these items and pull details from the attachment?\"\n\n## Output Format\n\nAlways inline markdown. Do not create a file unless the user explicitly asks for one.\n\n## Guardrails\n\n- **Never fabricate items.** Only return rows that came back from `ListListItems`. If the call fails or returns empty, say so — do not invent matches.\n- **Never invent download URLs.** Always construct the URL from the item's actual `id` field using the `DispForm.aspx?ID={id}` pattern.\n- **Field-name safety.** Field names in the list are `Title`, `Category`, `Persona`, `Industry`, `CustomerReady`, `Description`, `ShortDescription`, `Modified`. Use these exact keys.\n- **Pagination.** If `next_link` is present, follow it before filtering — partial pages produce wrong \"no match\" answers.\n- **Read-only.** This skill never creates, updates, or deletes items. If the user asks to add or modify a library item, tell them to use the SharePoint UI.\n\n## When NOT to Use\n\n- User asks about their **personal** skills in `/mnt/user-config/.claude/skills/` → use the `skills` skill instead.\n- User asks about **built-in** system skills (pdf, docx, calendar-management, etc.) → describe those directly.\n- User wants to **add** an item to the library → this skill is read-only; direct them to the SharePoint UI.\n- User asks to search OneDrive or SharePoint generally → use `SearchM365` with `sources=[\"files\"]` instead.\n","zh":"---\nname: cowork-library-search\ndescription: |\n  搜尋 ABS GSA SharePoint 網站上的 Copilot Cowork Library，並傳回相符項目，以及指向存放附加技能檔案之 SharePoint 項目頁面的 \"Download\" 連結。\n  支援的篩選條件：category（Skill / Plugin / Prompt）、persona（Knowledge workers, Sales, Management, Executives, Operations 等）、industry（Cross Industry, Legal, Retail 等）、customer-ready 旗標（true/false）、符合 Title 或 Description 的關鍵字，以及用於近期內容的 modified-after 日期（\"what's new this week\"）。\n  當使用者說「搜尋 cowork library」、「在 gallery 找技能」、「有哪些 sales 可用的 plugins」、「列出 executives 的 prompts」、「尋找會議相關 cowork 項目」、「顯示 customer-ready skills」、「retail 的 cowork gallery 有什麼」、「有 managers 用的 plugins 嗎」、「查詢 [topic] 相關 library items」、「這週 cowork library 有什麼新內容」、\"search the cowork library\", \"find skills in the gallery\", \"what plugins are available for sales\", \"list prompts for executives\", \"find cowork items about meetings\", \"show customer-ready skills\", \"what's in the cowork gallery for retail\", \"any plugins for managers\", \"look up library items about [topic]\", or \"what's new in the cowork library this week\" 時使用。\n  請勿使用此技能來 (a) 列出使用者的個人 skills — 請使用 `skills` skill；(b) 描述內建系統 skills — 直接回答；(c) 一般性搜尋 OneDrive 或 SharePoint 檔案 — 改用 `SearchM365` 搭配 `sources=[\"files\"]`。此技能僅限於 Copilot Cowork Library SharePoint 清單。\ncowork:\n  category: research\n  icon: Search\n---\n\n# Cowork Library 搜尋\n\n搜尋 Copilot Cowork Library SharePoint 清單，並傳回相符項目與下載連結。\n\n## Library 位置\n\n- **網站:** ABS - Global Solution Architects\n- **網站 ID:** `microsoft.sharepoint-df.com,243ad53f-1b98-4147-8162-7b1557299391,8b86e36e-e48e-4fda-9fe8-c1d6eab2b3ab`\n- **清單:** Copilot Cowork Library\n- **清單 ID:** `list_7` (alias) / `6c667e0a-5882-453e-9127-d70532841e28` (GUID)\n- **Gallery URL:** https://microsoft.sharepoint-df.com/sites/ABSGSA/Lists/CopilotCoworkLibrary/Cowork%20Full%20Gallery.aspx\n- **項目檢視模式:** `https://microsoft.sharepoint-df.com/sites/ABSGSA/Lists/CopilotCoworkLibrary/DispForm.aspx?ID={id}` — 這是 \"Download\" 目標（可存取附加技能檔案的 SharePoint 頁面）。\n\n## 工作流程\n\n### 步驟 1 — 擷取條件\n\n將使用者要求剖析為結構化篩選條件。支援的條件：\n\n| 條件 | 值 |\n|-----------|--------|\n| `category` | `Skill`, `Plugin`, `Prompt` |\n| `persona` | `Knowledge workers`, `Sales`, `Management`, `Executives`, `Operations`, etc. |\n| `industry` | `Cross Industry`, `Legal`, `Retail`, etc. |\n| `customer_ready` | `true` / `false` |\n| `keyword` | 自由文字 — 與 `Title` 和 `Description` 進行比對（不分大小寫） |\n| `modified_after` | ISO 日期（例如 `2026-05-20`）— 只保留 `Modified >= date` 的項目 |\n\n如果使用者只提供主題片語（例如 \"find something for meeting follow-ups\"），請視為 `keyword`。對於相對近期的說法（\"this week\", \"last 7 days\", \"since Monday\"），請使用使用者的本地時區解析為絕對 ISO 日期，再作為 `modified_after`。如果條件含糊，選擇合理的預設值並繼續 — 不要因要求釐清而中斷。\n\n### 步驟 2 — 查詢清單\n\n使用 `ListListItems` 擷取項目，然後在用戶端篩選。拉取較大的頁面（top=100）— library 規模很小。\n\n```\nListListItems(\n  site_id=\"microsoft.sharepoint-df.com,243ad53f-1b98-4147-8162-7b1557299391,8b86e36e-e48e-4fda-9fe8-c1d6eab2b3ab\",\n  list_id=\"list_7\",\n  top=100\n)\n```\n\n如果分頁傳回 `next_link`，請先沿著它取得完整集合，再套用篩選條件。\n\n### 步驟 3 — 套用篩選條件\n\n針對每個項目，讀取 `fields` 區塊；只有在**所有**指定條件都相符時才保留該項目：\n\n- `Category` 等於要求的 category（不分大小寫）\n- `Persona` 等於要求的 persona（不分大小寫）\n- `Industry` 等於要求的 industry（不分大小寫）\n- `CustomerReady` 等於要求的布林值\n- `keyword` 出現在 `Title` 或 `Description` 任一欄位中（不分大小寫的子字串比對）\n- `Modified`（ISO datetime）≥ `modified_after`\n\n如果沒有相符項目，請清楚說明，並建議放寬一項條件（例如移除 industry 篩選或放寬日期範圍）。\n\n### 步驟 4 — 呈現結果\n\n對於有 2 個以上相符項目的結果集，預設透過 `render_ui` 呈現 **Adaptive Card**。如果只有一個相符項目，則退回單行 markdown（單列資料不需要卡片）。\n\n**卡片呈現（2 個以上相符項目）:**\n\n1. 先叫用 `render-ui` skill，載入 schema 與驗證規則，然後呼叫 `render_ui`。\n2. 依下列方式建立卡片本文：\n   - 開頭 `TextBlock`（`size: Large`, `weight: Bolder`）標題為 `\"Cowork Library — N 筆相符\"`。\n   - 第二個 `TextBlock`（`isSubtle: true`, `wrap: true`）摘要說明已套用的篩選條件，例如 _\"篩選條件: category = Skill · persona = Knowledge workers\"_。\n   - 每個結果一個 `Container`，以 `separator: true` 分隔，每個 Container 包含：\n     - 一個 `ColumnSet`，含兩欄：第 1 欄（`width: stretch`）放標題（`TextBlock`, `weight: Bolder`, `size: Medium`）與描述（`TextBlock`, `wrap: true`，以省略符號截斷至約 140 chars）；第 2 欄（`width: auto`）放 `ActionSet`，其中只有一個 `Action.OpenUrl`，其 `title` 是字面字串 `\"Download\"`，其 `url` 是該項目的 `DispForm.aspx?ID={id}`。\n     - 欄位下方放 `FactSet`，facts 包含：`Category`, `Persona`, `Industry`, `Customer Ready`（是 / 否）, `Modified`（格式化為 `YYYY-MM-DD`）。\n3. 依 Category、再依 Title 排序結果容器。\n4. 在 `render_ui` 呼叫後，於卡片下方加上一行簡短純文字：_\"Download 按鈕會開啟 SharePoint 項目頁面，可在該頁下載附加的技能檔案。\"_\n\n**Markdown 後援（單一相符項目或 `render_ui` 無法使用）:**\n\n呈現一列 markdown 表格，包含相同欄位。**Link** 欄必須是 markdown 連結，字面文字為 `Download`，指向該項目的 `DispForm.aspx?ID={id}` URL。\n\n```\n| # | Title | Category | Persona | Industry | Customer Ready | Description | Link |\n|---|-------|----------|---------|----------|----------------|-------------|------|\n| 1 | meeting-followup | Skill | Knowledge workers | Cross Industry | Yes | Pulls action items from your last meeting and drafts a follow-up email. | [Download](https://microsoft.sharepoint-df.com/sites/ABSGSA/Lists/CopilotCoworkLibrary/DispForm.aspx?ID=1) |\n```\n\n規則（套用於兩種呈現方式）：\n- 一律使用字面動作文字 `Download` — 不是 \"Open\"，不是 \"Link\"，也不是項目標題。\n- 描述超過約 140 chars 時，以省略符號截斷。\n- 將 `Customer Ready` 顯示為 `是` / `否`（不是 `true` / `false`）。\n- 依 Category、再依 Title 排序。\n\n### 步驟 5 — 提供後續步驟\n\n表格後方提供 1–2 個合理的後續操作：\n- 「要我再依 industry 或 customer-ready 狀態縮小範圍嗎？」\n- 「要我開啟其中一個項目，並從附件擷取詳細資料嗎？」\n\n## 輸出格式\n\n一律使用行內 markdown。除非使用者明確要求建立檔案，否則不要建立檔案。\n\n## 護欄\n\n- **絕不捏造項目。** 只傳回來自 `ListListItems` 的列。如果呼叫失敗或傳回空值，請照實說明 — 不要編造相符項目。\n- **絕不編造下載 URL。** 一律使用項目的實際 `id` 欄位，依 `DispForm.aspx?ID={id}` 模式建立 URL。\n- **欄位名稱安全。** 清單中的欄位名稱是 `Title`, `Category`, `Persona`, `Industry`, `CustomerReady`, `Description`, `ShortDescription`, `Modified`。請使用這些確切鍵值。\n- **分頁。** 如果存在 `next_link`，請先沿著它取得資料再篩選 — 部分頁面會產生錯誤的「無相符」答案。\n- **唯讀。** 此技能絕不建立、更新或刪除項目。如果使用者要求新增或修改 library 項目，請告訴他們使用 SharePoint UI。\n\n## 不使用時機\n\n- 使用者詢問其 `/mnt/user-config/.claude/skills/` 中的**個人** skills → 改用 `skills` skill。\n- 使用者詢問**內建**系統 skills（pdf、docx、calendar-management 等）→ 直接說明。\n- 使用者想要**新增**項目到 library → 此技能為唯讀；請引導他們使用 SharePoint UI。\n- 使用者要求一般性搜尋 OneDrive 或 SharePoint → 改用 `SearchM365` 搭配 `sources=[\"files\"]`。","cn":"---\nname: cowork-library-search\ndescription: |\n  搜索 ABS GSA SharePoint 站点上的 Copilot Cowork Library，并返回匹配项目，以及指向存放附加技能文件的 SharePoint 项目页的 \"Download\" 链接。\n  支持的筛选条件：category（Skill / Plugin / Prompt）、persona（Knowledge workers, Sales, Management, Executives, Operations 等）、industry（Cross Industry, Legal, Retail 等）、customer-ready 标记（true/false）、匹配 Title 或 Description 的关键词，以及用于查看近期内容的 modified-after 日期（\"what's new this week\"）。\n  当用户说“搜索 cowork library”、“在 gallery 里找技能”、“有哪些 sales 可用的 plugins”、“列出 executives 的 prompts”、“查找会议相关的 cowork 项目”、“显示 customer-ready skills”、“retail 的 cowork gallery 里有什么”、“有没有 managers 用的 plugins”、“查询 [topic] 相关 library items”、“这周 cowork library 有什么新内容”、\"search the cowork library\", \"find skills in the gallery\", \"what plugins are available for sales\", \"list prompts for executives\", \"find cowork items about meetings\", \"show customer-ready skills\", \"what's in the cowork gallery for retail\", \"any plugins for managers\", \"look up library items about [topic]\", or \"what's new in the cowork library this week\" 时使用。\n  不要使用此技能来 (a) 列出用户的个人 skills — 请使用 `skills` skill；(b) 描述内置系统 skills — 直接回答；(c) 泛化搜索 OneDrive 或 SharePoint 文件 — 改用 `SearchM365` 并设置 `sources=[\"files\"]`。此技能仅限于 Copilot Cowork Library SharePoint 列表。\ncowork:\n  category: research\n  icon: Search\n---\n\n# Cowork Library 搜索\n\n搜索 Copilot Cowork Library SharePoint 列表，并返回匹配项目及下载链接。\n\n## Library 位置\n\n- **站点:** ABS - Global Solution Architects\n- **站点 ID:** `microsoft.sharepoint-df.com,243ad53f-1b98-4147-8162-7b1557299391,8b86e36e-e48e-4fda-9fe8-c1d6eab2b3ab`\n- **列表:** Copilot Cowork Library\n- **列表 ID:** `list_7` (alias) / `6c667e0a-5882-453e-9127-d70532841e28` (GUID)\n- **Gallery URL:** https://microsoft.sharepoint-df.com/sites/ABSGSA/Lists/CopilotCoworkLibrary/Cowork%20Full%20Gallery.aspx\n- **项目查看模式:** `https://microsoft.sharepoint-df.com/sites/ABSGSA/Lists/CopilotCoworkLibrary/DispForm.aspx?ID={id}` — 这是 \"Download\" 目标（可访问附加技能文件的 SharePoint 页面）。\n\n## 工作流\n\n### 步骤 1 — 捕获条件\n\n将用户请求解析成结构化筛选条件。支持的条件：\n\n| 条件 | 取值 |\n|-----------|--------|\n| `category` | `Skill`, `Plugin`, `Prompt` |\n| `persona` | `Knowledge workers`, `Sales`, `Management`, `Executives`, `Operations`, etc. |\n| `industry` | `Cross Industry`, `Legal`, `Retail`, etc. |\n| `customer_ready` | `true` / `false` |\n| `keyword` | 自由文本 — 与 `Title` 和 `Description` 进行匹配（不区分大小写） |\n| `modified_after` | ISO 日期（例如 `2026-05-20`）— 仅保留 `Modified >= date` 的项目 |\n\n如果用户只提供了一个主题短语（例如 \"find something for meeting follow-ups\"），按 `keyword` 处理。对于相对时间说法（\"this week\", \"last 7 days\", \"since Monday\"），基于用户本地时区解析为绝对 ISO 日期，再用作 `modified_after`。如果条件含糊，选择合理默认值并继续 — 不要因为澄清而阻塞。\n\n### 步骤 2 — 查询列表\n\n使用 `ListListItems` 获取项目，然后在客户端筛选。拉取较大的页面（top=100）— 这个库规模不大。\n\n```\nListListItems(\n  site_id=\"microsoft.sharepoint-df.com,243ad53f-1b98-4147-8162-7b1557299391,8b86e36e-e48e-4fda-9fe8-c1d6eab2b3ab\",\n  list_id=\"list_7\",\n  top=100\n)\n```\n\n如果分页返回 `next_link`，先继续拉取完整数据集，再应用筛选。\n\n### 步骤 3 — 应用筛选\n\n对每个项目，读取 `fields` 区块；只有在**所有**指定条件都匹配时才保留该项目：\n\n- `Category` 等于请求的 category（不区分大小写）\n- `Persona` 等于请求的 persona（不区分大小写）\n- `Industry` 等于请求的 industry（不区分大小写）\n- `CustomerReady` 等于请求的布尔值\n- `keyword` 出现在 `Title` 或 `Description` 任一字段中（不区分大小写的子字符串匹配）\n- `Modified`（ISO datetime）≥ `modified_after`\n\n如果没有匹配项，直接说明，并建议放宽一个条件（例如去掉 industry 筛选或扩大日期范围）。\n\n### 步骤 4 — 呈现结果\n\n对于 2 个及以上匹配项的结果集，默认通过 `render_ui` 呈现 **Adaptive Card**。如果只有一个匹配项，则使用一行 markdown 作为兜底（一行数据没必要使用卡片）。\n\n**卡片呈现（2 个及以上匹配项）:**\n\n1. 先调用 `render-ui` skill，加载 schema 和验证规则，然后调用 `render_ui`。\n2. 按如下方式构建卡片正文：\n   - 开头的 `TextBlock`（`size: Large`, `weight: Bolder`）标题为 `\"Cowork Library — N 个匹配项\"`。\n   - 第二个 `TextBlock`（`isSubtle: true`, `wrap: true`）总结已应用的筛选条件，例如 _\"筛选条件: category = Skill · persona = Knowledge workers\"_。\n   - 每个结果一个 `Container`，使用 `separator: true` 分隔，每个 Container 包含：\n     - 一个 `ColumnSet`，包含两列：第 1 列（`width: stretch`）放标题（`TextBlock`, `weight: Bolder`, `size: Medium`）和描述（`TextBlock`, `wrap: true`，用省略号截断到约 140 chars）；第 2 列（`width: auto`）放 `ActionSet`，其中只有一个 `Action.OpenUrl`，其 `title` 是字面字符串 `\"Download\"`，其 `url` 是该项目的 `DispForm.aspx?ID={id}`。\n     - 在列下方放 `FactSet`，facts 包括：`Category`, `Persona`, `Industry`, `Customer Ready`（是 / 否）, `Modified`（格式化为 `YYYY-MM-DD`）。\n3. 按 Category、再按 Title 对结果容器排序。\n4. 在 `render_ui` 调用之后，在卡片下方补充一行简短纯文本：_\"Download 按钮会打开 SharePoint 项目页面，可在该页面下载附加的技能文件。\"_\n\n**Markdown 兜底（单个匹配项或 `render_ui` 不可用）:**\n\n呈现一行 markdown 表格，包含相同列。**Link** 列必须是 markdown 链接，字面文本为 `Download`，指向该项目的 `DispForm.aspx?ID={id}` URL。\n\n```\n| # | Title | Category | Persona | Industry | Customer Ready | Description | Link |\n|---|-------|----------|---------|----------|----------------|-------------|------|\n| 1 | meeting-followup | Skill | Knowledge workers | Cross Industry | Yes | Pulls action items from your last meeting and drafts a follow-up email. | [Download](https://microsoft.sharepoint-df.com/sites/ABSGSA/Lists/CopilotCoworkLibrary/DispForm.aspx?ID=1) |\n```\n\n规则（适用于两种呈现方式）：\n- 始终使用字面动作文本 `Download` — 不是 \"Open\"，不是 \"Link\"，也不是项目标题。\n- 描述超过约 140 chars 时，用省略号截断。\n- 将 `Customer Ready` 显示为 `是` / `否`（不是 `true` / `false`）。\n- 按 Category、再按 Title 排序。\n\n### 步骤 5 — 提供下一步\n\n表格后提供 1–2 个合理的后续操作：\n- “要我再按 industry 或 customer-ready 状态进一步缩小范围吗？”\n- “要我打开其中一个项目，并从附件中提取详细信息吗？”\n\n## 输出格式\n\n始终内联输出 markdown。除非用户明确要求创建文件，否则不要创建文件。\n\n## 护栏\n\n- **绝不编造项目。** 只返回来自 `ListListItems` 的行。如果调用失败或返回为空，如实说明 — 不要虚构匹配项。\n- **绝不编造下载 URL。** 始终使用项目实际的 `id` 字段，并按 `DispForm.aspx?ID={id}` 模式构造 URL。\n- **字段名安全。** 列表中的字段名是 `Title`, `Category`, `Persona`, `Industry`, `CustomerReady`, `Description`, `ShortDescription`, `Modified`。请使用这些精确键名。\n- **分页。** 如果存在 `next_link`，先继续拉取再筛选 — 只处理部分页面会给出错误的“无匹配”答案。\n- **只读。** 此技能不会创建、更新或删除项目。如果用户要求新增或修改 library 项目，请让他们使用 SharePoint UI。\n\n## 不使用时机\n\n- 用户询问 `/mnt/user-config/.claude/skills/` 中的**个人** skills → 改用 `skills` skill。\n- 用户询问**内置**系统 skills（pdf、docx、calendar-management 等）→ 直接说明。\n- 用户想向 library **新增**项目 → 此技能只读；请引导他们使用 SharePoint UI。\n- 用户要求泛化搜索 OneDrive 或 SharePoint → 改用 `SearchM365` 并设置 `sources=[\"files\"]`。"},"frontend-design":{"en":"---\nname: frontend-design\ndescription: Build distinctive, production-grade frontend interfaces with a strong point of view. Use this skill when the user asks to design or implement a web component, page, landing site, dashboard, marketing site, or any UI surface. Generates working code with intentional aesthetic choices that avoid default AI-template looks.\n---\n\nThis skill produces frontend code that looks like it was designed, not generated. Every output should have a clear aesthetic identity, polished execution, and details that reward a second look.\n\nThe user will describe what they want built — a component, a page, an entire app — and may include context about audience, brand, framework, or constraints. If brand or tone are unspecified, choose a direction and commit to it; do not default to a neutral template.\n\n## Pre-flight: Commit to a Direction\n\nBefore writing any code, answer four questions internally:\n\n- **Purpose**: What is this interface for, and who is the user? What action should they take?\n- **Tone**: Pick one and commit. Options include — editorial/print-inspired, brutalist/raw HTML, swiss/typographic, retro-terminal, soft neumorphic, glassmorphic/aurora, vaporwave, art nouveau, bauhaus geometric, hand-drawn/sketchy, cyberpunk, monospace utilitarian, luxury/serif-heavy, ransom-note collage, isometric/3D, ambient/nature-inspired. Mix two if they reinforce each other; never blend three.\n- **Constraints**: Framework, browser targets, accessibility floor (WCAG AA minimum unless told otherwise), performance budget, responsive breakpoints.\n- **The Hook**: What is the one element a visitor will remember and describe to a friend? Every design needs one signature move — a typographic stunt, an unusual layout primitive, an unexpected interaction, a striking color pairing.\n\n**CRITICAL**: Intentionality beats intensity. A restrained design executed with precision is stronger than a loud design executed sloppily. Pick a lane and own it.\n\n## Output Requirements\n\nEvery deliverable must be:\n\n- **Working**: real code that runs without modification — no pseudocode, no `// TODO: implement`\n- **Accessible**: semantic HTML, keyboard navigable, sufficient contrast, focus states designed (not browser-default)\n- **Responsive**: mobile-first or explicitly desktop-only by design choice, never \"broken on mobile by accident\"\n- **Cohesive**: one design system, one motion language, one tonal voice across the whole output\n- **Refined**: the small details — letter-spacing on headings, optical alignment, hover states, empty states, loading states — are intentional, not omitted\n\n## Craft Guidelines\n\n- **Typography**: Type is the loudest design choice. Use Google Fonts, Fontshare, or system fallbacks creatively. Pair a characterful display face with a readable text face — e.g. Fraunces + Inter Tight, PP Editorial New + JetBrains Mono, Instrument Serif + Geist, Söhne + Tiempos. Push variable font axes (weight, optical size, slant). Use real typographic detail: hanging punctuation, true small caps, tabular numerals where they belong, ligatures, drop caps on long-form content. Avoid the safe defaults — Inter alone, Roboto, Arial, Helvetica with no opinion.\n\n- **Color**: One dominant color, one or two accents, and a deliberate neutral. Define everything as CSS custom properties. Light, dark, or duotone — decide upfront. Consider unusual palettes: warm off-white + ink black + a single saturated accent; deep navy + cream + brass; near-black + acid green; sand + terracotta + ocean. Avoid the AI tells: indigo-to-purple gradients on white, slate-50 backgrounds with slate-900 text and a blue-600 button.\n\n- **Layout & Composition**: Grids exist to be used intentionally — to align, or to break against deliberately. Try asymmetry, deliberate overlap, oversized type that crops out of its container, sidebars that feel editorial, baseline grids on long-form text. Generous whitespace OR controlled density — pick one. Avoid the \"three-column feature card grid abov","zh":"---\nname: frontend-design\ndescription: 建立有鮮明觀點、可上線使用的高品質前端介面。當使用者要求設計或實作 Web component、頁面、landing site、dashboard、marketing site 或任何 UI 介面時使用此技能；也可在使用者說「設計一個網頁元件」、「做一個落地頁」、「設計 dashboard」、「重做這個 UI」、「建立行銷網站」時使用。產生可運作的程式碼，並做出有意識的美學選擇，避免看起來像預設 AI-template。\n---\n\n這個技能會產出看起來像經過設計、而不是被生成出來的前端程式碼。每個輸出都應該有清楚的美學識別、精緻的執行，以及值得再看一眼的細節。\n\n使用者會描述想要建置的內容 — 一個元件、一個頁面、整個應用程式 — 也可能包含受眾、品牌、框架或限制條件等背景。如果沒有指定品牌或語氣，請自行選擇方向並貫徹；不要預設成中性的範本。\n\n## 前置準備：確立方向\n\n撰寫任何程式碼之前，先在內部回答四個問題：\n\n- **目的**：這個介面用來做什麼，使用者是誰？他們應該採取什麼行動？\n- **語氣**：選一個並貫徹。選項包括 — 編輯/印刷風（editorial/print-inspired）、粗野主義/原始 HTML（brutalist/raw HTML）、瑞士字體風（swiss/typographic）、復古終端機（retro-terminal）、柔和擬物（soft neumorphic）、玻璃擬態/極光（glassmorphic/aurora）、蒸氣波（vaporwave）、新藝術（art nouveau）、bauhaus 幾何（bauhaus geometric）、手繪/草圖（hand-drawn/sketchy）、賽博龐克（cyberpunk）、等寬實用風（monospace utilitarian）、奢華/大量襯線（luxury/serif-heavy）、勒索信拼貼（ransom-note collage）、等角/3D（isometric/3D）、環境/自然靈感（ambient/nature-inspired）。若兩者能互相強化，可以混合兩種；絕不要混合三種。\n- **限制**：框架、瀏覽器目標、無障礙底線（除非另有指示，最低為 WCAG AA）、效能預算、響應式斷點。\n- **記憶點**：訪客會記住並向朋友描述的那一個元素是什麼？每個設計都需要一個招牌動作 — 字體上的巧思、不尋常的版面原語、意料之外的互動、醒目的配色。\n\n**CRITICAL**：意圖明確勝過強度堆疊。精準執行的克制設計，比粗糙執行的高聲量設計更有力量。選定路線，並把它做到位。\n\n## 輸出要求\n\n每個交付項目都必須：\n\n- **可運作**：是不需修改即可執行的真實程式碼 — 沒有 pseudocode，沒有 `// TODO: implement`\n- **無障礙**：語意化 HTML、可用鍵盤操作、對比足夠、焦點狀態經過設計（不是瀏覽器預設）\n- **響應式**：採 mobile-first，或基於設計選擇明確只支援桌面；絕不能是「意外在手機上壞掉」\n- **一致**：整個輸出使用一套設計系統、一種動態語言、一致的語氣\n- **精緻**：小細節 — 標題字距、視覺對齊、hover 狀態、空狀態、載入狀態 — 都是有意安排，而不是省略\n\n## 工藝準則\n\n- **字體**：字體是最響亮的設計選擇。創意地使用 Google Fonts、Fontshare 或系統備援字體。將有個性的展示字體與易讀的內文字體配對 — 例如 Fraunces + Inter Tight、PP Editorial New + JetBrains Mono、Instrument Serif + Geist、Söhne + Tiempos。推動 variable font 軸線（weight、optical size、slant）。使用真正的排版細節：懸掛標點、真正的小型大寫、在適合處使用表格數字、連字、長文內容的首字放大。避開安全預設 — 單獨使用 Inter、Roboto、Arial、Helvetica 且沒有觀點。\n\n- **色彩**：一個主色、一到兩個強調色，以及刻意選定的中性色。把所有顏色定義為 CSS custom properties。亮色、暗色或雙色 — 一開始就決定。考慮不尋常的色盤：溫暖米白 + 墨黑 + 一個高飽和強調色；深海軍藍 + 奶油色 + 黃銅色；近黑 + 酸性綠；沙色 + 陶土色 + 海洋色。避開 AI 痕跡：白底上的靛紫漸層、slate-50 背景搭 slate-900 文字和 blue-600 按鈕。\n\n- **版面與構圖**：網格存在的目的，是被有意識地使用 — 用來對齊，或被刻意打破。嘗試不對稱、刻意重疊、裁出容器外的超大字、帶有編輯感的側欄、長文的 baseline grid。寬裕留白或受控密度 — 選一個。避免那種「三欄式功能卡片網格」的預設感\n","cn":"---\nname: frontend-design\ndescription: 构建有鲜明观点、可直接用于生产环境的高质量前端界面。当用户要求设计或实现 Web component、页面、landing site、dashboard、marketing site 或任何 UI 界面时使用此技能；也可在用户说“设计一个 Web 组件”、“做一个落地页”、“设计仪表盘”、“重做这个 UI”、“搭建营销网站”时使用。生成可运行的代码，并做出有意识的美学选择，避免默认 AI-template 风格。\n---\n\n此技能会产出看起来像被真正设计过、而不是自动生成的前端代码。每个输出都应具备清晰的美学身份、打磨到位的执行，以及值得二次品味的细节。\n\n用户会描述想要构建的内容 — 一个组件、一个页面、一个完整应用 — 也可能提供受众、品牌、框架或约束等背景。如果没有指定品牌或调性，请自行选择方向并坚持到底；不要默认套用中性模板。\n\n## 前置准备：确定方向\n\n编写任何代码前，先在内部回答四个问题：\n\n- **目的**：这个界面用于什么场景，用户是谁？他们应该采取什么行动？\n- **调性**：选定一种并坚持。可选方向包括 — 编辑/印刷风（editorial/print-inspired）、粗野主义/原始 HTML（brutalist/raw HTML）、瑞士排版风（swiss/typographic）、复古终端（retro-terminal）、柔和拟物（soft neumorphic）、玻璃拟态/极光（glassmorphic/aurora）、蒸汽波（vaporwave）、新艺术（art nouveau）、bauhaus 几何（bauhaus geometric）、手绘/草图（hand-drawn/sketchy）、赛博朋克（cyberpunk）、等宽实用风（monospace utilitarian）、奢华/重衬线（luxury/serif-heavy）、勒索信拼贴（ransom-note collage）、等距/3D（isometric/3D）、环境/自然灵感（ambient/nature-inspired）。如果两种方向能相互强化，可以混合两种；绝不要混合三种。\n- **约束**：框架、浏览器目标、无障碍底线（除非另有说明，最低为 WCAG AA）、性能预算、响应式断点。\n- **记忆点**：访客会记住并向朋友描述的那个元素是什么？每个设计都需要一个标志性动作 — 字体上的巧思、不寻常的排版原语、意料之外的交互、醒目的配色。\n\n**CRITICAL**：明确意图胜过堆砌强度。精准执行的克制设计，比粗糙执行的高刺激设计更有力量。选定路线，并把它做透。\n\n## 输出要求\n\n每个交付物都必须：\n\n- **可运行**：是真实代码，无需修改即可运行 — 没有 pseudocode，没有 `// TODO: implement`\n- **无障碍**：语义化 HTML、支持键盘导航、对比度充足、焦点状态经过设计（不是浏览器默认样式）\n- **响应式**：采用 mobile-first，或基于明确设计选择仅支持桌面；绝不能是“手机端意外坏掉”\n- **一致**：整个输出使用一套设计系统、一种动效语言、一致的语气\n- **精致**：小细节 — 标题字距、视觉对齐、hover 状态、空状态、加载状态 — 都经过有意设计，而不是被省略\n\n## 工艺准则\n\n- **字体**：字体是最响亮的设计选择。创造性地使用 Google Fonts、Fontshare 或系统回退字体。将有性格的展示字体与易读的正文字体配对 — 例如 Fraunces + Inter Tight、PP Editorial New + JetBrains Mono、Instrument Serif + Geist、Söhne + Tiempos。充分利用 variable font 轴（weight、optical size、slant）。使用真正的排版细节：悬挂标点、真正的小型大写、在合适位置使用表格数字、连字、长文内容的首字下沉。避开安全默认项 — 单独使用 Inter、Roboto、Arial、Helvetica 且没有观点。\n\n- **颜色**：一个主色、一到两个强调色，以及一个刻意选择的中性色。所有颜色都定义为 CSS custom properties。浅色、深色或双色 — 一开始就决定。考虑不常见的配色：暖米白 + 墨黑 + 一个高饱和强调色；深海军蓝 + 奶油色 + 黄铜色；近黑 + 酸性绿；沙色 + 陶土色 + 海洋色。避开 AI 痕迹：白底上的靛蓝到紫色渐变、slate-50 背景配 slate-900 文本和 blue-600 按钮。\n\n- **排版与构图**：网格要被有意使用 — 用来对齐，或被刻意打破。尝试不对称、刻意重叠、裁出容器外的超大字体、带有编辑感的侧栏、长文的 baseline grid。大留白或受控密度 — 二选一。避免那种“三栏功能卡片网格”的模板感\n"}}};
const S = { lang: "zh", cat: "all", q: "", tab: "guide" };
const $ = s => document.querySelector(s);
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c;
  if (x != null) n.textContent = x; return n; };
const CAT = Object.fromEntries(D.cats.map(c => [c.id, c]));
const ACT = Object.fromEntries(D.acts.map(a => [a.id, a]));
let openSlug = null;

/* ---------- language / theme ---------- */
function detectLang() {
  const p = new URLSearchParams(location.search).get("lang");
  const saved = p || localStorage.getItem("cwskills.lang");
  if (saved && D.ui[saved]) return saved;
  const n = (navigator.languages || [navigator.language || "en"]).join(",").toLowerCase();
  if (/zh-(cn|sg|hans)/.test(n)) return "cn";
  if (/zh/.test(n)) return "zh";
  return "en";
}
function setLang(l) {
  S.lang = l;
  localStorage.setItem("cwskills.lang", l);
  document.body.dataset.lang = l;
  document.documentElement.lang =
    l === "zh" ? "zh-Hant" : l === "cn" ? "zh-Hans" : "en";
  document.querySelectorAll("[data-lb]").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.lb === l)));
  paintStatic();
  render();
  if (openSlug) openPanel(openSlug, true);
}
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  localStorage.setItem("cwskills.theme", t);
  $("#themeBtn").textContent = t === "dark" ? "\u2600" : "\u263D";
  $("#themeBtn").setAttribute("aria-label", t === "dark" ? "Light mode" : "Dark mode");
}

/* ---------- static text ---------- */
function paintStatic() {
  const u = D.ui[S.lang];
  $("#kicker").textContent = u.kicker;
  $("#h1").textContent = u.title;
  $("#lede").textContent = u.lede;
  $("#srcline").textContent = u.src;
  $("#s1").textContent = u.n_skill;
  $("#s2").textContent = u.n_cat;
  $("#s3").textContent = u.n_act;
  $("#q").placeholder = u.search;
  $("#pbTitle").textContent = u.playbook;
  $("#pbDesc").textContent = u.playbook_d;
  $("#pbCta").textContent = u.playbook_cta;
  $("#dlAll").textContent = u.dl_all;
  $("#pbLink").href = "../index.html?lang=" + S.lang;
  $("#footnote").textContent = u.foot;
  $("#brandT").textContent = u.title;
  document.title = u.title + " \u00b7 Copilot Cowork";
  buildChips();
}
function buildChips() {
  const u = D.ui[S.lang], box = $("#chips");
  box.innerHTML = "";
  const mk = (id, label, color, n) => {
    const b = el("button", "chip");
    b.dataset.cat = id;
    b.setAttribute("aria-pressed", String(S.cat === id));
    if (color) { const d = el("span", "dot"); d.style.setProperty("--c", color); b.appendChild(d); }
    b.appendChild(el("span", null, label));
    b.appendChild(el("span", "cnt", String(n)));
    b.onclick = () => { S.cat = id; buildChips(); render(); };
    box.appendChild(b);
  };
  mk("all", u.all, null, D.items.length);
  D.cats.forEach(c => {
    const n = D.items.filter(i => i.cat === c.id).length;
    if (n) mk(c.id, c.label[S.lang], c.color, n);
  });
}

/* ---------- grid ---------- */
function match(it) {
  if (S.cat !== "all" && it.cat !== S.cat) return false;
  if (!S.q) return true;
  return S.q.split(/\s+/).every(t => it["q_" + S.lang].includes(t));
}
function render() {
  const g = $("#grid"), u = D.ui[S.lang];
  g.innerHTML = "";
  const list = D.items.filter(match);
  $("#empty").hidden = list.length > 0;
  $("#empty").textContent = u.none_found;
  g.hidden = list.length === 0;
  list.forEach(it => {
    const c = CAT[it.cat], L = it[S.lang];
    const b = el("button", "card");
    b.type = "button";
    b.style.setProperty("--c", c.color);
    b.appendChild(el("span", "num", String(it.n).padStart(2, "0")));
    const cat = el("span", "cat");
    const d = el("span", "dot"); d.style.setProperty("--c", c.color);
    cat.appendChild(d); cat.appendChild(el("span", null, c.label[S.lang]));
    b.appendChild(cat);
    b.appendChild(el("h3", null, L.title));
    b.appendChild(el("span", "slug", it.slug));
    b.appendChild(el("p", null, L.sum));
    const f = el("div", "foot");
    f.appendChild(el("span", "tag act", ACT[it.act].label[S.lang]));
    const vis = it.tools.filter(t => t.id !== "none");
    vis.slice(0, 3).forEach(t => f.appendChild(el("span", "tag", t.label[S.lang])));
    if (vis.length > 3) f.appendChild(el("span", "tag", "+" + (vis.length - 3)));
    b.appendChild(f);
    b.onclick = () => openPanel(it.slug);
    g.appendChild(b);
  });
}

/* ---------- panel ---------- */
function block(title, kind, data) {
  const s = el("section");
  s.appendChild(el("h4", null, title));
  if (kind === "p") { s.appendChild(el("p", null, data)); return s; }
  const list = el(kind === "ol" ? "ol" : "ul", kind === "rail" ? "rail" : null);
  data.forEach(x => list.appendChild(el("li", null, x)));
  s.appendChild(list);
  return s;
}

/* Light syntax tinting for the raw SKILL.md view. Escapes first, so it is safe. */
function tintMarkdown(src) {
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const lines = src.replace(/\r\n/g, "\n").split("\n");
  let fm = false, fence = false, out = [];
  lines.forEach((raw, i) => {
    let t = esc(raw);
    if (raw.trim() === "---" && (i === 0 || fm)) {
      fm = i === 0 ? true : false;
      out.push('<span class="fm">' + t + "</span>");
      return;
    }
    if (/^```/.test(raw)) {
      fence = !fence;
      out.push('<span class="c">' + t + "</span>");
      return;
    }
    if (fence) { out.push('<span class="c">' + t + "</span>"); return; }
    if (fm) {
      t = t.replace(/&quot;([^&]*?)&quot;/g, '<span class="q">"$1"</span>')
           .replace(/"([^"]*?)"/g, '<span class="q">"$1"</span>');
      out.push('<span class="fm">' + t + "</span>");
      return;
    }
    if (/^#{1,6}\s/.test(raw)) { out.push('<span class="h">' + t + "</span>"); return; }
    t = t.replace(/\*\*([^*]+)\*\*/g, '<span class="b">**$1**</span>')
         .replace(/`([^`]+)`/g, '<span class="c">`$1`</span>');
    out.push(t);
  });
  return out.join("\n");
}

function download(name, text) {
  const b = new Blob([text], { type: "text/markdown;charset=utf-8" });
  const u = URL.createObjectURL(b);
  const a = document.createElement("a");
  a.href = u; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 1500);
}

function renderGuide(it) {
  const u = D.ui[S.lang], L = it[S.lang], a = ACT[it.act];
  const body = $("#pbody");
  body.innerHTML = "";
  body.appendChild(block(u.sum, "p", L.sum));

  const ab = el("section");
  ab.appendChild(el("h4", null, u.act_label));
  const box = el("div", "actbox");
  box.appendChild(el("b", null, a.label[S.lang]));
  box.appendChild(el("span", null, a.note[S.lang]));
  ab.appendChild(box);
  body.appendChild(ab);

  if (L.use.length) body.appendChild(block(u.use, "ul", L.use));
  if (L.avoid.length) body.appendChild(block(u.avoid, "ul", L.avoid));
  if (L.flow.length) body.appendChild(block(u.flow, "ol", L.flow));
  body.appendChild(block(u.out, "p", L.out));
  if (L.rail.length) body.appendChild(block(u.rail, "rail", L.rail));

  const ts = el("section");
  ts.appendChild(el("h4", null, u.trig));
  const wrap = el("div", "trigs");
  it.trig.forEach(t => wrap.appendChild(el("code", null, "\u201c" + t + "\u201d")));
  ts.appendChild(wrap);
  ts.appendChild(el("p", "note", u.trig_note));
  body.appendChild(ts);

  const kv = el("dl", "kv");
  const row = (k, v, mono) => {
    kv.appendChild(el("dt", null, k));
    const dd = el("dd");
    if (mono) dd.appendChild(el("code", null, v)); else dd.textContent = v;
    kv.appendChild(dd);
  };
  row(u.meta, it.src, true);
  row(u.tool_label, it.tools.map(t => t.label[S.lang]).join(" \u00b7 "));
  body.appendChild(kv);
}

function renderSource(it) {
  const u = D.ui[S.lang];
  const md = (D.md[it.slug] || {})[S.lang] || (D.md[it.slug] || {}).en || "";
  const body = $("#pbody");
  body.innerHTML = "";

  body.appendChild(el("p", "srcnote", u.src_note));

  const bar = el("div", "srcbar");
  bar.appendChild(el("span", "fn", it.slug + "/SKILL.md \u00b7 " + md.length.toLocaleString() +
    " " + u.chars));
  const seg = el("div", "seg");
  [["zh", "\u7e41"], ["cn", "\u7b80"], ["en", "EN"]].forEach(([code, label]) => {
    const b = el("button", null, label);
    b.setAttribute("aria-pressed", String(S.lang === code));
    b.onclick = () => setLang(code);
    seg.appendChild(b);
  });
  bar.appendChild(seg);
  const copy = el("button", "sbtn", u.copy);
  copy.onclick = () => {
    navigator.clipboard.writeText(md).then(() => {
      copy.textContent = u.copied;
      copy.classList.add("ok");
      setTimeout(() => { copy.textContent = u.copy; copy.classList.remove("ok"); }, 1600);
    });
  };
  bar.appendChild(copy);
  const dl = el("button", "sbtn primary", u.download);
  dl.onclick = () => download("SKILL.md", md);
  bar.appendChild(dl);
  body.appendChild(bar);

  const pre = el("pre", "md");
  pre.innerHTML = tintMarkdown(md);
  body.appendChild(pre);
}

function paintPanel(it, keepScroll) {
  const prev = keepScroll ? $("#pbody").scrollTop : 0;
  if (S.tab === "src") renderSource(it); else renderGuide(it);
  $("#tabGuide").setAttribute("aria-selected", String(S.tab !== "src"));
  $("#tabSrc").setAttribute("aria-selected", String(S.tab === "src"));
  $("#pbody").scrollTop = prev;
}

function openPanel(slug, keepScroll) {
  const it = D.items.find(i => i.slug === slug);
  if (!it) return;
  const u = D.ui[S.lang], L = it[S.lang], c = CAT[it.cat];
  openSlug = slug;
  if (!keepScroll) S.tab = "guide";
  $("#pnum").textContent = String(it.n).padStart(2, "0") + " \u2014 " + c.label[S.lang];
  $("#ptitle").textContent = L.title;
  $("#pslug").textContent = it.slug;
  $("#tabGuide").textContent = u.tab_guide;
  $("#tabSrc").textContent = u.tab_src;
  paintPanel(it, keepScroll);
  $("#panel").classList.add("on");
  $("#scrim").classList.add("on");
  document.body.style.overflow = "hidden";
  if (!keepScroll) $("#pclose").focus();
}
function switchTab(t) {
  if (S.tab === t || !openSlug) { S.tab = t; return; }
  S.tab = t;
  const it = D.items.find(i => i.slug === openSlug);
  paintPanel(it, false);
}
function closePanel() {
  openSlug = null;
  $("#panel").classList.remove("on");
  $("#scrim").classList.remove("on");
  document.body.style.overflow = "";
}

/* ---------- boot ---------- */
document.querySelectorAll("[data-lb]").forEach(b =>
  b.onclick = () => setLang(b.dataset.lb));
$("#themeBtn").onclick = () =>
  setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
$("#q").oninput = e => { S.q = e.target.value.trim().toLowerCase(); render(); };
$("#dlAll").onclick = () => {
  const u = D.ui[S.lang];
  const sep = "\n\n" + "=".repeat(78) + "\n";
  const parts = D.items.map(it =>
    "FILE: " + it.slug + "/SKILL.md\n" + "=".repeat(78) + "\n\n" +
    ((D.md[it.slug] || {})[S.lang] || ""));
  const head = u.title + "\n" + u.bundle_note + "\n" +
    "generated " + new Date().toISOString().slice(0, 10) + "\n";
  download("Cowork_Skills_" + S.lang + ".md", head + sep + parts.join(sep));
};
$("#scrim").onclick = closePanel;
$("#pclose").onclick = closePanel;
$("#tabGuide").onclick = () => switchTab("guide");
$("#tabSrc").onclick = () => switchTab("src");
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if (openSlug) closePanel(); else $("#q").blur(); }
  if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); }
});
setTheme(localStorage.getItem("cwskills.theme") ||
  (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
$("#n1").textContent = D.items.length;
$("#n2").textContent = new Set(D.items.map(i => i.cat)).size;
$("#n3").textContent = new Set(D.items.map(i => i.act)).size;
setLang(detectLang());
</script>
</body>
</html>
