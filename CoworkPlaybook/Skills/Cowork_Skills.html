footer{border-top:1px solid var(--line);padding:34px 0 60px;color:var(--ink3);font-size:12.5px;

</style>

,"對外版自動回覆除非你明確同意，否則不寫出代理人姓名（隱私）","如果休假期間有你主辦的週期性會議，建議轉移主辦權，預設不取消"]},"cn":{"title":"休假前置准备","sum":"休假前三件事一次做完：起草自动回复、生成交接文档、扫出休假期间的会议并标注要谢绝、转交还是保留。","use":["宣布要休假／请年假","离开两个工作日以上","需要交接给代理人"],"avoid":["只请一天病假 → 直接设置自动回复就行","永久离职或转岗 → 用 stakeholder-comms","自动回复已经开着 → 用查询／关闭自动回复的工具"],"flow":["一次问完最少必要信息：代理对接人是谁、有无关键背景","起草对内与对外两版自动回复，先给你过目","扫描休假期间日历，逐场标注谢绝／转交／保留","生成交接文档：进行中项目、要盯的关键讨论串、可以忽略的事、材料放在哪","你确认后才执行：开启自动回复、发出谢绝说明、把交接文档发到团队频道"],"out":"自动回复草稿（对内／对外各一版）＋ 交接文档（代理对接人、进行中项目、关键讨论串、可忽略事项、材料位置）＋ 会议处置清单。","rail":["绝不在你过目并确认前就开启自动回复","绝不自动谢绝会议 —— 一定先把清单交给你审核","对外版自动回复除非你明确同意，否则不写出代理人姓名（隐私）","如果休假期间有你主办的周期性会议，建议转移主办权，默认不取消"]},"en":{"title":"OOF Prep","sum":"Three-part PTO prep in one pass: draft the auto-reply, build a handoff doc, and flag every meeting in the window as decline / delegate / keep.","use":["User announces PTO, vacation or leave","Two or more business days out","Coverage handoff needed"],"avoid":["Single sick day → just call SetAutoReply directly","Permanent leave or role change → use stakeholder-comms","Already-active OOF → use GetAutoReplySettings / DisableAutoReply"],"flow":["Ask for coverage contact and critical context in one batched question","Draft internal + external OOF messages and show them for review","Scan the calendar in the PTO window and flag decline / delegate / keep","Build the handoff doc: in-flight projects, threads to watch, what to ignore, where things live","On confirmation: enable OOF, send decline notes, post the handoff to a team channel"],"out":"OOF drafts (internal + external) + a handoff doc (coverage contact, in-flight projects, critical threads, ignorable items, where things live) + a meeting disposition list.","rail":["Never enable OOF without showing the draft and getting confirmation","Never auto-decline meetings — always show the list for approval first","For the external OOF, never name the coverage contact unless the user confirms (privacy)","For a recurring series the user organizes, suggest forwarding ownership — never cancel by default"]},"q_zh":"休假前置準備 休假前三件事一次做完：擬自動回覆、產交接文件、掃出休假期間的會議並標出要婉拒、代理還是保留。 自動回覆草稿（對內／對外各一版）＋ 交接文件（代理窗口、進行中專案、關鍵討論串、可忽略事項、資料位置）＋ 會議處置清單。 宣布要休假／請年假 離開兩個工作天以上 需要交接給代理人 只請一天病假 → 直接設自動回覆就好 永久離職或轉調 → 用 stakeholder-comms 自動回覆已經開著 → 用查詢／關閉自動回覆的工具 一次問完最少必要資訊：代理窗口是誰、有無關鍵背景 擬對內與對外兩版自動回覆，先給你看過 掃描休假期間行事曆，逐場標出婉拒／代理／保留 產交接文件：進行中專案、要盯的關鍵討論串、可以忽略的事、東西放哪裡 你確認後才執行：開啟自動回覆、送出婉拒說明、把交接文貼到團隊頻道 絕不在你看過草稿並確認前就開啟自動回覆 絕不自動婉拒會議 —— 一定先把清單給你核可 對外版自動回覆除非你明確同意，否則不寫出代理人姓名（隱私） 如果休假期間有你主辦的週期性會議，建議轉移主辦權，預設不取消 oof-prep prep me for pto going on vacation set up my oof i'm out next week out of office prep handoff before i leave oof prep three-part pto prep in one pass: draft the auto-reply, build a handoff doc, and flag every meeting in the window as decline / delegate / keep.","q_cn":"休假前置准备 休假前三件事一次做完：起草自动回复、生成交接文档、扫出休假期间的会议并标注要谢绝、转交还是保留。 自动回复草稿（对内／对外各一版）＋ 交接文档（代理对接人、进行中项目、关键讨论串、可忽略事项、材料位置）＋ 会议处置清单。 宣布要休假／请年假 离开两个工作日以上 需要交接给代理人 只请一天病假 → 直接设置自动回复就行 永久离职或转岗 → 用 stakeholder-comms 自动回复已经开着 → 用查询／关闭自动回复的工具 一次问完最少必要信息：代理对接人是谁、有无关键背景 起草对内与对外两版自动回复，先给你过目 扫描休假期间日历，逐场标注谢绝／转交／保留 生成交接文档：进行中项目、要盯的关键讨论串、可以忽略的事、材料放在哪 你确认后才执行：开启自动回复、发出谢绝说明、把交接文档发到团队频道 绝不在你过目并确认前就开启自动回复 绝不自动谢绝会议 —— 一定先把清单交给你审核 对外版自动回复除非你明确同意，否则不写出代理人姓名（隐私） 如果休假期间有你主办的周期性会议，建议转移主办权，默认不取消 oof-prep prep me for pto going on vacation set up my oof i'm out next week out of office prep handoff before i leave oof prep three-part pto prep in one pass: draft the auto-reply, build a handoff doc, and flag every meeting in the window as decline / delegate / keep.","q_en":"oof prep three-part pto prep in one pass: draft the auto-reply, build a handoff doc, and flag every meeting in the window as decline / delegate / keep. oof drafts (internal + external) + a handoff doc (coverage contact, in-flight projects, critical threads, ignorable items, where things live) + a meeting disposition list. user announces pto, vacation or leave two or more business days out coverage handoff needed single sick day → just call setautoreply directly permanent leave or role chang label":{"zh":"深度研究／網頁","cn":"深度研究／网页","en":"Deep research / Web"}}],"trig":["analyze our engagement survey","summarize the engagement survey into themes","build an engagement strategy for the CEO/SLT","create an HR enablement deck","turn survey results into a presentation","make an engagement infographic"],"zh":{"title":"員工敬業度調查全套交付","sum":"把一份敬業度調查匯出檔，跑成五階段管線：五大主題 → 策略文件 → 高層簡報 → 一頁資訊圖 → 影片腳本，全部互相接得起來。","use":["上傳敬業度／脈動／文化調查匯出檔想做分析","要從調查結果生出給執行長或高層的簡報","要一份以 Copilot 導入為核心、從人資延伸到業務的賦能策略","只想單獨要資訊圖或影片腳本"],"avoid":["安排或改期人資會議 → 用 schedule-meeting","只是一封狀態信或公告 → 用 stakeholder-comms","要排名、評分或比較個別員工績效 → 婉拒，改提供團隊／專案層級成果","要依受保護特徵（性別、年齡等）篩選人員 → 拒絕，改用角色／團隊／技能"],"flow":["階段 0：先找輸入檔，找不到就開口要，絕不自己編數據","階段 1：只從真實調查資料萃取剛好五個主題（走 Excel 技能）","階段 2：寫策略文件（Word）—— 趨勢、三項策略（短期＋兩年內）、高階摘要，並與約一萬人規模的同業做標竿對照（走深度研究並附引用）","階段 3：從策略文件生出高層執行簡報（PowerPoint）","階段 4：產一頁公司品牌配色的資訊圖（用程式碼輸出 PNG）","階段 5：寫 Copilot Create／Sora 可用的影片腳本（Word）","每個階段都建一個任務讓你看得到進度，並在報告完成前確認檔案真的落地"],"out":"五份成品：主題摘要、策略文件（.docx）、高層簡報（.pptx）、一頁資訊圖（.png）、影片腳本（.docx）。","rail":["調查資料閘門：沒有真實調查檔就絕不生成主題、統計或引述","絕不編造標竿、投資報酬率、KPI、姓名、日期或引述 —— 用 [Add: …] 佔位符，外部宣稱一律走深度研究並附引用","所有嵌入的數字都要先用程式算過再寫進文件","不做個人績效評估、不依受保護特徵做人員側寫 —— 婉拒並提供合規替代方案","交付閘門：每產出一個檔案就實際確認檔案存在，才回報完成","一次要全部也要照相依順序跑：調查 → 主題 → 策略 → 簡報／資訊圖／腳本"]},"cn":{"title":"员工敬业度调研全套交付","sum":"把一份敬业度调研导出文件，跑成五阶段流水线：五大主题 → 策略文档 → 高管汇报 → 一页信息图 → 视频脚本，全部彼此衔接。","use":["上传敬业度／脉搏／文化调研导出文件想做分析","要从调研结果生成给 CEO 或高管的汇报","要一份以 Copilot 落地为核心、从 HR 延伸到销售的赋能策略","只想单独要信息图或视频脚本"],"avoid":["安排或改期 HR 会议 → 用 schedule-meeting","只是一封状态邮件或通知 → 用 stakeholder-comms","要排名、打分或比较个别员工绩效 → 婉拒，改提供团队／项目层面成果","要按受保护特征（性别、年龄等）筛选人员 → 拒绝，改用岗位／团队／技能"],"flow":["阶段 0：先找输入文件，找不到就开口要，绝不自己编数据","阶段 1：只从真实调研数据提炼正好五个主题（走 Excel 技能）","阶段 2：写策略文档（Word）—— 趋势、三项策略（短期＋两年内）、高管摘要，并与约一万人规模的同行做对标（走深度研究并附引用）","阶段 3：从策略文档生成高管执行汇报（PowerPoint）","阶段 4：生成一页公司品牌配色的信息图（用代码输出 PNG）","阶段 5：写 Copilot Create／Sora 可用的视频脚本（Word）","每个阶段都建一个任务让你看得到进度，并在报告完成前确认文件真的落地"],"out":"五份成品：主题摘要、策略文档（.docx）、高管汇报（.pptx）、一页信息图（.png）、视频脚本（.docx）。","rail":["调研数据闸门：没有真实调研文件就绝不生成主题、统计或引述","绝不编造对标数据、投资回报率、KPI、姓名、日期或引述 —— 用 [Add: …] 占位符，外部论断一律走深度研究并附引用","所有嵌入的数字都要先用代码算过再写进文档","不做个人绩效评估、不按受保护特征做人员画像 —— 婉拒并提供合规替代方案","交付闸门：每产出一个文件就实际确认文件存在，才回报完成","一次要全部也要按依赖顺序跑：调研 → 主题 → 策略 → 汇报／信息图／脚本"]},"en":{"title":"HR Engagement Strategy","sum":"Runs one engagement survey export through a five-stage pipeline: five themes → strategy doc → SLT deck → one-page infographic → video script, each grounding the next.","use":["User uploads an engagement, pulse or culture survey export","A CEO or SLT presentation is needed from engagement findings","An HR-to-Sales enablement strategy centred on Copilot adoption","The infographic or video script is wanted on its own"],"avoid":["Scheduling or rescheduling HR meetings → use schedule-meeting","A simple status email or announcement → use stakeholder-comms","Ranking or comparing individual employee performance → refuse politely, offer team/program outcomes","Filtering people by any protected characteristic → refuse, offer role/team/skill instead"],"flow":["Stage 0: locate the input file; if none, ask — never invent data","Stage 1: extract exactly five themes from the real survey data (xlsx skill)","Stage 2: write the strategy doc (docx) — trends, three strategies (short + ≤2yr), exec summary, benchmark against a ~10k-employee peer via deep research with citations","Stage 3: build the SLT execution deck (pptx) from the strategy doc","Stage 4: generate the one-page brand-coloured infographic (PNG via code)","Stage 5: write the Copilot Create / Sora video script (docx)","Create a Task per stage so progress is visible, and confirm each file landed before reporting done"],"out":"Five deliverables: theme summary, strategy document (.docx), SLT deck (.pptx), one-page infographic (.png), video script (.docx).","rail":["Survey-data gate: never generate themes, stats or quotes without the real survey file loaded","Never fabricate benchmarks, ROI, KPIs, names, dates or quotes — use [Add: …] placeholders and route external claims through deep research with citations","Compute every embedded figure with a code tool before writing it","No performance evaluation and no protected-characteristic profiling — refuse and offer a compliant alternative","Delivery gate: confirm each file exists on disk before telling the user it's ready","Even when everything is asked for at once, keep the dependency order: survey → themes → strategy → deck/infographic/script"]},"q_zh":"員工敬業度調查全套交付 把一份敬業度調查匯出檔，跑成五階段管線：五大主題 → 策略文件 → 高層簡報 → 一頁資訊圖 → 影片腳本，全部互相接得起來。 五份成品：主題摘要、策略文件（.docx）、高層簡報（.pptx）、一頁資訊圖（.png）、影片腳本（.docx）。 上傳敬業度／脈動／文化調查匯出檔想做分析 要從調查結果生出給執行長或高層的簡報 要一份以 copilot 導入為核心、從人資延伸到業務的賦能策略 只想單獨要資訊圖或影片腳本 安排或改期人資會議 → 用 schedule-meeting 只是一封狀態信或公告 → 用 stakeholder-comms 要排名、評分或比較個別員工績效 → 婉拒，改提供團隊／專案層級成果 要依受保護特徵（性別、年齡等）篩選人員 → 拒絕，改用角色／團隊／技能 階段 0：先找輸入檔，找不到就開口要，絕不自己編數據 階段 1：只從真實調查資料萃取剛好五個主題（走 excel 技能） 階段 2：寫策略文件（word）—— 趨勢、三項策略（短期＋兩年內）、高階摘要，並與約一萬人規模的同業做標竿對照（走深度研究並附引用） 階段 3：從策略文件生出高層執行簡報（powerpoint） 階段 4：產一頁公司品牌配色的資訊圖（用程式碼輸出 png） 階段 5：寫 copilot create／sora 可用的影片腳本（word） 每個階段都建一個任務讓你看得到進度，並在報告完成前確認檔案真的落地 調查資料閘門：沒有真實調查檔就絕不生成主題、統計或引述 絕不編造標竿、投資報酬率、kpi、姓名、日期或引述 —— 用 [add: …] 佔位符，外部宣稱一律走深度研究並附引用 所有嵌入的數字都要先用程式算過再寫進文件 不做個人績效評估、不依受保護特徵做人員側寫 —— 婉拒並提供合規替代方案 交付閘門：每產出一個檔案就實際確認檔案存在，才回報完成 一次要全部也要照相依順序跑：調查 → 主題 → 策略 → 簡報／資訊圖／腳本 hr-engagement-strategy analyze our engagement survey summarize the engagement survey into themes build an engagement strategy for the ceo/slt create an hr enablement deck turn survey results into a presentation make an engagement infographic hr engagement strategy runs one engagement survey export through a five-stage pipeline: five themes → strategy doc → slt deck → one-page infographic → video script, each grounding the next.","q_cn":"员工敬业度调研全套交付 把一份敬业度调研导出文件，跑成五阶段流水线：五大主题 → 策略文档 → 高管汇报 → 一页信息图 → 视频脚本，全部彼此衔接。 五份成品：主题摘要、策略文档（.docx）、高管汇报（.pptx）、一页信息图（.png）、视频脚本（.docx）。 上传敬业度／脉搏／文化调研导出文件想做分析 要从调研结果生成给 ceo 或高管的汇报 要一份以 copilot 落地为核心、从 hr 延伸到销售的赋能策略 只想单独要信息图或视频脚本 安排或改期 hr 会议 → 用 schedule-meeting 只是一封状态邮件或通知 → 用 stakeholder-comms 要排名、打分或比较个别员工绩效 → 婉拒，改提供团队／项目层面成果 要按受保护特征（性别、年龄等）筛选人员 → 拒绝，改用岗位／团队／技能 阶段 0：先找输入文件，找不到就开口要，绝不自己编数据 阶段 1：只从真实调研数据提炼正好五个主题（走 excel 技能） 阶段 2：写策略文档（word）—— 趋势、三项策略（短期＋两年内）、高管摘要，并与约一万人规模的同行做对标（走深度研究并附引用） 阶段 3：从策略文档生成高管执行汇报（powerpoint） 阶段 4：生成一页公司品牌配色的信息图（用代码输出 png） 阶段 5：写 copilot create／sora 可用的视频脚本（word） 每个阶段都建一个任务让你看得到进度，并在报告完成前确认文件真的落地 调研数据闸门：没有真实调研文件就绝不生成主题、统计或引述 绝不编造对标数据、投资回报率、kpi、姓名、日期或引述 —— 用 [add: …] 占位符，外部论断一律走深度研究并附引用 所有嵌入的数字都要先用代码算过再写进文档 不做个人绩效评估、不按受保护特征做人员画像 —— 婉拒并提供合规替代方案 交付闸门：每产出一个文件就实际确认文件存在，才回报完成 一次要全部也要按依赖顺序跑：调研 → 主题 → 策略 → 汇报／信息图／脚本 hr-engagement-strategy analyze our engagement survey summarize the engagement survey into themes build an engagement strategy for the ceo/slt create an hr enablement deck turn survey results into a presentation make an engagement infographic hr engagement strategy runs one engagement survey export through a five-stage pipeline: five themes → strategy doc → slt deck → one-page infographic → video script, each grounding the next.","q_en":"hr engagement strategy runs one engagement survey export through a five-stage pipeline: five themes → strategy doc → slt deck → one-page infographic → video script, each grounding the next. five deliverables: theme summary, strategy document (.docx), slt deck (.pptx), one-page infographic (.png), video script (.docx). user uploads an engagement, pulse or culture survey export a ceo or slt presentation is needed from engagement findings an hr-to-sales enablement strategy centred on copilot adoption the infographic or video script is wanted on its own scheduling or rescheduling hr meetings → use schedule-meeting a simple status email or announcement → use stakeholder-comms ranking or comparing individual employee performance → refuse politely, offer team/program outcomes filtering people by any protected characteristic → refuse, offer role/team/skill instead stage 0: locate the input file; if none, ask — never invent data stage 1: extract exactly five themes from the real survey data (xlsx rch search the cowork library find skills in the gallery what plugins are available for sales list prompts for executives find cowork items about meetings show customer-ready skills what's in the cowork gallery for retail any plugins for managers look up library items about [topic] what's new in the cowork library this week cowork library search queries an internal copilot cowork library list, filtering by category, persona, industry, customer-ready flag and recency, with a download link per hit."},{"n":19,"slug":"frontend-design","cat":"design","act":"file","src":"frontend-design/SKILL.md","chars":4025,"tools":[{"id":"code","label":{"zh":"程式碼執行","cn":"代码执行","en":"Code execution"}}],"trig":["design or implement a web component","page","landing site","dashboard","marketing site","any UI surface"],"zh":{"title":"前端設計（源自 Anthropic）","sum":"做出有明確主張、不像 AI 樣板的前端介面：先定調性與記憶點，再產出可直接跑、合乎無障礙標準的實作程式碼。","use":["要設計或實作網頁元件、頁面、著陸頁、儀表板、行銷網站","介面看起來很「範本感」想脫離預設值","需要一份可直接執行的前端實作"],"avoid":[],"flow":["起飛前先在心裡回答四題 —— 目的：這個介面為誰而做、要他做什麼動作","調性：從編輯排版風、粗獷 HTML 風、瑞士字體風、復古終端機、柔和新擬態、玻璃擬態、蒸汽波、新藝術、包浩斯幾何、手繪風、賽博龐克、等寬實用風、奢華襯線、拼貼風、等角 3D、自然環境風之中選一種並貫徹；最多混兩種互相加分的，絕不混三種","限制：框架、瀏覽器目標、無障礙底線（未特別指定即 WCAG AA）、效能預算、響應式斷點","記憶點：訪客會記住並轉述給朋友的那一個元素 —— 每個設計都需要一個招牌動作","接著才寫程式，並照工藝準則處理字體、色彩、動效與細節"],"out":"四項硬性要求：能跑（真實可執行、不留 TODO）、無障礙（語意化 HTML、鍵盤可操作、對比足夠、焦點狀態自己設計）、響應式（行動優先或刻意只做桌機，不可意外壞掉）、一致（一套設計系統、一種動效語言、一種語氣），且細節要打磨到位。","rail":["字體是最大聲的設計選擇 —— 用有個性的標題體配好讀的內文體，避開沒有主張的 Inter／Roboto／Arial 預設值","色彩：一個主色、一到兩個輔色、一個刻意選過的中性色，全部定成 CSS 變數，明暗調性一開始就決定"]},"cn":{"title":"前端设计（源自 Anthropic）","sum":"做出有明确主张、不像 AI 模板的前端界面：先定调性与记忆点，再产出可直接跑、符合无障碍标准的实现代码。","use":["要设计或实现网页组件、页面、落地页、仪表盘、营销网站","界面看起来很「模板感」想摆脱默认值","需要一份可直接运行的前端实现"],"avoid":[],"flow":["动手前先在心里回答四题 —— 目的：这个界面为谁而做、要他做什么动作","调性：从编辑排版风、粗野 HTML 风、瑞士字体风、复古终端、柔和新拟物、玻璃拟态、蒸汽波、新艺术、包豪斯几何、手绘风、赛博朋克、等宽实用风、奢华衬线、拼贴风、等轴 3D、自然环境风之中选一种并贯彻；最多混两种互相加分的，绝不混三种","约束：框架、浏览器目标、无障碍底线（未特别指定即 WCAG AA）、性能预算、响应式断点","记忆点：访客会记住并转述给朋友的那一个元素 —— 每个设计都需要一个招牌动作","然后才写代码，并按工艺准则处理字体、色彩、动效与细节"],"out":"四项硬性要求：能跑（真实可运行、不留 TODO）、无障碍（语义化 HTML、键盘可操作、对比度足够、焦点态自己设计）、响应式（移动优先或刻意只做桌面端，不可意外崩坏）、一致（一套设计系统、一种动效语言、一种语气），且细节要打磨到位。","rail":["字体是最响亮的设计选择 —— 用有个性的标题字配好读的正文字，避开没有主张的 Inter／Roboto／Arial 默认值","色彩：一个主色、一到两个辅色、一个刻意选过的中性色，全部定成 CSS 变量，明暗调性一开始就定"]},"en":{"title":"Front End Design","sum":"Builds distinctive, production-grade frontend with a point of view: commit to a tone and a signature hook first, then ship working, accessible code.","use":["Designing or implementing a web component, page, landing site, dashboard or marketing site","An interface reads as a default AI template and needs escaping","A working frontend implementation is required"],"avoid":[],"flow":["Pre-flight, answer four questions internally — Purpose: what is this for, who is the user, what action should they take?","Tone: pick one and commit — editorial, brutalist, swiss, retro-terminal, neumorphic, glassmorphic, vaporwave, art nouveau, bauhaus, hand-drawn, cyberpunk, monospace utilitarian, luxury serif, ransom-note, isometric, ambient. Mix two if they reinforce; never three","Constraints: framework, browser targets, accessibility floor (WCAG AA minimum), performance budget, breakpoints","The Hook: the one element a visitor will remember and describe to a friend — every design needs a signature move","Only then write code, applying the craft guidelines for type, colour, motion and detail"],"out":"Four hard requirements: Working (real runnable code, no TODOs), Accessible (semantic HTML, keyboard navigable, contrast, designed focus states), Responsive (mobile-first or deliberately desktop-only), Cohesive (one design system, one motion language, one voice) — and refined in the small details.","rail":["Type is the loudest design choice — pair a characterful display face with a readable text face; avoid opinion-free Inter / Roboto / Arial defaults","Colour: one dominant, one or two accents, a deliberate neutral, all as CSS custom properties, light/dark decided upfront"]},"q_zh":"前端設計（源自 anthropic） 做出有明確主張、不像 ai 樣板的前端介面：先定調性與記憶點，再產出可直接跑、合乎無障礙標準的實作程式碼。 四項硬性要求：能跑（真實可執行、不留 todo）、無障礙（語意化 html、鍵盤可操作、對比足夠、焦點狀態自己設計）、響應式（行動優先或刻意只做桌機，不可意外壞掉）、一致（一套設計系統、一種動效語言、一種語氣），且細節要打磨到位。 要設計或實作網頁元件、頁面、著陸頁、儀表板、行銷網站 介面看起來很「範本感」想脫離預設值 需要一份可直接執行的前端實作  起飛前先在心裡回答四題 —— 目的：這個介面為誰而做、要他做什麼動作 調性：從編輯排版風、粗獷 html 風、瑞士字體風、復古終端機、柔和新擬態、玻璃擬態、蒸汽波、新藝術、包浩斯幾何、手繪風、賽博龐克、等寬實用風、奢華襯線、拼貼風、等角 3d、自然環境風之中選一種並貫徹；最多混兩種互相加分的，絕不混三種 限制：框架、瀏覽器目標、無障礙底線（未特別指定即 wcag aa）、效能預算、響應式斷點 記憶點：訪客會記住並轉述給朋友的那一個元素 —— 每個設計都需要一個招牌動作 接著才寫程式，並照工藝準則處理字體、色彩、動效與細節 字體是最大聲的設計選擇 —— 用有個性的標題體配好讀的內文體，避開沒有主張的 inter／roboto／arial 預設值 色彩：一個主色、一到兩個輔色、一個刻意選過的中性色，全部定成 css 變數，明暗調性一開始就決定 frontend-design design or implement a web component page landing site dashboard marketing site any ui surface front end design builds distinctive, production-grade frontend with a point of view: commit to a tone and a signature hook first, then ship working, accessible code.","q_cn":"前端设计（源自 anthropic） 做出有明确主张、不像 ai 模板的前端界面：先定调性与记忆点，再产出可直接跑、符合无障碍标准的实现代码。 四项硬性要求：能跑（真实可运行、不留 todo）、无障碍（语义化 html、键盘可操作、对比度足够、焦点态自己设计）、响应式（移动优先或刻意只做桌面端，不可意外崩坏）、一致（一套设计系统、一种动效语言、一种语气），且细节要打磨到位。 要设计或实现网页组件、页面、落地页、仪表盘、营销网站 界面看起来很「模板感」想摆脱默认值 需要一份可直接运行的前端实现  动手前先在心里回答四题 —— 目的：这个界面为谁而做、要他做什么动作 调性：从编辑排版风、粗野 html 风、瑞士字体风、复古终端、柔和新拟物、玻璃拟态、蒸汽波、新艺术、包豪斯几何、手绘风、赛博朋克、等宽实用风、奢华衬线、拼贴风、等轴 3d、自然环境风之中选一种并贯彻；最多混两种互相加分的，绝不混三种 约束：框架、浏览器目标、无障碍底线（未特别指定即 wcag aa）、性能预算、响应式断点 记忆点：访客会记住并转述给朋友的那一个元素 —— 每个设计都需要一个招牌动作 然后才写代码，并按工艺准则处理字体、色彩、动效与细节 字体是最响亮的设计选择 —— 用有个性的标题字配好读的正文字，避开没有主张的 inter／roboto／arial 默认值 色彩：一个主色、一到两个辅色、一个刻意选过的中性色，全部定成 css 变量，明暗调性一开始就定 frontend-design design or implement a web component page landing site dashboard marketing site any ui surface front end design builds distinctive, production-grade frontend with a point of view: commit to a tone and a signature hook first, then ship working, accessible code.","q_en":"front end design builds distinctive, production-grade frontend with a point of view: commit to a tone and a signature hook first, then ship working, accessible code. four hard requirements: working (real runnable code, no todos), accessible (semantic html, keyboard navigable, contrast, designed focus states), responsive (mobile-first or deliberately desktop-only), cohesive (one design system, one motion language, one voice) — and refined in the small details. designing or implementing a web component, page, landing site, dashboard or marketing site an interface reads as a default ai template and needs escaping a working frontend implementation is required  pre-flight, answer four questions internally — purpose: what is this for, who is the user, what action should they take? tone: pick one and commit — editorial, brutalist, swiss, retro-terminal, neumorphic, glassmorphic, vaporwave, art nouveau, bauhaus, hand-drawn, cyberpunk, monospace utilitarian, luxury serif, ransom-note, isometric, ambient. mix two if they reinforce; never three constraints: framework, browser targets, accessibility floor (wcag aa minimum), performance budget, breakpoints the hook: the one element a visitor will remember and describe to a friend — every design needs a signature move only then write code, applying the craft guidelines for type, colour, motion and detail type is the loudest design choice — pair a characterful display face with a readable text face; avoid opinion-free inter / roboto / arial defaults colour: one dominant, one or two accents, a deliberate neutral, all as css custom properties, light/dark decided upfront frontend-design design or implement a web component page landing site dashboard marketing site any ui surface front end design builds distinctive, production-grade frontend with a point of view: commit to a tone and a signature hook first, then ship working, accessible code."}],"ui":{"zh":{"kicker":"Copilot Cowork · Custom Skills","title":"Cowork 技能圖鑑","lede":"19 個實際可用的 Copilot Cowork 自訂技能範例。每一張卡片拆解它做什麼、什麼時候該用、什麼時候不該用、流程怎麼跑、產出長什麼樣，以及作者刻意設下的護欄。","src":"每個技能都提供繁中／簡中／英文三個版本的 SKILL.md，可直接下載匯入 Cowork 使用。","n_skill":"個技能範例","n_cat":"個應用分類","n_act":"種行為層級","search":"搜尋技能、觸發詞、關鍵字…（按 / 聚焦）"," ork; this page shows you how the skills are written.","playbook_cta":"Open the Playbook","dl_all":"Download all 19 SKILL.md","bundle_note":"The complete SKILL.md for 19 Copilot Cowork custom skills (English). Each file is separated by a rule — copy everything under a FILE header and save it as that skill's SKILL.md."}},"md":{"inbox-triage":{"en":"---\nname: inbox-triage\ndescription: |\n  Classifies unread emails into Reply / FYI / Delegate / Ignore buckets with reasoning.\n  Use when user asks to \"triage my inbox\", \"sort my unread mail\", \"what should I reply to\",\n  \"clean up my inbox\", \"prioritize my emails\", or \"go through my unread\".\n  Do NOT use for searching specific emails — use SearchM365 directly.\n  Do NOT use for drafting replies in bulk — this skill classifies only; user picks which\n  to act on.\ncowork:\n  category: productivity\n  icon: TaskListLtr\n---\n\n## Overview\n\nReads the user's unread inbox, classifies each message into one of four action buckets, and\npresents them as a prioritized table. The user decides which to act on; this skill does not\nauto-reply, auto-delete, or auto-file.\n\n## Classification buckets\n\n| Bucket | Meaning |\n|--------|---------|\n| **Reply** | Direct ask of the user, awaiting their response |\n| **FYI** | Informational, no action needed but worth reading |\n| **Delegate** | Better handled by someone else (named in the output) |\n| **Ignore** | Newsletter, automated, low-signal — safe to archive |\n\n## When to Use\n\n- Morning inbox cleanup\n- After PTO or a heavy meeting day\n- User feels overwhelmed by unread count\n\n## When NOT to Use\n\n- Looking for one specific email → use `SearchM365` directly\n- Daily briefing across email + calendar + Teams → use `daily-briefing`\n- Setting up filters/rules → use Outlook rules tools directly\n\n## Quick Start\n\n```\nUser: \"triage my inbox\"\n1. ListMessages(unread_only=true, top=50)\n2. For each: classify by sender role, recipient pattern, body intent\n3. Render table grouped by bucket, Reply first\n4. Offer next step: open the first Reply item, draft replies, archive Ignores\n```\n\n## Core Instructions\n\n### Step 1: Fetch unread\n- `ListMessages(unread_only=true, top=50)`\n- If `next_link` and the user has more, paginate up to 100 — beyond that ask if they want everything\n\n### Step 2: Classify each message\n\nApply these heuristics in order:\n\n1. **Reply** if:\n   - User is in `to` (not just `cc`)\n   - Body contains direct question, request, or `?` directed at user\n   - Sender is the user's manager, skip-level, or a key stakeholder\n\n2. **Delegate** if:\n   - Sender asks for something a known team member typically handles\n   - Use `GetDirectReportsDetails` if the user has reports — suggest by name\n   - Otherwise leave blank — do NOT invent names\n\n3. **FYI** if:\n   - User is in `cc` only, or it's a forwarded thread for awareness\n   - Status updates, announcements, read-only context\n\n4. **Ignore** if:\n   - Sender is a known automated address (no-reply, notifications, newsletters)\n   - Marketing or external mass distribution\n   - Calendar invitations that the user already responded to\n\n### Step 3: Render output\n\nUse `render-ui` to show a card with a table:\n\n| Bucket | From | Subject | Why |\n|--------|------|---------|-----|\n| Reply | Piotr Dragan | Q2 review prep | Direct ask, manager |\n| Delegate | … | … | Routine vendor follow-up |\n| FYI | … | … | CC'd only |\n| Ignore | … | … | Marketing |\n\nSort Reply first, then Delegate, then FYI, then Ignore. Include message aliases like\n`[msg_3]` so the user can click through.\n\n### Step 4: Next steps\n\nAfter showing the table, offer:\n- \"Want me to draft replies for the Reply bucket?\"\n- \"Want me to archive the Ignore bucket?\" (requires explicit confirmation per message)\n\n## Guardrails\n\n- Never auto-archive, auto-reply, or auto-delete — classification only\n- Never invent a delegate name — only suggest reports/teammates resolved via people tools\n- If sender is the user's manager or skip-level, always classify as Reply or FYI (never Ignore)\n- If unsure between two buckets, prefer the more cautious one (Reply over FYI, FYI over Ignore)\n","zh":"---\nname: inbox-triage\ndescription: |\n  將未讀郵件分類到 Reply / FYI / Delegate / Ignore 四個桶，並附上理由。\n  當使用者說「幫我分流收件匣」、「整理未讀郵件」、「哪些信要先回」、「清理我的收件匣」、「排定郵件優先順序」、「逐封看未讀」、\"triage my inbox\", \"sort my unread mail\", \"what should I reply to\",\n  \"clean up my inbox\", \"prioritize my emails\", or \"go through my unread\" 時使用。\n  不要用於搜尋特定郵件 — 直接使用 SearchM365。\n  不要用於大量草擬回覆 — 此 skill 只做分類；由使用者選擇要處理哪些\n  郵件。\ncowork:\n  category: productivity\n  icon: TaskListLtr\n---\n\n## 概觀\n\n讀取使用者收件匣中的未讀郵件，將每封訊息分類到四個行動桶之一，並以優先排序表格呈現。使用者決定要處理哪些；此 skill 不會自動回覆、自動刪除或自動歸檔。\n\n## 分類桶\n\n| 桶 | 意義 |\n|--------|---------|\n| **Reply** | 直接要求使用者回應，等待其回覆 |\n| **FYI** | 資訊性內容，無需行動但值得閱讀 |\n| **Delegate** | 較適合由其他人處理（在輸出中註明姓名） |\n| **Ignore** | 電子報、自動通知、低訊號 — 可安全封存 |\n\n## 使用時機\n\n- 早上清理收件匣\n- 休假後或會議密集的一天之後\n- 使用者被未讀數量壓得喘不過氣\n\n## 不適用時機\n\n- 尋找某一封特定郵件 → 直接使用 `SearchM365`\n- 跨郵件 + 行事曆 + Teams 的每日簡報 → 使用 `daily-briefing`\n- 設定篩選器/規則 → 直接使用 Outlook 規則工具\n\n## 快速開始\n\n```\n使用者: 「幫我分流收件匣」\n1. ListMessages(unread_only=true, top=50)\n2. 逐封依寄件者角色、收件者模式、內文意圖分類\n3. 依桶分組呈現表格，Reply 優先\n4. 提供下一步：開啟第一個 Reply 項目、草擬回覆、封存 Ignore\n```\n\n## 核心指示\n\n### 步驟 1：擷取未讀郵件\n- `ListMessages(unread_only=true, top=50)`\n- 如果有 `next_link` 且使用者還有更多郵件，最多分頁到 100 封 — 超過則詢問是否要全部處理\n\n### 步驟 2：分類每封訊息\n\n依序套用這些啟發式規則：\n\n1. **Reply**，如果：\n   - 使用者在 `to` 中（不只是 `cc`）\n   - 內文包含直接問題、請求，或指向使用者的 `?`\n   - 寄件者是使用者的主管、隔級主管或重要利害關係人\n\n2. **Delegate**，如果：\n   - 寄件者要求的事項通常由已知團隊成員處理\n   - 如果使用者有直屬部屬，使用 `GetDirectReportsDetails` — 依姓名建議\n   - 否則留空 — 不要捏造姓名\n\n3. **FYI**，如果：\n   - 使用者只在 `cc` 中，或這是轉寄給使用者了解的討論串\n   - 狀態更新、公告、唯讀背景資訊\n\n4. **Ignore**，如果：\n   - 寄件者是已知自動寄送地址（no-reply、notifications、newsletters）\n   - 行銷或外部大量發送\n   - 使用者已回覆過的行事曆邀請\n\n### 步驟 3：呈現輸出\n\n使用 `render-ui` 顯示含表格的卡片：\n\n| 桶 | 寄件者 | 主旨 | 原因 |\n|--------|------|---------|-----|\n| Reply | Piotr Dragan | Q2 review prep | 直接請求，主管 |\n| Delegate | … | … | 例行供應商追蹤 |\n| FYI | … | … | 僅被副本 |\n| Ignore | … | … | 行銷 |\n\n排序為 Reply 優先，其次 Delegate、FYI、Ignore。包含像 `[msg_3]` 這樣的訊息別名，讓使用者可點入查看。\n\n### 步驟 4：下一步\n\n顯示表格後，提供：\n- \"Want me to draft replies for the Reply bucket?\"\n- \"Want me to archive the Ignore bucket?\"（每封郵件都需要明確確認）\n\n## 護欄\n\n- 絕不自動封存、自動回覆或自動刪除 — 只做分類\n- 絕不捏造轉派對象姓名 — 只建議透過人員工具解析到的直屬部屬/團隊成員\n- 若寄件者是使用者的主管或隔級主管，一律分類為 Reply 或 FYI（絕不 Ignore）\n- 若不確定該歸到哪兩個桶，選擇較謹慎者（Reply 優先於 FYI，FYI 優先於 Ignore）\n","cn":"---\nname: inbox-triage\ndescription: |\n  将未读邮件归类到 Reply / FYI / Delegate / Ignore 四类，并说明原因。\n  当用户说“帮我分流收件箱”、“整理未读邮件”、“哪些邮件要先回复”、“清理我的收件箱”、“给邮件排优先级”、“过一遍未读邮件”、\"triage my inbox\", \"sort my unread mail\", \"what should I reply to\",\n  \"clean up my inbox\", \"prioritize my emails\", or \"go through my unread\" 时使用。\n  不要用于搜索特定邮件 — 直接使用 SearchM365。\n  不要用于批量起草回复 — 此 skill 只做分类；由用户选择要处理哪些\n  邮件。\ncowork:\n  category: productivity\n  icon: TaskListLtr\n---\n\n## 概览\n\n读取用户收件箱中的未读邮件，将每封信息归类到四个行动类别之一，并以优先级表格呈现。用户决定处理哪些；此 skill 不会自动回复、自动删除或自动归档。\n\n## 分类类别\n\n| 类别 | 含义 |\n|--------|---------|\n| **Reply** | 直接向用户提出请求，等待用户回复 |\n| **FYI** | 信息性内容，无需行动但值得阅读 |\n| **Delegate** | 更适合由其他人处理（在输出中注明姓名） |\n| **Ignore** | 简报、自动通知、低信号内容 — 可安全归档 |\n\n## 适用场景\n\n- 早上清理收件箱\n- 休假后或会议密集的一天之后\n- 用户被未读数量压得不知从何下手\n\n## 不适用场景\n\n- 查找某一封特定邮件 → 直接使用 `SearchM365`\n- 跨邮件 + 日历 + Teams 的每日简报 → 使用 `daily-briefing`\n- 设置筛选器/规则 → 直接使用 Outlook 规则工具\n\n## 快速开始\n\n```\n用户: “帮我分流收件箱”\n1. ListMessages(unread_only=true, top=50)\n2. 逐封根据发件人角色、收件人模式、正文意图分类\n3. 按类别分组渲染表格，Reply 优先\n4. 提供下一步：打开第一个 Reply 项、起草回复、归档 Ignore\n```\n\n## 核心说明\n\n### 步骤 1：获取未读邮件\n- `ListMessages(unread_only=true, top=50)`\n- 如果有 `next_link` 且用户还有更多邮件，最多翻页到 100 封 — 超过后询问是否要全部处理\n\n### 步骤 2：逐封分类\n\n按顺序应用这些启发式规则：\n\n1. **Reply**，如果：\n   - 用户在 `to` 中（不只是 `cc`）\n   - 正文包含直接问题、请求，或指向用户的 `?`\n   - 发件人是用户的经理、隔级领导或关键干系人\n\n2. **Delegate**，如果：\n   - 发件人请求的事项通常由已知团队成员处理\n   - 如果用户有直接下属，使用 `GetDirectReportsDetails` — 按姓名建议\n   - 否则留空 — 不要编造姓名\n\n3. **FYI**，如果：\n   - 用户只在 `cc` 中，或这是转发给用户了解情况的线程\n   - 状态更新、公告、只读背景信息\n\n4. **Ignore**，如果：\n   - 发件人是已知自动发送地址（no-reply、notifications、newsletters）\n   - 营销或外部群发内容\n   - 用户已经响应过的日历邀请\n\n### 步骤 3：渲染输出\n\n使用 `render-ui` 显示带表格的卡片：\n\n| 类别 | 发件人 | 主题 | 原因 |\n|--------|------|---------|-----|\n| Reply | Piotr Dragan | Q2 review prep | 直接请求，经理 |\n| Delegate | … | … | 常规供应商跟进 |\n| FYI | … | … | 仅抄送 |\n| Ignore | … | … | 营销 |\n\n排序为 Reply 优先，然后 Delegate、FYI、Ignore。包含类似 `[msg_3]` 的消息别名，方便用户点开查看。\n\n### 步骤 4：下一步\n\n显示表格后，提供：\n- \"Want me to draft replies for the Reply bucket?\"\n- \"Want me to archive the Ignore bucket?\"（每封邮件都需要明确确认）\n\n## 护栏\n\n- 绝不自动归档、自动回复或自动删除 — 只做分类\n- 绝不编造转派对象姓名 — 只建议通过人员工具解析到的下属/团队成员\n- 如果发件人是用户的经理或隔级领导，始终归类为 Reply 或 FYI（绝不 Ignore）\n- 如果在两个类别之间不确定，选择更谨慎的一个（Reply 优先于 FYI，FYI 优先于 Ignore）\n"},"teams-digest":{"en":"---\nname: teams-digest\ndescription: |\n  Summarizes Teams channels and chats you may have missed.\n  Use when user asks \"what did I miss in Teams\", \"Teams summary\", \"channel updates\",\n  \"catch me up on Teams\", \"unread Teams messages\", or \"Teams digest\".\nlicense: MIT\nmetadata:\n  author: Cowork Library\n  version: \"1.0\"\n  plugin: teams-hub\n  m365-services: [Teams, Graph]\n---\n\n# Teams Digest\n\nGet a summary of Teams activity across channels and chats.\n\n## M365 Integration\n\n- **Microsoft Teams:** Channel posts, chat messages, reactions\n- **Microsoft Graph:** Activity feed, mentions, replies\n\n## What This Skill Does\n\nSummarizes:\n- Unread channel posts by importance\n- Direct messages requiring attention\n- @mentions and replies to you\n- Key decisions and announcements\n- Action items from conversations\n\n## When to Use\n\n- Returning from PTO or time off\n- Morning catch-up routine\n- After being in back-to-back meetings\n- End of day review\n- Before team meetings\n\n## Workflow\n\n1. **Scan Activity**\n   - Check all channels you're a member of\n   - Review direct messages and group chats\n   - Find @mentions and replies\n\n2. **Prioritize**\n   - Urgent/important messages first\n   - Messages requiring response\n   - FYI items last\n\n3. **Summarize**\n   - Extract key points\n   - Identify action items\n   - Note decisions made\n\n## Output Format\n\n# Teams Digest\n\n**Period:** {timeframe, e.g., \"Last 24 hours\" or \"Since Monday\"}\n**Last checked:** {timestamp}\n\n---\n\n## 🔴 Requires Your Attention\n\n### @Mentions\n| Time | Channel/Chat | From | Message |\n|------|--------------|------|---------|\n| {time} | {location} | {person} | {summary + link} |\n\n### Direct Messages Awaiting Reply\n| From | Preview | Time |\n|------|---------|------|\n| {name} | {message preview} | {time} |\n\n### Replies to Your Posts\n| Thread | Latest Reply | From |\n|--------|--------------|------|\n| {topic} | {summary} | {name} |\n\n---\n\n## 📢 Important Updates by Channel\n\n### #{channel-name-1}\n**Activity level:** {High/Medium/Low} ({n} messages)\n\n**Key posts:**\n- **{Author}:** {Summary of important post}\n  - Reactions: {👍 n, etc.}\n  - {Link to message}\n\n- **{Author}:** {Summary of another post}\n  - {Link}\n\n**Decisions made:**\n- {Decision 1}\n- {Decision 2}\n\n---\n\n### #{channel-name-2}\n**Activity level:** {level}\n\n**Key posts:**\n- {summaries}\n\n---\n\n## 💬 Group Chats\n\n### {Chat name or participants}\n**Messages:** {n} new\n**Summary:** {What was discussed}\n**Action items:** {Any tasks mentioned}\n\n---\n\n## 📋 Action Items Found\n\n| Item | Source | Assigned To | Deadline |\n|------|--------|-------------|----------|\n| {task} | #{channel} | {you/person} | {if mentioned} |\n| {task} | {chat} | {person} | {date} |\n\n---\n\n## 📊 Activity Summary\n\n| Channel | New Posts | Your Participation |\n|---------|-----------|-------------------|\n| #{channel1} | {n} | {replied/reacted/none} |\n| #{channel2} | {n} | {status} |\n| #{channel3} | {n} | {status} |\n\n---\n\n## 🎯 Suggested Actions\n\n1. **Reply to {person}** in #{channel} about {topic}\n2. **Acknowledge** {important announcement}\n3. **Follow up** on {thread}\n\n---\n\n## ℹ️ FYI Only (Low Priority)\n\n{Brief list of lower-priority updates that don't require action}\n\n- #{channel}: {brief summary}\n- #{channel}: {brief summary}\n","zh":"---\nname: teams-digest\ndescription: |\n  彙整你在 Teams 上可能錯過的頻道貼文與聊天訊息。\n  當使用者說「Teams 我漏了什麼」、「Teams 摘要」、「頻道更新」、「幫我補 Teams 進度」、\n  「未讀 Teams 訊息」、「Teams 摘要報告」、\"what did I miss in Teams\", \"Teams summary\", \"channel updates\",\n  \"catch me up on Teams\", \"unread Teams messages\", or \"Teams digest\" 時使用。\nlicense: MIT\nmetadata:\n  author: Cowork Library\n  version: \"1.0\"\n  plugin: teams-hub\n  m365-services: [Teams, Graph]\n---\n\n# Teams 未讀摘要\n取得跨頻道與聊天的 Teams 活動摘要。\n\n## M365 整合\n\n- **Microsoft Teams:** 頻道貼文、聊天訊息、回應\n- **Microsoft Graph:** 活動摘要、提及、回覆\n\n## 此技能的功能\n\n彙整：\n- 依重要性排序的未讀頻道貼文\n- 需要注意的直接訊息\n- 對你的 @提及與回覆\n- 重要決策與公告\n- 對話中的待辦事項\n\n## 使用時機\n\n- 從休假或請假返回時\n- 早晨補進度例行作業\n- 連續開會之後\n- 每日結束前回顧\n- 團隊會議前\n\n## 工作流程\n\n1. **掃描活動**\n   - 檢查你所屬的所有頻道\n   - 檢閱直接訊息與群組聊天\n   - 找出 @提及與回覆\n\n2. **排定優先順序**\n   - 優先處理緊急／重要訊息\n   - 找出需要回覆的訊息\n   - 最後處理僅供參考事項\n\n3. **彙整摘要**\n   - 擷取重點\n   - 識別待辦事項\n   - 記錄已做成的決策\n\n## 輸出格式\n\n# Teams 摘要\n\n**期間:** {timeframe, e.g., \"Last 24 hours\" or \"Since Monday\"}\n**上次檢查:** {timestamp}\n\n---\n\n## 🔴 需要你注意\n\n### @提及\n| 時間 | 頻道／聊天 | 來自 | 訊息 |\n|------|--------------|------|---------|\n| {time} | {location} | {person} | {summary + link} |\n\n### 等待回覆的直接訊息\n| 來自 | 預覽 | 時間 |\n|------|---------|------|\n| {name} | {message preview} | {time} |\n\n### 你貼文的回覆\n| 對話串 | 最新回覆 | 來自 |\n|--------|--------------|------|\n| {topic} | {summary} | {name} |\n\n---\n\n## 📢 各頻道重要更新\n\n### #{channel-name-1}\n**活動量:** {High/Medium/Low} ({n} messages)\n\n**重點貼文:**\n- **{Author}:** {Summary of important post}\n  - 回應: {👍 n, etc.}\n  - {Link to message}\n\n- **{Author}:** {Summary of another post}\n  - {Link}\n\n**已做成的決策:**\n- {Decision 1}\n- {Decision 2}\n\n---\n\n### #{channel-name-2}\n**活動量:** {level}\n\n**重點貼文:**\n- {summaries}\n\n---\n\n## 💬 群組聊天\n\n### {Chat name or participants}\n**訊息數:** {n} new\n**摘要:** {What was discussed}\n**待辦事項:** {Any tasks mentioned}\n\n---\n\n## 📋 找到的待辦事項\n\n| 項目 | 來源 | 指派給 | 截止日期 |\n|------|--------|-------------|----------|\n| {task} | #{channel} | {you/person} | {if mentioned} |\n| {task} | {chat} | {person} | {date} |\n\n---\n\n## 📊 活動摘要\n\n| 頻道 | 新貼文 | 你的參與 |\n|---------|-----------|-------------------|\n| #{channel1} | {n} | {replied/reacted/none} |\n| #{channel2} | {n} | {status} |\n| #{channel3} | {n} | {status} |\n\n---\n\n## 🎯 建議行動\n\n1. **回覆 {person}** 在 #{channel} 關於 {topic}\n2. **確認收到** {important announcement}\n3. **追蹤** {thread}\n\n---\n\n## ℹ️ 僅供參考（低優先順序）\n\n{Brief list of lower-priority updates that don't require action}\n\n- #{channel}: {brief summary}\n- #{channel}: {brief summary}","cn":"---\nname: teams-digest\ndescription: |\n  汇总你可能错过的 Teams 频道帖子和聊天信息。\n  当用户说“Teams 我错过了什么”、“Teams 摘要”、“频道更新”、“帮我补一下 Teams 进展”、\n  “未读 Teams 信息”、“Teams 简报”、\"what did I miss in Teams\", \"Teams summary\", \"channel updates\",\n  \"catch me up on Teams\", \"unread Teams messages\", or \"Teams digest\" 时使用。\nlicense: MIT\nmetadata:\n  author: Cowork Library\n  version: \"1.0\"\n  plugin: teams-hub\n  m365-services: [Teams, Graph]\n---\n\n# Teams 未读摘要\n汇总频道和聊天中的 Teams 活动情况。\n\n## M365 集成\n\n- **Microsoft Teams:** 频道帖子、聊天信息、回应\n- **Microsoft Graph:** 活动动态、提及、回复\n\n## 此技能的作用\n\n汇总：\n- 按重要程度排序的未读频道帖子\n- 需要关注的私聊信息\n- 对你的 @提及和回复\n- 关键决策和公告\n- 对话中的待办事项\n\n## 使用时机\n\n- 休假或请假返岗后\n- 早晨补进展例行处理\n- 连续开会之后\n- 每日收尾复盘\n- 团队会议前\n\n## 工作流\n\n1. **扫描活动**\n   - 检查你所在的所有频道\n   - 查看私聊信息和群聊\n   - 找出 @提及和回复\n\n2. **确定优先级**\n   - 先处理紧急/重要信息\n   - 找出需要回复的信息\n   - 最后处理 FYI 事项\n\n3. **生成摘要**\n   - 提取关键点\n   - 识别待办事项\n   - 记录已作出的决策\n\n## 输出格式\n\n# Teams 摘要\n\n**时间范围:** {timeframe, e.g., \"Last 24 hours\" or \"Since Monday\"}\n**上次检查:** {timestamp}\n\n---\n\n## 🔴 需要你关注\n\n### @提及\n| 时间 | 频道/聊天 | 来自 | 信息 |\n|------|--------------|------|---------|\n| {time} | {location} | {person} | {summary + link} |\n\n### 等待回复的私聊信息\n| 来自 | 预览 | 时间 |\n|------|---------|------|\n| {name} | {message preview} | {time} |\n\n### 你帖子的回复\n| 话题串 | 最新回复 | 来自 |\n|--------|--------------|------|\n| {topic} | {summary} | {name} |\n\n---\n\n## 📢 按频道列出的重要更新\n\n### #{channel-name-1}\n**活动量:** {High/Medium/Low} ({n} messages)\n\n**关键帖子:**\n- **{Author}:** {Summary of important post}\n  - 回应: {👍 n, etc.}\n  - {Link to message}\n\n- **{Author}:** {Summary of another post}\n  - {Link}\n\n**已作出的决策:**\n- {Decision 1}\n- {Decision 2}\n\n---\n\n### #{channel-name-2}\n**活动量:** {level}\n\n**关键帖子:**\n- {summaries}\n\n---\n\n## 💬 群聊\n\n### {Chat name or participants}\n**信息数:** {n} new\n**摘要:** {What was discussed}\n**待办事项:** {Any tasks mentioned}\n\n---\n\n## 📋 发现的待办事项\n\n| 事项 | 来源 | 分配给 | 截止日期 |\n|------|--------|-------------|----------|\n| {task} | #{channel} | {you/person} | {if mentioned} |\n| {task} | {chat} | {person} | {date} |\n\n---\n\n## 📊 活动摘要\n\n| 频道 | 新帖子 | 你的参与情况 |\n|---------|-----------|-------------------|\n| #{channel1} | {n} | {replied/reacted/none} |\n| #{channel2} | {n} | {status} |\n| #{channel3} | {n} | {status} |\n\n---\n\n## 🎯 建议操作\n\n1. **回复 {person}** 在 #{channel} 关于 {topic}\n2. **确认收到** {important announcement}\n3. **跟进** {thread}\n\n---\n\n## ℹ️ 仅供参考（低优先级）\n\n{Brief list of lower-priority updates that don't require action}\n\n- #{channel}: {brief summary}\n- #{channel}: {brief summary}"},"weekly-wrap":{"en":"---\nname: weekly-wrap\ndescription: |\n  Aggregates the user's sent emails, accepted meetings, and Teams posts from the past week\n  into a Friday status note. Use when user asks to \"wrap my week\", \"weekly wrap\", \"write my\n  weekly status\", \"what did I do this week\", \"Friday status note\", or \"summarize my week\".\n  Do NOT use for daily summaries — use daily-briefing instead.\n  Do NOT use for forward-looking planning — this skill is retrospective only.\ncowork:\n  category: productivity\n  icon: Flag\n---\n\n## Overview\n\nPulls the user's activity across Outlook (sent mail), calendar (accepted meetings), and Teams\n(channel + chat posts) for the current work week, then produces a structured status note\nthe user can post to a team channel, email to a manager, or keep as a personal log.\n\n## When to Use\n\n- End-of-week status writing\n- Catching up on what you accomplished\n- Building a manager update or team digest from the week's activity\n\n## When NOT to Use\n\n- \"What did I miss today\" / morning briefing → use `daily-briefing`\n- Multi-week or quarterly reports → use `stakeholder-comms`\n- Single-meeting recap → use `meeting-followup`\n\n## Quick Start\n\n```\nUser: \"wrap my week\"\n1. Compute week range (Monday 00:00 → now) in user's timezone\n2. In parallel:\n   - ListMessages with folder_id=sentitems, received_after=<Monday>\n   - ListCalendarView for the same window, is_organizer filter both ways\n   - SearchM365 sources=[\"teams\"], from_user=<user email>, after=<Monday>\n3. Group results into themes (projects, topics, people)\n4. Produce a structured Friday status note\n```\n\n## Core Instructions\n\n### Step 1: Resolve week range\n- Use the user's current local time\n- Week starts Monday 00:00 in user's timezone, ends now\n- If it's Monday morning, ask whether they mean last week or the current partial week\n\n### Step 2: Gather data in parallel\nRun these three tool calls concurrently:\n- `ListMessages(folder_id=\"sentitems\", received_after=<Monday ISO>, top=100)`\n- `ListCalendarView(start=<Monday>, end=<now>, top=50)` — keep only events the user attended (not declined)\n- `SearchM365(sources=[\"teams\"], from_user=<user email>, after=<Monday>, response_length=\"long\")`\n\nFollow `next_link` if any of these signal more data.\n\n### Step 3: Classify and group\nGroup activity by theme. Detect themes from recurring subjects, attendee overlap, or channel names.\nTypical buckets:\n- **Projects shipped / progressed**\n- **Key meetings**\n- **Decisions made**\n- **People I engaged with**\n\n### Step 4: Output format\n\n```markdown\n# Week of <Mon date> – <Fri date>\n\n## Highlights\n- 3–5 bullets, most important things\n\n## What I worked on\n- Grouped by project/theme\n\n## Meetings of note\n- Only meetings with outcomes (not routine syncs)\n\n## Next week\n- 2–3 things rolling forward (only if obvious from open threads)\n```\n\nRender inline as markdown by default. If user asks for a file or wants to share it, offer to\ndraft a Teams post (`PostMessage`) or email (`CreateDraftMessage`) — never send without review.\n\n## Guardrails\n\n- Never include private appointments (sensitivity=private) — show only as time block\n- Never include personnel/HR/compensation discussion in the public summary\n- Never fabricate accomplishments — if a week was light, say so\n- Default to inline markdown; only create a file or send a message on explicit request\n","zh":"---\nname: weekly-wrap\ndescription: |\n  彙整使用者過去一週寄出的郵件、已接受的會議與 Teams 貼文，\n  形成週五狀態筆記。當使用者說「幫我整理這週」、「每週回顧」、「寫我的每週狀態」、「我這週做了什麼」、「週五狀態筆記」、「摘要我的一週」、\"wrap my week\", \"weekly wrap\", \"write my\n  weekly status\", \"what did I do this week\", \"Friday status note\", or \"summarize my week\" 時使用。\n  不要用於每日摘要 — 請改用 daily-briefing。\n  不要用於前瞻性規劃 — 此 skill 只做回顧。\ncowork:\n  category: productivity\n  icon: Flag\n---\n\n## 概觀\n\n擷取使用者本工作週在 Outlook（已傳送郵件）、行事曆（已接受會議）與 Teams（頻道 + 聊天貼文）的活動，然後產出結構化狀態筆記，使用者可張貼到團隊頻道、寄給主管，或保留作為個人紀錄。\n\n## 使用時機\n\n- 週末撰寫狀態更新\n- 回顧自己完成了哪些事\n- 從一週活動建立主管更新或團隊摘要\n\n## 不適用時機\n\n- \"What did I miss today\" / 早晨簡報 → 使用 `daily-briefing`\n- 多週或季度報告 → 使用 `stakeholder-comms`\n- 單一會議摘要 → 使用 `meeting-followup`\n\n## 快速開始\n\n```\n使用者: 「幫我整理這週」\n1. 計算週範圍（Monday 00:00 → now），使用使用者時區\n2. 平行執行：\n   - ListMessages，使用 folder_id=sentitems, received_after=<Monday>\n   - ListCalendarView 使用相同時間範圍，is_organizer filter both ways\n   - SearchM365 sources=[\"teams\"], from_user=<user email>, after=<Monday>\n3. 將結果分組為主題（專案、議題、人員）\n4. 產出結構化週五狀態筆記\n```\n\n## 核心指示\n\n### 步驟 1：解析週範圍\n- 使用使用者目前的本地時間\n- 一週從使用者時區的 Monday 00:00 開始，到 now 結束\n- 如果是週一早上，詢問使用者指的是上週還是目前這個不完整週\n\n### 步驟 2：平行蒐集資料\n同時執行以下三個工具呼叫：\n- `ListMessages(folder_id=\"sentitems\", received_after=<Monday ISO>, top=100)`\n- `ListCalendarView(start=<Monday>, end=<now>, top=50)` — 只保留使用者已參加的事件（未拒絕）\n- `SearchM365(sources=[\"teams\"], from_user=<user email>, after=<Monday>, response_length=\"long\")`\n\n若任何工具回傳 `next_link`，請接續處理。\n\n### 步驟 3：分類並分組\n依主題分組活動。從重複主旨、與會者重疊或頻道名稱偵測主題。\n常見桶：\n- **已交付 / 有進展的專案**\n- **重要會議**\n- **已做成的決策**\n- **互動過的人員**\n\n### 步驟 4：輸出格式\n\n```markdown\n# <Mon date> – <Fri date> 週\n\n## 重點亮點\n- 3–5 個項目，列出最重要的事\n\n## 我做了什麼\n- 依專案/主題分組\n\n## 值得一提的會議\n- 只列有結果的會議（不含例行同步）\n\n## 下週\n- 2–3 件延續事項（只有在可從未結討論明顯看出時）\n```\n\n預設以內嵌 markdown 呈現。若使用者要求檔案或想分享，提供草擬 Teams 貼文（`PostMessage`）或郵件（`CreateDraftMessage`）— 未經檢閱絕不送出。\n\n## 護欄\n\n- 絕不包含私人約會（sensitivity=private）— 只顯示為時間區塊\n- 絕不在公開摘要中包含人事/HR/薪酬討論\n- 絕不捏造成果 — 如果那週活動較少，就如實說明\n- 預設使用內嵌 markdown；只有在明確要求時才建立檔案或傳送訊息\n","cn":"---\nname: weekly-wrap\ndescription: |\n  汇总用户过去一周发送的邮件、已接受的会议和 Teams 帖子，\n  生成周五状态笔记。当用户说“帮我整理这周”、“每周复盘”、“写我的每周状态”、“我这周做了什么”、“周五状态笔记”、“总结我这一周”、\"wrap my week\", \"weekly wrap\", \"write my\n  weekly status\", \"what did I do this week\", \"Friday status note\", or \"summarize my week\" 时使用。\n  不要用于每日摘要 — 请改用 daily-briefing。\n  不要用于前瞻性规划 — 此 skill 只做回顾。\ncowork:\n  category: productivity\n  icon: Flag\n---\n\n## 概览\n\n拉取用户本工作周在 Outlook（已发送邮件）、日历（已接受会议）和 Teams（频道 + 聊天帖子）中的活动，然后生成一份结构化状态笔记，用户可发布到团队频道、发邮件给经理，或保留为个人记录。\n\n## 适用场景\n\n- 周末撰写状态更新\n- 回顾自己完成了哪些工作\n- 基于一周活动生成经理更新或团队摘要\n\n## 不适用场景\n\n- \"What did I miss today\" / 早间简报 → 使用 `daily-briefing`\n- 多周或季度报告 → 使用 `stakeholder-comms`\n- 单场会议复盘 → 使用 `meeting-followup`\n\n## 快速开始\n\n```\n用户: “帮我整理这周”\n1. 计算周范围（Monday 00:00 → now），使用用户时区\n2. 并行执行：\n   - ListMessages，使用 folder_id=sentitems, received_after=<Monday>\n   - ListCalendarView 使用相同时间窗口，is_organizer filter both ways\n   - SearchM365 sources=[\"teams\"], from_user=<user email>, after=<Monday>\n3. 将结果归组为主题（项目、话题、人员）\n4. 生成结构化周五状态笔记\n```\n\n## 核心说明\n\n### 步骤 1：解析周范围\n- 使用用户当前本地时间\n- 一周从用户时区的 Monday 00:00 开始，到 now 结束\n- 如果是周一早上，询问用户指的是上周还是当前这个不完整周\n\n### 步骤 2：并行收集数据\n同时运行以下三个工具调用：\n- `ListMessages(folder_id=\"sentitems\", received_after=<Monday ISO>, top=100)`\n- `ListCalendarView(start=<Monday>, end=<now>, top=50)` — 只保留用户已参加的事件（未拒绝）\n- `SearchM365(sources=[\"teams\"], from_user=<user email>, after=<Monday>, response_length=\"long\")`\n\n如果其中任何一个返回 `next_link`，继续翻页处理。\n\n### 步骤 3：分类并分组\n按主题归组活动。根据重复主题、参会人重叠或频道名称识别主题。\n常见类别：\n- **已交付 / 有进展的项目**\n- **关键会议**\n- **已做出的决策**\n- **互动过的人员**\n\n### 步骤 4：输出格式\n\n```markdown\n# <Mon date> – <Fri date> 周\n\n## 亮点\n- 3–5 条，列出最重要的事情\n\n## 我做了什么\n- 按项目/主题分组\n\n## 值得关注的会议\n- 只列有结果的会议（不包括例行同步）\n\n## 下周\n- 2–3 件延续事项（仅当可从开放线程中明显看出时）\n```\n\n默认以内联 markdown 呈现。如果用户要求文件或想分享，提供起草 Teams 帖子（`PostMessage`）或邮件（`CreateDraftMessage`）— 未经检查绝不发送。\n\n## 护栏\n\n- 绝不包含私人日程（sensitivity=private）— 只显示为时间块\n- 绝不在公开摘要中包含人事/HR/薪酬讨论\n- 绝不编造成果 — 如果一周活动较少，就如实说明\n- 默认使用内联 markdown；只有在明确要求时才创建文件或发送信息\n"},"oof-prep":{"en":"---\nname: oof-prep\ndescription: |\n  Prepares the user for time off: drafts an out-of-office auto-reply, creates a handoff\n  document, and flags meetings during the PTO window for decline or delegation.\n  Use when user asks to \"prep me for PTO\", \"going on vacation\", \"set up my OOF\",\n  \"I'm out next week\", \"out of office prep\", or \"handoff before I leave\".\n  Do NOT use for one-day sick coverage — just set OOF directly with SetAutoReply.\n  Do NOT use for permanent role transitions — use stakeholder-comms instead.\ncowork:\n  category: productivity\n  icon: Calendar\n---\n\n## Overview\n\nThree-part PTO prep: (1) draft an OOF auto-reply for internal and external audiences,\n(2) generate a handoff document summarizing in-flight work and key contacts,\n(3) scan meetings in the PTO window and flag which to decline, delegate, or keep.\n\n## When to Use\n\n- User announces they're going on PTO / vacation / leave\n- 2+ business days out of office\n- Need a handoff for coverage\n\n## When NOT to Use\n\n- Single sick day → just call `SetAutoReply` directly\n- Permanent leave / role change → use `stakeholder-comms`\n- Already-active OOF → use `GetAutoReplySettings` / `DisableAutoReply`\n\n## Quick Start\n\n```\nUser: \"prep me for PTO May 30 – June 6\"\n1. Ask for coverage contact and any critical context (one batched question)\n2. Draft OOF (internal + external) — show for review\n3. ListCalendarView for PTO window → flag meetings (decline / delegate / keep)\n4. Build handoff doc: in-flight projects, key contacts, where things live\n5. Offer to: enable OOF, send decline notes, post handoff to team channel\n```\n\n## Core Instructions\n\n### Step 1: Clarify minimal context\n\nAsk ONE batched `AskUserQuestion` covering:\n- Coverage contact (who to point urgent issues to)\n- Whether they want strict no-reply or willing to monitor email\n- Whether to auto-decline meetings or just flag them\n\nDo not ask multiple round-trips — gather everything in one card.\n\n### Step 2: Draft OOF message\n\nUse `SetAutoReply` with `status=\"scheduled\"`, the PTO start/end, and:\n- **Internal message:** warm tone, mentions coverage contact by name, return date\n- **External message:** brief, professional, return date, \"for urgent matters contact <X>\"\n\nShow drafts to user before calling `SetAutoReply`. Never enable OOF without confirmation.\n\n### Step 3: Scan calendar\n\n`ListCalendarView(start=<PTO start>, end=<PTO end>)` — for each event classify:\n- **Decline** — recurring routine syncs, optional meetings, anything the user could miss\n- **Delegate** — meetings where the coverage contact can attend\n- **Keep on calendar (but signal)** — meetings the user organizes; forward to delegate\n- **Important — needs action** — meetings the user must handle before/after PTO\n\nRender as a `render-ui` table. Do NOT auto-decline — show recommendations for user approval.\n\n### Step 4: Handoff document\n\nCreate a markdown doc with sections:\n\n```markdown\n# Handoff — <name> OOF <start> to <end>\n\n## Coverage contact\n<Name, email, focus areas>\n\n## In-flight projects\n- <Project> — current state, next checkpoint, key contact\n\n## Critical threads to watch\n- <Email subject> — what to do if X happens\n\n## Things you can ignore\n- <Bucket> — won't matter while I'm out\n\n## Where things live\n- <Files, channels, dashboards>\n```\n\nPopulate from: recent sent mail, accepted meetings the past week, active Teams chats.\nSave inline as markdown by default; offer to save as a file or post in a team channel.\n\n### Step 5: Execute on confirmation\n\nOnly after the user reviews all three artifacts:\n- Call `SetAutoReply` to schedule OOF\n- For declines: use `DeclineEvent` with a brief comment for each approved one\n- For delegate forwards: use `ForwardEvent`\n\n## Guardrails\n\n- Never enable OOF without showing the draft and getting confirmation\n- Never auto-decline meetings — always show the list for approval first\n- For external OOF, do NOT name the coverage contact unless user confirms (privacy)\n- If the user organizes a recurring series during PTO, suggest forwarding ownership, never cancel by default\n","zh":"---\nname: oof-prep\ndescription: |\n  為使用者準備休假：草擬 OOF 自動回覆、建立交接文件，並標記 PTO 期間需要婉拒或委派的會議。\n  當使用者要求「幫我準備 PTO」、「我要休假」、「設定我的 OOF」、「我下週不在」、「休假交接」、「離開前交接」、\"prep me for PTO\", \"going on vacation\", \"set up my OOF\",\n  \"I'm out next week\", \"out of office prep\", 或 \"handoff before I leave\" 時使用。\n  請勿用於一天病假代班 — 直接使用 SetAutoReply 設定 OOF 即可。\n  請勿用於永久職務轉換 — 請改用 stakeholder-comms。\ncowork:\n  category: productivity\n  icon: Calendar\n---\n\n## 概觀\n\n三段式 PTO 準備：(1) 為內部與外部對象草擬 OOF 自動回覆，\n(2) 產生交接文件，摘要進行中的工作與關鍵聯絡人，\n(3) 掃描 PTO 期間的會議，標記哪些應婉拒、委派或保留。\n\n## 使用時機\n\n- 使用者表示即將 PTO / 休假 / 請假\n- 離開辦公室 2+ 個工作天\n- 需要交接給代理人員\n\n## 不適用時機\n\n- 單日病假 → 直接呼叫 `SetAutoReply`\n- 永久離職 / 職務變更 → 使用 `stakeholder-comms`\n- OOF 已啟用 → 使用 `GetAutoReplySettings` / `DisableAutoReply`\n\n## 快速開始\n\n```\n使用者：「幫我準備 5 月 30 日到 6 月 6 日的 PTO」\n1. 詢問代理聯絡人與任何關鍵背景（一次彙整提問）\n2. 草擬 OOF（內部 + 外部）— 顯示給使用者審閱\n3. 對 PTO 期間使用 ListCalendarView → 標記會議（婉拒 / 委派 / 保留）\n4. 建立交接文件：進行中專案、關鍵聯絡人、資料位置\n5. 提議：啟用 OOF、寄送婉拒說明、將交接內容張貼到團隊頻道\n```\n\n## 核心指示\n\n### 步驟 1：釐清最少必要背景\n\n提出 ONE 個彙整式 `AskUserQuestion`，涵蓋：\n- 代理聯絡人（緊急事項應轉給誰）\n- 使用者想完全不回覆，或願意查看郵件\n- 要自動婉拒會議，還是只先標記\n\n不要來回多次提問 — 在一張卡片中一次收集完整資訊。\n\n### 步驟 2：草擬 OOF 訊息\n\n使用 `SetAutoReply` 搭配 `status=\"scheduled\"`、PTO 開始/結束時間，以及：\n- **內部訊息：** 語氣溫暖，提及代理聯絡人的姓名與返回日期\n- **外部訊息：** 簡短、專業、包含返回日期與 \"for urgent matters contact <X>\"\n\n在呼叫 `SetAutoReply` 前，先向使用者顯示草稿。沒有確認前，絕不啟用 OOF。\n\n### 步驟 3：掃描行事曆\n\n`ListCalendarView(start=<PTO start>, end=<PTO end>)` — 對每個活動分類：\n- **婉拒** — 例行週期同步、選擇性會議、使用者可缺席的任何會議\n- **委派** — 代理聯絡人可以出席的會議\n- **保留在行事曆上（但發出訊號）** — 使用者主辦的會議；轉寄給代理人\n- **重要 — 需要行動** — 使用者必須在 PTO 前/後處理的會議\n\n以 `render-ui` 表格呈現。請勿自動婉拒 — 先向使用者顯示建議並取得核准。\n\n### 步驟 4：交接文件\n\n建立包含下列區段的 markdown 文件：\n\n```markdown\n# 交接 — <name> OOF <start> 至 <end>\n\n## 代理聯絡人\n<Name, email, focus areas>\n\n## 進行中專案\n- <Project> — 目前狀態、下一個檢查點、關鍵聯絡人\n\n## 需要留意的重要郵件串\n- <Email subject> — 如果 X 發生時該怎麼做\n\n## 可以忽略的事項\n- <Bucket> — 我不在期間不會有影響\n\n## 資料位置\n- <Files, channels, dashboards>\n```\n\n資料來源：近期寄件、過去一週已接受的會議、活躍 Teams 聊天。\n預設以 markdown 內嵌儲存；可提議另存成檔案或張貼到團隊頻道。\n\n### 步驟 5：確認後執行\n\n只有在使用者審閱三項產出後：\n- 呼叫 `SetAutoReply` 排程 OOF\n- 針對婉拒項目：對每個核准的會議使用 `DeclineEvent`，並附上簡短留言\n- 針對委派轉寄：使用 `ForwardEvent`\n\n## 護欄\n\n- 未顯示草稿並取得確認前，絕不啟用 OOF\n- 絕不自動婉拒會議 — 一律先顯示清單供使用者核准\n- 外部 OOF 不得提及代理聯絡人，除非使用者確認（隱私）\n- 如果使用者在 PTO 期間主辦週期性系列會議，建議轉移主辦權，預設不要取消\n","cn":"---\nname: oof-prep\ndescription: |\n  为用户准备休假：起草 OOF 自动回复、创建交接文档，并标记 PTO 期间需要谢绝或委派的会议。\n  当用户提出“帮我准备 PTO”、“我要休假”、“设置我的 OOF”、“我下周不在”、“休假前交接”、“休假交接”、\"prep me for PTO\", \"going on vacation\", \"set up my OOF\",\n  \"I'm out next week\", \"out of office prep\", 或 \"handoff before I leave\" 时使用。\n  不要用于一天病假替岗 — 直接用 SetAutoReply 设置 OOF 即可。\n  不要用于永久岗位交接 — 请改用 stakeholder-comms。\ncowork:\n  category: productivity\n  icon: Calendar\n---\n\n## 概览\n\n三部分 PTO 准备：(1) 为内部和外部对象起草 OOF 自动回复，\n(2) 生成交接文档，汇总进行中的工作和关键联系人，\n(3) 扫描 PTO 时间段内的会议，并标记哪些应谢绝、委派或保留。\n\n## 使用场景\n\n- 用户表示即将 PTO / 休假 / 请假\n- 离岗 2+ 个工作日\n- 需要为替岗人员准备交接\n\n## 不适用场景\n\n- 单日病假 → 直接调用 `SetAutoReply`\n- 永久离职 / 岗位变更 → 使用 `stakeholder-comms`\n- OOF 已启用 → 使用 `GetAutoReplySettings` / `DisableAutoReply`\n\n## 快速开始\n\n```\n用户：“帮我准备 5 月 30 日到 6 月 6 日的 PTO”\n1. 询问替岗联系人和任何关键背景（一次性汇总提问）\n2. 起草 OOF（内部 + 外部）— 展示给用户审核\n3. 针对 PTO 时间段调用 ListCalendarView → 标记会议（谢绝 / 委派 / 保留）\n4. 生成交接文档：进行中的项目、关键联系人、资料位置\n5. 提议：启用 OOF、发送谢绝说明、将交接内容发布到团队频道\n```\n\n## 核心说明\n\n### 步骤 1：澄清最少必要背景\n\n提出 ONE 个汇总式 `AskUserQuestion`，覆盖：\n- 替岗联系人（紧急事项应转给谁）\n- 用户希望完全不回复，还是愿意查看邮件\n- 是自动谢绝会议，还是只先标记\n\n不要多轮来回提问 — 在一张卡片中一次收集完整信息。\n\n### 步骤 2：起草 OOF 信息\n\n使用 `SetAutoReply`，设置 `status=\"scheduled\"`、PTO 开始/结束时间，以及：\n- **内部信息：** 语气温和，提到替岗联系人姓名和返回日期\n- **外部信息：** 简短、专业，包含返回日期和 \"for urgent matters contact <X>\"\n\n调用 `SetAutoReply` 前，先向用户展示草稿。未经确认，绝不启用 OOF。\n\n### 步骤 3：扫描日历\n\n`ListCalendarView(start=<PTO start>, end=<PTO end>)` — 对每个事件分类：\n- **谢绝** — 例行周期同步、可选会议、用户可以缺席的任何会议\n- **委派** — 替岗联系人可以参加的会议\n- **保留在日历上（但发出提示）** — 用户组织的会议；转发给代理人\n- **重要 — 需要行动** — 用户必须在 PTO 前/后处理的会议\n\n以 `render-ui` 表格呈现。不要自动谢绝 — 先向用户展示建议并获得审批。\n\n### 步骤 4：交接文档\n\n创建包含以下部分的 markdown 文档：\n\n```markdown\n# 交接 — <name> OOF <start> 至 <end>\n\n## 替岗联系人\n<Name, email, focus areas>\n\n## 进行中的项目\n- <Project> — 当前状态、下一个检查点、关键联系人\n\n## 需要关注的关键邮件线程\n- <Email subject> — 如果 X 发生时该怎么做\n\n## 可以忽略的事项\n- <Bucket> — 我不在期间不会产生影响\n\n## 资料位置\n- <Files, channels, dashboards>\n```\n\n数据来源：近期已发送邮件、过去一周已接受的会议、活跃 Teams 聊天。\n默认以内嵌 markdown 保存；可提议另存为文件或发布到团队频道。\n\n### 步骤 5：确认后执行\n\n只有在用户审核全部三项产出后：\n- 调用 `SetAutoReply` 排程 OOF\n- 对于谢绝项：对每个已审批的会议使用 `DeclineEvent`，并附上简短评论\n- 对于委派转发：使用 `ForwardEvent`\n\n## 护栏\n\n- 未展示草稿并获得确认前，绝不启用 OOF\n- 绝不自动谢绝会议 — 始终先展示列表供用户审批\n- 外部 OOF 不得提及替岗联系人，除非用户确认（隐私）\n- 如果用户在 PTO 期间组织周期性会议系列，建议转交组织权，默认不要取消\n"},"meeting-followup":{"en":"---\nname: meeting-followup\ndescription: |\n  Pulls action items and decisions from the user's most recent meeting and drafts a\n  follow-up email to attendees. Use when user asks to \"send the follow-up from my last call\",\n  \"draft a recap of my last meeting\", \"follow up on that meeting\", \"send action items from\n  the standup\", or \"write a recap email to attendees\".\n  Do NOT use for proactive meeting prep — use meeting-intel or schedule-meeting instead.\n  Do NOT use for generic stakeholder updates not tied to a specific meeting — use\n  stakeholder-comms instead.\ncowork:\n  category: communication\n  icon: Mail\n---\n\n## Overview\n\nIdentifies the user's most recently completed meeting, extracts decisions and action items\nfrom its transcript (or, if no transcript exists, from chat/email context around it), then\ndrafts a recap email to the attendees for the user to review and send.\n\n## When to Use\n\n- User just finished a call and wants to send a recap\n- User says \"the follow-up\", \"the recap\", \"the action items\" without naming a meeting\n- User wants attendees reminded of what they committed to\n\n## When NOT to Use\n\n- Preparing FOR an upcoming meeting → use `meeting-intel`\n- Generic team update untied to a meeting → use `stakeholder-comms`\n- Scheduling a new meeting → use `schedule-meeting`\n\n## Quick Start\n\n```\nUser: \"send the follow-up from my last call\"\n1. ListCalendarView for past 6 hours → pick most recent ended meeting\n2. ListMeetingTranscripts for that meeting → GetMeetingTranscript if available\n3. If no transcript: search Teams/email around that window for context\n4. Extract: decisions, action items (owner + due date), open questions\n5. Draft email with CreateDraftMessage to attendees, show for review\n```\n\n## Core Instructions\n\n### Step 1: Identify the meeting\n- Resolve current time from user context\n- Call `ListCalendarView` with start = 8 hours ago, end = now, `is_organizer=false` not set (include both)\n- Pick the most recently-ended event the user was an attendee of (skip declined/cancelled)\n- If multiple recent meetings, ask the user which one via `AskUserQuestion` with the candidates as options\n\n### Step 2: Get content\n- If the event has `onlineMeeting.joinUrl`, call `ListMeetingTranscripts` then `GetMeetingTranscript`\n- If no transcript: call `SearchM365` with `sources=[\"teams\",\"email\"]`, scoped to the day, with the meeting subject as query\n- If still nothing: tell the user you couldn't find content and offer to draft from the meeting subject + attendees only\n\n### Step 3: Extract structure\nPull from the transcript or context:\n- **Decisions** — what was agreed\n- **Action items** — owner, task, due date (if mentioned)\n- **Open questions** — things still unresolved\n- **Next steps** — follow-on meetings or checkpoints\n\nNever invent owners or dates. If unclear, mark as `[owner TBD]`.\n\n### Step 4: Draft email\nUse `CreateDraftMessage` with:\n- **To:** original attendees (excluding the user)\n- **Subject:** `Recap: <meeting subject>`\n- **Body** structure:\n  ```\n  Thanks everyone for joining today's <meeting>. Quick recap below.\n\n  Decisions\n  - ...\n\n  Action items\n  - <Owner>: <task> — <due date>\n\n  Open questions\n  - ...\n\n  Let me know if I missed anything.\n  ```\n\nShow the draft to the user and let them edit before sending. Do NOT call `SendDraftMessage`\nunless the user explicitly says \"send it\".\n\n## Guardrails\n\n- Never fabricate action items, owners, or dates not present in the source\n- Always create a draft (`CreateDraftMessage`) — never send directly\n- If the meeting was private/1:1, confirm before drafting to ensure user wants a written record\n- Redact any sensitive personnel discussion (compensation, performance) — flag to user instead\n","zh":"---\nname: meeting-followup\ndescription: |\n  從使用者最近一次會議擷取行動項目與決策，並草擬寄給與會者的\n  後續追蹤郵件。當使用者說「寄出我上一通電話的後續追蹤」、「幫我草擬上一場會議摘要」、「追蹤那場會議」、「寄出站會的行動項目」、「寫一封會議摘要信給與會者」、\"send the follow-up from my last call\",\n  \"draft a recap of my last meeting\", \"follow up on that meeting\", \"send action items from\n  the standup\", or \"write a recap email to attendees\" 時使用。\n  不要用於主動會議準備 — 請改用 meeting-intel 或 schedule-meeting。\n  不要用於與特定會議無關的一般利害關係人更新 — 請改用\n  stakeholder-comms。\ncowork:\n  category: communication\n  icon: Mail\n---\n\n## 概觀\n\n找出使用者最近完成的會議，從其逐字稿擷取決策與行動項目（若沒有逐字稿，則從該時段周邊的聊天/郵件背景擷取），接著草擬一封給與會者的摘要郵件，供使用者檢閱並寄出。\n\n## 使用時機\n\n- 使用者剛結束一通電話，想寄送摘要\n- 使用者說「後續追蹤」、「摘要」、「行動項目」但沒有指名會議\n- 使用者想提醒與會者各自承諾的事項\n\n## 不適用時機\n\n- 為即將到來的會議做準備 → 使用 `meeting-intel`\n- 與會議無關的一般團隊更新 → 使用 `stakeholder-comms`\n- 排定新會議 → 使用 `schedule-meeting`\n\n## 快速開始\n\n```\n使用者: 「寄出我上一通電話的後續追蹤」\n1. ListCalendarView 查過去 6 小時 → 選取最近結束的會議\n2. ListMeetingTranscripts 該會議 → 若可用則 GetMeetingTranscript\n3. 若沒有逐字稿：搜尋該時段周邊的 Teams/郵件背景\n4. 擷取：決策、行動項目（負責人 + 到期日）、未決問題\n5. 使用 CreateDraftMessage 草擬給與會者的郵件，顯示供檢閱\n```\n\n## 核心指示\n\n### 步驟 1：識別會議\n- 從使用者情境解析目前時間\n- 呼叫 `ListCalendarView`，start = 8 hours ago，end = now，`is_organizer=false` 不設定（兩者都包含）\n- 選取使用者曾參加且最近結束的事件（略過已拒絕/已取消）\n- 若有多場近期會議，使用 `AskUserQuestion` 並以候選會議作為選項詢問使用者\n\n### 步驟 2：取得內容\n- 如果事件有 `onlineMeeting.joinUrl`，呼叫 `ListMeetingTranscripts`，再呼叫 `GetMeetingTranscript`\n- 如果沒有逐字稿：呼叫 `SearchM365`，搭配 `sources=[\"teams\",\"email\"]`，範圍限定當天，並以會議主旨作為查詢\n- 如果仍找不到內容：告知使用者你找不到內容，並提供只根據會議主旨 + 與會者草擬的選項\n\n### 步驟 3：擷取結構\n從逐字稿或背景內容擷取：\n- **決策** — 已達成共識的事項\n- **行動項目** — 負責人、任務、到期日（若有提到）\n- **未決問題** — 仍未解決的事項\n- **下一步** — 後續會議或檢查點\n\n絕不捏造負責人或日期。若不清楚，標示為 `[owner TBD]`。\n\n### 步驟 4：草擬郵件\n使用 `CreateDraftMessage`，並設定：\n- **To:** 原始與會者（排除使用者）\n- **Subject:** `Recap: <meeting subject>`\n- **Body** 結構：\n  ```\n  謝謝大家參加今天的 <meeting>。以下是簡短摘要。\n\n  決策\n  - ...\n\n  行動項目\n  - <Owner>: <task> — <due date>\n\n  未決問題\n  - ...\n\n  若我有遺漏任何事項，請告訴我。\n  ```\n\n將草稿顯示給使用者，讓他們在寄出前編輯。除非使用者明確說 \"send it\"，否則不要呼叫 `SendDraftMessage`。\n\n## 護欄\n\n- 絕不編造來源中沒有的行動項目、負責人或日期\n- 一律建立草稿（`CreateDraftMessage`）— 絕不直接寄出\n- 如果會議是私人/1:1，草擬前先確認，確保使用者想留下書面紀錄\n- 遮蔽任何敏感人事討論（薪酬、績效）— 改為提醒使用者\n","cn":"---\nname: meeting-followup\ndescription: |\n  从用户最近一次会议中提取行动项和决策，并起草发给参会人的\n  会后跟进邮件。当用户说“发送我上个电话会的跟进”、“帮我起草上次会议纪要”、“跟进那场会”、“发送站会行动项”、“给参会人写一封复盘邮件”、\"send the follow-up from my last call\",\n  \"draft a recap of my last meeting\", \"follow up on that meeting\", \"send action items from\n  the standup\", or \"write a recap email to attendees\" 时使用。\n  不要用于主动会议准备 — 请改用 meeting-intel 或 schedule-meeting。\n  不要用于与特定会议无关的通用干系人更新 — 请改用\n  stakeholder-comms。\ncowork:\n  category: communication\n  icon: Mail\n---\n\n## 概览\n\n识别用户最近完成的会议，从会议转录中提取决策和行动项（如果没有转录，则从该时间窗口周边的聊天/邮件上下文中提取），然后起草一封发给参会人的复盘邮件，供用户检查并发送。\n\n## 适用场景\n\n- 用户刚结束一个电话会，想发送复盘\n- 用户说“跟进”、“复盘”、“行动项”，但没有指明哪场会议\n- 用户希望提醒参会人各自承诺的事项\n\n## 不适用场景\n\n- 为即将召开的会议做准备 → 使用 `meeting-intel`\n- 与会议无关的通用团队更新 → 使用 `stakeholder-comms`\n- 安排新会议 → 使用 `schedule-meeting`\n\n## 快速开始\n\n```\n用户: “发送我上个电话会的跟进”\n1. ListCalendarView 查询过去 6 小时 → 选择最近结束的会议\n2. ListMeetingTranscripts 查询该会议 → 如可用则 GetMeetingTranscript\n3. 如无转录：搜索该时间窗口周边的 Teams/邮件上下文\n4. 提取：决策、行动项（负责人 + 截止日期）、开放问题\n5. 使用 CreateDraftMessage 起草发给参会人的邮件，并展示给用户检查\n```\n\n## 核心说明\n\n### 步骤 1：识别会议\n- 根据用户上下文解析当前时间\n- 调用 `ListCalendarView`，start = 8 hours ago，end = now，不设置 `is_organizer=false`（两类都包含）\n- 选择用户参加过且最近结束的事件（跳过已拒绝/已取消）\n- 如果有多个近期会议，使用 `AskUserQuestion`，将候选会议作为选项让用户选择\n\n### 步骤 2：获取内容\n- 如果事件有 `onlineMeeting.joinUrl`，调用 `ListMeetingTranscripts`，然后调用 `GetMeetingTranscript`\n- 如果没有转录：调用 `SearchM365`，使用 `sources=[\"teams\",\"email\"]`，范围限定当天，并以会议主题作为查询\n- 如果仍然找不到内容：告知用户未找到内容，并提供仅根据会议主题 + 参会人起草的选项\n\n### 步骤 3：提取结构\n从转录或上下文中提取：\n- **决策** — 已达成一致的事项\n- **行动项** — 负责人、任务、截止日期（如果提到）\n- **开放问题** — 仍未解决的事项\n- **下一步** — 后续会议或检查点\n\n绝不编造负责人或日期。如果不清楚，标记为 `[owner TBD]`。\n\n### 步骤 4：起草邮件\n使用 `CreateDraftMessage`，并设置：\n- **To:** 原始参会人（排除用户）\n- **Subject:** `Recap: <meeting subject>`\n- **Body** 结构：\n  ```\n  感谢大家参加今天的 <meeting>。简要复盘如下。\n\n  决策\n  - ...\n\n  行动项\n  - <Owner>: <task> — <due date>\n\n  开放问题\n  - ...\n\n  如有遗漏，请告诉我。\n  ```\n\n将草稿展示给用户，并让他们在发送前编辑。除非用户明确说 \"send it\"，否则不要调用 `SendDraftMessage`。\n\n## 护栏\n\n- 绝不编造来源中没有的行动项、负责人或日期\n- 始终创建草稿（`CreateDraftMessage`）— 绝不直接发送\n- 如果会议是私密/1:1，起草前先确认，确保用户希望留下书面记录\n- 对任何敏感人事讨论（薪酬、绩效）进行遮蔽 — 改为提示用户\n"},"newsletter-builder":{"en":"---\nname: newsletter-builder\ndescription: |\n  Creates structured newsletter drafts for internal or external audiences.\n  Use when user asks \"write newsletter\", \"team update email\", \"monthly digest\",\n  \"company newsletter\", or \"internal comms\".\nlicense: MIT\nmetadata:\n  author: Cowork Library\n  version: \"1.0\"\n  plugin: content-studio\n---\n\n# Newsletter Builder\n\nGenerate engaging newsletters with proper structure and compelling content.\n\n## What This Skill Does\n\nCreates newsletter drafts including:\n- Attention-grabbing subject lines\n- Clear section structure\n- Scannable formatting\n- Calls to action\n- Engagement elements\n\n## When to Use\n\n- Weekly/monthly team updates\n- Company-wide communications\n- Customer newsletters\n- Product updates\n- Community digests\n\n## Required Information\n\n1. Newsletter type (internal/external)\n2. Audience\n3. Frequency (weekly, monthly, etc.)\n4. Key topics/updates to include\n5. Tone (formal, friendly, energetic)\n6. Any recurring sections\n\n## Newsletter Best Practices Applied\n\n- **Subject line:** Clear value, under 50 chars\n- **Preview text:** Complements subject\n- **Scannable:** Headers, bullets, short paragraphs\n- **One primary CTA:** Don't overwhelm\n- **Mobile-first:** Most read on phones\n\n## Output Format\n\n# Newsletter Draft: {Edition/Date}\n\n## Subject Line Options\n1. {Option 1 - benefit-focused}\n2. {Option 2 - curiosity-driven}\n3. {Option 3 - news-focused}\n\n**Preview text:** {The text that appears after subject in inbox}\n\n---\n\n## Newsletter Content\n\n### Header\n{Newsletter Name} | {Date/Edition}\n\n---\n\n### 👋 Hello {Name/Team},\n\n{Brief, warm opening. 1-2 sentences that set the tone and preview what's inside.}\n\n---\n\n### 📣 Big News / Spotlight\n**{Headline}**\n\n{The most important update or story. 2-3 paragraphs max. Include why it matters to the reader.}\n\n{CTA if applicable: Learn more → }\n\n---\n\n### 📊 Updates & Highlights\n\n**{Update 1 Title}**\n{Brief description. 2-3 sentences.}\n\n**{Update 2 Title}**\n{Brief description. 2-3 sentences.}\n\n**{Update 3 Title}**\n{Brief description. 2-3 sentences.}\n\n---\n\n### 🎉 Wins & Recognition\n\n- {Shoutout or celebration 1}\n- {Shoutout or celebration 2}\n- {Milestone or achievement}\n\n---\n\n### 📅 Upcoming\n\n| Date | Event |\n|------|-------|\n| {date} | {event} |\n| {date} | {event} |\n| {date} | {event} |\n\n---\n\n### 💡 Quick Tips / Did You Know?\n\n> {Useful tip, fact, or insight relevant to your audience}\n\n---\n\n### 📚 Resources / Links\n\n- [{Resource 1}]({link})\n- [{Resource 2}]({link})\n- [{Resource 3}]({link})\n\n---\n\n### 💬 Feedback Corner\n\n{Question to engage readers or request for input}\n\n[Reply to share your thoughts →]\n\n---\n\n### Closing\n\n{Brief sign-off. Thank them, preview next edition, or inspiring close.}\n\nBest,\n{Name/Team}\n\n---\n\n## Footer\n{Unsubscribe link if external} | {Contact info} | {Social links}\n\n---\n\n## Metrics to Track\n- Open rate (aim: >40% internal, >20% external)\n- Click rate (aim: >10%)\n- Reply rate\n- Unsubscribes\n\n## Pre-Send Checklist\n- [ ] Subject line tested\n- [ ] All links working\n- [ ] Images loading\n- [ ] Mobile preview checked\n- [ ] Sent test to yourself\n- [ ] Scheduled for optimal time","zh":"---\nname: newsletter-builder\ndescription: |\n  為內部或外部受眾建立結構化的電子報草稿。\n  當使用者說「撰寫電子報」、「團隊更新郵件」、「每月摘要」、「公司電子報」、「內部溝通」、\n  \"write newsletter\", \"team update email\", \"monthly digest\",\n  \"company newsletter\", or \"internal comms\" 時使用。\nlicense: MIT\nmetadata:\n  author: Cowork Library\n  version: \"1.0\"\n  plugin: content-studio\n---\n\n# 電子報草稿產生器\n以合適的結構與具吸引力的內容產生引人入勝的電子報。\n\n## 此技能的功能\n\n建立電子報草稿，包含：\n- 吸引目光的主旨\n- 清楚的段落結構\n- 易於瀏覽的格式\n- 行動呼籲\n- 互動元素\n\n## 使用時機\n\n- 每週／每月團隊更新\n- 全公司溝通\n- 客戶電子報\n- 產品更新\n- 社群摘要\n\n## 必要資訊\n\n1. 電子報類型（內部／外部）\n2. 受眾\n3. 頻率（每週、每月等）\n4. 要納入的重點主題／更新\n5. 語氣（正式、親切、充滿活力）\n6. 任何固定單元\n\n## 套用的電子報最佳做法\n\n- **主旨:** 價值清楚，少於 50 chars\n- **預覽文字:** 補充主旨\n- **易於瀏覽:** 標題、項目符號、短段落\n- **一個主要 CTA:** 不讓讀者負擔過重\n- **行動裝置優先:** 多數人會在手機上閱讀\n\n## 輸出格式\n\n# 電子報草稿: {Edition/Date}\n\n## 主旨選項\n1. {Option 1 - benefit-focused}\n2. {Option 2 - curiosity-driven}\n3. {Option 3 - news-focused}\n\n**預覽文字:** {The text that appears after subject in inbox}\n\n---\n\n## 電子報內容\n\n### 標頭\n{Newsletter Name} | {Date/Edition}\n\n---\n\n### 👋 您好 {Name/Team},\n\n{Brief, warm opening. 1-2 sentences that set the tone and preview what's inside.}\n\n---\n\n### 📣 重大消息／焦點\n**{Headline}**\n\n{The most important update or story. 2-3 paragraphs max. Include why it matters to the reader.}\n\n{CTA if applicable: Learn more → }\n\n---\n\n### 📊 更新與亮點\n\n**{Update 1 Title}**\n{Brief description. 2-3 sentences.}\n\n**{Update 2 Title}**\n{Brief description. 2-3 sentences.}\n\n**{Update 3 Title}**\n{Brief description. 2-3 sentences.}\n\n---\n\n### 🎉 成果與表揚\n\n- {Shoutout or celebration 1}\n- {Shoutout or celebration 2}\n- {Milestone or achievement}\n\n---\n\n### 📅 即將到來\n\n| 日期 | 活動 |\n|------|-------|\n| {date} | {event} |\n| {date} | {event} |\n| {date} | {event} |\n\n---\n\n### 💡 快速提示／你知道嗎？\n\n> {Useful tip, fact, or insight relevant to your audience}\n\n---\n\n### 📚 資源／連結\n\n- [{Resource 1}]({link})\n- [{Resource 2}]({link})\n- [{Resource 3}]({link})\n\n---\n\n### 💬 意見交流區\n\n{Question to engage readers or request for input}\n\n[回覆分享你的想法 →]\n\n---\n\n### 結語\n\n{Brief sign-off. Thank them, preview next edition, or inspiring close.}\n\n敬上,\n{Name/Team}\n\n---\n\n## 頁尾\n{Unsubscribe link if external} | {Contact info} | {Social links}\n\n---\n\n## 要追蹤的指標\n- 開信率（目標: >40% internal, >20% external）\n- 點擊率（目標: >10%）\n- 回覆率\n- 取消訂閱\n\n## 寄送前檢查清單\n- [ ] 已測試主旨\n- [ ] 所有連結可正常使用\n- [ ] 圖片可載入\n- [ ] 已檢查行動裝置預覽\n- [ ] 已寄送測試信給自己\n- [ ] 已排程在最佳時間寄送","cn":"---\nname: newsletter-builder\ndescription: |\n  面向内部或外部受众创建结构化的新闻简报草稿。\n  当用户说“写新闻简报”、“团队更新邮件”、“月度简报”、“公司内刊”、“内部沟通”、\n  \"write newsletter\", \"team update email\", \"monthly digest\",\n  \"company newsletter\", or \"internal comms\" 时使用。\nlicense: MIT\nmetadata:\n  author: Cowork Library\n  version: \"1.0\"\n  plugin: content-studio\n---\n\n# 电子报草稿生成器\n生成结构清晰、内容有吸引力的新闻简报。\n\n## 此技能的作用\n\n创建新闻简报草稿，包括：\n- 吸引注意力的主题行\n- 清晰的版块结构\n- 便于快速浏览的格式\n- 行动号召\n- 互动元素\n\n## 使用时机\n\n- 每周/月度团队更新\n- 面向全公司的沟通\n- 客户新闻简报\n- 产品更新\n- 社区动态汇总\n\n## 必要信息\n\n1. 新闻简报类型（内部/外部）\n2. 受众\n3. 频率（每周、每月等）\n4. 需要包含的关键主题/更新\n5. 语气（正式、友好、有活力）\n6. 任何固定栏目\n\n## 已应用的新闻简报最佳实践\n\n- **主题行:** 价值清晰，少于 50 chars\n- **预览文本:** 与主题行互补\n- **便于快速浏览:** 标题、项目符号、短段落\n- **一个主要 CTA:** 不让读者负担过重\n- **移动端优先:** 大多数人在手机上阅读\n\n## 输出格式\n\n# 新闻简报草稿: {Edition/Date}\n\n## 主题行选项\n1. {Option 1 - benefit-focused}\n2. {Option 2 - curiosity-driven}\n3. {Option 3 - news-focused}\n\n**预览文本:** {The text that appears after subject in inbox}\n\n---\n\n## 新闻简报正文\n\n### 页眉\n{Newsletter Name} | {Date/Edition}\n\n---\n\n### 👋 你好 {Name/Team},\n\n{Brief, warm opening. 1-2 sentences that set the tone and preview what's inside.}\n\n---\n\n### 📣 重大新闻 / 焦点\n**{Headline}**\n\n{The most important update or story. 2-3 paragraphs max. Include why it matters to the reader.}\n\n{CTA if applicable: Learn more → }\n\n---\n\n### 📊 更新与亮点\n\n**{Update 1 Title}**\n{Brief description. 2-3 sentences.}\n\n**{Update 2 Title}**\n{Brief description. 2-3 sentences.}\n\n**{Update 3 Title}**\n{Brief description. 2-3 sentences.}\n\n---\n\n### 🎉 成果与认可\n\n- {Shoutout or celebration 1}\n- {Shoutout or celebration 2}\n- {Milestone or achievement}\n\n---\n\n### 📅 即将发生\n\n| 日期 | 活动 |\n|------|-------|\n| {date} | {event} |\n| {date} | {event} |\n| {date} | {event} |\n\n---\n\n### 💡 快速提示 / 你知道吗？\n\n> {Useful tip, fact, or insight relevant to your audience}\n\n---\n\n### 📚 资源 / 链接\n\n- [{Resource 1}]({link})\n- [{Resource 2}]({link})\n- [{Resource 3}]({link})\n\n---\n\n### 💬 反馈角\n\n{Question to engage readers or request for input}\n\n[回复分享你的想法 →]\n\n---\n\n### 结尾\n\n{Brief sign-off. Thank them, preview next edition, or inspiring close.}\n\n祝好,\n{Name/Team}\n\n---\n\n## 页脚\n{Unsubscribe link if external} | {Contact info} | {Social links}\n\n---\n\n## 需跟踪的指标\n- 打开率（目标: >40% internal, >20% external）\n- 点击率（目标: >10%）\n- 回复率\n- 退订数\n\n## 发送前检查清单\n- [ ] 主题行已测试\n- [ ] 所有链接可正常访问\n- [ ] 图片可正常加载\n- [ ] 已检查移动端预览\n- [ ] 已向自己发送测试邮件\n- [ ] 已安排在最佳时间发送"},"exec-summary":{"en":"---\nname: exec-summary\ndescription: |\n  Condenses a long document, email thread, or transcript into a one-page executive summary.\n  Use when user asks to \"TL;DR this\", \"give me the exec summary\", \"summarize this for\n  leadership\", \"one-page summary\", \"condense this\", or \"make this shorter for a busy\n  reader\".\n  Do NOT use for summarizing a meeting transcript — use meeting-intel.\n  Do NOT use for inbox-wide summaries — use inbox-triage or daily-briefing.\ncowork:\n  category: writing\n  icon: DocumentText\n---\n\n## Overview\n\nTakes a long piece of content (document, thread, transcript, report) and produces a one-page\nexecutive summary aimed at a busy senior reader: what, why it matters, decisions needed,\nrecommended next step.\n\n## When to Use\n\n- User shares a long file or pastes a long thread and wants the gist\n- \"TL;DR\" of any artifact\n- Preparing a brief from a longer source for leadership consumption\n\n## When NOT to Use\n\n- Meeting transcript specifically → use `meeting-intel`\n- Multi-source synthesis across emails/Teams → use `daily-briefing` or `weekly-wrap`\n- Drafting a *new* exec update from scratch (no source) → use `stakeholder-comms`\n\n## Quick Start\n\n```\nUser: \"TL;DR this\" (with attached file or referenced doc)\n1. Identify the source — uploaded file, web URL, or pasted text\n2. Read it (Read tool for files, ReadFileContent for SharePoint, web_fetch for URLs)\n3. Extract: core claim, key evidence, decisions/asks, risks\n4. Render the one-page summary inline as markdown\n```\n\n## Core Instructions\n\n### Step 1: Locate the source\nPriority order:\n1. **Attached files** in the message — use `Read` directly on the path\n2. **Pasted text** in the message — use it directly\n3. **Referenced M365 file** — use `SearchM365` or `ReadFileContent`\n4. **URL** — use `web_fetch`\n5. If none of the above, ask the user to share the content\n\n### Step 2: Read fully\n- For PDFs over 10 pages, use `Read` with `pages` parameter and iterate through the document\n- For SharePoint docs: `ReadFileContent` with `download_url` if available\n- For long Teams threads: `ListChatMessages` and concatenate\n- Read the WHOLE source — don't summarize from the first page\n\n### Step 3: Extract the structure\n\nPull these into working notes:\n- **Core claim** — the single most important point (one sentence)\n- **Why it matters** — business impact, stakes\n- **Key evidence** — 3–5 supporting facts/numbers/quotes\n- **Decisions or asks** — what's being requested of the reader\n- **Risks / open issues** — what could go wrong\n- **Next step** — recommended action\n\n### Step 4: Output\n\nRender as inline markdown — exec summaries are read, not downloaded, unless user explicitly\nasks for a Word doc. Use this structure:\n\n```markdown\n# <Document title> — Executive Summary\n\n**Bottom line:** <one-sentence core claim>\n\n## Why it matters\n<2–3 sentence stakes/context>\n\n## Key points\n- <point 1 with number/fact>\n- <point 2>\n- <point 3>\n\n## Decisions / asks\n- <what is being requested>\n\n## Risks\n- <key risk>\n\n## Recommended next step\n<one sentence>\n```\n\nTarget: under 250 words. If the source has critical numbers, cite them with the source line\nor page where possible.\n\n### Step 5: Offer file conversion\n\nAfter showing the inline summary, ask: \"Want this as a Word doc or PDF?\" Only invoke `docx`\nor `pdf` skills if the user says yes.\n\n## Guardrails\n\n- Never fabricate numbers, names, or quotes — every fact must trace to the source\n- If the source has gaps or contradictions, surface them in the Risks section, don't paper over\n- Keep to one page (≤250 words) — that's the value proposition. If the content can't be\n  compressed that much, say so and ask what to prioritize\n- For sensitive documents (financials, HR), keep names generic unless the user signals\n  the audience is internal\n","zh":"---\nname: exec-summary\ndescription: |\n  將冗長文件、郵件討論串或逐字稿濃縮成一頁式主管摘要。\n  當使用者說「幫我做 TL;DR」、「給我主管摘要」、「幫主管摘要這份內容」、「一頁摘要」、「幫我濃縮」、「給忙碌讀者的精簡版」、\"TL;DR this\", \"give me the exec summary\", \"summarize this for\n  leadership\", \"one-page summary\", \"condense this\", or \"make this shorter for a busy\n  reader\" 時使用。\n  不要用於摘要會議逐字稿 — 請使用 meeting-intel。\n  不要用於整個收件匣摘要 — 請使用 inbox-triage 或 daily-briefing。\ncowork:\n  category: writing\n  icon: DocumentText\n---\n\n## 概觀\n\n接收一段冗長內容（文件、討論串、逐字稿、報告），產出面向忙碌高階讀者的一頁式主管摘要：內容是什麼、為何重要、需要哪些決策、建議的下一步。\n\n## 使用時機\n\n- 使用者分享長檔案或貼上冗長討論串，並想掌握重點\n- 任何成品的 \"TL;DR\"\n- 從較長來源準備給主管閱讀的簡報摘要\n\n## 不適用時機\n\n- 特定會議逐字稿 → 使用 `meeting-intel`\n- 跨郵件/Teams 的多來源綜整 → 使用 `daily-briefing` 或 `weekly-wrap`\n- 從零開始撰寫*新的*主管更新（沒有來源）→ 使用 `stakeholder-comms`\n\n## 快速開始\n\n```\n使用者: 「幫我做 TL;DR」（附上檔案或指定文件）\n1. 找出來源 — 上傳的檔案、Web URL 或貼上的文字\n2. 閱讀來源（檔案使用 Read tool，SharePoint 使用 ReadFileContent，URL 使用 web_fetch）\n3. 擷取：核心主張、關鍵證據、決策/請求、風險\n4. 將一頁式摘要以 markdown 內嵌呈現\n```\n\n## 核心指示\n\n### 步驟 1：定位來源\n優先順序：\n1. **訊息中的附件檔案** — 直接對路徑使用 `Read`\n2. **訊息中貼上的文字** — 直接使用\n3. **提及的 M365 檔案** — 使用 `SearchM365` 或 `ReadFileContent`\n4. **URL** — 使用 `web_fetch`\n5. 如果以上都沒有，請使用者分享內容\n\n### 步驟 2：完整閱讀\n- 超過 10 頁的 PDF，使用 `Read` 搭配 `pages` 參數，並逐段走完整份文件\n- SharePoint 文件：若可用，使用 `ReadFileContent` 搭配 `download_url`\n- 冗長 Teams 討論串：使用 `ListChatMessages` 並串接內容\n- 閱讀整個來源 — 不要只根據第一頁摘要\n\n### 步驟 3：擷取結構\n\n整理到工作筆記：\n- **核心主張** — 最重要的單一重點（一句話）\n- **為何重要** — 業務影響與利害關係\n- **關鍵證據** — 3–5 個支持事實/數字/引述\n- **決策或請求** — 對讀者的要求是什麼\n- **風險 / 未決議題** — 可能出錯之處\n- **下一步** — 建議行動\n\n### 步驟 4：輸出\n\n以內嵌 markdown 呈現 — 主管摘要是用來閱讀，不是下載；除非使用者明確要求 Word 文件。使用此結構：\n\n```markdown\n# <Document title> — 主管摘要\n\n**結論：** <one-sentence core claim>\n\n## 為何重要\n<2–3 sentence stakes/context>\n\n## 重點\n- <point 1 with number/fact>\n- <point 2>\n- <point 3>\n\n## 決策 / 請求\n- <what is being requested>\n\n## 風險\n- <key risk>\n\n## 建議下一步\n<one sentence>\n```\n\n目標：250 字以內。若來源有關鍵數字，盡可能引用來源行號或頁碼。\n\n### 步驟 5：提供檔案轉換\n\n顯示內嵌摘要後，詢問：\"Want this as a Word doc or PDF?\" 只有在使用者同意時，才叫用 `docx` 或 `pdf` skills。\n\n## 護欄\n\n- 絕不編造數字、姓名或引述 — 每個事實都必須可追溯至來源\n- 如果來源有缺口或矛盾，請在風險區段揭露，不要粉飾\n- 維持一頁（≤250 words）— 這就是價值主張。如果內容無法壓縮到這個程度，請說明並詢問要優先保留什麼\n- 對於敏感文件（財務、人資），除非使用者表明受眾為內部，否則姓名一律泛化\n","cn":"---\nname: exec-summary\ndescription: |\n  将较长的文档、邮件线程或转录浓缩成一页高管摘要。\n  当用户说“帮我做 TL;DR”、“给我高管摘要”、“给领导总结这份内容”、“一页摘要”、“帮我精简一下”、“给忙碌读者的简短版”、\"TL;DR this\", \"give me the exec summary\", \"summarize this for\n  leadership\", \"one-page summary\", \"condense this\", or \"make this shorter for a busy\n  reader\" 时使用。\n  不要用于总结会议转录 — 请使用 meeting-intel。\n  不要用于整个收件箱摘要 — 请使用 inbox-triage 或 daily-briefing。\ncowork:\n  category: writing\n  icon: DocumentText\n---\n\n## 概览\n\n接收一段较长内容（文档、线程、转录、报告），面向忙碌的资深读者产出一页高管摘要：讲的是什么、为什么重要、需要哪些决策、建议的下一步。\n\n## 适用场景\n\n- 用户分享长文件或粘贴长线程，希望快速抓住要点\n- 任何材料的 \"TL;DR\"\n- 基于较长来源，为领导阅读准备简报摘要\n\n## 不适用场景\n\n- 专门总结会议转录 → 使用 `meeting-intel`\n- 跨邮件/Teams 的多来源综合 → 使用 `daily-briefing` 或 `weekly-wrap`\n- 从零起草*新的*高管更新（没有来源）→ 使用 `stakeholder-comms`\n\n## 快速开始\n\n```\n用户: “帮我做 TL;DR”（附有文件或引用了文档）\n1. 确定来源 — 上传的文件、Web URL 或粘贴的文本\n2. 读取来源（文件用 Read tool，SharePoint 用 ReadFileContent，URL 用 web_fetch）\n3. 提取：核心主张、关键证据、决策/请求、风险\n4. 将一页摘要以内联 markdown 呈现\n```\n\n## 核心说明\n\n### 步骤 1：定位来源\n优先级：\n1. **消息中的附件文件** — 直接对路径使用 `Read`\n2. **消息中粘贴的文本** — 直接使用\n3. **引用的 M365 文件** — 使用 `SearchM365` 或 `ReadFileContent`\n4. **URL** — 使用 `web_fetch`\n5. 如果以上都没有，请让用户分享内容\n\n### 步骤 2：完整读取\n- 对于超过 10 页的 PDF，使用带 `pages` 参数的 `Read`，并遍历整个文档\n- 对于 SharePoint 文档：如果可用，使用带 `download_url` 的 `ReadFileContent`\n- 对于较长的 Teams 线程：使用 `ListChatMessages` 并拼接内容\n- 读取整个来源 — 不要只根据第一页总结\n\n### 步骤 3：提取结构\n\n整理到工作笔记：\n- **核心主张** — 最重要的单一观点（一句话）\n- **为什么重要** — 业务影响和利害关系\n- **关键证据** — 3–5 个支撑事实/数字/引用\n- **决策或请求** — 希望读者做什么\n- **风险 / 未决问题** — 可能出问题的地方\n- **下一步** — 建议行动\n\n### 步骤 4：输出\n\n以内联 markdo
