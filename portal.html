const topicList = document.getElementById("topicList");
const hubLayout = document.getElementById("hubLayout");
const navToggle = document.getElementById("navToggle");
const themeToggle = document.getElementById("themeToggle");
const langSwitch = document.getElementById("langSwitch");
const sidebarNav = document.getElementById("sidebarNav");

const LANGS = ["zh-Hant", "zh-Hans", "en"];
const LANG_SUFFIX = { "zh-Hant": "", "zh-Hans": "Cn", en: "En" };
let lang = LANGS.includes(document.documentElement.dataset.lang)
  ? document.documentElement.dataset.lang
  : "en";
const t = () => UI[lang];
const pick = (item, key) => (item[key + LANG_SUFFIX[lang]] ?? item[key]) ?? "";
const plain = (value) => String(value).replace(/\s+/g, " ").trim();

function syncThemeToggle() {
  const dark = document.documentElement.dataset.theme === "dark";
  const action = dark ? t().themeToLight : t().themeToDark;
  themeToggle.querySelector(".theme-icon").textContent = dark ? "☀" : "☾";
  themeToggle.querySelector(".theme-label").textContent = dark ? t().themeLight : t().themeDark;
  themeToggle.setAttribute("aria-label", action);
  themeToggle.setAttribute("aria-pressed", String(dark));
  themeToggle.title = action;
}
themeToggle.addEventListener("click", () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("copilotPortalTheme", next); } catch (_) {}
  syncThemeToggle();
});

function syncNavToggle() {
  const expanded = !hubLayout.classList.contains("nav-collapsed");
  navToggle.setAttribute("aria-expanded", String(expanded));
  navToggle.title = expanded ? t().navCollapse : t().navExpand;
  navToggle.setAttribute("aria-label", navToggle.title);
}
navToggle.addEventListener("click", () => {
  hubLayout.classList.toggle("nav-collapsed");
  syncNavToggle();
});

function renderChrome() {
  document.documentElement.setAttribute("lang", lang);
  document.documentElement.dataset.lang = lang;
  document.title = t().documentTitle;
  document.getElementById("brandSub").textContent = t().brandSub;
  document.getElementById("sidebar").setAttribute("aria-label", t().sidebarLabel);
  document.getElementById("sidebarTitle").textContent = t().sidebarTitle;
  document.getElementById("pageTitle").textContent = t().pageTitle;
  document.getElementById("introText").textContent = t().intro;
  document.getElementById("footerText").textContent = t().footer;
  topicList.setAttribute("aria-label", t().topicListLabel);
  const websiteCount = TOPICS.reduce((total, topic) =>
    total + topic.websites.reduce((count, product) => count + (product.variants?.length || 1), 0), 0);
  document.getElementById("resourceCount").textContent = t().resourceCount(TOPICS.length, websiteCount);
  langSwitch.setAttribute("aria-label", t().langGroup);
  langSwitch.querySelectorAll("button").forEach(btn => {
    const value = btn.dataset.lang;
    btn.setAttribute("aria-pressed", String(value === lang));
    btn.title = t().langPick[value];
    btn.setAttribute("aria-label", btn.title);
  });
}

function renderTopics() {
  topicList.innerHTML = TOPICS.map((topic, topicIndex) => `
  <section class="topic-section" id="topic-section-${topicIndex}" aria-labelledby="topic-${topicIndex}">
    <div class="topic-header">
      <div class="topic-index" aria-hidden="true">${String(topicIndex + 1).padStart(2, "0")}</div>
      <div class="topic-heading">
        <div class="topic-kicker">${pick(topic, "kicker")}</div>
        <h2 id="topic-${topicIndex}">${pick(topic, "title")}</h2>
      </div>
    </div>
    <div class="website-list">
      ${topic.websites.map((product, productIndex) => {
        const title = pick(product, "title");
        const description = pick(product, "description");
        return product.variants ? `
        <article class="product-card experience-card" id="site-${topicIndex}-${productIndex}">
          <div class="experience-copy">
            <h3 class="card-title">${title}</h3>
            <p class="card-description">${description}</p>
          </div>
          <div class="experience-links" aria-label="${t().entryGroup(plain(title))}">
            ${product.variants.map(variant => `
              <a class="experience-link" href="${variant.href}" target="_blank" rel="noopener noreferrer" aria-label="${t().openAgent(plain(pick(variant, "title")))}">
                <span class="experience-icon" aria-hidden="true">${variant.icon}</span>
                <span class="experience-name">${pick(variant, "title")}</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"></path><path d="M7 7h10v10"></path></svg>
              </a>
            `).join("")}
          </div>
        </article>
      ` : product.href ? `
        <a class="product-card" id="site-${topicIndex}-${productIndex}" href="${product.href}" target="_blank" rel="noopener noreferrer" aria-label="${t().openSite(plain(title))}">
          <div class="card-visual" aria-hidden="true">${product.icon}</div>
          <div class="card-body">
            <h3 class="card-title">${title}</h3>
            <p class="card-description">${description}</p>
          </div>
          <span class="card-arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7 17 17 7"></path>
              <path d="M7 7h10v10"></path>
            </svg>
          </span>
        </a>
      ` : `
        <div class="product-card is-pending" aria-label="${t().pendingAria(plain(title))}">
          <div class="card-visual" aria-hidden="true">${product.icon}</div>
          <div class="card-body">
            <h3 class="card-title">${title}</h3>
            <p class="card-description">${description}</p>
          </div>
          <span class="pending-label">${t().pendingLabel}</span>
        </div>
      `;
      }).join("")}
    </div>
  </section>
`).join("");
}

function renderSidebar() {
  const collapsed = Array.from(sidebarNav.querySelectorAll(".sidebar-topic"))
    .map(node => node.classList.contains("is-collapsed"));
  sidebarNav.innerHTML = TOPICS.map((topic, topicIndex) => `
  <div class="sidebar-topic${collapsed[topicIndex] ? " is-collapsed" : ""}">
    <button class="sidebar-topic-toggle" type="button" aria-expanded="${String(!collapsed[topicIndex])}" aria-controls="sidebar-sites-${topicIndex}" title="${t().topicToggle(pick(topic, "title"))}">
      <span class="sidebar-number">${String(topicIndex + 1).padStart(2, "0")}</span>
      <span class="sidebar-topic-copy">${pick(topic, "title")}</span>
      <svg class="sidebar-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
    </button>
    <div class="sidebar-websites" id="sidebar-sites-${topicIndex}">
      ${topic.websites.map((product, productIndex) => product.href || product.variants
        ? `<a class="sidebar-website" href="#site-${topicIndex}-${productIndex}">${plain(pick(product, "title"))}</a>`
        : `<span class="sidebar-website is-pending">${plain(pick(product, "title"))}</span>`).join("")}
    </div>
  </div>
`).join("");
}

function applyLang() {
  renderChrome();
  renderTopics();
  renderSidebar();
  syncThemeToggle();
  syncNavToggle();
}

langSwitch.addEventListener("click", event => {
  const btn = event.target.closest("button[data-lang]");
  if (!btn || btn.dataset.lang === lang) return;
  lang = btn.dataset.lang;
  window.PocLang.save(lang);
  applyLang();
});

sidebarNav.addEventListener("click", event => {
  const toggle = event.target.closest(".sidebar-topic-toggle");
  if (toggle) {
    const topic = toggle.closest(".sidebar-topic");
    topic.classList.toggle("is-collapsed");
    toggle.setAttribute("aria-expanded", String(!topic.classList.contains("is-collapsed")));
    return;
  }
  if (window.innerWidth <= 720 && event.target.closest("a")) {
    hubLayout.classList.add("nav-collapsed");
    syncNavToggle();
  }
});

if (!window.matchMedia("(max-width: 720px)").matches) hubLayout.classList.remove("nav-collapsed");
applyLang();
</script>
