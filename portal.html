<script>
/* Power of Copilot - shared language core (v1)
 *
 * ONE source of truth. Injected inline into every entry page by
 * _tools/inject_lang.py, so each page stays a standalone file.
 * Never load this with <script src>: the handbooks are distributed as
 * single files and are opened offline over file://.
 *
 * Priority: ?lang= > saved preference > navigator.languages > fallback.
 * Once the reader picks a language it wins everywhere, including when they
 * open a link that points at a different language edition.
 *
 * Pages declare window.__LANG_CFG before this block:
 *   cur        current edition of THIS file, normalized ('zh-Hant'|'zh-Hans'|'en')
 *   mode       'redirect' (separate file per language) | 'inpage' (switches live)
 *   paths      redirect mode only: normalized code -> relative path
 *   supported  languages this page actually ships (default: all three)
 *   fallback   used when nothing matches (default: 'en')
 *
 * Exposes window.PocLang = { code, save, normalize, KEY }.
 */
(function () {
  "use strict";

  var KEY = "pocLang";
  var CODES = ["zh-Hant", "zh-Hans", "en"];
  // keys written by earlier per-page implementations, newest first - read once
  // so nobody who already picked a language gets thrown back to detection
  var LEGACY = [
    "copilotPortalLang", "powerofcopilot.lang", "poc.lang", "cph-lang",
    "copilotBuildingLang", "copilotPlaygroundLang", "copilotPlanetLang",
    "copilotExpoLang", "agentTransitLang", "agent-lang"
  ];
  var cfg = window.__LANG_CFG || {};
  var supported = cfg.supported || CODES;
  var HOP = "pocLangHop";

  // Accepts every vocabulary in use across the sites plus raw BCP 47 tags:
  // 'zh'/'cn'/'en', 'zh-cn'/'zh-Hant', 'zh-Hans-CN', 'en-GB'...
  function normalize(value) {
    if (!value) return null;
    var v = String(value).toLowerCase();
    if (v === "cn") return "zh-Hans";
    if (v === "zh") return "zh-Hant";
    if (/^en/.test(v)) return "en";
    if (/(^|[-_])(hans|cn|sg)(?![a-z])/.test(v)) return "zh-Hans";
    if (/^zh/.test(v)) return "zh-Hant";
    return null;
  }

  function read(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }
  function write(key, value) {
    try { localStorage.setItem(key, value); } catch (e) {}
  }

  function save(value) {
    var code = normalize(value);
    if (code) write(KEY, code);
    return code;
  }

  // Preference is stored unchanged even when the current page cannot render it;
  // only the language used for THIS render is downgraded.
  function toSupported(code) {
    if (supported.indexOf(code) !== -1) return code;
    var order = code === "zh-Hans" ? ["zh-Hant", "en"]
      : code === "zh-Hant" ? ["zh-Hans", "en"]
      : ["en", "zh-Hant"];
    for (var i = 0; i < order.length; i++) {
      if (supported.indexOf(order[i]) !== -1) return order[i];
    }
    return supported[0] || "en";
  }

  function fromQuery() {
    try {
      return normalize(new URLSearchParams(location.search).get("lang"));
    } catch (e) { return null; }
  }

  function fromLegacy() {
    for (var i = 0; i < LEGACY.length; i++) {
      var code = normalize(read(LEGACY[i]));
      if (code) return code;
    }
    return null;
  }

  function fromBrowser() {
    var list = (navigator.languages && navigator.languages.length)
      ? navigator.languages
      : [navigator.language || ""];
    for (var i = 0; i < list.length; i++) {
      var code = normalize(list[i]);
      if (code) return code;
    }
    return null;
  }

  function resolve() {
    var q = fromQuery();
    if (q) { write(KEY, q); return q; }         // shared links set the preference
    var saved = normalize(read(KEY));
    if (saved) return saved;
    var legacy = fromLegacy();
    if (legacy) { write(KEY, legacy); return legacy; }
    return fromBrowser() || normalize(cfg.fallback) || "en";
  }

  var wanted = resolve();
  var code = toSupported(wanted);

  // ---- redirect editions (Basic / Pro) ----
  // Each hop lands on a page whose cur === code, so this settles after one
  // move; the marker only guards against a broken paths table.
  if (cfg.mode === "redirect" && cfg.cur && code !== cfg.cur) {
    var target = cfg.paths && cfg.paths[code];
    var hopped = null;
    try { hopped = sessionStorage.getItem(HOP); } catch (e) {}
    if (target && hopped !== code) {
      try { sessionStorage.setItem(HOP, code); } catch (e) {}
      var qs;
      try {
        qs = new URLSearchParams(location.search);
        qs.delete("lang");
        qs = qs.toString();
      } catch (e) { qs = ""; }
      location.replace(target + (qs ? "?" + qs : "") + location.hash);
      return;
    }
  }
  try {
    if (cfg.mode !== "redirect" || code === cfg.cur) sessionStorage.removeItem(HOP);
  } catch (e) {}

  // Detection is deliberately NOT persisted: only an explicit pick (a click or
  // ?lang=) is stored, so readers who never choose keep following the browser.
  window.PocLang = { code: code, save: save, normalize: normalize, KEY: KEY };

  // Language buttons that are plain links (the redirect editions) must record
  // the choice before navigating, otherwise the new page bounces straight back.
  var TEXT = { "\u7e41": "zh-Hant", "\u7b80": "zh-Hans", "EN": "en" };

    var el = event.target && event.target.closest
      ? event.target.closest("a[href], button")

    if (!el) return;
    var picked = normalize(el.getAttribute("data-poc-lang") || el.getAttribute("data-lang"));

      picked = TEXT[(el.textContent || "").trim().toUpperCase()]
        || TEXT[(el.textContent || "").trim()];
    }
    if (picked) save(picked);
  }, true);
})();

<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Power of Copilot</title>
<script>
  (() => {
    if ("scrollRestoration" in history) history.scrollRestoration = "manual";
    window.scrollTo(0, 0);
    const param = new URLSearchParams(window.location.search).get("scoutTheme");
    let saved = null;
    try { saved = localStorage.getItem("copilotPortalTheme"); } catch (_) {}
    const theme =
      param || saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);

    const lang = window.PocLang.code;
    document.documentElement.setAttribute("data-lang", lang);
    document.documentElement.setAttribute("lang", lang);
  })();
</script>
<style>
:root {
  color-scheme: light;
  --cp-bg: #f7f4ef;
  --cp-bg-elevated: #fcfbf8;
  --cp-surface: #ffffff;
  --cp-surface-soft: #f5f5f5;
  --cp-border: #dedede;
  --cp-border-strong: #919191;
  --cp-text: #242424;
  --cp-text-muted: #5c5c5c;
  --cp-text-soft: #6f6f6f;
  --cp-accent: #6d28d9;
  --cp-accent-hover: #5b21b6;
  --cp-accent-soft: rgba(109, 40, 217, 0.09);
  --cp-accent-fg: #ffffff;
  --cp-success: #16a34a;
  --cp-danger: #dc2626;
  --cp-warning: #f59e0b;
  --cp-link: #0078d4;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
  --cp-overlay: rgba(255, 255, 255, 0.8);
  --cp-panel: rgba(255, 255, 255, 0.86);
  --cp-panel-strong: rgba(255, 255, 255, 0.96);
  --cp-sheen: rgba(255, 255, 255, 0.55);
  --cp-highlight: rgba(109, 40, 217, 0.14);
  --cp-brand-purple: #7c3aed;
  --cp-brand-blue: #0078d4;
  --cp-gradient: linear-gradient(105deg, var(--cp-brand-purple), var(--cp-brand-blue));
  --cp-gradient-soft: linear-gradient(135deg, var(--cp-accent-soft), var(--cp-highlight), color-mix(in srgb, var(--cp-link) 10%, var(--cp-surface)));
}
html[data-theme="dark"] {
  color-scheme: dark;
  --cp-bg: #3d3b3a;
  --cp-bg-elevated: #343231;
  --cp-surface: #292929;
  --cp-surface-soft: #2e2e2e;
  --cp-border: #474747;
  --cp-border-strong: #5f5f5f;
  --cp-text: #dedede;
  --cp-text-muted: #919191;
  --cp-text-soft: #b0b0b0;
  --cp-accent: #c4b5fd;
  --cp-accent-hover: #ddd6fe;
  --cp-accent-soft: rgba(167, 139, 250, 0.14);
  --cp-accent-fg: #1a1a1a;
  --cp-success: #4ade80;
  --cp-danger: #f87171;
  --cp-warning: #fbbf24;
  --cp-link: #4da6ff;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
  --cp-overlay: rgba(41, 41, 41, 0.88);
  --cp-panel: rgba(41, 41, 41, 0.72);
  --cp-panel-strong: rgba(41, 41, 41, 0.96);
  --cp-sheen: rgba(255, 255, 255, 0.04);
  --cp-highlight: rgba(167, 139, 250, 0.18);
  --cp-brand-purple: #a78bfa;
  --cp-brand-blue: var(--cp-link);
}
* { box-sizing: border-box; }
html { min-height: 100%; background: var(--cp-bg); }
body {
  min-width: 280px; min-height: 100vh; margin: 0;
  background:
    radial-gradient(circle at 12% 12%, var(--cp-accent-soft), transparent 34%),
    radial-gradient(circle at 88% 22%, color-mix(in srgb, var(--cp-link) 13%, transparent), transparent 32%),
    linear-gradient(var(--cp-sheen), var(--cp-sheen)),
    var(--cp-bg);
  color: var(--cp-text);
  font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
}
a { color: inherit; }
html[data-lang="zh-Hans"] body {
  font-family: "Segoe UI", "Microsoft YaHei", "微软雅黑", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
}
.shell { width: min(1180px, calc(100% - 48px)); margin: 0 auto; }
.topbar {
  position: sticky; top: 0; z-index: 10;
  background: var(--cp-overlay); border-bottom: 1px solid var(--cp-border);
  backdrop-filter: blur(18px);
}
.topbar::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
  background: var(--cp-gradient);
}
.topbar-inner {
  min-height: 68px; display: flex; align-items: center; justify-content: space-between; gap: 20px;
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand img { width: 38px; height: 38px; object-fit: contain; flex: none; }
.brand-copy { min-width: 0; }
.brand-name { font-size: 15px; font-weight: 700; line-height: 1.25; }
.brand-sub { margin-top: 2px; color: var(--cp-text-muted); font-size: 12px; }
.topbar-actions { display: flex; align-items: center; gap: 8px; flex: none; }
.resource-count {
  flex: none; padding: 7px 10px; border: 1px solid var(--cp-border);
  border-radius: 0.625rem; color: var(--cp-text-muted); font-size: 12px;
  background: var(--cp-surface);
}
.theme-toggle {
  min-width: 104px; height: 36px; padding: 0 11px; display: inline-flex; align-items: center;
  justify-content: center; gap: 7px; border: 1px solid var(--cp-border); border-radius: 0.625rem;
  background: var(--cp-surface); color: var(--cp-text); font: 600 12px "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
  cursor: pointer; transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
}
.theme-toggle:hover { transform: translateY(-1px); border-color: var(--cp-border-strong); box-shadow: 0 0 2px var(--cp-border); }
.theme-toggle:focus-visible { outline: 3px solid var(--cp-highlight); outline-offset: 2px; }
.theme-icon { width: 18px; text-align: center; font-size: 16px; line-height: 1; }
.lang-switch {
  height: 36px; display: inline-flex; align-items: center; gap: 2px; padding: 3px;
  border: 1px solid var(--cp-border); border-radius: 0.625rem; background: var(--cp-surface);
}
.lang-switch button {
  min-width: 30px; height: 28px; padding: 0 8px; border: 0; border-radius: 0.45rem; background: transparent;
  color: var(--cp-text-muted); font: 600 12px "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;

        titleCn: "管理员\n上手指南",
        kicker: "規劃到治理",
        kickerEn: "Plan to govern",
        kickerCn: "规划到治理",
        description: "給 IT 管理員：規劃、導入、設置、管理與治理四個階段，同步索引型與即時查詢型兩種連接器都涵蓋。目前為純文字版，之後補上實機截圖。",
        descriptionEn: "For IT admins: four phases (plan, adopt, set up, manage and govern) that cover both synced and federated connectors. Text-only for now; real screenshots will follow.",
        descriptionCn: "给 IT 管理员：规划、落地、配置、管理与治理四个阶段，同步索引型和实时查询型两类连接器都涵盖。目前是纯文字版，之后会补上实机截图。",
        icon: "🛡️",
        href: "CopilotConnectors/admin-guide.html",
      },
    ],
  },
];

const topicList = document.getElementById("topicList");
const hubLayout = document.getElementById("hubLayout");
const navToggle = document.getElementById("navToggle");
const themeToggle = document.getElementById("themeToggle");
const langSwitch = document.getElementById("langSwitch");
const sidebarNav = document.getElementById("sidebarNav");

const LANGS = ["zh-Hant", "zh-Hans", "en"];
const LANG_SUFFIX = { "zh-Hant": "", "zh-Hans": "Cn", en: "En" };
let lang = LANGS.includes(document.documentElement.dataset.lang)
  ? document.documentElement.dataset.lang
  : "en";
const t = () => UI[lang];
const pick = (item, key) => (item[key + LANG_SUFFIX[lang]] ?? item[key]) ?? "";
const plain = (value) => String(value).replace(/\s+/g, " ").trim();
const DOC_LOCALE = { "zh-Hant": "zh-tw", "zh-Hans": "zh-cn", en: "en-us" };
const localHref = (href) => href.replace("{loc}", DOC_LOCALE[lang]);

function syncThemeToggle() {
  const dark = document.documentElement.dataset.theme === "dark";
  const action = dark ? t().themeToLight : t().themeToDark;
  themeToggle.querySelector(".theme-icon").textContent = dark ? "☀" : "☾";
  themeToggle.querySelector(".theme-label").textContent = dark ? t().themeLight : t().themeDark;
  themeToggle.setAttribute("aria-label", action);
  themeToggle.setAttribute("aria-pressed", String(dark));
  themeToggle.title = action;
}
themeToggle.addEventListener("click", () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("copilotPortalTheme", next); } catch (_) {}
  syncThemeToggle();
});

function syncNavToggle() {
  const expanded = !hubLayout.classList.contains("nav-collapsed");
  navToggle.setAttribute("aria-expanded", String(expanded));
  navToggle.title = expanded ? t().navCollapse : t().navExpand;
  navToggle.setAttribute("aria-label", navToggle.title);
}
navToggle.addEventListener("click", () => {
  hubLayout.classList.toggle("nav-collapsed");
  syncNavToggle();
});

function renderChrome() {
  document.documentElement.setAttribute("lang", lang);
  document.documentElement.dataset.lang = lang;
  document.title = t().documentTitle;
  document.getElementById("brandSub").textContent = t().brandSub;
  document.getElementById("sidebar").setAttribute("aria-label", t().sidebarLabel);
  document.getElementById("sidebarTitle").textContent = t().sidebarTitle;
  document.getElementById("pageTitle").textContent = t().pageTitle;
  document.getElementById("introText").textContent = t().intro;
  document.getElementById("footerText").textContent = t().footer;
  topicList.setAttribute("aria-label", t().topicListLabel);
  const websiteCount = TOPICS.reduce((total, topic) =>
    total + topic.websites.reduce((count, product) => count + (product.countAs ?? (product.variants?.length || 1)), 0), 0);
  document.getElementById("resourceCount").textContent = t().resourceCount(TOPICS.length, websiteCount);
  langSwitch.setAttribute("aria-label", t().langGroup);
  langSwitch.querySelectorAll("button").forEach(btn => {
    const value = btn.dataset.lang;
    btn.setAttribute("aria-pressed", String(value === lang));
    btn.title = t().langPick[value];
    btn.setAttribute("aria-label", btn.title);
  });
}

function renderTopics() {
  topicList.innerHTML = TOPICS.map((topic, topicIndex) => `
  <section class="topic-section" id="topic-section-${topicIndex}" aria-labelledby="topic-${topicIndex}">
    <div class="topic-header">
      <div class="topic-index" aria-hidden="true">${String(topicIndex + 1).padStart(2, "0")}</div>
      <div class="topic-heading">
        <div class="topic-kicker">${pick(topic, "kicker")}</div>
        <h2 id="topic-${topicIndex}">${pick(topic, "title")}</h2>
      </div>
    </div>
    <div class="website-list">
      ${topic.websites.map((product, productIndex) => {
        const title = pick(product, "title");
        const description = pick(product, "description").replace("{n}", product.variants ? product.variants.length : "");
        return product.variants ? `
        <article class="product-card experience-card${product.layout ? ` ${product.layout}-card` : ""}"${product.collapsible ? " data-fold" : ""} id="site-${topicIndex}-${productIndex}">
          <div class="experience-copy">
            ${product.collapsible ? `
            <div class="card-head">
              <h3 class="card-title">${title}</h3>
              <button class="fold-toggle" type="button" aria-expanded="true" aria-controls="links-${topicIndex}-${productIndex}">
                <span class="fold-label"></span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
              </button>
            </div>` : `
            <h3 class="card-title">${title}</h3>`}
            <p class="card-description">${description}</p>
          </div>
          <div class="experience-links" id="links-${topicIndex}-${productIndex}" aria-label="${t().entryGroup(plain(title))}">
            ${product.variants.map((variant, variantIndex) => {
              const name = pick(variant, "title");
              const sub = pick(variant, "sub");
              if (!product.menu) return `
              <a class="experience-link" href="${localHref(variant.href)}" target="_blank" rel="noopener noreferrer" aria-label="${t().openAgent(plain(name))}">
                <span class="experience-icon" aria-hidden="true">${variant.icon}</span>
                <span class="experience-name">${name}</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"></path><path d="M7 7h10v10"></path></svg>
              </a>
            `;
              const state = variant.status ? t().badgeAria[variant.status] : "";
              return `
              <button class="experience-link" type="button" data-agent="${topicIndex}-${productIndex}-${variantIndex}" aria-haspopup="menu" aria-expanded="false" aria-label="${t().chooseAgent(plain(name), state)}">
                ${variant.status ? `<span class="agent-badge" data-status="${variant.status}" aria-hidden="true">${t().badge[variant.status]}</span>` : ""}
                <span class="experience-icon" aria-hidden="true">${variant.icon}</span>
                <span class="experience-name">${name}</span>
                ${sub ? `<span class="agent-sub">${sub}</span>` : ""}
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
              </button>
            `;
            }).join("")}
          </div>
        </article>
      ` : product.href ? `
        <a class="product-card" id="site-${topicIndex}-${productIndex}" href="${product.href}" target="_blank" rel="noopener noreferrer" aria-label="${t().openSite(plain(title))}">
          <div class="card-visual" aria-hidden="true">${product.icon}</div>
          <div class="card-body">
            <h3 class="card-title">${title}</h3>
            <p class="card-description">${description}</p>
          </div>
          <span class="card-arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7 17 17 7"></path>
              <path d="M7 7h10v10"></path>
            </svg>
          </span>
        </a>
      ` : `
        <div class="product-card is-pending" aria-label="${t().pendingAria(plain(title))}">
          <div class="card-visual" aria-hidden="true">${product.icon}</div>
          <div class="card-body">
            <h3 class="card-title">${title}</h3>
            <p class="card-description">${description}</p>
          </div>
          <span class="pending-label">${t().pendingLabel}</span>
        </div>
      `;
      }).join("")}
    </div>
  </section>
`).join("");
}

function renderSidebar() {
  const collapsed = Array.from(sidebarNav.querySelectorAll(".sidebar-topic"))
    .map(node => node.classList.contains("is-collapsed"));
  sidebarNav.innerHTML = TOPICS.map((topic, topicIndex) => `
  <div class="sidebar-topic${collapsed[topicIndex] ? " is-collapsed" : ""}">
    <button class="sidebar-topic-toggle" type="button" aria-expanded="${String(!collapsed[topicIndex])}" aria-controls="sidebar-sites-${topicIndex}" title="${t().topicToggle(pick(topic, "title"))}">
      <span class="sidebar-number">${String(topicIndex + 1).padStart(2, "0")}</span>
      <span class="sidebar-topic-copy">${pick(topic, "title")}</span>
      <svg class="sidebar-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
    </button>
    <div class="sidebar-websites" id="sidebar-sites-${topicIndex}">
      ${topic.websites.map((product, productIndex) => product.href || product.variants
        ? `<a class="sidebar-website" href="#site-${topicIndex}-${productIndex}">${plain(pick(product, "title"))}</a>`
        : `<span class="sidebar-website is-pending">${plain(pick(product, "title"))}</span>`).join("")}
    </div>
  </div>
`).join("");
}

function applyLang() {
  closeAgentMenu();
  renderChrome();
  renderTopics();
  renderSidebar();
  syncThemeToggle();
  syncNavToggle();
  syncFold();
}

const FOLD_KEY = "copilotPortalAgentsFolded";
let folded = false;
try {
  const saved = localStorage.getItem(FOLD_KEY);
  if (saved !== null) folded = saved === "1";
} catch (_) {}
let foldGrid = null;
const foldObserver = new ResizeObserver(() => requestAnimationFrame(syncFold));

// Collapsing keeps one row; the column count follows the grid, so it is re-read on every resize.
function syncFold() {
  const card = topicList.querySelector("[data-fold]");
  if (!card) return;
  const grid = card.querySelector(".experience-links");
  if (grid !== foldGrid) {
    foldObserver.disconnect();
    foldObserver.observe(grid);
    foldGrid = grid;
  }
  const tiles = Array.from(grid.children);
  const columns = getComputedStyle(grid).gridTemplateColumns.split(" ").length;
  tiles.forEach((tile, index) => { tile.hidden = folded && index >= columns; });
  card.classList.toggle("is-collapsed", folded);
  const button = card.querySelector(".fold-toggle");
  button.setAttribute("aria-expanded", String(!folded));
  button.querySelector(".fold-label").textContent = folded ? t().foldExpand(tiles.length) : t().foldCollapse;
  placeAgentMenu();
}

topicList.addEventListener("click", event => {
  if (!event.target.closest(".fold-toggle")) return;
  closeAgentMenu();
  folded = !folded;
  try { localStorage.setItem(FOLD_KEY, folded ? "1" : "0"); } catch (_) {}
  syncFold();
});

const MENU_ICONS = {
  info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg>',
  chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-8 8H7l-4 3 1.2-4.4A8 8 0 1 1 21 12z"></path></svg>',
  ext: '<svg class="mi-ext" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"></path><path d="M7 7h10v10"></path></svg>',
};

const agentMenu = document.createElement("div");
agentMenu.className = "agent-menu";
agentMenu.setAttribute("role", "menu");
agentMenu.hidden = true;
document.body.appendChild(agentMenu);
let menuTile = null;

function agentVariant(tile) {
  const [topicIndex, productIndex, variantIndex] = tile.dataset.agent.split("-").map(Number);
  return TOPICS[topicIndex].websites[productIndex].variants[variantIndex];
}

function placeAgentMenu() {
  if (!menuTile) return;
  if (menuTile.offsetParent === null) { closeAgentMenu(); return; }
  const tile = menuTile.getBoundingClientRect();
  const gap = 10;
  const width = agentMenu.offsetWidth;
  const height = agentMenu.offsetHeight;
  const left = Math.min(Math.max(8, tile.left + tile.width / 2 - width / 2), window.innerWidth - width - 8);
  const above = tile.bottom + gap + height > window.innerHeight - 8 && tile.top - gap - height > 8;
  agentMenu.classList.toggle("is-above", above);
  agentMenu.style.left = `${left + window.scrollX}px`;
  agentMenu.style.top = `${(above ? tile.top - gap - height : tile.bottom + gap) + window.scrollY}px`;
  agentMenu.style.setProperty("--arrow-x", `${tile.left + tile.width / 2 - left}px`);
}

function openAgentMenu(tile, focusFirst) {
  const variant = agentVariant(tile);
  const name = plain(pick(variant, "title"));
  const state = variant.status ? `<span class="agent-badge" data-status="${variant.status}">${t().badge[variant.status]}</span>` : "";
  const open = variant.open
    ? `<a class="agent-menu-item is-primary" role="menuitem" href="${variant.open}" target="_blank" rel="noopener noreferrer">
        <span class="mi-icon">${MENU_ICONS.chat}</span>
        <span class="mi-copy"><span class="mi-name">${t().openAgentBtn}</span><span class="mi-hint">${t().openAgentHint}</span></span>${MENU_ICONS.ext}
      </a>`
    : `<div class="agent-menu-item is-disabled" role="menuitem" aria-disabled="true">
        <span class="mi-icon">${MENU_ICONS.chat}</span>
        <span class="mi-copy"><span class="mi-name">${t().openAgentBtn}</span><span class="mi-hint">${t().openAgentNone}</span></span>
      </div>`;
  agentMenu.innerHTML = `
    <div class="agent-menu-title" aria-hidden="true"><span>${variant.icon}</span><span>${name}</span>${state}</div>
    <a class="agent-menu-item" role="menuitem" href="${localHref(variant.href)}" target="_blank" rel="noopener noreferrer">
      <span class="mi-icon">${MENU_ICONS.info}</span>
      <span class="mi-copy"><span class="mi-name">${t().learnMore}</span><span class="mi-hint">${t().learnMoreHint}</span></span>${MENU_ICONS.ext}
    </a>
    ${open}`;
  agentMenu.setAttribute("aria-label", t().menuLabel(name));
  if (menuTile) menuTile.setAttribute("aria-expanded", "false");
  menuTile = tile;
  tile.setAttribute("aria-expanded", "true");
  agentMenu.hidden = false;
  placeAgentMenu();
  if (focusFirst) agentMenu.querySelector("a.agent-menu-item")?.focus();
}

function closeAgentMenu(restoreFocus) {
  if (!menuTile) return;
  const tile = menuTile;
  tile.setAttribute("aria-expanded", "false");
  menuTile = null;
  agentMenu.hidden = true;
  if (restoreFocus) tile.focus();
}

topicList.addEventListener("click", event => {
  const tile = event.target.closest("button[data-agent]");
  if (!tile) return;
  if (tile === menuTile) closeAgentMenu();
  else openAgentMenu(tile, event.detail === 0);
});

document.addEventListener("click", event => {
  if (!menuTile || agentMenu.contains(event.target) || menuTile.contains(event.target)) return;
  closeAgentMenu();
});

agentMenu.addEventListener("click", event => {
  if (event.target.closest("a.agent-menu-item")) closeAgentMenu(event.detail === 0);
});

document.addEventListener("keydown", event => {
  if (!menuTile) return;
  const items = Array.from(agentMenu.querySelectorAll("a.agent-menu-item"));
  if (event.key === "Escape") {
    event.preventDefault();
    closeAgentMenu(true);
  } else if (event.key === "Tab") {
    closeAgentMenu(agentMenu.contains(document.activeElement));
  } else if ((event.key === "ArrowDown" || event.key === "ArrowUp") && items.length) {
    event.preventDefault();
    const index = items.indexOf(document.activeElement);
    const next = event.key === "ArrowDown" ? (index + 1) % items.length : (index <= 0 ? items.length - 1 : index - 1);
    items[next].focus();
  }
});

topicList.addEventListener("keydown", event => {
  const tile = event.target.closest("button[data-agent]");
  if (!tile || event.key !== "ArrowDown" || event.altKey) return;
  event.preventDefault();
  if (tile === menuTile) agentMenu.querySelector("a.agent-menu-item")?.focus();
  else openAgentMenu(tile, true);
});

window.addEventListener("resize", placeAgentMenu);

langSwitch.addEventListener("click", event => {
  const btn = event.target.closest("button[data-lang]");
  if (!btn || btn.dataset.lang === lang) return;
  lang = btn.dataset.lang;
  window.PocLang.save(lang);
  applyLang();
});

sidebarNav.addEventListener("click", event => {
  const toggle = event.target.closest(".sidebar-topic-toggle");
  if (toggle) {
    const topic = toggle.closest(".sidebar-topic");
    topic.classList.toggle("is-collapsed");
    toggle.setAttribute("aria-expanded", String(!topic.classList.contains("is-collapsed")));
    return;
  }
  if (window.innerWidth <= 720 && event.target.closest("a")) {
    hubLayout.classList.add("nav-collapsed");
    syncNavToggle();
  }
});

if (!window.matchMedia("(max-width: 720px)").matches) hubLayout.classList.remove("nav-collapsed");
applyLang();
</script>
</body>
</html>
